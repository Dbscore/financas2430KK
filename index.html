// só "corpo vazio/ruim" vira {}; o prazo estourado precisa continuar sendo erro de rede (senão virava "senha incorreta")
const semTempo=e=>{if(e&&(e.tempo||e.name==="AbortError"))throw e;return{};};
async function ler(nome,soCarimbo){
  const r=await fetchT(urlDoc(nome)+(soCarimbo?"?mask.fieldPaths=em":""),{cache:"no-store",headers:{Authorization:"Bearer "+await token()}});
  if(r.status===404)return null;
  const j=await r.json().catch(semTempo);
  if(!r.ok)throw new Error(r.status===403?"Sem permissão na nuvem para as compras (regras do Firebase ou versão antiga do app — feche e abra o app).":"Erro "+r.status+" da nuvem: "+((j.error&&j.error.message)||""));
  const f=j.fields||{},sv=k=>f[k]&&f[k].stringValue;
  return{updateTime:j.updateTime,cifra:sv("cifra"),iv:sv("iv"),gz:!!(f.gz&&f.gz.booleanValue),v:+((f.v&&f.v.integerValue)||0)};}
async function gravar(nome,d,updateTime){
  const pre=updateTime?"currentDocument.updateTime="+encodeURIComponent(updateTime):"currentDocument.exists=false";
  const corpo={fields:{cifra:{stringValue:d.cifra},iv:{stringValue:d.iv},salt:{stringValue:sync.salt||""},gz:{booleanValue:d.gz},
    versao:{integerValue:"1"},v:{integerValue:String(APP_VERSAO)},por:{stringValue:sync.email||""},em:{timestampValue:new Date().toISOString()}}};
  const r=await fetchT(urlDoc(nome)+"?"+pre,{method:"PATCH",headers:{Authorization:"Bearer "+await token(),"Content-Type":"application/json"},body:JSON.stringify(corpo)});
  const j=await r.json().catch(semTempo);const st=(j.error&&j.error.status)||"";
  if(r.status===409||r.status===412||st==="FAILED_PRECONDITION"||st==="ABORTED"||st==="ALREADY_EXISTS")return{conflito:true};
  if(!r.ok)throw new Error(r.status===403?"A nuvem recusou gravar as compras (versão antiga do app? feche e abra o app).":"Erro "+r.status+" ao gravar: "+((j.error&&j.error.message)||""));
  return{updateTime:j.updateTime};}

// um documento: lê o carimbo; se mudou, baixa e junta; se o daqui difere do que está lá, grava (com checagem)
async function syncDoc(nome){
  for(let t=0;t<4;t++){
    CP.absorver();
    const k=est.docs[nome]||null;
    const c=await ler(nome,true);
    // baixa e junta quando o documento mudou OU é a 1ª vez nesta abertura do app (o que o aparelho tem pode estar mais velho do que
    // o que ele "lembra" ter enviado — ex.: gravação local que falhou antes de fechar o app — e aí ele sobrescreveria a nuvem)
    if(c&&(!k||k.ut!==c.updateTime||!sess[nome])){
      const rem=await ler(nome,false);
      if(!rem)continue;
      if(rem.v>APP_VERSAO)throw new Error("Existe uma versão mais nova do app. Feche e abra o app para atualizar.");
      const dados=CP.normalizar(await decifrar(rem));
      const antes=CP.estavel(CP.partir(CP.dados())[nome]||CP.vazio());
      CP.substituir(CP.mesclar(CP.dados(),dados));if(nome===CP.DOC_PRINCIPAL)CP.consertarListas();sess[nome]=1;
      est.docs[nome]={ut:rem.updateTime,hash:hashCurto(CP.estavel(dados))};gravarEst();
      if(CP.estavel(CP.partir(CP.dados())[nome]||CP.vazio())!==antes){CP.registrar("recebeu "+nome+" da nuvem");CP.recebeu=true;}
    }else if(!c&&k){delete est.docs[nome];gravarEst();}
    const parte=CP.partir(CP.dados())[nome]||CP.vazio();const h=hashCurto(CP.estavel(parte));
    const atual=est.docs[nome];
    if(atual&&atual.hash===h)return;          // nada de novo daqui
    if(!atual&&!c&&h===hashCurto(CP.estavel(CP.vazio())))return; // nada aqui nem lá
    const d=await cifrar(parte);
    if(d.cifra.length>900000)throw new Error("As compras de "+nome+" passaram do tamanho de um documento da nuvem. Avise para dividirmos.");
    const w=await gravar(nome,d,atual&&c?atual.ut:null);
    if(w.conflito)continue;                    // outro aparelho gravou no meio: lê de novo e junta
    est.docs[nome]={ut:w.updateTime,hash:h};sess[nome]=1;gravarEst();CP.registrar("enviou "+nome);return;
  }
  throw new Error("Não consegui gravar as compras na nuvem (muitos aparelhos gravando ao mesmo tempo?). Tente de novo.");
}

// ciclo: sempre o documento principal; os anos só quando pedido (abrir o módulo, salvar compra) — no modo
// "ao vivo" só o principal, que é onde estão as listas. Um documento com erro NÃO impede os outros (ano atual primeiro).
const ehRede=e=>!!(e&&(e.tempo||/Failed to fetch|NetworkError|Load failed|tempo esgotado/i.test(e.message||"")));
CP.sincronizar=function(opc){opc=opc||{};
  if(!CP.syncAtivo())return Promise.resolve();
  const atual=CP.sync.emCurso;
  if(atual){ // já há um ciclo; se ele só enviava o principal e este pede os anos, encadeia outro depois
    if(opc.soPrincipal||!CP.sync.soPrincipal)return atual;
    return atual.then(()=>CP.sincronizar(opc));}
  CP.sync.soPrincipal=!!opc.soPrincipal;
  const p=(async()=>{
    try{
      if(typeof navigator!=="undefined"&&navigator.onLine===false){CP.statusSync("offline");return;}
      CP.recebeu=false;if(!opc.silencioso)CP.statusSync("sincronizando");
      const erros=[];
      const doc=async n=>{try{await syncDoc(n);return true;}catch(e){if(ehRede(e))throw e;erros.push((n===CP.DOC_PRINCIPAL?"listas":n.replace("compras-","compras de "))+": "+e.message);return false;}};
      const okP=await doc(CP.DOC_PRINCIPAL);
      // "rápido" = listas + as compras do ANO ATUAL (uma compra finalizada no outro aparelho aparece aqui também, e o VA acompanha)
      if(opc.soPrincipal)await doc("compras-"+new Date().getFullYear());
      if(!opc.soPrincipal){
        const anos=CP.anosConhecidos().slice().sort().reverse(); // o ano atual primeiro
        const ra=CP.por("config","anos"),asc=anos.slice().reverse();if(okP&&CP.estavel((ra&&ra.anos)||[])!==CP.estavel(asc)){CP.salvarReg("config",{id:"anos",anos:asc});CP.gravar();await doc(CP.DOC_PRINCIPAL);} // registro PRÓPRIO: não regrava a config (cartões, ajustes) na virada do ano
        for(const a of anos)await doc("compras-"+a);
      }
      if(erros.length)throw new Error(erros.join(" · "));
      CP.limparMarcadores();
      est.ultimo=CP.sync.ultimo=Date.now();gravarEst();CP.statusSync("ok");try{CP.publicarUso();}catch(e){}
      if(CP.recebeu&&typeof CP.aoReceber==="function")CP.aoReceber();
    }catch(e){CP.registrar("erro: "+e.message);CP.statusSync(ehRede(e)?"offline":"erro",e.message);}
  })();
  CP.sync.emCurso=p;
  // libera depois (fora da função async): com "sem internet" ela termina antes de a variável existir, e o antigo "finally" interno
  // deixava o ciclo preso para sempre
  const fim=()=>{if(CP.sync.emCurso===p)CP.sync.emCurso=null;};p.then(fim,fim);
  return p;};
CP.statusSync=function(tipo,msg){CP.sync.status=tipo;CP.sync.msg=msg||"";if(typeof CP.aoStatus==="function")CP.aoStatus();};
CP.textoSync=function(){const s=CP.sync;if(!CP.syncAtivo())return"📴 só neste aparelho";
  const h=s.ultimo?new Date(s.ultimo).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"}):"";
  return s.status==="sincronizando"?"⏳ sincronizando…":s.status==="offline"?"📴 sem sinal":s.status==="erro"?"⚠ não sincronizou":"☁️ "+(h?h.slice(0,5):"ok");};
// depois de cada edição: envia logo (só o principal, rápido); as compras do ano vão no ciclo completo
let tEnvio=null;
// "precisaAnos" só é zerado depois de um envio que deu certo (antes zerava mesmo com falha e a compra ficava só no aparelho)
CP.aoGravar=function(){if(!CP.syncAtivo())return;clearTimeout(tEnvio);tEnvio=setTimeout(()=>{const pedeAnos=!!CP.precisaAnos;CP.sincronizar({soPrincipal:!pedeAnos}).then(()=>{if(pedeAnos&&CP.sync.status==="ok")CP.precisaAnos=false;});},700);};

// ---- "ao vivo": só com a Lista aberta, a tela visível e a pessoa usando ----
// Nos primeiros 3 min sem tocar na tela: a cada poucos segundos. Até 10 min sem tocar: a cada ~16 s. Depois disso pausa (poupa leituras
// do Firebase e bateria); qualquer toque na tela retoma na hora e a tela mostra "pausado".
let tVivo=null,ultimoToque=Date.now(),contaVivo=0;
const SEM_USO=600000,DEVAGAR=180000;
const aberto=()=>typeof HUB==="undefined"||!HUB.atual||HUB.atual()==="lista";
CP.vivo=function(seg){clearInterval(tVivo);tVivo=null;contaVivo=0;CP.vivoLento=seg>10;if(!seg||!aberto())return;
  tVivo=setInterval(()=>{if(!aberto()){clearInterval(tVivo);tVivo=null;return;}
    if(typeof document!=="undefined"&&document.visibilityState==="hidden")return;
    const parado=Date.now()-ultimoToque;
    if(parado>SEM_USO){if(CP.aoStatus)CP.aoStatus();return;}
    if(parado>DEVAGAR&&(++contaVivo%4)!==0)return;
    CP.sincronizar({soPrincipal:true,silencioso:true});},seg*1000);};
// o que a tela diz sobre o "ao vivo" (só diz "ao vivo" quando é verdade)
CP.estadoVivo=function(){if(!CP.syncAtivo())return{ok:false,txt:"📴 só neste aparelho"};
  if(CP.renderPendente)return{ok:false,txt:"⏳ saia do campo para ver as novidades"};
  if(CP.sync.status==="offline")return{ok:false,txt:"📴 sem sinal"};
  if(CP.sync.status==="erro")return{ok:false,txt:"⚠ sem atualizar"};
  if(Date.now()-ultimoToque>SEM_USO)return{ok:false,txt:"⏸ pausado — toque na tela"};
  if(!tVivo)return{ok:false,txt:"○ não está ao vivo"};
  if(CP.vivoLento)return{ok:false,txt:"○ atualiza a cada 30 s (abra a lista para ao vivo)"};
  return{ok:true,txt:"● ao vivo"};};
if(typeof window!=="undefined"&&window.addEventListener){
  const tocou=()=>{const dormiu=Date.now()-ultimoToque>DEVAGAR;ultimoToque=Date.now();if(dormiu&&tVivo)CP.sincronizar({soPrincipal:true,silencioso:true});};
  ["pointerdown","keydown","touchstart"].forEach(ev=>window.addEventListener(ev,tocou,{passive:true,capture:true}));
  // voltou o sinal / voltou para o app: sincroniza na hora (se a Lista está aberta)
  window.addEventListener("online",()=>{if(aberto())CP.sincronizar();});
  if(typeof document!=="undefined")document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&typeof HUB!=="undefined"&&HUB.atual&&HUB.atual()==="lista")CP.sincronizar({soPrincipal:true});});
  // outra janela do mesmo navegador gravou as compras: junta e redesenha
  window.addEventListener("storage",e=>{if(e.key===KEY+"__compras"){CP.absorver();if(typeof CP.aoReceber==="function")CP.aoReceber();}});
}
})(CP);}catch(e){window.__erroModulo=(window.__erroModulo||[]).concat("46: "+e.message);}

// ============ COMPRAS — nota fiscal (NFC-e): QR, leitura dos itens, casamento com a lista ============
// 1) QR code do cupom → link da Sefaz com a CHAVE de 44 dígitos. Só da chave (sem internet) já saem:
//    CNPJ do mercado, ano/mês e número da nota. O dígito verificador é conferido.
// 2) Itens: a página da Sefaz-SP mostra cada item (descrição, código, qtde, unidade, valor unitário e total).
//    O navegador não pode ler essa página direto (outro site), então: (a) pelo intermediário (Cloudflare
//    Worker, ver publicar/worker/) ou (b) você abre o link, copia tudo e cola aqui — o mesmo leitor serve.
//    Tudo é lido como TEXTO (nunca como HTML executável).
// 3) Casamento nota × lista: pelo que o app aprendeu (apelido/código do item naquele mercado) e por
//    semelhança de nomes ("ARROZ T JOAO 5KG" ↔ "arroz"). Você confirma na tela de conferência.
try{(function(CP){
"use strict";
// ---------- chave da NFC-e ----------
function dvOk(k){let s=0,p=2;for(let i=42;i>=0;i--){s+=(+k[i])*p;p=p===9?2:p+1;}const r=s%11,dv=r<2?0:11-r;return dv===+k[43];}
CP.lerChave=function(txt){txt=String(txt||"");
  let cand=[];const m=txt.match(/[?&]p=([^&|#\s]+)/i);if(m)cand.push(m[1].replace(/\D/g,""));
  (txt.match(/\d[\d\s.\-/]{42,80}\d/g)||[]).forEach(x=>cand.push(x.replace(/\D/g,"")));
  for(const c of cand){for(let i=0;i+44<=c.length;i++){const k=c.slice(i,i+44);
    if(dvOk(k)&&(k.slice(20,22)==="65"||k.slice(20,22)==="55"))return{chave:k,uf:k.slice(0,2),ano:"20"+k.slice(2,4),mes:k.slice(4,6),cnpj:k.slice(6,20),modelo:k.slice(20,22),serie:+k.slice(22,25),numero:+k.slice(25,34)};}}
  return null;};
// link do QR: só aceitamos endereços https de Sefaz (fazenda.<uf>.gov.br), nada mais
CP.linkNota=function(txt){const m=String(txt||"").match(/https?:\/\/[^\s"'<>]+/i);if(!m)return null;
  try{const u=new URL(m[0]);if(!/(^|\.)fazenda\.[a-z]{2}\.gov\.br$|(^|\.)sefaz\.[a-z]{2}\.gov\.br$/i.test(u.hostname))return null;u.protocol="https:";return u.toString();}catch(e){return null;}};
CP.fmtCnpj=c=>String(c||"").replace(/\D/g,"").replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,"$1.$2.$3/$4-$5");

// ---------- página/texto da nota → dados ----------
// HTML vira texto com separadores (as classes da Sefaz viram marcas), depois tudo é lido por expressões.
// Entidades HTML (&amp; &#233; &#xE9; &eacute; ...) são decodificadas de UMA vez só ("&amp;lt;" vira o texto "&lt;", não "<").
const TEM=CP.TEM,ID_OK_CP=id=>typeof id==="string"&&CP.ID_OK.test(id);
const ENT=Object.create(null);
Object.assign(ENT,{amp:"&",lt:"<",gt:">",quot:'"',apos:"'",nbsp:" ",ordm:"º",ordf:"ª",deg:"°",middot:"·",ndash:"–",mdash:"—",hellip:"…",copy:"©",reg:"®",laquo:"«",raquo:"»",times:"×",plusmn:"±",frac12:"½",sup2:"²",sup3:"³",euro:"€"});
[["a","acute grave circ tilde uml"],["e","acute grave circ uml"],["i","acute grave circ uml"],["o","acute grave circ tilde uml"],["u","acute grave circ uml"],["c","cedil"],["n","tilde"],["y","acute"]]
  .forEach(([b,ms])=>ms.split(" ").forEach(m=>{const mk={acute:"\u0301",grave:"\u0300",circ:"\u0302",tilde:"\u0303",uml:"\u0308",cedil:"\u0327"}[m];
    ENT[b+m]=(b+mk).normalize("NFC");ENT[b.toUpperCase()+m]=(b.toUpperCase()+mk).normalize("NFC");}));
CP.decodificarEntidades=function(s){return String(s).replace(/&(#x[0-9a-f]{1,6}|#\d{1,7}|[a-z][a-z0-9]{1,10});/gi,(t,e)=>{
  if(e[0]==="#"){const n=(e[1]==="x"||e[1]==="X")?parseInt(e.slice(2),16):+e.slice(1);
    return n>=32&&n!==127&&n<=0x10FFFF&&!(n>=0xD800&&n<=0xDFFF)?String.fromCodePoint(n):" ";}
  return TEM(ENT,e)?ENT[e]:t;});};
// caracteres de controle e invisíveis não entram em nome de produto
const LIMPA=s=>s.replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f\u200b-\u200f\ufeff]/g,"").replace(/[\u2028\u2029]/g,"\n");
function htmlParaTexto(h){return CP.decodificarEntidades(String(h)
  .replace(/<script[\s\S]*?<\/script>/gi," ").replace(/<style[\s\S]*?<\/style>/gi," ")
  .replace(/<(br|\/tr|\/div|\/p|\/li|\/h\d)[^>]*>/gi,"\n").replace(/<[^>]+>/g," ")).replace(/[ \t\r]+/g," ");}
// número da nota: milhar com ponto e decimal com vírgula; "1250,00" (sem ponto de milhar) e "27.95" (ponto decimal) também são lidos inteiros
const NUM="(\\d+(?:\\.\\d{3})*(?:[,.]\\d+)?)";
const tipoPag=r=>{const t=CP.norm(r);return/alimenta|refei/.test(t)?"va":/debito/.test(t)?"debito":/credito/.test(t)?"credito":/\bpix\b|instant/.test(t)?"pix":/dinheiro|especie/.test(t)?"dinheiro":null;};
const ROTULO_NAO_PAGAMENTO=/^(valor|total|desconto|acrescimo|troco|qtd|quantidade|forma|tributo)/;
CP.lerNota=function(entrada){
  const bruto=String(entrada||"").slice(0,400000); // uma nota de verdade tem ~100 mil caracteres; o limite evita travar com texto absurdo
  const txt=LIMPA(/<[a-z][\s\S]*>/i.test(bruto)?htmlParaTexto(bruto):CP.decodificarEntidades(bruto.replace(/\r/g,"")));
  const plano=txt.replace(/\s+/g," ");
  // itens: a descrição fica numa linha só (não atravessa linhas — senão pegaria o cabeçalho da página); pode ter parênteses
  // (ex.: "CERVEJA (LATA) 350ML") — ela vai até o "(Código" desta linha. A unidade pode ter número ("UN2", "CX12").
  const porLinha=txt.replace(/[ \t\u00a0]+/g," ");
  // (acha o "(Código ...) Qtde ... UN ... Vl. Unit ... Vl. Total ..." e a descrição é o texto da linha logo antes dele: a busca é linear
  // mesmo com texto estranho, e a descrição pode ter parênteses)
  const rxItem=new RegExp("\\(\\s*C[óo]digo\\s*:?\\s*([^)]{0,30})\\)\\s*Qtde\\.?\\s*:?\\s*"+NUM+"\\s*UN\\s*:?\\s*([A-Za-z][A-Za-z0-9]{0,7})\\s*Vl\\.?\\s*Unit\\.?\\s*:?\\s*"+NUM+"\\s*(?:Vl\\.?\\s*Total)?\\s*"+NUM,"gi");
  const itens=[];let m;
  let prev=0;
  while((m=rxItem.exec(porLinha))){
    const antes=porLinha.slice(prev,m.index).replace(/\s+$/,"");prev=rxItem.lastIndex;
    const linha=antes.slice(antes.lastIndexOf("\n")+1).slice(-160);
    const desc=linha.replace(/^.*?(?:Vl\.?\s*Total\s*[\d.,]+\s*)+/i,"").replace(/\s+/g," ").trim();if(desc.length<2)continue;
    itens.push({desc:desc.slice(0,120),cod:m[1].trim().slice(0,30),qtd:CP.numBR(m[2]),un:m[3].toUpperCase(),vUnit:CP.numBR(m[4]),vTotal:CP.numBR(m[5])});}
  const pega=rx=>{const x=plano.match(rx);return x?x[1].trim():"";};
  const total=CP.numBR(pega(/Valor a pagar R\$\s*:?\s*([\d.,]+)/i))||CP.numBR(pega(/Valor total R\$\s*:?\s*([\d.,]+)/i));
  const desconto=CP.numBR(pega(/Descontos? R\$\s*:?\s*([\d.,]+)/i));
  const cnpj=(pega(/CNPJ\s*:?\s*([\d./-]{14,18})/i)||"").replace(/\D/g,"");
  // nome do emitente: a linha antes do "CNPJ:" no topo da página
  let nome="";{const i=txt.search(/CNPJ\s*:/i);if(i>0){const linhas=txt.slice(0,i).split("\n").map(s=>s.trim()).filter(Boolean);nome=(linhas[linhas.length-1]||"").slice(0,80);}}
  let endereco="";{const x=txt.match(/CNPJ\s*:?\s*[\d./-]{14,18}\s*\n?\s*([^\n]{5,160})/i);if(x)endereco=x[1].trim();}
  const em=pega(/Emiss[ãa]o\s*:?\s*(\d{2}\/\d{2}\/\d{4})/i);const data=em?em.split("/").reverse().join("-"):"";
  // formas de pagamento. Lê a seção "Forma de pagamento" linha a linha: o que for reconhecido (vale-alimentação, débito, crédito, dinheiro, pix)
  // ganha tipo; QUALQUER OUTRA forma ("Outros", "Vale Combustível"...) vira tipo "outro" e a nota fica com pagamentoIncerto —
  // a tela precisa perguntar; nunca se presume vale-alimentação.
  let pags=[];
  {const i=plano.search(/Formas? de pagamento/i);
    if(i>=0){let sec=plano.slice(i).replace(/^Formas? de pagamento\s*:?\s*/i,"").replace(/^Valor pago R\$\s*:?\s*/i,"");
      sec=sec.split(/\b(?:Troco|Informa[çc][õo]es|Tributos|Consulte|Chave de acesso|Protocolo|N[úu]mero\s*:)/i)[0];
      const rx=/([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ0-9 .\/'-]{1,40}?)\s*:?\s*(?:R\$\s*)?(\d[\d.]*,\d{2})/g;let q;
      while((q=rx.exec(sec))){const rot=q[1].trim();if(ROTULO_NAO_PAGAMENTO.test(CP.norm(rot)))continue;
        const t=tipoPag(rot);pags.push({tipo:t||"outro",valor:CP.numBR(q[2]),rotulo:rot.slice(0,40)});}}
    if(!pags.length){ // texto colado sem o título da seção: só as formas conhecidas
      const rxPag=/(Vale Alimenta[çc][ãa]o|Vale Refei[çc][ãa]o|Cart[ãa]o de D[ée]bito|Cart[ãa]o de Cr[ée]dito|Dinheiro|PIX|Pagamento Instant[âa]neo)[^\d]{0,20}([\d.]*\d,\d{2})/gi;
      let p;while((p=rxPag.exec(plano)))pags.push({tipo:tipoPag(p[1])||"dinheiro",valor:CP.numBR(p[2]),rotulo:p[1]});}}
  const desconhecidos=pags.filter(x=>x.tipo==="outro").map(x=>({rotulo:x.rotulo,valor:x.valor}));
  const pagamentoIncerto=!pags.length||desconhecidos.length>0;
  const k=CP.lerChave(bruto)||CP.lerChave(plano);
  // conferências da própria nota (a tela mostra como aviso; nada é corrigido sozinho)
  const avisos=[];
  itens.forEach((x,i)=>{const esperado=CP.r2(x.qtd*x.vUnit);if(Math.abs(esperado-x.vTotal)>Math.max(0.02,x.vTotal*0.005))avisos.push({tipo:"item",i,texto:"A conta do item “"+x.desc+"” não bate: "+CP.nBR(x.qtd,3)+" × "+CP.dinheiroTxt(x.vUnit)+" = "+CP.dinheiroTxt(esperado)+", e a nota diz "+CP.dinheiroTxt(x.vTotal)+"."});});
  const qtdTotal=+(pega(/Qtd\.? total de itens\s*:?\s*(\d+)/i)||0);
  if(qtdTotal&&qtdTotal!==itens.length)avisos.push({tipo:"qtd",texto:"A nota diz "+qtdTotal+" item(ns) e eu li "+itens.length+": confira se algum item ficou de fora."});
  const soma=CP.r2(itens.reduce((s,x)=>s+x.vTotal,0)),totalNota=total||soma;
  if(itens.length&&total&&Math.abs(soma-desconto-total)>0.05)avisos.push({tipo:"soma",texto:"Os itens somam "+CP.dinheiroTxt(soma)+(desconto?" (menos "+CP.dinheiroTxt(desconto)+" de desconto)":"")+", mas a nota cobra "+CP.dinheiroTxt(total)+"."});
  return{itens,total:totalNota,desconto,cnpj:cnpj||(k&&k.cnpj)||"",nome,endereco,data:data||(k?k.ano+"-"+k.mes+"-01":""),chave:k&&k.chave,pagamentos:pags,
    pagamentoIncerto,pagamentosDesconhecidos:desconhecidos,qtdTotalNota:qtdTotal,avisos};};

// ---------- buscar a página da nota pelo intermediário ----------
// https sempre; http só no próprio computador (teste local)
CP.urlIntermediarioOk=u=>/^(https:\/\/[a-z0-9.-]+|http:\/\/(127\.0\.0\.1|localhost)(:\d+)?)(\/[\w./-]*)?$/i.test(String(u||""));
CP.temIntermediario=()=>CP.urlIntermediarioOk(CP.config().worker);
CP.viaIntermediario=async function(alvo){const w=CP.config().worker.replace(/\/+$/,"");
  const pedido=w+"/?u="+encodeURIComponent(alvo),opt={cache:"no-store",credentials:"omit",referrerPolicy:"no-referrer"};
  let r;try{r=await(CP.fetchT?CP.fetchT(pedido,opt,15000,"do intermediário"):fetch(pedido,opt));}
  catch(e){if(e&&!e.tempo&&!e.sem){e.sem=true;e.message="Não consegui falar com o intermediário (sem conexão ou endereço errado). "+(e.message||"");}throw e;}
  if(!r.ok){const x=new Error("O intermediário respondeu "+r.status+(r.status===403?" (endereço não permitido ou origem do app não liberada)":""));x.status=r.status;throw x;}
  const buf=await r.arrayBuffer();const ct=r.headers.get("Content-Type")||"";const cs=(ct.match(/charset=([\w-]+)/i)||[])[1]||"utf-8";
  let t;try{t=new TextDecoder(cs).decode(buf);}catch(e){t=new TextDecoder("utf-8").decode(buf);}return{texto:t,tipo:ct};};
// erro ao ler a nota pelo intermediário -> frase simples, sem número técnico em destaque (a Sefaz-SP tem proteção anti-robô
// e costuma bloquear o intermediário: 520, 403, 502, 504...). NÃO tenta contornar a proteção; o caminho é copiar e colar.
CP.PASSOS_NOTA="toque em “Abrir a nota”, selecione tudo, copie e volte aqui para tocar em “Colar o que copiei”";
CP.erroNota=function(e){const st=+(e&&e.status)||+(/respondeu (\d{3})/.exec(String((e&&e.message)||""))||[])[1]||0;
  if(st>=500||st===403||st===401||st===429)return"A Sefaz não deixou o intermediário abrir a nota — é comum em sites do governo. Faça assim: "+CP.PASSOS_NOTA+".";
  if(e&&(e.sem||e.tempo))return"Não consegui falar com o intermediário agora (sem sinal ou demorou demais). Você pode copiar a nota e colar aqui: "+CP.PASSOS_NOTA+".";
  return String((e&&e.message)||e||"Não consegui ler a nota.").replace(/^Error:\s*/,"");};
CP.baixarNota=async function(link){const{texto}=await CP.viaIntermediario(link);const n=CP.lerNota(texto);
  if(!n.itens.length)throw new Error("A página da nota abriu, mas não achei os itens (a Sefaz pode ter mudado a página ou a nota ainda não foi processada). Tente colar o texto.");
  return n;};

// ---------- casamento nota × lista ----------
// devolve, para cada linha da nota, o item da lista sugerido (ou null = "a mais")
CP.casar=function(linhas,itensLista,cnpj){
  const pares=[];
  linhas.forEach((ln,li)=>{const cod=cnpj&&ln.cod?cnpj+":"+ln.cod:"",n=CP.norm(ln.desc);
    itensLista.forEach((it,ii)=>{const p=it.produtoId&&CP.por("produtos",it.produtoId);let s=0;
      if(p&&cod&&(p.cods||[]).includes(cod))s=3;else if(p&&(p.apelidos||[]).includes(n))s=2.5;
      else s=Math.max(CP.semelhanca(it.nome,ln.desc),p?CP.semelhanca(p.nome,ln.desc):0);
      if(s>=.6)pares.push({li,ii,s});});});
  pares.sort((a,b)=>b.s-a.s);
  const usadaL=new Set(),usadoI=new Set(),res=linhas.map(()=>null);
  pares.forEach(({li,ii,s})=>{if(usadaL.has(li)||usadoI.has(ii))return;usadaL.add(li);usadoI.add(ii);res[li]={item:itensLista[ii],s};});
  // segunda passada: linhas que sobraram e casam muito bem com um item já usado (ex.: 2 cortes de carne)
  pares.forEach(({li,ii,s})=>{if(!res[li]&&s>=1)res[li]={item:itensLista[ii],s};});
  return res;};

// ---------- conferência: monta o rascunho a partir da nota (ou manual) ----------
// rascunho = {listaId, mercado:{cnpj,nome,endereco}, data, chave, origem, linhas:[{desc,cod,qtd,un,vUnit,vTotal,itemId|null}],
//             faltas:{itemId: "faltou"|"outro"|"dispensado"|"pego"}, outro:{itemId:{mercado,valor}}, total, pagamento, valorVA}
CP.rascunhoDaNota=function(n,lid){const its=lid?CP.itensDa(lid).filter(i=>i.estado!=="dispensado"):[];
  const cas=CP.casar(n.itens,its,n.cnpj);
  const linhas=n.itens.map((x,i)=>Object.assign({},x,{itemId:cas[i]?cas[i].item.id:null,conf:cas[i]?cas[i].s:0}));
  const pagVA=(n.pagamentos||[]).filter(p=>p.tipo==="va").reduce((s,p)=>s+p.valor,0);
  const outros=(n.pagamentos||[]).filter(p=>p.tipo!=="va");
  // forma de pagamento que o leitor não reconheceu (ou ausente): NUNCA presume vale-alimentação. Fica "outro" (não conta no VA)
  // e a nota vem com pagamentoIncerto — a tela pergunta e chama CP.confirmarPagamento antes de salvar.
  const incerto=!!n.pagamentoIncerto;
  const pag=incerto?(pagVA?"misto":"outro"):pagVA&&!outros.length?"va":pagVA?"misto":outros.length?outros[0].tipo:CP.config().pagPadrao;
  return{listaId:lid||null,mercado:{cnpj:n.cnpj,nome:n.nome,endereco:n.endereco},data:n.data||CP.hoje(),chave:n.chave||"",origem:"nfce",
    linhas,faltas:{},outro:{},total:n.total,desconto:n.desconto||0,pagamento:pag,valorVA:CP.r2(pagVA),
    pagamentoIncerto:incerto,pagamentoConfirmado:false,pagamentos:(n.pagamentos||[]).map(x=>Object.assign({},x)),pagamentosDesconhecidos:(n.pagamentosDesconhecidos||[]).map(x=>Object.assign({},x)),avisosNota:(n.avisos||[]).map(x=>Object.assign({},x))};};
// formas de pagamento aceitas (a tela pode usar esta lista no seletor; "outro" = não identificado / outra forma)
CP.PAGAMENTOS={va:"Vale-alimentação",debito:"Débito",credito:"Crédito",pix:"Pix",dinheiro:"Dinheiro",misto:"VA + outro",outro:"Outro (não identificado)"};
// a pessoa respondeu "como foi pago?": limpa a pergunta. Para "misto" o valor pago com VA é obrigatório (0 ou mais).
CP.confirmarPagamento=function(rc,tipo,valorVA){if(!rc||!TEM(CP.PAGAMENTOS,tipo))throw new Error("Forma de pagamento inválida.");
  rc.pagamento=tipo;rc.valorVA=tipo==="misto"?CP.r2(Math.max(0,CP.numBR(valorVA))):tipo==="va"?CP.r2(+rc.total||0):0;
  rc.pagamentoIncerto=false;rc.pagamentoConfirmado=true;return rc;};
CP.pagamentoPendente=rc=>!!(rc&&rc.pagamentoIncerto&&!rc.pagamentoConfirmado);
CP.rascunhoManual=function(lid){const its=lid?CP.itensDa(lid):[];
  const linhas=its.filter(i=>i.estado==="pego").map(i=>{const u=i.produtoId&&CP.ultimoPreco(i.produtoId);
    return{desc:i.nome,cod:"",qtd:+i.qtd||1,un:(i.un||"un").toUpperCase(),vUnit:u?u.vUnit:0,vTotal:u?CP.r2(u.vUnit*(+i.qtd||1)):0,itemId:i.id,conf:1};});
  return{listaId:lid||null,mercado:{},mercadoId:"",data:CP.hoje(),chave:"",origem:"manual",linhas,faltas:{},outro:{},total:0,desconto:0,pagamento:CP.config().pagPadrao,valorVA:0};};
// o que a conferência mostra: itens da lista não achados na nota, a mais, previsto × pago
CP.analisar=function(rc){const its=rc.listaId?CP.itensDa(rc.listaId).filter(i=>i.estado!=="dispensado"&&i.estado!=="faltou"):[];
  const usados=new Set(rc.linhas.map(l=>l.itemId).filter(Boolean));
  const naoAchados=its.filter(i=>!usados.has(i.id));
  const extras=rc.linhas.filter(l=>!l.itemId);
  const soma=CP.r2(rc.linhas.reduce((s,l)=>s+(+l.vTotal||0),0));
  const total=CP.r2(+rc.total||soma);
  const prev=rc.listaId?CP.previaLista(rc.listaId):{total:0};
  return{naoAchados,extras,somaExtras:CP.r2(extras.reduce((s,l)=>s+(+l.vTotal||0),0)),soma,total,difSoma:CP.r2(total-soma),previsto:prev.total,passou:CP.r2(total-prev.total)};};
// item da lista que não apareceu na nota: se estava marcado "peguei", continua pego (mas a tela avisa);
// se não estava, o padrão é "ficou faltando" (vai para a próxima lista)
CP.escolhaPadrao=it=>it.estado==="pego"?"pego":it.estado==="outroMercado"?"outro":"faltou";
// grava a compra: registro da compra (com itens e preços), aprende os nomes, atualiza a lista
CP.salvarCompra=function(rc){const a=CP.analisar(rc);
  if(CP.pagamentoPendente(rc))throw new Error("Diga como esta compra foi paga antes de salvar (a nota traz uma forma de pagamento que não reconheci).");
  const m=rc.mercadoId?CP.por("mercados",rc.mercadoId):(rc.mercado&&(rc.mercado.cnpj||rc.mercado.nome)?CP.garantirMercado(rc.mercado):null);
  if(rc.chave&&CP.comprasVivas().some(c=>c.chave===rc.chave))throw new Error("Esta nota já foi registrada.");
  const itens=rc.linhas.map(l=>{let pid=null;const it=l.itemId&&CP.por("itens",l.itemId);
    if(it&&it.produtoId)pid=it.produtoId;else pid=CP.garantirProduto(l.desc).id;
    if(rc.origem==="nfce")CP.aprender(pid,l.desc,m&&m.cnpj,l.cod);
    const x={produtoId:pid,desc:String(l.desc).slice(0,120),cod:l.cod||"",qtd:+l.qtd||1,un:l.un||"",vUnit:+l.vUnit||0,vTotal:+l.vTotal||0,itemListaId:l.itemId||null,extra:!l.itemId};
    if(l.marca)x.marca=String(l.marca).slice(0,40);
    if(!l.itemId)x.extraDestino=CP.destinoExtra(l);
    return x;});
  const total=a.total;const va=rc.pagamento==="va"?total:rc.pagamento==="misto"?Math.min(+rc.valorVA||0,total):0;
  // com chave de nota, o id é a própria chave: a mesma nota registrada em dois aparelhos (um sem sinal) vira UMA compra só ao juntar
  const c=CP.salvarReg("compras",{id:/^\d{44}$/.test(rc.chave||"")?"nf"+rc.chave:undefined,data:rc.data||CP.hoje(),mercadoId:m?m.id:"",listaId:rc.listaId||"",total,desconto:+rc.desconto||0,pagamento:rc.pagamento,valorVA:CP.r2(va),chave:rc.chave||"",origem:rc.origem,itens,quem:CP.eu().nome});
  if(va>0&&rc.cartaoId&&ID_OK_CP(rc.cartaoId)){c.cartaoId=rc.cartaoId;}
  if(va>0&&Array.isArray(rc.cartoes)&&rc.cartoes.length)c.cartoes=rc.cartoes.filter(k=>k&&ID_OK_CP(k.id)&&+k.valor>0).map(k=>({id:k.id,valor:CP.r2(+k.valor)}));
  // lista: o que veio na nota fica "pego" com preço; o que não veio segue a escolha da conferência
  rc.linhas.forEach(l=>{const it=l.itemId&&CP.por("itens",l.itemId);if(!it)return;it.estado="pego";it.preco=+l.vUnit||0;it.compraId=c.id;if(!it.pegoPor){it.pegoPor=CP.eu().nome;it.pegoEm=Date.now();}CP.salvarReg("itens",it);});
  const proxima=[],extrasProxima=[];
  // "peguei algo a mais": cada linha fora da lista segue a escolha explícita da pessoa (CP.destinoExtra)
  rc.linhas.forEach((l,i)=>{if(l.itemId)return;const d=CP.destinoExtra(l),pr=CP.por("produtos",itens[i].produtoId);if(!pr)return;
    if(d==="lista"&&rc.listaId&&CP.por("listas",rc.listaId))CP.salvarReg("itens",{listaId:rc.listaId,produtoId:pr.id,nome:pr.nome,qtd:+l.qtd||1,un:String(l.un||pr.un||"un").toLowerCase(),secao:pr.secao||CP.secaoDe(pr.nome),estado:"pego",preco:+l.vUnit||0,compraId:c.id,pegoPor:CP.eu().nome,pegoEm:Date.now(),aMais:true});
    else if(d==="proxima")extrasProxima.push({nome:pr.nome,qtd:+l.qtd||1,un:String(l.un||pr.un||"un").toLowerCase()});});
  a.naoAchados.forEach(it=>{const escolha=rc.faltas[it.id]||CP.escolhaPadrao(it);
    if(escolha==="outro"){const o=rc.outro[it.id]||{};it.estado="outroMercado";it.outroMercado=String(o.mercado||"").slice(0,60);it.preco=+o.valor||0;}
    else if(escolha==="dispensado")it.estado="dispensado";
    else if(escolha==="pego")it.estado="pego";
    else{it.estado="faltou";proxima.push(it);}
    CP.salvarReg("itens",it);});
  // o que faltou vai para a próxima lista aberta (ou uma nova)
  if(proxima.length||extrasProxima.length){let l2=CP.listasAbertas().find(l=>l.id!==rc.listaId);if(!l2)l2=CP.novaLista("Faltou da última compra");
    proxima.forEach(it=>CP.addItem(l2.id,it.nome,it.qtd,it.un,it.mercadoId,it.id));extrasProxima.forEach(x=>CP.addItem(l2.id,x.nome,x.qtd,x.un));}
  if(rc.listaId){const l=CP.por("listas",rc.listaId);if(l&&!CP.itensDa(l.id).some(i=>i.estado==="pendente")){l.status="fechada";l.fechada=CP.hoje();CP.salvarReg("listas",l);}}
  CP.precisaAnos=true;CP.gravar();
  return{compra:c,analise:a,faltou:proxima.length};};

// ---------- "peguei algo a mais" (linha da nota que não estava na lista) ----------
// Cada linha a mais tem um destino ESCOLHIDO pela pessoa (nada acontece sozinho; dá para trocar até salvar):
//   "so-compra" (padrão) = fica só nesta compra (o produto entra no catálogo interno para guardar o preço, mas não vai para a lista)
//   "lista"              = também entra na lista desta compra, já como "pego" (fica no histórico da lista)
//   "proxima"            = entra como pendente na próxima lista aberta (comprar de novo)
const DESTINOS_EXTRA=["so-compra","lista","proxima"];
CP.DESTINOS_EXTRA=DESTINOS_EXTRA;
CP.destinoExtra=l=>l&&DESTINOS_EXTRA.includes(l.extraDestino)?l.extraDestino:"so-compra";
// linhas da nota fora da lista, com o índice (para a tela mostrar o botão certo em cada uma)
CP.linhasAMais=rc=>(rc&&rc.linhas||[]).map((l,i)=>({i,linha:l})).filter(x=>!x.linha.itemId).map(x=>({i:x.i,desc:x.linha.desc,qtd:+x.linha.qtd||1,vTotal:CP.r2(+x.linha.vTotal||0),destino:CP.destinoExtra(x.linha)}));
CP.definirDestinoExtra=function(rc,i,destino){const l=rc&&rc.linhas&&rc.linhas[i];if(!l||l.itemId||!DESTINOS_EXTRA.includes(destino))return false;l.extraDestino=destino;return true;};
// acrescentar à mão uma linha a mais (compra sem nota, ou item que a nota não trouxe)
CP.addLinhaAMais=function(rc,o){const desc=String(o&&o.desc||"").trim().slice(0,120);if(!desc||!rc)return null;
  const qtd=CP.numBR(o.qtd)||1,vUnit=CP.numBR(o.vUnit),vTotal=o.vTotal!=null&&o.vTotal!==""?CP.numBR(o.vTotal):CP.r2(qtd*vUnit);
  const l={desc,cod:"",qtd,un:String(o.un||"UN").toUpperCase(),vUnit:vUnit||(qtd?CP.r2(vTotal/qtd):0),vTotal,itemId:null,conf:1,extraDestino:DESTINOS_EXTRA.includes(o.destino)?o.destino:"so-compra"};
  if(o.marca)l.marca=String(o.marca).slice(0,40);rc.linhas.push(l);return l;};

// ---------- fechamento de caixa: nota × total digitado no mercado × soma do app ----------
// Referência = a nota (o que foi cobrado de verdade). O app soma os itens (menos descontos que você informar) e é comparado com ela;
// o total que você digitou do caixa/carrinho também. Entradas aceitam número ou texto brasileiro ("1.550,30").
const valorOuNulo=v=>{if(v==null||v==="")return null;

CP.fechamentoCaixa=function(o){o=o||{};const D=CP.dinheiroTxt;
  const nota=valorOuNulo(o.notaTotal),mer=valorOuNulo(o.digitadoMercado),app=valorOuNulo(o.somaApp);
  const ds=Array.isArray(o.descontos)?o.descontos:[o.descontos];const desc=CP.r2(ds.reduce((s,x)=>s+(valorOuNulo(x)||0),0));
  const appLiq=app==null?null:CP.r2(app-desc);
  const dif={appMenosNota:nota!=null&&appLiq!=null?CP.r2(appLiq-nota):null,mercadoMenosNota:nota!=null&&mer!=null?CP.r2(mer-nota):null,appMenosMercado:mer!=null&&appLiq!=null?CP.r2(appLiq-mer):null};
  const valores={nota,mercado:mer,app,descontos:desc,appLiquido:appLiq};
  let veredito,mercado=null;const pistas=[];
  const ref=nota!=null?"nota":mer!=null?"mercado":null;
  if(ref&&appLiq!=null){const d=ref==="nota"?dif.appMenosNota:dif.appMenosMercado,alvo=ref==="nota"?nota:mer,nome=ref==="nota"?"a nota cobrou":"o total que você digitou no mercado é";
    const v=vereditoDe(d);
    const conta="o app soma "+D(appLiq)+(desc?" (já tirando "+D(desc)+" de desconto)":"");
    veredito=Object.assign(v,{contra:ref,texto:v.tipo==="confere"?"Confere: "+(ref==="nota"?"a nota":"o total do mercado")+" e o app batem em "+D(alvo)+".":
      v.tipo==="falta"?"Falta "+D(v.valor)+" no app: "+nome+" "+D(alvo)+" e "+conta+". Pode ser item que ficou de fora, preço digitado a menos ou desconto informado a mais.":
      "Sobra "+D(v.valor)+" no app: "+nome+" "+D(alvo)+" e "+conta+". Pode ser desconto que falta informar, item que não foi cobrado ou preço digitado a mais."});
    if(v.tipo!=="confere"){
      (o.linhas||[]).forEach(l=>{if(l&&ZERO((+l.vTotal||0)-v.valor))pistas.push("A diferença é igual ao item “"+String(l.desc||"?").slice(0,60)+"” ("+D(+l.vTotal)+").");});
      if(v.valor<=0.05)pistas.push("É diferença de centavos: costuma ser arredondamento da nota.");}}
  else veredito={tipo:"incompleto",valor:0,contra:null,texto:"Falta informar "+(nota==null&&mer==null?"o total da nota ou o total do mercado":"a soma do app")+" para conferir."};
  if(nota!=null&&mer!=null){const v=vereditoDe(dif.mercadoMenosNota);
    mercado=Object.assign(v,{texto:v.tipo==="confere"?"O total que você digitou no mercado bate com a nota ("+D(nota)+").":
      v.tipo==="falta"?"O total que você digitou no mercado está "+D(v.valor)+" abaixo da nota ("+D(mer)+" × "+D(nota)+"): algum item não foi digitado ou foi digitado a menos.":
      "O total que você digitou no mercado está "+D(v.valor)+" acima da nota ("+D(mer)+" × "+D(nota)+"): algum item foi digitado a mais."});}
  return{valores,diferencas:dif,veredito,mercado,pistas,confere:veredito.tipo==="confere"&&(!mercado||mercado.tipo==="confere")};};
// o mesmo, a partir do rascunho da conferência (com o total que a pessoa digitou do mercado)
CP.fechamentoDoRascunho=function(rc,digitadoMercado,descontosExtras){const a=CP.analisar(rc);
  return CP.fechamentoCaixa({notaTotal:rc.origem==="nfce"&&+rc.total>0?rc.total:null,digitadoMercado,somaApp:a.soma,descontos:[rc.desconto,descontosExtras],linhas:rc.linhas});};

CP.totalPegos=function(lid){let total=0,com=0,sem=0;
  CP.itensDa(lid).filter(i=>i.estado==="pego").forEach(i=>{const u=+i.preco>0?+i.preco:(i.produtoId&&CP.ultimoPreco(i.produtoId)||{}).vUnit;

const ZX={url:"https://cdn.jsdelivr.net/npm/barcode-detector@3.2.3/dist/iife/ponyfill.js",sri:"sha384-ZQvvHKgw7Ktqkui5vapXokyfDpQcnXLZhR9hfFMh8rUQztTRNywKQdQ994308nhY"};

  try{if(typeof BarcodeDetector!=="undefined"&&(await BarcodeDetector.getSupportedFormats()).includes("qr_code"))return new BarcodeDetector({formats:["qr_code"]});}catch(e){}
  if(typeof BarcodeDetectionAPI==="undefined")await new Promise((ok,erro)=>{const s=document.createElement("script");s.src=ZX.url;s.integrity=ZX.sri;s.crossOrigin="anonymous";s.onload=ok;s.onerror=()=>erro(new Error("Não consegui carregar o leitor de QR (sem internet?)."));document.head.appendChild(s);});

let camera=null,geracao=0;

CP.pararCamera=function(){geracao++;CP.abrindoCamera=false;if(camera){camera.ativo=false;try{camera.stream.getTracks().forEach(t=>t.stop());}catch(e){}camera=null;}};

  try{const det=await CP.detector();if(g!==geracao)return;
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
    if(g!==geracao){try{stream.getTracks().forEach(t=>t.stop());}catch(e){}return;}
    camera={stream,ativo:true};video.srcObject=stream;video.setAttribute("playsinline","");await video.play();
    if(g!==geracao)return;
    const laco=async()=>{if(!camera||!camera.ativo||g!==geracao)return;
      try{const r=await det.detect(video);if(g===geracao&&r&&r.length&&r[0].rawValue){const t=r[0].rawValue;CP.pararCamera();aoLer(t);return;}}catch(e){}

  finally{if(g===geracao)CP.abrindoCamera=false;}};

  const e=$("cpSync");if(e)e.textContent=CP.textoSync();const v=$("cpVivo");if(v){const x=CP.estadoVivo();v.textContent=x.txt;v.className="cp-ao-vivo"+(x.ok?"":" off");}};
CP.aoReceber=function(){if(HUB.atual()==="lista")CP.renderFundo();else if(HUB.atual()==="hub")HUB.mostrar(true,true);};
if(typeof document!=="undefined"&&document.addEventListener)document.addEventListener("focusout",()=>{if(CP.renderPendente&&listaAberta())setTimeout(()=>{const a=document.activeElement;if(listaAberta()&&(!a||!/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName||"")))CP.render();},60);else if(CP.renderPendente)CP.renderPendente=false;});

// ao sair de um campo de número, mostra no padrão do Brasil (1550,3 → 1.550,30); o valor guardado continua sendo número normal
if(typeof document!=="undefined"&&document.addEventListener)document.addEventListener("focusout",e=>{const t=e.target;if(!t||!t.getAttribute||t.getAttribute("data-cpnum")==null||t.value==null||!String(t.value).trim())return;
  const c=t.getAttribute("data-cpnum");const v=CP.numBR(t.value);t.value=c==="q"?qtdTxt(v):CP.fmtNum(v,+c);},true);

// ---------- VA do mês (lido das finanças) ----------
function cardVA(ym,extraGasto){const r=CP.resumoMes(ym);
  if(r.vaRecebido==null)return `<div class="note">💳 VA de ${lblMes(ym)}: o mês ainda não existe em Contas Casa → Editar dados (o valor do VA vem de lá).</div>`;
  const depois=extraGasto?CP.r2(r.vaSaldo-extraGasto):null;
  return `<div class="cp-va"><span>💳 VA ${lblMes(ym)}</span><b>${F(r.vaRecebido)}</b><span>gasto em compras</span><b class="rose">${F(r.va)}</b><span>saldo</span><b class="${r.vaSaldo>=0?"teal":"rose"}">${F(r.vaSaldo)}</b>${depois!=null?`<span>depois desta</span><b class="${depois>=0?"teal":"rose"}">${F(depois)}</b>`:""}</div>`;}

// ---------- VR por cartão (ciclo 30→29; "usou tudo? quanto tem agora?") ----------
const dmBR=d=>/^\d{4}-\d{2}-\d{2}$/.test(String(d))?d.slice(8,10)+"/"+d.slice(5,7):"";
function cardVR(extra,cartaoSel,refData){let rs=[];try{rs=CP.resumoCartoes(/^\d{4}-\d{2}-\d{2}$/.test(String(refData||""))?refData:CP.hoje());}catch(e){}
  if(!rs.length)return cardVA(CP.ymAtual(),extra);
  const prin=rs[0].cartaoId;
  return rs.map(s=>{const alvo=(cartaoSel||prin)===s.cartaoId,depois=extra&&alvo&&s.saldo!=null?CP.r2(s.saldo-extra):null;
    return `<div class="cp-va" style="margin-bottom:8px"><span><b>💳 ${esc(s.nome)}</b> · ${esc(s.ciclo.rotulo)}</span><span class="note" style="margin:0;text-align:right">${dmBR(s.ciclo.inicio)} a ${dmBR(s.ciclo.fim)}</span>
      <span>valor original${s.origemOriginal==="financas"?" (das finanças)":s.origemOriginal==="editado"?" (editado)":""}</span><b>${s.original==null?"—":F(s.original)}</b>
      <span>gasto nas compras</span><b class="rose">${F(s.gastoLista)}</b>
      ${s.semAjuste?"":`<span>saldo informado${s.em?" em "+dmBR(s.em):""}</span><b>${F(s.saldoAgora)}</b>`}
      <span>saldo</span><b class="${s.saldo==null?"":s.saldo>=0?"teal":"rose"}">${s.saldo==null?"—":F(s.saldo)}</b>
      ${depois!=null?`<span>depois desta</span><b class="${depois>=0?"teal":"rose"}">${F(depois)}</b>`:""}</div>
      ${s.avisos.map(a=>`<p class="note" style="margin:0 0 4px">⚠ ${esc(a)}</p>`).join("")}
      <div class="row" style="margin-bottom:10px"><button class="btn cp-mini" onclick="CP.ajustarCartao('${A(s.cartaoId)}')">💬 usou tudo? quanto tem agora?</button><button class="btn cp-mini" onclick="CP.originalCartao('${A(s.cartaoId)}')">✏️ valor original</button></div>`;}).join("");}
CP.ajustarCartao=function(id){const s=CP.saldoCartao(id,CP.hoje());const t=prompt("Quanto tem no cartão "+s.nome+" agora? (digite 0 se já usou tudo)",s.saldoAgora!=null?CP.fmtNum(s.saldoAgora,2):(s.saldo!=null?CP.fmtNum(s.saldo,2):""));if(t==null)return;
  if(!/^\s*R?\$?\s*\d[\d.,\s]*$/.test(t)){alert("Digite só o valor em reais (ex.: 123,45), ou 0 se já usou tudo. Nada foi alterado.");return;}
  try{CP.ajustarSaldoCartao(id,CP.hoje(),{saldoAgora:t,usouTudo:CP.numBR(t)===0});CP.gravar();CP.render();}catch(e){alert(e.message);}};
CP.originalCartao=function(id){const s=CP.saldoCartao(id,CP.hoje());const t=prompt("Valor original creditado no cartão "+s.nome+" neste ciclo ("+s.ciclo.rotulo+"). Deixe vazio para voltar ao valor das finanças:",s.original!=null?CP.fmtNum(s.original,2):"");if(t==null)return;
  if(t.trim()&&!/^\s*R?\$?\s*\d[\d.,\s]*$/.test(t)){alert("Digite só o valor em reais (ex.: 600,00). Nada foi alterado.");return;}
  try{CP.definirOriginalCiclo(id,CP.hoje(),t.trim()?t:null);CP.gravar();CP.render();}catch(e){alert(e.message);}};
CP.novoCartao=function(){const n=prompt("Nome do cartão (ex.: VR da mãe):");if(!n||!n.trim())return;let id=CP.norm(n).replace(/\s+/g,"-").slice(0,20)||"cartao"+Date.now().toString(36);const usados=new Set(CP.cartoesVR().map(c=>c.id));let k=2;const base=id;while(usados.has(id))id=base.slice(0,16)+"-"+(k++); // nome repetido não sobrescreve outro cartão
  const dia=CP.numBR(prompt("Dia do mês em que o valor cai:","30"))||30;const v=prompt("Valor que cai todo mês (deixe vazio se vem das finanças):","");
  try{CP.salvarCartaoVR({id,nome:n.trim().slice(0,30),diaCredito:Math.min(31,Math.max(1,Math.round(dia))),deFinancas:false,valorOriginal:v&&v.trim()?CP.numBR(v):null,ciclos:{}});CP.gravar();CP.render();}catch(e){alert(e.message);}};
CP.editarCartao=function(id){const c=CP.cartaoVR(id);const n=prompt("Nome do cartão:",c.nome);if(n==null)return;const dia=prompt("Dia do mês em que o valor cai:",String(c.diaCredito));if(dia==null)return;
  const v=prompt("Valor que cai todo mês (vazio = sem valor fixo):",c.valorOriginal!=null?CP.fmtNum(c.valorOriginal,2):"");if(v==null)return;
  try{CP.salvarCartaoVR(Object.assign({},c,{nome:n.trim().slice(0,30)||c.nome,diaCredito:Math.min(31,Math.max(1,Math.round(CP.numBR(dia))||30)),valorOriginal:v.trim()?CP.numBR(v):null}));CP.gravar();CP.render();}catch(e){alert(e.message);}};
CP.financasCartao=function(id,on){const c=CP.cartaoVR(id);try{CP.salvarCartaoVR(Object.assign({},c,{deFinancas:!!on}));CP.gravar();CP.render();}catch(e){alert(e.message);}};
CP.removerCartao=function(id){if(!confirm("Remover este cartão? As compras antigas continuam, mas passam a contar no cartão principal."))return;if(!CP.removerCartaoVR(id))alert("Precisa existir pelo menos um cartão.");else{CP.gravar();CP.render();}};

// ---------- LISTA ----------
function telaLista(){
  const abertas=CP.listasAbertas();
  if(ui.lista&&!abertas.some(l=>l.id===ui.lista))ui.lista=null;
  if(!ui.lista&&abertas.length)ui.lista=abertas[0].id;
  const ym=CP.ymAtual();
  if(!ui.lista)return `<div class="card">${cardVR()}</div><div class="card"><h3>Nenhuma lista aberta</h3>
    <p class="note">Crie uma lista e vá adicionando os itens. Quem estiver com o app aberto vê ao vivo o que foi pego.</p>
    <div class="row" style="margin-top:8px"><input id="cpNovaLista" placeholder="nome (ex.: compra do mês)"><button class="btn primary" onclick="CP.criarLista()">+ Nova lista</button></div></div>
    ${blocoSugestoes(null)}`;
  const l=CP.por("listas",ui.lista),its=CP.itensDa(l.id);
  const pend=its.filter(i=>i.estado==="pendente"),pegos=its.filter(i=>i.estado==="pego");
  const pv=CP.previaLista(l.id),r=CP.resumoMes(ym);
  const secoes=Object.create(null);its.filter(i=>ui.mostrarPegos||i.estado!=="pego").forEach(i=>{(secoes[i.secao||"Outros"]=secoes[i.secao||"Outros"]||[]).push(i);});
  const eu=CP.eu().nome;
  const linha=i=>{const u=i.produtoId&&CP.ultimoPreco(i.produtoId);const ok=i.estado==="pego";
    const tag=i.estado==="faltou"?'<span class="pill rose">faltou</span>':i.estado==="outroMercado"?`<span class="pill">outro mercado${i.outroMercado?": "+esc(i.outroMercado):""}</span>`:i.estado==="dispensado"?'<span class="pill">não precisou</span>':"";
    return `<div class="cp-item ${ok?"ok":""}" data-ancora="${esc(i.id)}">
      <button class="cp-check" role="checkbox" aria-checked="${ok?"true":"false"}" aria-label="${esc(i.nome)}" onclick="CP.pegar('${A(i.id)}','${ok?"pendente":"pego"}')">${ok?"✓":""}</button>
      <div class="cp-nome" role="button" tabindex="0" aria-label="editar ${esc(i.nome)}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();CP.editar('${A(i.id)}')}" onclick="CP.editar('${A(i.id)}')"><span class="cp-emo" aria-hidden="true">${esc(emojiDe(i))}</span><b>${esc(i.nome)}</b> <span class="note" style="margin:0">${esc(fmtQtd(i.qtd))} ${esc(i.un||"un")}</span> ${tag}${i.aMais?' <span class="pill rose">a mais</span>':""}${(()=>{try{const m=CP.mercadoDoItem(i);return m?` <span class="pill">📍 ${esc(CP.nomeMercado(m))}</span>`:"";}catch(e){return"";}})()}
        <div class="note" style="margin:0">${ok&&i.pegoPor?"✓ "+esc(i.pegoPor)+(i.pegoEm?" às "+new Date(i.pegoEm).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):""):i.resp?"🙋 "+esc(i.resp):""}${u?` · últ. ${F(u.vUnit)} (${esc(u.mercado)}, ${dataBR(u.data)})`:""}</div>${precoItemHtml(i)}</div>
    </div>${ui.editando===i.id?editorItem(i):""}`;};
  return `<div class="card">${cardVR()}
      <div class="cp-prev">🧮 Estimativa desta lista: <b>${F(pv.total)}</b>${pv.sem?` <span class="note" style="margin:0">(${pv.sem} item(ns) ainda sem preço conhecido)</span>`:""}
      ${pv.ref?` <span class="note" style="margin:0">(${CP.fmtNum(pv.ref,0)} com preço de hoje da comparação)</span>`:""}${orcHtml(l,pv,r)}</div></div>
    ${blocoPrecos(l,pend.length)}
    <div class="card">
      <div class="flexbet"><div class="row">${abertas.length>1?`<select onchange="CP.ui.lista=this.value;CP.render()">${abertas.map(x=>`<option value="${esc(x.id)}" ${x.id===l.id?"selected":""}>${esc(x.nome)}</option>`).join("")}</select>`:`<h3 style="margin:0">${esc(l.nome)}</h3>`}
        <span class="note" style="margin:0">${pegos.length}/${its.length} pegos · <span class="cp-ao-vivo ${CP.estadoVivo().ok?"":"off"}" id="cpVivo">${esc(CP.estadoVivo().txt)}</span></span></div>
        <div class="row"><button class="btn" onclick="CP.renomearLista()">✏️</button><button class="btn" onclick="CP.criarLista(true)">+ lista</button></div></div>
      <div class="cp-carrinho">🧺 <span id="cpCarrinhoTxt">${carrinhoHtml(l.id)}</span><input id="cpCarrinhoIn" type="text" inputmode="decimal" data-cpnum="2" value="${esc(ui.carrinho||"")}" aria-label="total que o caixa mostra até agora" placeholder="total no caixa até agora" oninput="CP.carrinhoDig(this.value)" style="flex:1;min-width:130px"></div>
      <div class="cp-add"><input id="cpItemNome" list="cpProdutos" placeholder="adicionar item (ex.: arroz ou arroz/tio joão)" autocomplete="off" onkeydown="if(event.key==='Enter')CP.addItemTela()">
        <input id="cpItemQtd" type="text" inputmode="decimal" data-cpnum="q" value="1" aria-label="quantidade" style="width:70px">
        <select id="cpItemUn">${["un","kg","g","L","pct","cx","dz"].map(u=>`<option>${u}</option>`).join("")}</select>
        <select id="cpItemMerc" aria-label="mercado deste item (opcional)"><option value="">qualquer mercado</option>${CP.vivos("mercados").sort((a,b)=>String(a.apelido||a.nome).localeCompare(String(b.apelido||b.nome),"pt-BR")).map(m=>`<option value="${esc(m.id)}">${esc(m.apelido||m.nome)}</option>`).join("")}</select>
        <button class="btn primary" aria-label="adicionar à lista" onclick="CP.addItemTela()">+</button><button class="btn" title="Peguei algo que não estava na lista: entra já como pego" onclick="CP.addPegueiAMais()">✓ peguei a mais</button></div>
      <datalist id="cpProdutos">${CP.vivos("produtos").map(p=>`<option value="${esc(p.nome)}">`).join("")}</datalist>
      ${!ui.mostrarPegos&&pegos.length?`<div class="cp-aviso card" style="margin:8px 0" role="status">✓ <b>${pegos.length} ${pegos.length===1?"item pego está escondido":"itens pegos estão escondidos"}</b> (o que você já pegou não aparece). <button class="btn cp-mini" onclick="CP.ui.mostrarPegos=true;CP.render()">Mostrar riscados</button></div>`:""}
      ${its.length?"":`<p class="note">Lista vazia. Adicione os itens acima${CP.sugestoesReposicao(l.id).length?" ou use as sugestões abaixo":""}.</p>`}
      ${Object.entries(secoes).map(([s,xs])=>`<div class="cp-secao"><div class="flexbet"><span>${emoSec(s)} ${esc(s)}</span><button class="btn cp-mini" onclick="CP.euPego('${A(s)}')">🙋 eu pego</button></div>${xs.map(linha).join("")}</div>`).join("")}
      <div class="row" style="margin-top:10px;justify-content:space-between"><label class="note" style="margin:0"><input type="checkbox" ${ui.mostrarPegos?"checked":""} style="accent-color:#0f766e" onchange="CP.ui.mostrarPegos=this.checked;CP.render()"> mostrar os já pegos (riscados)</label>
        <span class="note" style="margin:0">você aparece como <b>${esc(eu)}</b> (<a href="#" onclick="CP.irAba('ajustes');return false">trocar</a>)</span></div>
    </div>
    ${blocoSugestoes(l.id)}
    <div class="cp-rodape"><button class="btn primary" style="flex:1" onclick="CP.finalizar()">🧾 Finalizar compra (ler a nota)</button></div>`;}
const fmtQtd=q=>{q=+q||0;return q.toLocaleString("pt-BR",{maximumFractionDigits:3});};
function editorItem(i){return `<div class="cp-editor">
  <div class="row"><input id="cpEdNome" value="${esc(i.nome)}" style="flex:1;min-width:140px"><input id="cpEdQtd" type="text" inputmode="decimal" data-cpnum="q" value="${esc(qtdTxt(i.qtd))}" aria-label="quantidade" style="width:80px">
  <select id="cpEdUn">${["un","kg","g","L","pct","cx","dz"].map(u=>`<option ${u===(i.un||"un")?"selected":""}>${u}</option>`).join("")}</select>
  <select id="cpEdSec" aria-label="seção">${CP.SECOES.map(s=>`<option ${s===i.secao?"selected":""}>${esc(s)}</option>`).join("")}</select>
  <input id="cpEdEmoji" aria-label="emoji do produto" maxlength="8" placeholder="emoji" value="${esc(emojiDe(i))}" style="width:70px">
  <select id="cpEdMerc" aria-label="mercado deste item"><option value="">qualquer mercado</option>${CP.vivos("mercados").sort((a,b)=>String(a.apelido||a.nome).localeCompare(String(b.apelido||b.nome),"pt-BR")).map(m=>`<option value="${esc(m.id)}" ${m.id===i.mercadoId?"selected":""}>${esc(m.apelido||m.nome)}</option>`).join("")}</select></div>
  ${i.precoRef?`<div class="note" style="margin:4px 0 0">💲 preço de referência: ${F(i.precoRef.p)} (${esc(i.precoRef.r)}, ${esc(dataBR(i.precoRef.d))})</div>`:""}
  <div class="row" style="margin-top:6px"><button class="btn primary" onclick="CP.salvarEdicao('${A(i.id)}')">Salvar</button>
  <button class="btn" onclick="CP.estadoItem('${A(i.id)}','pendente')">↺ pendente</button>
  <button class="btn" onclick="CP.estadoItem('${A(i.id)}','dispensado')">não precisa</button>
  <button class="btn danger" onclick="CP.removerItem('${A(i.id)}')">remover</button><button class="btn" onclick="CP.editar(null)">fechar</button></div></div>`;}
// ---------- 💲 Preços de hoje: consulta os itens que faltam nos sites dos mercados (a lógica está em BP.precosHoje, 49) ----------
// São só consultas: nada disto é gravado como compra nem entra no histórico de preços.
const precosDaLista=lid=>{try{const R=typeof BP!=="undefined"&&BP.st&&BP.st.precosLista;return R&&R.listaId===lid?R:null;}catch(e){return null;}};
function precoItemHtml(i){try{const R=precosDaLista(ui.lista);if(!R||R.estado!=="ok"||i.estado!=="pendente")return"";const x=R.itens&&R.itens[i.id];if(!x)return"";
  if(!x.melhor)return`<div class="note cp-preco-item" style="margin:0">💲 sem preço nos sites agora</div>`;
  const m=x.melhor,o=m.o,q=+i.qtd||1;
  return`<div class="note cp-preco-item" style="margin:0">💲 mais barato: <b>${esc(m.rede)} ${F(o.preco)}</b> · ${esc(o.nome)}${o.porBase?" · "+F(o.porBase)+"/"+esc(o.base):""}${q!==1||m.porBase?` · para ${esc(fmtQtd(q))} ${esc(i.un||"un")}: <b>${F(m.v)}</b>${m.aprox?" (aprox.)":""}`:""}</div>`;}catch(e){return"";}}
function blocoPrecos(l,pendN,origem){if(typeof BP==="undefined"||!BP.compararMercados)return"";
  const prox=origem==="proxima",idc=prox?"cpPrecosProx":"cpPrecos",R=precosDaLista(prox?"proxima":l.id),chamar=prox?"BP.compararMercados('proxima')":"BP.compararMercados()";
  const topo=(extra)=>`<div class="flexbet"><span><b>💲 Comparar mercados</b><span class="note" style="margin:0;display:block">Onde comprar esta lista fica mais barato (consulta os sites; só quando você toca).</span></span>${extra}</div>`;
  const fechar=`<button class="btn cp-mini" aria-label="fechar a comparação de mercados" onclick="BP.limparPrecos()">✕</button>`;
  if(!R)return`<div class="card" id="${idc}">${topo(`<button class="btn" ${pendN?"":"disabled"} onclick="${chamar}">💲 Comparar mercados</button>`)}${pendN?"":`<p class="note">Não há itens para comparar.</p>`}</div>`;
  if(R.estado==="vazia")return`<div class="card" id="${idc}">${topo(fechar)}<p class="note">Não há itens pendentes para comparar.</p></div>`;
  if(R.estado==="carregando")return`<div class="card" id="${idc}">${topo("")}<p class="note" id="cpPrecosProg" role="status">⏳ Consultando ${CP.fmtNum(R.prog.feito,0)} de ${CP.fmtNum(R.prog.total,0)}…</p></div>`;
  if(R.estado==="previa"){const pv=BP.previaAnalise();if(!pv)return"";const MAX=BP.MAX_ITENS;
    const bloq=pv.bloqueio==="semIntermediario"?"Para consultar os preços nos sites, configure o intermediário em Ajustes.":pv.bloqueio==="semSites"?"Nenhum mercado com consulta de preço cadastrado.":pv.bloqueio;
    const pendentes=BP.itensAnalise(R);
    return`<div class="card" id="${idc}">${topo(fechar)}
      ${R.n>MAX?`<p class="note" style="margin-top:0"><b>A lista tem ${CP.fmtNum(R.n,0)} itens e a análise aceita até ${MAX}</b> (para não gastar o limite grátis). Marque quais comparar:</p>
        <div class="cp-selitens">${pendentes.map(i=>`<label class="cp-selitem"><input type="checkbox" ${R.sel[i.id]?"checked":""} onchange="BP.alternarItem('${A(i.id)}',this.checked)"> ${esc(i.nome)}</label>`).join("")}</div>`:`<p class="note" style="margin-top:0">${CP.fmtNum(pv.its.length,0)} ${pv.its.length===1?"item será comparado":"itens serão comparados"} em ${CP.fmtNum(pv.redes.length,0)} mercado(s): ${pv.redes.map(esc).join(", ")}.</p>`}
      <p id="cpPrevia" style="margin:6px 0"><b>Esta análise vai usar ~${CP.fmtNum(pv.pedidos,0)} pedidos</b> (${CP.fmtPct(pv.pctAnalise,2)} do limite diário do intermediário; hoje já foram ${CP.fmtPct(pv.pctHoje)}).${pv.emCache?` <span class="note" style="margin:0">${CP.fmtNum(pv.emCache,0)} consulta(s) já estão guardadas (30 min) e não gastam pedido.</span>`:""}</p>
      ${bloq?`<p class="note" style="color:#be123c" role="alert">⛔ ${esc(bloq)}</p>`:""}
      <div class="row"><button class="btn primary" ${pv.bloqueio?"disabled":""} onclick="BP.rodarAnalise()">Rodar a análise</button><button class="btn" onclick="BP.limparPrecos()">Cancelar</button></div></div>`;}
  if(R.estado==="semIntermediario")return`<div class="card" id="${idc}">${topo(fechar)}<p class="note">Para consultar os preços nos sites, configure o intermediário em <a href="#" onclick="CP.irAba('ajustes');return false">Ajustes</a>.</p></div>`;
  const min=Math.max(0,Math.round((Date.now()-R.em)/60000)),n=(R.analisados||[]).length;
  const nome=id=>{const x=CP.por("itens",id);return x?x.nome:"";};
  const resumoConta=Object.entries(R.conta||{}).sort((a,b)=>b[1]-a[1]).map(([r,c])=>`${CP.fmtNum(c,0)} no ${esc(r)}`).join(" e ");
  const rot=o=>o.tipo==="misto"?"Plano misto ("+o.redes.map(esc).join(" + ")+"): cada item no mais barato":"Tudo no "+esc(o.rede);
  return`<div class="card" id="${idc}">${topo(`<span class="row"><button class="btn cp-mini" onclick="${chamar}">↻ de novo</button>${fechar}</span>`)}
    <p class="note" style="margin-top:0">Consultado ${min?"há "+CP.fmtNum(min,0)+" min":"agora"}. Preço do site pode ser diferente na loja; nada disto é gravado como compra.</p>
    ${resumoConta?`<p style="margin:6px 0" id="cpResumoConta"><b>De ${CP.fmtNum(n,0)} ${n===1?"item":"itens"}, ${resumoConta} ${Object.keys(R.conta).length===1&&Object.values(R.conta)[0]===1?"fica mais barato":"ficam mais baratos"}.</b></p>`:`<p style="margin:6px 0">Nenhum site mostrou preço para os itens da lista agora.</p>`}
    ${R.opcoes.map(o=>`<div class="cp-linha cp-opcao ${o.chave===R.melhorOpcao?"melhor":""}"><div class="flexbet"><b>${rot(o)}</b>${o.chave===R.melhorOpcao?'<span class="pill teal">🏆 melhor</span>':""}</div>
      <div class="note" style="margin:0">${F(o.total)} em ${CP.fmtNum(o.achou,0)}/${CP.fmtNum(n,0)} itens${o.desloc?` + ${F(o.desloc)} de deslocamento${o.tipo==="misto"?" (as duas viagens)":""} = <b>${F(o.custo)} com deslocamento</b>`:""}${o.semDesloc?`<span style="color:#b45309">${o.desloc?" · ":" — "}${esc(BP.avisoSemDesloc(o.semDesloc))}</span>`:""}${o.aprox?` · ${CP.fmtNum(o.aprox,0)} aprox.`:""}${o.faltam?` · ${CP.fmtNum(o.faltam,0)} sem preço lá (não entram na soma)`:""}</div>
      <div class="row" style="margin-top:4px">${R.escolhida===o.chave?'<span class="pill teal">✓ escolhida</span>':`<button class="btn cp-mini" onclick="BP.escolherOpcao('${A(o.chave)}')">Usar esta opção</button>`}</div></div>`).join("")}
    ${R.escolhida?(prox?`<p class="note" role="status" id="cpEscolhida">✔ Opção escolhida. Ao tocar em “Criar esta lista”, cada item já nasce com o mercado e o preço de hoje.</p>`:`<p class="note" role="status" id="cpEscolhida">✔ Lista atualizada: cada item tem o mercado escolhido e o preço de hoje; a estimativa já usa esses preços. Para trocar o mercado de um item, toque no nome dele.</p>`):`<p class="note">Escolha uma opção para ${prox?"já criar a lista com mercado e preço":"atualizar a lista"} (ou ignore e siga como está).</p>`}
    ${(R.habitual||[]).length?`<div id="cpHabitual" class="cp-habitual"><b>💡 Preço fora do habitual</b><span class="note" style="margin:0;display:block">Mais barato em outro mercado do que o último que você pagou (comparação lado a lado):</span>${R.habitual.map(h=>`<div class="cp-linha"><b>${esc(h.nome)}</b>: ${F(h.dif)} a menos no ${esc(h.rede)} do que você pagou no ${esc(h.ultMercado)} <span class="note" style="margin:0">(${F(h.hoje)} hoje × ${F(h.antes)}${h.data?" em "+esc(dataBR(h.data)):""})</span></div>`).join("")}</div>`:""}
    ${R.semResultado.length?`<p class="note">Sem preço em nenhum site (contam à parte): ${R.semResultado.map(id=>esc(nome(id))).filter(Boolean).join(", ")}.</p>`:""}
    <div style="margin-top:6px">${BP.fontesLinhas?BP.fontesLinhas(R.fontes):""}</div></div>`;}
// quanto pretendo gastar: compara a estimativa da lista com o que a pessoa quer gastar e com o saldo do VR
function orcTxt(l,pv,r){const est=pv.total,orc=+l.orcamento>0?+l.orcamento:null;let t="";
  if(orc!=null)t+=est<=orc?`<b class="teal">✔ Dentro do que você pretende gastar</b>: estimativa ${F(est)} de ${F(orc)} (sobram ${F(orc-est)}).`:`<b class="rose">⚠ Passa em ${F(est-orc)}</b>: estimativa ${F(est)} para os ${F(orc)} que você pretende gastar.`;
  if(r&&r.vaSaldo!=null)t+=(t?" ":"")+(est<=r.vaSaldo?`Cabe no saldo do VR (${F(r.vaSaldo)}).`:`Passa ${F(est-r.vaSaldo)} do saldo do VR (${F(r.vaSaldo)}).`);
  return t;}
function orcHtml(l,pv,r){return`<div class="row" style="margin-top:8px"><label class="note" style="margin:0">Quanto pretendo gastar (R$) <input id="cpOrc" type="text" inputmode="decimal" data-cpnum="2" value="${esc(+l.orcamento>0?CP.fmtNum(l.orcamento,2):"")}" placeholder="ex.: 800,00" aria-label="quanto pretendo gastar nesta lista, em reais" style="width:130px" onchange="CP.orcamentoMudou('${A(l.id)}',this.value)"></label></div>
  <p class="note" id="cpOrcTxt" role="status" style="margin:4px 0 0">${orcTxt(l,pv,r)}</p>`;}
CP.orcamentoMudou=function(lid,v){CP.definirOrcamento(lid,v);const l=CP.por("listas",lid);if(!l)return;const el=$("cpOrcTxt");if(el)el.innerHTML=orcTxt(l,CP.previaLista(lid),CP.resumoMes(CP.ymAtual()));};
function blocoSugestoes(lid){const s=CP.sugestoesReposicao(lid);let prox="";try{prox=blocoProximaLista();}catch(e){}
  if(!s.length)return prox;
  return prox+`<div class="card"><h3>🔁 Está na hora de repor?</h3><p class="note" style="margin-top:0">Pelo seu histórico de compras.</p><div class="row">${s.map(x=>`<button class="btn cp-chip" onclick="CP.addSugestao('${A(x.p.id)}')">+ ${esc(x.p.nome)} <span class="note" style="margin:0">a cada ~${x.intervalo} dias · última há ${x.desde}</span></button>`).join("")}</div></div>`;}

// lista do próximo ciclo: sugerida a partir do 25 (faltando até 5 dias para o crédito) ou quando a pessoa pede
const proxMarcado=x=>x.qtdSugerida>0&&!x.jaNaLista&&(ui.proxSel&&ui.proxSel[x.produtoId]!=null?!!ui.proxSel[x.produtoId]:x.sobraInformada||x.qtdSugerida<=x.comprou); // sem "sobrou" informado e pedindo mais do que comprou: começa desmarcado
function proxItensHtml(p){return p.produtos.map(x=>`<div class="cp-linha"><div class="flexbet"><span><input type="checkbox" aria-label="incluir ${esc(x.nome)} na lista" ${proxMarcado(x)?"checked":""} ${x.qtdSugerida>0&&!x.jaNaLista?"":"disabled"} onchange="CP.proxMarcar('${A(x.produtoId)}',this.checked)"> <span class="cp-emo" aria-hidden="true">${esc(emojiDe({nome:x.nome,produtoId:x.produtoId}))}</span><b>${esc(x.nome)}</b> → <b data-pqtd="${esc(x.produtoId)}">${esc(qtdTxt(x.qtdSugerida))} ${esc(x.un)}</b>${x.jaNaLista?' <span class="pill">já está numa lista</span>':""}</span>
    <label class="note" style="margin:0">sobrou <input type="text" inputmode="decimal" data-cpnum="q" value="${x.sobraInformada?esc(qtdTxt(x.sobrou)):""}" placeholder="0" aria-label="quanto sobrou de ${esc(x.nome)}" style="width:64px" onchange="CP.sobrou('${A(x.produtoId)}',this.value)"></label></div>
    <details><summary class="note" style="margin:0">por quê?</summary><p class="note" style="margin:2px 0" data-pq="${esc(x.produtoId)}">${esc(x.porque)}</p></details></div>`).join("")||(p.avisos.length?"":'<p class="note">Nada para propor ainda.</p>');}
function blocoProximaLista(){const p=CP.proximaLista(CP.hoje(),{aPedido:!!ui.proxPedido});
  if(!p.devido&&!ui.proxPedido)return `<div class="card"><button class="btn" onclick="CP.ui.proxPedido=true;CP.render()">📅 Propor a lista do próximo ciclo</button></div>`;
  return `<div class="card"><div class="flexbet"><h3 style="margin:0">📅 Lista do ${esc(p.proximo.rotulo)}</h3><span class="note" style="margin:0">${p.proximo.dias} dias · faltam ${p.diasAteCredito} para o crédito</span></div>
    <p class="note" style="margin-top:4px">Pelo que você comprou e usou neste ciclo, multiplicado pelos dias do próximo. Diga quanto <b>sobrou</b> para ficar mais certo.</p>
    <div id="cpProxItens">${proxItensHtml(p)}</div>
    ${p.total>0?`<p id="cpProxTotal" class="note">🧮 Estimativa: <b>${F(p.total)}</b>${p.cabeNoVR!=null?` · cabe no VR de ${F(p.vrProximo)}? <b class="${p.cabeNoVR?"teal":"rose"}">${p.cabeNoVR?"sim":"não"}</b>`:""}</p>`:""}
    ${p.avisos.map(a=>`<p class="note">⚠ ${esc(a)}</p>`).join("")}
    ${blocoPrecos(null,p.produtos.some(proxMarcado)?1:0,"proxima")}
    <div class="row"><button class="btn primary" onclick="CP.criarListaProxima()">Criar esta lista</button>${ui.proxPedido&&!p.devido?`<button class="btn" onclick="CP.ui.proxPedido=false;CP.render()">fechar</button>`:""}</div></div>`;}
CP.sobrou=function(pid,txt){try{CP.registrarSobra(pid,txt);CP.gravar();}catch(e){}
  // atualiza só os TEXTOS (quantidade, "por quê?" e total): os campos não são recriados (recriar tirava o foco do próximo campo)
  const p=CP.proximaLista(CP.hoje(),{aPedido:!!ui.proxPedido});const x=p.produtos.find(y=>y.produtoId===pid);
  if(x){const q=document.querySelector('[data-pqtd="'+String(pid).replace(/["\\]/g,"")+'"]'),w=document.querySelector('[data-pq="'+String(pid).replace(/["\\]/g,"")+'"]');if(q)q.textContent=qtdTxt(x.qtdSugerida)+" "+x.un;if(w)w.textContent=x.porque;}
  const t=$("cpProxTotal");if(t)t.innerHTML="🧮 Estimativa: <b>"+F(p.total)+"</b>"+(p.cabeNoVR!=null?" · cabe no VR de "+F(p.vrProximo)+"? <b class=\""+(p.cabeNoVR?"teal":"rose")+"\">"+(p.cabeNoVR?"sim":"não")+"</b>":"");};
// itens da proposta que a pessoa marcou, no formato de item de lista (usado pela comparação de mercados)
CP.proxItensMarcados=function(){const p=CP.proximaLista(CP.hoje(),{aPedido:!!ui.proxPedido});
  return p.produtos.filter(proxMarcado).map(x=>({id:"p-"+x.produtoId,produtoId:x.produtoId,nome:x.nome,qtd:x.qtdSugerida,un:x.un,estado:"pendente"}));};
CP.proxMarcar=function(pid,on){ui.proxSel=ui.proxSel||{};ui.proxSel[pid]=!!on;};
CP.criarListaProxima=function(){const p=CP.proximaLista(CP.hoje(),{aPedido:true});p.produtos=p.produtos.filter(proxMarcado);const l=CP.aplicarProposta(p);
  if(!l){toast("Nada novo para criar: tudo já está numa lista aberta ou não há quantidade sugerida.");return;}
  try{if(typeof BP!=="undefined"&&BP.aplicarEscolhaProxima)BP.aplicarEscolhaProxima(l.id);}catch(e){} // a opção de mercado escolhida na proposta vira mercado + preço de hoje em cada item
  ui.lista=l.id;ui.proxPedido=false;CP.render();toast("✔ Lista criada: <b>"+esc(l.nome)+"</b>");};
CP.criarLista=function(pedir){let nome=val("cpNovaLista");if(pedir){nome=prompt("Nome da nova lista:","Compras "+dataBR(CP.hoje()));if(nome==null)return;}
  const l=CP.novaLista(nome||undefined);CP.gravar();ui.lista=l.id;CP.render();};
CP.renomearLista=function(){const l=CP.por("listas",ui.lista);if(!l)return;const n=prompt("Nome da lista:",l.nome);if(!n)return;l.nome=n.slice(0,60);CP.salvarReg("listas",l);CP.gravar();CP.render();};
CP.addItemTela=function(){const nome=val("cpItemNome").trim();if(!nome)return;
  if(!ui.lista){const l=CP.novaLista();ui.lista=l.id;}
  CP.addItem(ui.lista,nome,CP.numBR(val("cpItemQtd"))||1,val("cpItemUn"),val("cpItemMerc")||undefined);CP.gravar();
  const campo=$("cpItemNome");if(campo)campo.value="";
  CP.render();
  setTimeout(()=>{const x=$("cpItemNome");if(x&&x.focus)x.focus();},30);};
// peguei algo que não estava na lista: entra já como "pego" e como "a mais" (aparece assim na conferência)
CP.addPegueiAMais=function(){const nome=val("cpItemNome").trim();if(!nome){alert("Digite o que você pegou a mais no campo de adicionar item.");return;}
  if(!ui.lista){const l=CP.novaLista();ui.lista=l.id;}
  try{CP.pegueiAMais(ui.lista,nome,CP.numBR(val("cpItemQtd"))||1,val("cpItemUn"));CP.gravar();}catch(e){alert(e.message);return;}
  const campo=$("cpItemNome");if(campo)campo.value="";CP.render();toast("✓ <b>"+esc(nome)+"</b> entrou como pego (a mais).");};
// total no carrinho (itens pegos com preço conhecido) × o que o caixa mostra até agora
function carrinhoHtml(lid){let t;try{t=CP.conferirCarrinho(lid,ui.carrinho);}catch(e){return"";}
  return `<b>${F(t.total)}</b>${t.semPreco?` <span class="note" style="margin:0">(${t.semPreco} ${t.semPreco===1?"item":"itens"} sem preço)</span>`:""}${ui.carrinho&&t.texto?`<br><span class="note" style="margin:0">${esc(t.texto)}</span>`:""}`;}
CP.carrinhoDig=function(txt){ui.carrinho=txt;const e=$("cpCarrinhoTxt");if(e&&ui.lista)e.innerHTML=carrinhoHtml(ui.lista);};
CP.addSugestao=function(pid){const p=CP.por("produtos",pid);if(!p)return;if(!ui.lista){const l=CP.novaLista();ui.lista=l.id;}CP.addItem(ui.lista,p.nome,1,p.un);CP.gravar();CP.render();};
// ✓: a tela manda o que a pessoa QUER ("pego" ou "pendente"), nunca "inverter". Assim, se a tela estava velha e o outro já marcou,
// o toque não desfaz a marca dele; ignora toque duplo (<0,4 s) no mesmo item.
const toques={};
CP.pegar=function(id,quero){const t=Date.now();if(toques[id]&&t-toques[id]<400)return;toques[id]=t;
  CP.absorver();const i=CP.por("itens",id);if(!i){CP.render();return;}
  const eu=CP.eu();
  if(quero==="pendente"){
    if(i.estado!=="pego"){toast("↺ Este item já estava sem a marca de pego.");CP.render();return;}
    if(i._por&&i._por!==eu.id&&!confirm((i.pegoPor||"Outra pessoa")+" marcou este item como pego. Desmarcar mesmo assim?"))return;
    CP.definirPego(id,false);}
  else{
    if(i.estado==="pego"){toast("✓ "+esc(i.pegoPor||"Outra pessoa")+" já tinha pego "+esc(i.nome)+(i.pegoEm?" às "+new Date(i.pegoEm).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"")+".");CP.render();return;}
    CP.definirPego(id,true);if(!CP.nomeDefinido())toast("✓ Marcado. Diga seu nome no topo da Lista para a outra pessoa saber quem pegou.");}
  CP.gravar();CP.render();};
CP.editar=function(id){ui.editando=ui.editando===id?null:id;CP.render();};
CP.salvarEdicao=function(id){const i=CP.por("itens",id);if(!i)return;const nome=val("cpEdNome").trim()||i.nome;
  if(nome!==i.nome){const p=CP.garantirProduto(nome);i.produtoId=p.id;i.nome=p.nome;}
  i.qtd=CP.numBR(val("cpEdQtd"))||1;i.un=val("cpEdUn");i.secao=val("cpEdSec");
  const p=CP.por("produtos",i.produtoId);const emo=val("cpEdEmoji").trim().slice(0,8);
  if(p&&(p.secao!==i.secao||(emo&&emo!==emojiDe(i))||(!emo&&p.emoji))){p.secao=i.secao;if(emo)p.emoji=emo;else delete p.emoji;CP.salvarReg("produtos",p);} // aprende a seção e o emoji
  CP.salvarReg("itens",i);const mNovo=val("cpEdMerc");if(mNovo!==(i.mercadoId||""))CP.definirMercadoItem(id,mNovo); // trocar o mercado à mão apaga o preço de referência do outro
  CP.gravar();ui.editando=null;CP.render();};
CP.estadoItem=function(id,e){const i=CP.por("itens",id);if(!i)return;i.estado=e;if(e==="pendente"){delete i.pegoPor;delete i.pegoEm;}CP.salvarReg("itens",i);CP.gravar();ui.editando=null;CP.render();};
// remover tem "desfazer" por 10 s (faixa no topo; o aviso flutuante não aceita toque)
CP.removerItem=function(id){const i=CP.por("itens",id);if(!i)return;const copia=JSON.parse(JSON.stringify(i));
  CP.apagar("itens",id);CP.gravar();ui.editando=null;ui.desfazer={copia,ate:Date.now()+10000};
  clearTimeout(CP._tDesf);CP._tDesf=setTimeout(()=>{ui.desfazer=null;if(listaAberta())CP.renderFundo();},10200);CP.render();};
CP.desfazerRemover=function(){const d=ui.desfazer;ui.desfazer=null;if(!d||Date.now()>d.ate+500){CP.render();return;}
  const r=d.copia;delete r._del;CP.salvarReg("itens",r);CP.gravar();CP.render();};
CP.euPego=function(sec){const eu=CP.eu().nome;CP.itensDa(ui.lista).filter(i=>(i.secao||"Outros")===sec&&i.estado==="pendente").forEach(i=>{i.resp=i.resp===eu?"":eu;CP.salvarReg("itens",i);});CP.gravar();CP.render();};

      <button class="btn primary" style="margin-top:6px" onclick="CP.lerColado()">Ler</button>`:""}
    ${CP.temIntermediario()?"":`<p class="note">ℹ️ Sem o intermediário configurado (Ajustes), o QR traz mercado e data; para os itens, toque em "abrir a nota", copie o texto da página e cole aqui.</p>`}
    <div class="row" style="margin-top:10px"><button class="btn" onclick="CP.cancelarConf()">cancelar</button></div></div>`;
  const rc=rasc,an=CP.analisar(rc),its=rc.listaId?CP.itensDa(rc.listaId).filter(i=>i.estado!=="dispensado"&&i.estado!=="faltou"):[];
  const mercados=CP.vivos("mercados").sort((a,b)=>String(a.apelido||a.nome).localeCompare(String(b.apelido||b.nome),"pt-BR"));
  const mid=rc.mercadoId||(rc.mercado&&rc.mercado.cnpj?CP.idMercadoCnpj(rc.mercado.cnpj):"");
  const novoMerc=rc.mercado&&rc.mercado.cnpj&&!CP.por("mercados",mid);
  const opItem=sel=>`<option value="">➕ a mais (não estava na lista)</option>`+its.map(i=>`<option value="${esc(i.id)}" ${i.id===sel?"selected":""}>${esc(i.nome)} (${esc(fmtQtd(i.qtd))} ${esc(i.un||"un")})</option>`).join("");
  return `<div class="card"><div class="flexbet"><h3 style="margin:0">🧾 Conferir compra</h3><span class="pill">${rc.origem==="nfce"?"nota fiscal":"sem nota"}</span></div>
    <div class="row" style="margin-top:8px">
      <label class="note" style="margin:0">Mercado <select onchange="CP.rc('mercadoId',this.value)">${novoMerc?`<option value="" selected>${esc(rc.mercado.nome||"novo")} · CNPJ ${esc(CP.fmtCnpj(rc.mercado.cnpj))} (novo)</option>`:`<option value="">— escolha —</option>`}
        ${mercados.map(m=>`<option value="${esc(m.id)}" ${m.id===mid&&!novoMerc?"selected":""}>${esc(m.apelido||m.nome)}</option>`).join("")}</select></label>
      ${!novoMerc&&!mid?`<button class="btn" onclick="CP.novoMercadoConf()">+ mercado</button>`:""}
      <label class="note" style="margin:0">Data <input type="date" value="${esc(rc.data)}" onchange="CP.rc('data',this.value)"></label></div>
    ${CP.pagamentoPendente(rc)?`<div class="card" role="alert" style="border-color:var(--amber);margin:8px 0 0"><b>💳 Como esta compra foi paga?</b><p class="note" style="margin:4px 0">A nota traz uma forma de pagamento que não reconheci${(rc.pagamentosDesconhecidos||[]).length?" ("+(rc.pagamentosDesconhecidos||[]).map(x=>esc(x.rotulo)).join(", ")+")":""}. Escolha para eu não contar errado no vale-alimentação.</p>
      <div class="row">${Object.entries(PAG).filter(([k])=>k!=="outro").map(([k,n])=>`<button class="btn" onclick="CP.pagarComo('${k}')">${esc(n)}</button>`).join("")}<button class="btn" onclick="CP.pagarComo('outro')">Outro (não conta no VA)</button></div></div>`:""}

CP.rcMercado=function(txt){if(!rasc)return;rasc.digitadoMercado=/\d/.test(String(txt))?CP.numBR(txt):"";gravarRascLogo();const e=$("cpCaixa");if(e)e.innerHTML=caixaHtml(rasc);};

CP.rasc=()=>rasc;

let tRasc=null;

function atualizarTotais(){if(!rasc||rasc.etapa==="fonte")return;
  rasc.linhas.forEach((l,k)=>{const e=$("cpLT"+k);if(e)e.textContent=F(l.vTotal);});
  const an=CP.analisar(rasc);const ta=$("cpResA"),tb=$("cpResB"),ti=$("cpTotalIn");if(ta)ta.innerHTML=resumoA(an);if(tb)tb.innerHTML=resumoB(rasc,an);if(ti&&ti.placeholder!==undefined)ti.placeholder=CP.fmtNum(an.soma,2);
  const v=$("cpResVA");if(v){v.innerHTML=cardVR(vaDe(rasc,an),rasc.cartaoId,rasc.data);}

CP.rcDig=function(i,k,txt,el){const l=rasc&&rasc.linhas[i];if(!l)return;l[k]=CP.numBR(txt);if(el&&el.classList&&k==="vUnit"){el.classList.toggle("sem-preco",!(+l.vUnit>0));if(+l.vUnit>0)el.removeAttribute("aria-invalid");else el.setAttribute("aria-invalid","true");}l.vTotal=CP.r2((+l.qtd||0)*(+l.vUnit||0));gravarRascLogo();atualizarTotais();};
CP.rcDigCampo=function(k,txt){if(!rasc)return;rasc[k]=CP.numBR(txt);gravarRascLogo();atualizarTotais();};
// sair da tela / fechar o app com o rascunho ainda na espera: grava na hora
if(typeof window!=="undefined"&&window.addEventListener){window.addEventListener("pagehide",()=>{if(tRasc){clearTimeout(tRasc);tRasc=null;gravarRasc();}});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&tRasc){clearTimeout(tRasc);tRasc=null;gravarRasc();}});}
CP.rcLinha=function(i,k,v){const l=rasc&&rasc.linhas[i];if(!l)return;l[k]=v;if(k==="qtd"||k==="vUnit")l.vTotal=CP.r2((+l.qtd||0)*(+l.vUnit||0));if(k==="itemId")l.conf=1;gravarRasc();CP.render();};
CP.rcTirar=function(i){rasc.linhas.splice(i,1);gravarRasc();CP.render();};
CP.rcExtra=function(){const d=val("cpExDesc").trim();if(!d)return;const q=CP.numBR(val("cpExQtd"))||1,v=CP.numBR(val("cpExV"));rasc.linhas.push({desc:d,cod:"",qtd:q,un:"UN",vUnit:v,vTotal:CP.r2(q*v),itemId:null,conf:1});gravarRasc();CP.render();};
