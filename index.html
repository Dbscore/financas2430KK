// ---- criptografia (Web Crypto, no aparelho) ----
function b64de(u8){let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function deB64(t){const b=atob(t),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function derivarChave(senha,saltB64){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:deB64(saltB64),iterations:310000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["encrypt","decrypt"]);
  return b64de(new Uint8Array(await crypto.subtle.exportKey("raw",k)));}
const chaveAES=(c)=>crypto.subtle.importKey("raw",deB64(c||sync.chave),"AES-GCM",false,["encrypt","decrypt"]);
async function gzip(u8,comprimir){if(typeof CompressionStream==="undefined")return null;
  const t=comprimir?new CompressionStream("gzip"):new DecompressionStream("gzip");
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(t)).arrayBuffer());}
async function cifrar(objeto,chave){
  const txt=new TextEncoder().encode(JSON.stringify(objeto)),z=await gzip(txt,true),iv=crypto.getRandomValues(new Uint8Array(12));
  const c=await crypto.subtle.encrypt({name:"AES-GCM",iv},await chaveAES(chave),z||txt);
  return{cifra:b64de(new Uint8Array(c)),iv:b64de(iv),gz:!!z};}
async function decifrar(d,chave){
  let p;try{p=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:deB64(d.iv)},await chaveAES(chave),deB64(d.cifra)));}
  catch(e){throw new Error("Senha da família incorreta (não consegui abrir os dados da nuvem).");}
  return JSON.parse(new TextDecoder().decode(d.gz?await gzip(p,false):p));}

// ---- Firestore (API REST) ----
const fsUrl=()=>"https://firestore.googleapis.com/v1/projects/"+FB.projectId+"/databases/(default)/documents/"+FB_DOC;
function erroFs(st,j){if(st===403)return"Sem permissão no Firestore: confira as regras (e se o seu e-mail está liberado e confirmado). Se acabou de atualizar as regras, feche e abra o app de novo.";return"Erro "+st+" do Firestore: "+((j.error&&j.error.message)||"");}
async function fsLer(){
  const r=await fetch(fsUrl(),{cache:"no-store",headers:{Authorization:"Bearer "+await fbToken()}});
  if(r.status===404)return null;
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(erroFs(r.status,j));
  const f=j.fields||{},sv=k=>f[k]&&f[k].stringValue;
  return{cifra:sv("cifra"),iv:sv("iv"),salt:sv("salt"),gz:!!(f.gz&&f.gz.booleanValue),versao:+((f.versao&&f.versao.integerValue)||0),v:+((f.v&&f.v.integerValue)||0),por:sv("por"),em:f.em&&f.em.timestampValue,updateTime:j.updateTime};}
// ---- versão mínima na nuvem (casas/config.min): a 1ª sincronização de cada versão nova sobe esse
// número, e as regras do Firestore recusam gravação de quem tem versão menor. Assim uma janela ou
// aparelho com o app antigo (que ainda não recarregou) NÃO consegue mais mandar dados velhos.
const fsUrlConfig=()=>"https://firestore.googleapis.com/v1/projects/"+FB.projectId+"/databases/(default)/documents/casas/config";
async function fsLerMin(){
  const r=await fetch(fsUrlConfig(),{cache:"no-store",headers:{Authorization:"Bearer "+await fbToken()}});
  if(r.status===404)return 0;const j=await r.json().catch(()=>({}));if(!r.ok)return 0;
  return +((j.fields&&j.fields.min&&j.fields.min.integerValue)||0);}
async function fsSubirMin(){
  const r=await fetch(fsUrlConfig(),{method:"PATCH",headers:{Authorization:"Bearer "+await fbToken(),"Content-Type":"application/json"},
    body:JSON.stringify({fields:{min:{integerValue:String(APP_VERSAO)},por:{stringValue:sync.email||""}}})});
  if(r.ok)registrar("nuvem passou a exigir a versão "+APP_VERSAO_TXT+" ou mais nova");
  else registrar("aviso: não consegui marcar a versão mínima na nuvem (regras do Firebase antigas?)");}
function versaoBarrada(){
  registrar("versão "+APP_VERSAO_TXT+" é antiga para a nuvem: recarregando");
  try{if(typeof sessionStorage!=="undefined"&&!sessionStorage.getItem("recarregouVersao")&&typeof location!=="undefined"&&location.reload){
    sessionStorage.setItem("recarregouVersao","1");location.reload();}}catch(e){}
  throw new Error("Este aparelho está com uma versão antiga do app e não envia nada. Recarregue a página (no computador: Ctrl/Cmd + Shift + R; no iPhone: feche e abra o app).");}
// updateTime: grava só se ninguém gravou depois (concorrência otimista). semCheck: grava direto.
async function fsGravar(d,updateTime,semCheck){
  const pre=semCheck?"":updateTime?"currentDocument.updateTime="+encodeURIComponent(updateTime):"currentDocument.exists=false";
  const corpo={fields:{cifra:{stringValue:d.cifra},iv:{stringValue:d.iv},salt:{stringValue:d.salt},gz:{booleanValue:d.gz},
    versao:{integerValue:String(d.versao)},v:{integerValue:String(APP_VERSAO)},por:{stringValue:sync.email||""},em:{timestampValue:new Date().toISOString()}}};
  const r=await fetch(fsUrl()+(pre?"?"+pre:""),{method:"PATCH",headers:{Authorization:"Bearer "+await fbToken(),"Content-Type":"application/json"},body:JSON.stringify(corpo)});
  const j=await r.json().catch(()=>({}));
  const st=(j.error&&j.error.status)||"";
  if(r.status===409||r.status===412||st==="FAILED_PRECONDITION"||st==="ABORTED"||st==="ALREADY_EXISTS")
    return{conflito:true,detalhe:r.status+" "+st+" "+((j.error&&j.error.message)||"")};
  if(!r.ok)throw new Error(erroFs(r.status,j));return{updateTime:j.updateTime};}

// ---- senha da família (1ª vez cria; nos outros aparelhos, confere abrindo os dados) ----
async function contaSenhaFamilia(){
  const s1=document.getElementById("cxFam").value||"",s2=(document.getElementById("cxFam2")||{}).value||"";
  if(s1.length<8){alert("Use pelo menos 8 caracteres na senha da família.");return;}
  if(typeof crypto==="undefined"||!crypto.subtle){alert("Este navegador não permite criptografia aqui. Abra o app pelo endereço https (GitHub Pages).");return;}
  try{statusSync("sincronizando","conferindo…");
    const rem=await fsLer();
    if(rem){const chave=await derivarChave(s1,rem.salt);await decifrar(rem,chave);sync.chave=chave;sync.salt=rem.salt;sync.versao=null;sync.pendente=true;}
    else{if(s1!==s2){statusSync("","");alert("É a primeira vez: digite a senha da família duas vezes, iguais.");return;}
      const salt=b64de(crypto.getRandomValues(new Uint8Array(16)));sync.chave=await derivarChave(s1,salt);sync.salt=salt;sync.versao=null;sync.pendente=true;}
    gravarSync();render();await sincronizar(true);
  }catch(e){statusSync("erro",e.message);alert(e.message);}
}

// resumo do que a sincronização mudou neste aparelho (para o Diagnóstico): meses e campos
function oQueMudou(a,b){
  const out=[],ma={},mb={};(a.meses||[]).forEach(m=>ma[m.ym]=m);(b.meses||[]).forEach(m=>mb[m.ym]=m);
  new Set([...Object.keys(ma),...Object.keys(mb)]).forEach(ym=>{const x=ma[ym],y=mb[ym];
    if(!x){out.push(lbl(ym)+" chegou");return;}if(!y){out.push(lbl(ym)+" saiu");return;}
    const cs=["salario","extra","va"].filter(k=>!iguais(x[k],y[k]));
    const ct=Object.keys({...x.contas,...y.contas}).filter(k=>!iguais((x.contas||{})[k],(y.contas||{})[k]));
    if(cs.length||ct.length)out.push(lbl(ym)+": "+[...cs,...ct.slice(0,3)].join(", ")+(ct.length>3?" +"+(ct.length-3):""));});
  ["folha","movs","ferias","pagos","metasCurto","futuros","visSel","sobraAlvo"].forEach(k=>{if(!iguais(a[k],b[k]))out.push(k);});
  return out.slice(0,6).join("; ");
}
// compara os dados em si (sem carimbo de hora e marcadores de exclusão, que a junção recalcula)
function mesmoConteudo(x,y){const f=o=>{const c={...o};delete c._atualizadoEm;delete c._apagados;return c;};return iguais(f(x),f(y));}
// ---- o ciclo: baixa o que há de novo, junta, e sobe se houver mudança local ----
async function sincronizar(manual){
  if(!syncAtivo())return;
  if(syncEmCurso)return syncEmCurso;
  syncEmCurso=(async()=>{
    try{
      if(typeof navigator!=="undefined"&&navigator.onLine===false){statusSync("offline");return;}
      statusSync("sincronizando");
      let ultimoConflito="";
      if(janelaVelha())throw new Error("Esta janela está com uma versão antiga do app — recarregue a página.");
      {const min=await fsLerMin();
        if(min>APP_VERSAO)versaoBarrada();
        if(min<APP_VERSAO)await fsSubirMin();}
      for(let t=0;t<4;t++){
        if(janelaVelha())throw new Error("Esta janela está com uma versão antiga do app — recarregue a página.");
        absorverOutraAba(); // outra janela pode ter importado/sincronizado enquanto esta estava parada
        const tinhaPendente=!!sync.pendente;
        const rem=await fsLer();
        // leitura desatualizada (cache): a nuvem nunca "volta" para uma versão menor do que este aparelho já viu.
        // Nesse caso não junta nem envia nada — era assim que dados velhos sobrescreviam a nuvem.
        if(rem&&+sync.maxVersao>0&&rem.versao<+sync.maxVersao){registrar("leitura velha da nuvem (v"+rem.versao+" < v"+sync.maxVersao+"): ignorada");
          throw new Error("A leitura da nuvem veio desatualizada (cache do navegador). Nada foi alterado. Feche e abra o app de novo.");}
        if(rem){sync.maxVersao=Math.max(+sync.maxVersao||0,rem.versao);gravarSync();}
        if(rem&&rem.v>APP_VERSAO)throw new Error("Existe uma versão mais nova do app. Feche e abra o app de novo (no computador, recarregue a página) para atualizar — até lá este aparelho não envia nada.");
        // 1ª sincronização desta janela: junta com a nuvem mesmo se a versão bate — o que está no
        // aparelho pode ter sido regravado por uma janela antiga sem que o controle de versão saiba
        if(rem&&(rem.versao!==sync.versao||primeiraSync)){
          const remoto=migrarEstado(await decifrar(rem));
          const base=sync.versao!=null?lerBase():null;
          // sem base (aparelho novo nesta conta ou recém-atualizado): a nuvem vence os conflitos;
          // deste aparelho só entram registros novos (gastos, meses) que a nuvem ainda não tem
          const antesJunta=JSON.parse(JSON.stringify(state));
          state=migrarEstado(mesclarEstados(state,remoto,base,base?null:{bVence:true}));reaplicarRenomes();salvarLocal();
          const mudou=oQueMudou(antesJunta,state);
          registrar("recebeu da nuvem (v"+rem.versao+", enviado por "+(remoto._ultimoEnvio?nomeDe(remoto,remoto._ultimoEnvio.id):(rem.por||"?"))+(base?"":", sem base")+")"+(mudou?" — mudou aqui: "+mudou:" — nada mudou aqui"));
          sync.versao=rem.versao;sync.porUltimo=rem.por;gravarSync();renderSeguro();
          if(!tinhaPendente)gravarBase(remoto);
          if(!mesmoConteudo(state,remoto)){sync.pendente=true;gravarSync();} // a junção trouxe algo daqui que a nuvem não tem
        }
        primeiraSync=false;
        // 1x por abertura: este aparelho se registra na lista (versão, último acesso)
        if(!aparelhoAvisado){const a=(state._aparelhos||{})[idAparelho()];if(!a||a.versao!==APP_VERSAO_TXT||Date.now()-(+a.visto||0)>6*3600000){sync.pendente=true;}}
        if(rem&&!sync.pendente){sync.ultimo=Date.now();gravarSync();statusSync("ok");return;}
        registrarAparelho();aparelhoAvisado=true;
        const enviado=JSON.stringify(state);
        const d=await cifrar(JSON.parse(enviado));d.salt=rem?rem.salt:sync.salt;d.versao=(rem?rem.versao:0)+1;
        if(d.cifra.length>900000)throw new Error("Os dados passaram do tamanho máximo de um documento. Avise para dividirmos o armazenamento.");
        // até 4 tentativas, todas com a checagem (a antiga 4ª "sem checar" era um remendo para a leitura em cache e sobrescrevia a nuvem)
        const w=await fsGravar(d,rem&&rem.updateTime,false); // sempre com checagem: nunca grava por cima sem conferir
        if(w.conflito){ultimoConflito=w.detalhe;continue;} // outro aparelho gravou no meio: baixa de novo e junta
        salvarLocal(); // o registro do aparelho também fica gravado aqui
        registrar("enviou para a nuvem (v"+d.versao+")");
        sync.versao=d.versao;sync.maxVersao=Math.max(+sync.maxVersao||0,d.versao);sync.pendente=JSON.stringify(state)!==enviado;sync.ultimo=Date.now();sync.porUltimo=sync.email;gravarSync();gravarBase(JSON.parse(enviado));statusSync("ok");
        if(sync.pendente){clearTimeout(syncTimer);syncTimer=setTimeout(()=>sincronizar(),1500);}return;
      }
      throw new Error("Não consegui gravar na nuvem (resposta do Firebase: "+ultimoConflito+"). Tente de novo; se repetir, mande um print.");
    }catch(e){registrar("erro: "+e.message);liberarTela();statusSync(/Failed to fetch|NetworkError|Load failed/i.test(e.message)?"offline":"erro",e.message);}
    finally{syncEmCurso=null;liberarTela();}
  })();
  return syncEmCurso;
}
// redesenha sem atrapalhar quem está digitando
function renderSeguro(){const a=typeof document!=="undefined"&&document.activeElement;
  if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName||"")){renderPendente=true;return;}render();}
function statusSync(tipo,msg){
  syncStatus={tipo,msg:msg||""};
  const el=typeof document!=="undefined"&&document.getElementById("syncstate");if(!el||!el.style)return;
  const hora=sync.ultimo?new Date(sync.ultimo).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"";
  const txt=!syncAtivo()?"":tipo==="sincronizando"?"⏳ sincronizando…":tipo==="offline"?"📴 sem internet — salvo no aparelho":tipo==="erro"?"⚠ não sincronizou (ver Backup)":"☁️ sincronizado"+(hora?" às "+hora:"");
  el.textContent=txt;el.title=msg||"";el.style.color=tipo==="erro"?"var(--rose)":"";
}

// ============ BACKUP ============
function vBackup(){
  return cardConta()+`
  <div class="card"><h3>Backup em arquivo</h3>
  <p class="note">Uma cópia de tudo num arquivo <b>.json</b>, para guardar numa pasta ou levar para outro aparelho. Com a conta conectada (card acima) a cópia na nuvem já é automática — mesmo assim, vale exportar de vez em quando (ex.: ao fechar o mês).</p>
  <div class="row" style="margin-top:10px">
    <button class="btn primary" onclick="exportar()">⬇ Exportar backup (.json)</button>
    <label class="btn" style="cursor:pointer" title="Junta o arquivo com os dados deste aparelho, sem apagar nada">⬆ Importar e juntar <input type="file" accept=".json" style="display:none" onchange="importarJuntar(this)"></label>
    <label class="btn" style="cursor:pointer" title="Troca TUDO deste aparelho pelo conteúdo do arquivo">⬆ Importar substituindo <input type="file" accept=".json" style="display:none" onchange="importar(this)"></label>
    <button class="btn danger" onclick="resetar()">Apagar tudo e recomeçar vazio</button>

// O backup leva a categoria e o tipo efetivos de cada conta e as categorias de gasto usadas,
// para que ele abra igual numa versão do app com categorias-padrão diferentes (ex.: a do iPhone).
function estadoParaExportar(){
  const o=JSON.parse(JSON.stringify(state));o.catConta=o.catConta||{};o.tipos=o.tipos||{};o.catsUser=o.catsUser||[];o.catsUserCores=o.catsUserCores||{};o.catContaCores=o.catContaCores||{};
  allContas().forEach(n=>{if(!o.catConta[n])o.catConta[n]=catOf(n);if(!(n in o.tipos))o.tipos[n]=tipoOf(n)==="Fixo"?1:0;});
  catList().forEach(c=>{if(!o.catContaCores[c])o.catContaCores[c]=catColor(c);});
  const usadas=new Set();Object.values(o.movs||{}).forEach(a=>(a||[]).forEach(x=>x.cat&&usadas.add(x.cat)));
  (o.ferias||[]).forEach(f=>((f.viagem&&f.viagem.gastos)||[]).forEach(g=>g.cat&&usadas.add(g.cat)));
  usadas.forEach(c=>{if(c!=="Outros"&&c!=="Renda extra"&&!o.catsUser.includes(c)&&CATMOV[c]){o.catsUser.push(c);o.catsUserCores[c]=CATMOV[c];}});
  return o;
}
function exportar(){
  const blob=new Blob([JSON.stringify(estadoParaExportar(),null,1)],{type:"application/json"});

// o arquivo errado (ex.: o backup da Lista de compras, ou qualquer .json) não pode apagar as finanças em silêncio
function arquivoDasFinancas(j){
  if(j&&j.tipo==="compras-familia"){alert("Este arquivo é o backup da LISTA DE COMPRAS, não das Contas Casa.\n\nPara importá-lo, abra a Lista de compras → Ajustes → Importar. Nada foi alterado aqui.");return false;}
  if(!j||typeof j!=="object"||Array.isArray(j)||!Array.isArray(j.meses)){alert("Este arquivo não parece um backup das Contas Casa (não tem a lista de meses). Nada foi alterado.");return false;}
  // cada mês precisa ser um objeto com ym AAAA-MM (um mês sem isso derruba todas as abas, inclusive a do Backup)
  const ruim=j.meses.findIndex(m=>!m||typeof m!=="object"||Array.isArray(m)||!/^\d{4}-(0[1-9]|1[0-2])$/.test(String(m.ym||""))||(m.contas!=null&&(typeof m.contas!=="object"||Array.isArray(m.contas))));
  if(ruim>=0){alert("Este arquivo tem um mês com defeito (posição "+(ruim+1)+"): sem data AAAA-MM ou com as contas fora do formato. Por segurança nada foi importado.");return false;}
  return true;}
function importar(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const bruto=JSON.parse(r.result);
    if(!arquivoDasFinancas(bruto))return;
    if(!bruto.meses.length&&!confirm("Este arquivo NÃO tem nenhum mês: importar substituindo deixa as Contas Casa vazias. Continuar mesmo assim?"))return;
    guardarAntes("importar substituindo"); // dá para desfazer na aba Backup (inclusive no mesmo dia)
    backupRotativo();
    const anterior=state;
    try{state=migrarEstado(bruto);avisoCorrompido=null;render(); // desenha ANTES de gravar: se o arquivo derrubar a tela, volta ao que estava e nada é salvo
      save();alert("Backup importado!");}
    catch(e){state=anterior;try{render();}catch(x){}alert("O arquivo não pôde ser usado ("+e.message+"). Nada foi alterado.");}}catch(e){alert("Arquivo inválido: "+e.message);}};
  r.readAsText(f);
}
function importarJuntar(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const bruto=JSON.parse(r.result);if(!arquivoDasFinancas(bruto))return;
    const outro=migrarEstado(bruto);
    const antes={meses:state.meses.length,movs:Object.values(state.movs||{}).reduce((s,a)=>s+(a||[]).length,0)};
    guardarAntes("importar e juntar");backupRotativo();
    const anterior=JSON.parse(JSON.stringify(state));
    try{state=mesclarEstados(state,outro);reaplicarRenomes();state=migrarEstado(state);render(); // desenha antes de gravar; se derrubar a tela, volta ao que estava
      }catch(e){state=anterior;try{render();}catch(x){}alert("O arquivo não pôde ser juntado ("+e.message+"). Nada foi alterado.");return;}
    const depois={meses:state.meses.length,movs:Object.values(state.movs||{}).reduce((s,a)=>s+(a||[]).length,0)};
    save();
    alert("Dados juntados.\n\nMeses: "+antes.meses+" → "+depois.meses+"\nLançamentos avulsos: "+antes.movs+" → "+depois.movs+"\n\nNada deste aparelho foi apagado. Onde os dois lados tinham valores diferentes, valeu o que foi editado por último. Se algo ficou errado, restaure o backup automático de hoje.");
  }catch(e){alert("Arquivo inválido: "+e.message);}};
  r.readAsText(f);
}

const DIA_RX=/^\d{4}-\d{2}-\d{2}$/,NOME_DOC=/^[a-z0-9-]{1,30}$/,DIAS_USO=35;

    const o={id:c.id,nome:String(c.nome??"").slice(0,40)||"VR",diaCredito:Math.min(31,Math.max(1,Math.round(+c.diaCredito)||30)),deFinancas:!!c.deFinancas,ciclos:{}};
    if(c.valorOriginal!=null&&c.valorOriginal!==""&&isFinite(+c.valorOriginal)&&+c.valorOriginal>=0)o.valorOriginal=r2(+c.valorOriginal);
    if(c.ciclos&&typeof c.ciclos==="object"&&!Array.isArray(c.ciclos))Object.keys(c.ciclos).slice(0,60).forEach(k=>{const a=c.ciclos[k];if(!DATA_ISO.test(k)||!a||typeof a!=="object")return;const z={};

// um registro com tipo errado (versão antiga com bug, backup estranho) não pode travar as telas em todos os aparelhos
function limpar(c,r){const x=Object.assign({},r);

  if(x._del)return x;

    if(x.cartoes!=null)x.cartoes=Array.isArray(x.cartoes)?x.cartoes.filter(k=>k&&typeof k==="object"&&typeof k.id==="string"&&isFinite(+k.valor)).map(k=>({id:k.id.slice(0,48),valor:+k.valor})):[];}
  if(c==="produtos"){LISTA(x,"apelidos");LISTA(x,"cods");x.apelidos=x.apelidos.map(String);x.cods=x.cods.map(String);["nome","secao","un"].forEach(k=>TXT(x,k));
    if(x.sobra!=null&&!(typeof x.sobra==="object"&&!Array.isArray(x.sobra)&&isFinite(+x.sobra.qtd)&&+x.sobra.qtd>=0&&/^\d{4}-\d{2}-\d{2}$/.test(String(x.sobra.em))))delete x.sobra;}
  if(c==="itens"&&x.precoRef!=null){const r=x.precoRef;x.precoRef=r&&typeof r==="object"&&!Array.isArray(r)&&numOk(r.p,1e7,0.001)&&dataIsoOk(r.d)?{p:r2(+r.p),r:String(r.r??"").slice(0,30),d:r.d}:undefined;if(x.precoRef===undefined)delete x.precoRef;}

  if(c==="listas"||c==="itens"||c==="mercados"){["nome","secao","un","estado","status","listaId","produtoId","apelido","rede","cnpj","endereco","mercadoId","arquivada"].forEach(k=>TXT(x,k));}

    for(const[k,r]of Object.entries(src)){

CP.normalizar=normalizar;

// junção: para cada registro, vale o de carimbo (_em) maior; empate → decide pelo aparelho e pelo conteúdo
// (determinístico: os dois lados chegam no mesmo resultado)
function vence(x,y,c){if(!x)return y;if(!y)return x;
  // "peguei" vence "faltou": quem marcou no mercado pegou de verdade; o "faltou" vem de uma conferência que não viu essa marca
  // (regra simétrica: os dois aparelhos chegam ao mesmo resultado)
  if(c==="itens"&&!x._del&&!y._del){if(x.estado==="pego"&&y.estado==="faltou")return x;if(y.estado==="pego"&&x.estado==="faltou")return y;}
  const ex=+x._em||0,ey=+y._em||0;if(ex!==ey)return ey>ex?y:x;
  const px=String(x._por||""),py=String(y._por||"");if(px!==py)return py>px?y:x;
  return estavel(y)>estavel(x)?y:x;}
function mesclar(a,b){a=normalizar(a);b=normalizar(b);const d=vazio();
  COLECOES.forEach(c=>{const ks=new Set([...Object.keys(a[c]),...Object.keys(b[c])]);ks.forEach(k=>{d[c][k]=vence(a[c][k],b[c][k],c);});});
  return d;}
CP.mesclar=mesclar;

// ---------- dados em memória + gravação no aparelho ----------
let D=null;

    let j=null;try{j=cru?JSON.parse(cru):null;}catch(e){}D=normalizar(j);if(cru)copiaAoAbrir(cru);
    // ao abrir: a configuração antiga (um registro só) vira registros pequenos; e o nome deste aparelho é renovado (no máx. 1 vez a cada 6 h)
    try{const m=migrarConfig(),a=CP.registrarAparelho();if(m||a)gravarLS();}catch(e){}}return D;};

// Gravar no aparelho. O localStorage é UM SÓ para as finanças e para as compras (~5 milhões de caracteres): se encher, as compras
// não podem tirar o espaço das finanças. Se a gravação falhar, o app libera sozinho o que é dispensável (cópias automáticas,
// registro de eventos, cache de mapas) e tenta de novo; se ainda assim não couber, avisa na tela (CP.erroGravar) em vez de falhar em silêncio.
// o navegador conta por BYTES (acento e emoji ocupam mais que 1): conta caracteres fora do ASCII a mais, para o medidor não ficar otimista
const bytesDe=t=>{t=String(t||"");let n=t.length;for(let i=0;i<t.length;i++)if(t.charCodeAt(i)>127)n+=2;return n;};
CP.bytesDe=bytesDe;
function liberarEspaco(){const apagou=[];[[CHAVE_AUTO,"cópias automáticas da Lista"],[KEY+"__compras_log","registro de eventos da Lista"],[KEY+"__busca_osm","mapas guardados da Busca"]].forEach(([k,nome])=>{try{if(localStorage.getItem(k)!=null){localStorage.removeItem(k);apagou.push(nome);}}catch(e){}});return apagou;}
// RESERVA: as finanças moram no mesmo armazenamento. A Lista nunca ocupa o último pedaço (5%) — esse espaço é das finanças.
const RESERVA=0.05;
const cabeNaReserva=(novo,velho)=>{const t=CP.tamanho();return t.total-velho+novo<=t.limite*(1-RESERVA);};
function gravarLS(){let s;
  try{s=JSON.stringify(D);}catch(e){CP.erroGravar="não consegui preparar os dados para gravar";return;}
  let velho=0;try{velho=bytesDe(localStorage.getItem(CHAVE));}catch(e){}
  let apagou=[];

  if(!cabeNaReserva(novoTam,velho)){apagou=liberarEspaco();CP.liberou=Date.now();if(apagou.length)CP.liberouTxt=apagou.join(", ");}
  if(cabeNaReserva(novoTam,velho)||novoTam<=velho){ // cabe (ou está encolhendo): grava
    try{localStorage.setItem(CHAVE,s);CP.erroGravar="";return;}catch(e){}
    apagou=apagou.concat(liberarEspaco());CP.liberou=Date.now();if(apagou.length)CP.liberouTxt=apagou.join(", ");
    try{localStorage.setItem(CHAVE,s);CP.erroGravar="";return;}catch(e){}}
  CP.erroGravar="A memória do aparelho está quase cheia: as compras novas NÃO estão sendo salvas aqui (para as Contas Casa nunca ficarem sem espaço). Exporte um backup da Lista (Ajustes) e apague compras antigas em Histórico para liberar espaço.";}
// quanto da memória está usada (para avisar antes de encher)

// ---------- configuração: um registro por coisa (coleção config) ----------
// Antes tudo morava em UM registro ("geral"): um saldo de cartão informado sem sinal podia sumir quando outro aparelho regravava
// qualquer ajuste. Agora:  vr-<cartão> (nome, dia, valor, ordem) · ciclo-<cartão>-<AAAA-MM-DD do início> (valor editado, saldo informado) ·
// aj-<ajuste> ({valor}) · ap-<aparelho> (nome na Lista, versão, visto) · anos (lista de anos) · geral (só o que sobrou: anos, ofertas).
// Só disputam o mesmo registro se mexerem no MESMO cartão e ciclo (ou no mesmo ajuste).
const CONFIG_PADRAO={id:"geral",worker:"",custoKm:0.9,raioKm:8,pagPadrao:"va",contarDeslocamento:true,kmPorLitro:0,precoLitro:0,cidade:"",anos:[],ofertas:{}};
const CAMPOS_LEGADO=["cartoesVR"].concat(AJUSTES);
// MIGRAÇÃO (idempotente): lê o "geral" antigo e cria os registros novos que ainda não existem, com o MESMO carimbo do "geral"
// (_em do geral, _por "migracao") — ids e conteúdo iguais em todos os aparelhos, então dois aparelhos migrando juntos geram o mesmo
// registro (sem duplicar) e qualquer edição de verdade (carimbo novo) sempre ganha da migração. Depois tira do "geral" o que migrou.

  const cria=(id,campos)=>{if(TEM(cfg,id))return;cfg[id]=Object.assign({id,_em:base,_por:"migracao"},campos);};
  limparCartoes(g.cartoesVR).forEach((c,i)=>{
    const r={nome:c.nome,diaCredito:c.diaCredito,deFinancas:c.deFinancas,ordem:i};if(c.valorOriginal!=null)r.valorOriginal=c.valorOriginal;
    cria("vr-"+c.id,r);
    Object.keys(c.ciclos).forEach(k=>cria(idCiclo(c.id,k),c.ciclos[k]));});
  AJUSTES.forEach(k=>{if(TEM(g,k)){const v=ajusteOk(k,g[k]);if(v!==undefined)cria("aj-"+k,{valor:v});}});

  const id="aj-"+k,ex=TEM(CP.dados().config,id)?CP.dados().config[id]:null;
  const r=ex&&!ex._del?ex:Object.assign({id},ex?{_em:ex._em}:{});r.valor=v;CP.salvarReg("config",r);}

  if(Object.keys(resto).length){const cfg=CP.dados().config,ex=TEM(cfg,"geral")?cfg.geral:null;

  CP.gravar();};

// Abastecimentos = itens de compras (notas de posto) cujo nome tem gasolina/etanol/álcool/diesel e a unidade é litro.
// Preço do litro: o digitado à mão (Ajustes) vale no lugar do da nota; sem nenhum, o custo por km volta ao valor fixo.

CP.abastecimentos=function(){const out=[];

    out.push({data:String(c.data||""),litros:Math.round(litros*1000)/1000,vUnit:Math.round(vu*1000)/1000,total:r2(vt||vu*litros),desc:String(x.desc||"").slice(0,60),mercadoId:c.mercadoId||""});}));

    const c=t.split(/\s*\|\s*|\t/).map(x=>x.trim());const nome=(c[0]||"").slice(0,60),endereco=(c[1]||"").slice(0,120);
    if(!nome||!endereco){ignoradas.push({linha:i+1,motivo:"falta o nome ou o endereço"});return;}

// grava/atualiza (só regrava o que mudou); devolve {novas, atualizadas, iguais}
CP.importarCatalogo=function(lojas){let novas=0,atualizadas=0,iguais=0;const cfg=CP.dados().config;
  (lojas||[]).forEach(l=>{if(!l||!l.id||!l.id.startsWith("cat-"))return;const ex=TEM(cfg,l.id)?cfg[l.id]:null;

  ["Bebidas",["agua","refrigerante","refri","suco","cerveja","vinho","coca","guarana","cha","energetico","isotonico"]],
  ["Limpeza",["detergente","sabao","amaciante","desinfetante","agua sanitaria","alvejante","esponja","limpador","multiuso","saco de lixo","lustra","veja","pinho","papel toalha"]],
  ["Higiene",["papel higienico","sabonete","shampoo","xampu","condicionador","creme dental","pasta de dente","escova","desodorante","absorvente","fralda","lenco","algodao","cotonete","fio dental"]],
  ["Congelados",["congelado","sorvete","pizza","lasanha","nuggets","hamburguer","batata frita","empanado"]],
  ["Mercearia",["arroz","feijao","acucar","cafe","oleo","azeite","sal","farinha","macarrao","molho","extrato","milho","ervilha","atum","sardinha","biscoito","bolacha","achocolatado","aveia","granola","cereal","tempero","vinagre","maionese","ketchup","mostarda","fuba","gelatina","leite condensado","chocolate"]],
  ["Pet",["racao","areia","petisco"]],
];
CP.SECOES=SECOES.map(s=>s[0]).concat(["Outros"]);
CP.secaoDe=function(nome){const n=" "+norm(nome)+" ";let melhor=null,tam=0;
  SECOES.forEach(([s,ps])=>ps.forEach(p=>{const q=" "+norm(p)+" ";if(n.includes(q)&&q.length>tam){melhor=s;tam=q.length;}}));
  if(!melhor)SECOES.forEach(([s,ps])=>ps.forEach(p=>{const q=norm(p);if(q.length>=4&&n.includes(" "+q)&&q.length>tam){melhor=s;tam=q.length;}}));
  return melhor||"Outros";};

// ---------- medida da embalagem (para preço por kg / litro) ----------
CP.medida=function(txt){const t=String(txt??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/(\d),(\d)/g,"$1.$2");
  const m=t.match(/(?:^|[^a-z0-9.])(\d+(?:\.\d+)?)\s?(kg|g|gr|grs|ml|l|lt|lts|litro|litros)(?![a-z])/);if(!m)return null;
  let q=+m[1],u=m[2];if(/^(g|gr|grs)$/.test(u))return{q:q/1000,base:"kg"};if(u==="kg")return{q,base:"kg"};
  if(u==="ml")return{q:q/1000,base:"L"};return{q,base:"L"};};

// ---------- semelhança de nomes (item da lista × linha da nota / produto do site) ----------
const PARADAS=new Set(["de","da","do","das","dos","com","c","p","para","e","em","un","und","unid","pct","pc","cx","tp","tipo","kg","g","ml","l","lt"]);
const tokens=s=>norm(s).split(" ").filter(t=>t&&!PARADAS.has(t)&&!/^\d+([.,]\d+)?$/.test(t));
function bigramas(s){const o=[];for(let i=0;i<s.length-1;i++)o.push(s.slice(i,i+2));return o;}
function dice(a,b){if(a===b)return 1;if(a.length<2||b.length<2)return 0;const A=bigramas(a),B=bigramas(b);let n=0;const usa=B.slice();
  A.forEach(x=>{const i=usa.indexOf(x);if(i>=0){n++;usa.splice(i,1);}});return 2*n/(A.length+B.length);}
function simToken(a,b){if(a===b)return 1;const c=Math.min(a.length,b.length);
  if(c>=3&&(a.startsWith(b)||b.startsWith(a)))return .85; // nota abrevia: "refrig" × "refrigerante"
  const d=dice(a,b);return d>=.6?d*.9:0;}
// quanto do nome curto (da lista) aparece no nome longo (da nota): média do melhor casamento de cada palavra
CP.semelhanca=function(curto,longo){const A=tokens(curto),B=tokens(longo);if(!A.length||!B.length)return 0;
  const s=A.reduce((t,a)=>t+Math.max(...B.map(b=>simToken(a,b))),0)/A.length;
  return Math.round(s*1000)/1000;};

// ---------- produtos (catálogo próprio, aprende com as notas) ----------
CP.acharProduto=function(nome){const n=norm(nome);if(!n)return null;
  return CP.vivos("produtos").find(p=>norm(p.nome)===n||(p.apelidos||[]).includes(n))||null;};
CP.garantirProduto=function(nome,extra){let p=CP.acharProduto(nome);
  if(!p)p=CP.salvarReg("produtos",Object.assign({nome:CP.padronizarNome(nome),secao:CP.secaoDe(nome),un:"un",apelidos:[],cods:[]},extra||{}));
  return p;};
// liga um texto da nota (e o código do item naquele mercado) a um produto, para casar sozinho da próxima vez
CP.aprender=function(pid,descNota,cnpj,cod){const p=CP.por("produtos",pid);if(!p)return;let mudou=false;
  const n=norm(descNota);if(n&&n!==norm(p.nome)&&!(p.apelidos||[]).includes(n)){p.apelidos=(p.apelidos||[]).concat(n).slice(-20);mudou=true;}
  const c=cnpj&&cod?cnpj+":"+String(cod).trim():"";if(c&&!(p.cods||[]).includes(c)){p.cods=(p.cods||[]).concat(c).slice(-20);mudou=true;}
  if(mudou)CP.salvarReg("produtos",p);};

// ---------- mercados ----------
const REDES=[["Savegnago",/savegnago/],["Atacadão",/atacadao/],["Tenda",/tenda/],["Carrefour",/carrefour/],["Passarinho",/passarinho/],["Tonin",/tonin/],
  ["Assaí",/assai/],["Pão de Açúcar",/pao de acucar|cbd|companhia brasileira de distribuicao/],["Sam's Club",/sams club/],["Dia",/\bdia\b/],
  ["Paulistão",/paulistao/],["Spani",/spani/],["Jaú Serve",/jau serve/],["Cogeb",/cogeb/],["Serv Bem",/serv ?bem/],["Arco Íris",/arco iris/],["Varejão da Família",/varejao da familia/]];
CP.redeDe=nome=>{const n=norm(nome);const r=REDES.find(([,rx])=>rx.test(n));return r?r[0]:"";};
CP.idMercadoCnpj=cnpj=>"cnpj"+String(cnpj||"").replace(/\D/g,"");
CP.garantirMercado=function(dados){// dados: {cnpj, nome, endereco}
  const cnpj=String(dados.cnpj||"").replace(/\D/g,"");const id=cnpj.length===14?CP.idMercadoCnpj(cnpj):(dados.id||null);
  let m=id?CP.por("mercados",id):null;
  if(!m){m={id:id||novoId(),cnpj,nome:String(dados.nome||"Mercado").slice(0,80),apelido:"",rede:CP.redeDe(dados.nome),endereco:String(dados.endereco||"").slice(0,160)};CP.salvarReg("mercados",m);}
  else if((dados.endereco&&!m.endereco)||(dados.nome&&m.nome==="Mercado")){m.endereco=m.endereco||String(dados.endereco).slice(0,160);if(dados.nome&&m.nome==="Mercado")m.nome=String(dados.nome).slice(0,80);CP.salvarReg("mercados",m);}
  return m;};
CP.nomeMercado=id=>{const m=CP.por("mercados",id);return m?(m.apelido||m.nome):"(mercado não informado)";};

// ---------- listas e itens ----------
CP.listasAbertas=()=>CP.vivos("listas").filter(l=>l.status!=="fechada").sort((a,b)=>String(b.criada).localeCompare(String(a.criada)));
CP.itensDa=lid=>CP.vivos("itens").filter(i=>i.listaId===lid).sort((a,b)=>(CP.SECOES.indexOf(a.secao)-CP.SECOES.indexOf(b.secao))||String(a.nome).localeCompare(String(b.nome),"pt-BR"));
CP.novaLista=function(nome){return CP.salvarReg("listas",{nome:String(nome||("Compras "+hoje().split("-").reverse().join("/"))).slice(0,60),criada:hoje(),status:"aberta"});};
CP.addItem=function(lid,nome,qtd,un,mercadoId,copiaDe){nome=String(nome||"").trim().slice(0,80);if(!nome)return null;
  const p=CP.garantirProduto(nome),m=typeof mercadoId==="string"&&ID_OK.test(mercadoId)?mercadoId:"";
  const ja=CP.itensDa(lid).find(i=>i.produtoId===p.id&&i.estado!=="pego"&&(i.mercadoId||"")===m);
  if(ja){ja.qtd=r2((+ja.qtd||0)+(+qtd||1));CP.salvarReg("itens",ja);return ja;}
  const it={listaId:lid,produtoId:p.id,nome:p.nome,qtd:+qtd||1,un:un||p.un||"un",secao:p.secao||CP.secaoDe(nome),estado:"pendente"};if(m)it.mercadoId=m;if(typeof copiaDe==="string"&&ID_OK.test(copiaDe))it.copiaDe=copiaDe; // cópia de um item "faltou" (some se o original aparecer como pego)
  return CP.salvarReg("itens",it);};
// "+ peguei algo a mais": item que NÃO estava na lista e já está no carrinho. Se o produto já estava pendente na lista, só marca como pego
// (não é "a mais"). Devolve {item, aMais}.
CP.pegueiAMais=function(lid,nome,qtd,un){nome=String(nome||"").trim().slice(0,80);if(!nome||!CP.por("listas",lid))return null;
  const p=CP.garantirProduto(nome),ja=CP.itensDa(lid).find(i=>i.produtoId===p.id&&i.estado==="pendente");
  if(ja){CP.definirPego(ja.id,true);return{item:CP.por("itens",ja.id),aMais:false};}
  const it=CP.salvarReg("itens",{listaId:lid,produtoId:p.id,nome:p.nome,qtd:+qtd||1,un:un||p.un||"un",secao:p.secao||CP.secaoDe(nome),estado:"pego",pegoPor:CP.eu().nome,pegoEm:Date.now(),aMais:true});
  return{item:it,aMais:true};};
// marca/desmarca "peguei" (quem e quando). O toque diz o que a pessoa QUER (pego=true/false), não "inverter":
// se a tela estava velha e o outro aparelho já tinha marcado, o toque não desfaz a marca dele.
// Devolve false quando já estava assim (nada a fazer).
CP.definirPego=function(iid,pego){const i=CP.por("itens",iid);if(!i)return false;
  if((i.estado==="pego")===!!pego)return false;
  if(pego){i.estado="pego";i.pegoPor=CP.eu().nome;i.pegoEm=Date.now();}
  else{i.estado="pendente";delete i.pegoPor;delete i.pegoEm;}
  CP.salvarReg("itens",i);return true;};
CP.alternarPego=function(iid){const i=CP.por("itens",iid);if(!i)return;CP.definirPego(iid,i.estado!=="pego");};
// lista fechada que ganhou um item pendente (outro aparelho adicionou/desmarcou na hora em que a compra era finalizada): reabre
CP.consertarListas=function(){let n=0;
  // "faltou" virou uma cópia na próxima lista, mas o outro aparelho tinha pegado o original: a cópia pendente é duplicata
  CP.vivos("itens").forEach(i=>{if(i.copiaDe&&i.estado==="pendente"){const o=CP.por("itens",i.copiaDe);if(o&&o.estado==="pego"){CP.apagar("itens",i.id);n++;}}});const pend=new Set(CP.vivos("itens").filter(i=>i.estado==="pendente").map(i=>i.listaId));
  CP.vivos("listas").forEach(l=>{if(l.status==="fechada"&&pend.has(l.id)){l.status="aberta";delete l.fechada;CP.salvarReg("listas",l);n++;}});return n;};

// ---------- compras (o que foi pago: nota fiscal ou lançamento manual) ----------
CP.comprasVivas=()=>CP.vivos("compras").sort((a,b)=>String(b.data).localeCompare(String(a.data))||(+b._em||0)-(+a._em||0));
CP.comprasDoMes=ym=>CP.comprasVivas().filter(c=>ymDe(c.data)===ym);
CP.totalCompra=c=>r2(+c.total||((c.itens||[]).reduce((s,x)=>s+(+x.vTotal||0),0)));
CP.vaDaCompra=c=>r2(c.pagamento==="va"?CP.totalCompra(c):(+c.valorVA||0));
// meses com alguma compra, do mais antigo ao mais novo
CP.mesesComCompras=()=>[...new Set(CP.comprasVivas().map(c=>ymDe(c.data)).filter(x=>/^\d{4}-\d{2}$/.test(x)))].sort();
CP.ymAtual=()=>ymDe(hoje());
const ymMais=(ym,k)=>{const d=new Date(+ym.slice(0,4),+ym.slice(5)-1+k,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");};
CP.ymMais=ymMais;

// ---- leitura das FINANÇAS (só leitura; nunca grava em `state`) ----
// VA recebido no mês, como está em Contas Casa → Editar dados (null se o mês não existe lá)
CP.vaRecebido=function(ym){try{const m=(state.meses||[]).find(x=>x.ym===ym);return m?r2(+m.va||0):null;}catch(e){return null;}};
// quanto as finanças registram na categoria Mercado no mês (contas + gastos avulsos)
CP.mercadoNasFinancas=function(ym){try{if(typeof gastoPorCategoria!=="function")return null;const g=gastoPorCategoria([ym]);return r2(g.Mercado||0);}catch(e){return null;}};

// resumo do mês: total, por pagamento, por mercado, por seção; VA recebido × gasto × saldo
CP.resumoMes=function(ym){const cs=CP.comprasDoMes(ym);const o={ym,n:cs.length,total:0,va:0,outros:0,porMercado:mapa(),porSecao:mapa(),porProduto:mapa(),extras:0};
  cs.forEach(c=>{const t=CP.totalCompra(c),v=Math.min(CP.vaDaCompra(c),t);o.total+=t;o.va+=v;o.outros+=t-v;
    const mn=CP.nomeMercado(c.mercadoId);o.porMercado[mn]=(o.porMercado[mn]||0)+t;
    const soma=(c.itens||[]).reduce((s,x)=>s+(+x.vTotal||0),0),f=soma>0?t/soma:1; // descontos da nota rateados
    (c.itens||[]).forEach(x=>{const p=x.produtoId&&CP.por("produtos",x.produtoId);const sec=(p&&p.secao)||CP.secaoDe(x.desc||x.nome);const v2=(+x.vTotal||0)*f;
      o.porSecao[sec]=(o.porSecao[sec]||0)+v2;const nome=p?p.nome:(x.nome||x.desc||"?");o.porProduto[nome]=(o.porProduto[nome]||0)+v2;if(x.extra)o.extras+=v2;});
    if(!(c.itens||[]).length){o.porSecao["Sem itens detalhados"]=(o.porSecao["Sem itens detalhados"]||0)+t;}});
  ["total","va","outros","extras"].forEach(k=>o[k]=r2(o[k]));
  ["porMercado","porSecao","porProduto"].forEach(k=>{for(const x in o[k])o[k][x]=r2(o[k][x]);});
  const rec=CP.vaRecebido(ym);o.vaRecebido=rec;o.vaSaldo=rec==null?null:r2(rec-o.va);
  o.mercadoFinancas=CP.mercadoNasFinancas(ym);
  return o;};
// comparação de dois meses: o que subiu e o que caiu (por seção e por produto)
CP.compararMeses=function(a,b){const A=CP.resumoMes(a),B=CP.resumoMes(b);
  const dif=(x,y)=>[...new Set([...Object.keys(x),...Object.keys(y)])].map(k=>({nome:k,a:r2(x[k]||0),b:r2(y[k]||0),dif:r2((y[k]||0)-(x[k]||0))})).sort((p,q)=>Math.abs(q.dif)-Math.abs(p.dif));
  return{A,B,total:r2(B.total-A.total),secoes:dif(A.porSecao,B.porSecao),produtos:dif(A.porProduto,B.porProduto),mercados:dif(A.porMercado,B.porMercado)};};

// ---------- preços (histórico tirado das compras) ----------
// cada linha de compra com preço vira um ponto: produto × mercado × data
CP.historicoPrecos=function(pid){const out=[];
  CP.comprasVivas().forEach(c=>(c.itens||[]).forEach(x=>{if(x.produtoId!==pid||!(+x.vUnit>0))return;
    const md=CP.medida(x.desc||x.nome);out.push({data:c.data,mercadoId:c.mercadoId,mercado:CP.nomeMercado(c.mercadoId),vUnit:+x.vUnit,qtd:+x.qtd||1,un:x.un||"",desc:x.desc||x.nome,porBase:md&&md.q>0?r2(+x.vUnit/md.q):null,base:md?md.base:null});}));
  return out.sort((a,b)=>String(b.data).localeCompare(String(a.data)));};
CP.ultimoPreco=function(pid,mercadoId){const h=CP.historicoPrecos(pid).filter(x=>!mercadoId||x.mercadoId===mercadoId);return h[0]||null;};
// resumo por produto: último preço em cada mercado, menor e média
CP.resumoPrecos=function(){return CP.vivos("produtos").map(p=>{const h=CP.historicoPrecos(p.id);if(!h.length)return null;
  const porM=mapa();h.forEach(x=>{if(!porM[x.mercadoId])porM[x.mercadoId]=x;});
  const vs=h.map(x=>x.vUnit);const ult=Object.values(porM).sort((a,b)=>a.vUnit-b.vUnit);
  return{p,h,ultimoPorMercado:ult,menor:Math.min(...vs),media:r2(vs.reduce((s,v)=>s+v,0)/vs.length),ultimo:h[0]};}).filter(Boolean)
  .sort((a,b)=>String(a.p.nome).localeCompare(String(b.p.nome),"pt-BR"));};

// ---------- inteligência simples, sem IA ----------
// estimativa da lista pelos preços que você já pagou
CP.previaLista=function(lid){let total=0,com=0,sem=0;
  let ref=0;
  CP.itensDa(lid).filter(i=>i.estado!=="faltou"&&i.estado!=="dispensado").forEach(i=>{
    // preço de referência da análise "Comparar mercados" (consulta nos sites, de até 2 dias atrás) vale mais que o último preço pago
    const pr=i.precoRef&&+i.precoRef.p>0&&dias(i.precoRef.d,hoje())<=2?i.precoRef:null;
    if(pr){total+=pr.p*(+i.qtd||1);com++;ref++;return;}
    const u=i.produtoId&&CP.ultimoPreco(i.produtoId);
    if(u){total+=u.vUnit*(+i.qtd||1);com++;}else sem++;});
  return{total:r2(total),com,sem,ref};};
// reposição: produtos comprados em intervalos regulares, já perto da hora de comprar de novo
CP.sugestoesReposicao=function(lid){const naLista=new Set(lid?CP.itensDa(lid).map(i=>i.produtoId):[]);const h=hoje();const out=[];
  const datas=mapa();CP.comprasVivas().forEach(c=>(c.itens||[]).forEach(x=>{if(!x.produtoId)return;(datas[x.produtoId]=datas[x.produtoId]||new Set()).add(c.data);}));
  for(const[pid,ds]of Object.entries(datas)){if(naLista.has(pid))continue;const p=CP.por("produtos",pid);if(!p)continue;
    const l=[...ds].sort();if(l.length<2)continue;
    const ints=[];for(let i=1;i<l.length;i++){const d=dias(l[i-1],l[i]);if(d>0)ints.push(d);}if(!ints.length)continue;
    ints.sort((a,b)=>a-b);const med=ints[Math.floor(ints.length/2)];const desde=dias(l[l.length-1],h);
    if(med>=3&&desde>=med*.85)out.push({p,intervalo:med,desde,atraso:desde/med});}
  return out.sort((a,b)=>b.atraso-a.atraso).slice(0,8);};

// ============ ETAPA 7 — produto/marca, mercado na lista, cartões de VR (ciclo 30→29), comparações ============
// ---------- número para texto (pt-BR; nunca toFixed) ----------
const nBR=(v,max)=>(+v||0).toLocaleString("pt-BR",{maximumFractionDigits:max==null?2:max});
CP.nBR=nBR;
const dinheiro=v=>{try{if(typeof fmt==="function")return fmt(+v||0);}catch(e){}return"R$ "+(+v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});};
CP.dinheiroTxt=dinheiro;

// ---------- produto/marca ("arroz/tio joão"); sem marca = qualquer marca ----------
// A barra separa produto e marca, menos em "1/2" e "c/" ("pão c/ queijo").
const SEM_MARCA=new Set(["qualquer","qualquer marca","sem marca","generico","generica","tanto faz"]);
function acharBarra(t){for(let i=0;i<t.length;i++){if(t[i]!=="/")continue;
  const esq=t.slice(0,i).trimEnd(),dir=t.slice(i+1).trimStart();if(!esq||!dir)continue;
  if(/\d$/.test(esq)&&/^\d/.test(dir))continue;
  const ult=esq.split(/\s+/).pop();if(ult.length<2)continue;
  return i;}
  return -1;}
CP.partirProdutoMarca=function(txt){const t=String(txt??"").replace(/\s+/g," ").trim();const i=acharBarra(t);
  let produto=t,marca="";if(i>=0){produto=t.slice(0,i).trim();marca=t.slice(i+1).replace(/\//g," ").replace(/\s+/g," ").trim();}
  const produtoN=norm(produto);let marcaN=norm(marca);if(SEM_MARCA.has(marcaN)){marcaN="";marca="";}
  return{produto,marca,produtoN,marcaN,qualquerMarca:!marcaN,chave:marcaN?produtoN+"/"+marcaN:produtoN,nome:marca?produto+"/"+marca:produto};};
// nome no padrão guardado: "arroz / tio joão" → "arroz/tio joão" (espaços limpos, sem marca = só o produto)
CP.padronizarNome=nome=>CP.partirProdutoMarca(nome).nome.slice(0,80);
// dois nomes são "o mesmo produto"? mesmo produto; e, se os dois têm marca, a mesma marca (sem marca = qualquer marca)
CP.mesmoProduto=function(a,b){const A=CP.partirProdutoMarca(a),B=CP.partirProdutoMarca(b);
  return!!A.produtoN&&A.produtoN===B.produtoN&&(!A.marcaN||!B.marcaN||A.marcaN===B.marcaN);};

// ---------- mercado na lista e nos itens (opcional) ----------
const mercadoOk=id=>typeof id==="string"&&ID_OK.test(id)?id:"";
CP.definirMercadoItem=function(iid,mercadoId){const i=CP.por("itens",iid);if(!i)return false;const m=mercadoOk(mercadoId);
  if((i.mercadoId||"")===m)return false;if(m)i.mercadoId=m;else delete i.mercadoId;delete i.precoRef;CP.salvarReg("itens",i);return true;};
// preço de referência de hoje (vindo da consulta nos sites): {p: preço unitário, r: mercado/rede, d: data}
CP.definirPrecoRef=function(iid,p,rede){const i=CP.por("itens",iid);if(!i||!(+p>0))return false;i.precoRef={p:r2(+p),r:String(rede||"").slice(0,30),d:hoje()};CP.salvarReg("itens",i);return true;};
// o mercado (registro) de uma rede/site: o que já existe com essa rede, senão cria um com id fixo (igual em todos os aparelhos)
CP.mercadoDaRede=function(rede){rede=String(rede||"").slice(0,30);if(!rede)return"";
  const ja=CP.vivos("mercados").filter(m=>m.rede===rede||CP.norm(m.apelido||m.nome)===CP.norm(rede)).sort((a,b)=>String(a.id).localeCompare(String(b.id)))[0];if(ja)return ja.id;
  const slug=CP.norm(rede).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40)||"mercado";
  const m=CP.garantirMercado({id:"mc-"+slug,nome:rede});if(m&&m.rede!==rede){m.rede=rede;CP.salvarReg("mercados",m);}return m?m.id:"";};
CP.definirOrcamento=function(lid,v){const l=CP.por("listas",lid);if(!l)return false;const n=v==null||v===""?null:CP.numBR(v);
  if(n==null||!isFinite(n)||n<=0){if(l.orcamento==null)return false;delete l.orcamento;}else{const x=r2(Math.min(n,1e7));if(l.orcamento===x)return false;l.orcamento=x;}
  CP.salvarReg("listas",l);CP.gravar();return true;};
CP.definirMercadoLista=function(lid,mercadoId){const l=CP.por("listas",lid);if(!l)return false;const m=mercadoOk(mercadoId);
  if((l.mercadoId||"")===m)return false;if(m)l.mercadoId=m;else delete l.mercadoId;CP.salvarReg("listas",l);return true;};
// mercado efetivo de um item: o do item, senão o da lista, senão "" (qualquer um)
CP.mercadoDoItem=function(i){if(!i)return"";if(i.mercadoId)return i.mercadoId;const l=CP.por("listas",i.listaId);return(l&&l.mercadoId)||"";};
// itens agrupados por mercado ("" = sem mercado definido)
CP.itensPorMercado=function(lid){const o=mapa();CP.itensDa(lid).forEach(i=>{const m=CP.mercadoDoItem(i);(o[m]=o[m]||[]).push(i);});return o;};

// ---------- cartões de VR e ciclo 30→29 ----------
// O VR cai no dia `diaCredito` (30) e vale até o dia anterior ao próximo crédito (29). O "VR de dezembro" é o que cai em 30/nov.
// Mês sem o dia (fevereiro): o crédito vai para o último dia do mês.
const MESES_NOME=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const iso=(y,m,d)=>y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
const ultimoDia=(y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate();
const creditoEm=(y,m,dia)=>iso(y,m,Math.min(dia,ultimoDia(y,m)));
const dataOk=d=>typeof d==="string"&&DATA_ISO.test(d)&&!isNaN(Date.parse(d+"T12:00:00"));
const diaAntes=d=>{const t=new Date(Date.parse(d+"T12:00:00Z")-86400000);return iso(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate());};
CP.dataOk=dataOk;
CP.cicloVR=function(dataISO,diaCredito){const d=dataOk(dataISO)?dataISO:hoje();const dia=Math.min(31,Math.max(1,Math.round(+diaCredito)||30));
  const y=+d.slice(0,4),m=+d.slice(5,7),dd=+d.slice(8,10);let cy=y,cm=m;
  if(dd<Math.min(dia,ultimoDia(y,m))){cm--;if(cm<1){cm=12;cy--;}}
  const inicio=creditoEm(cy,cm,dia);let ny=cy,nm=cm+1;if(nm>12){nm=1;ny++;}
  const prox=creditoEm(ny,nm,dia);
  // o rótulo é o mês em que o dinheiro é gasto: crédito no fim do mês (dia ≥ 20) → mês seguinte
  let ry=cy,rm=cm;if(dia>=20){rm++;if(rm>12){rm=1;ry++;}}
  return{id:inicio,inicio,fim:diaAntes(prox),proxInicio:prox,dia,dias:dias(inicio,prox),ym:ry+"-"+String(rm).padStart(2,"0"),
    rotulo:"VR de "+MESES_NOME[rm-1],rotuloAno:"VR de "+MESES_NOME[rm-1]+" de "+ry};};
CP.cicloSeguinte=c=>CP.cicloVR(c.proxInicio,c.dia);
CP.cicloAnterior=c=>CP.cicloVR(diaAntes(c.inicio),c.dia);

const CARTAO_PADRAO=()=>({id:"vr",nome:"VR",diaCredito:30,deFinancas:true,ciclos:{}});
// os cartões, do principal (menor "ordem") para os outros; cada um com seus ciclos (registros ciclo-<cartão>-<início>).
// Sem nenhum cartão guardado, existe o "VR" padrão (virtual — só passa a ser guardado quando se grava algo com ele).
function lerCartoes(){try{migrarConfig();}catch(e){}const cfg=CP.dados().config,cs=[],porId=mapa(),cics=[];
  for(const k of Object.keys(cfg)){const r=cfg[k];if(!r||r._del)continue;
    if(k.startsWith("vr-")){const id=k.slice(3);if(!CARTAO_ID.test(id))continue;
      const c={id,nome:r.nome||"VR",diaCredito:r.diaCredito||30,deFinancas:!!r.deFinancas,ciclos:{},ordem:+r.ordem||0,guardado:true};
      if(r.valorOriginal!=null)c.valorOriginal=r.valorOriginal;cs.push(c);porId[id]=c;}
    else{const m=RX_CICLO.exec(k);if(m)cics.push([m[1],m[2],r]);}}
  if(!cs.length){const c=Object.assign(CARTAO_PADRAO(),{ordem:0});cs.push(c);porId[c.id]=c;}
  cics.sort((x,y)=>x[1]<y[1]?1:x[1]>y[1]?-1:0); // mais novos primeiro; no máximo 60 por cartão
  cics.forEach(([cid,ini,r])=>{const c=porId[cid];if(!c||Object.keys(c.ciclos).length>=60)return;const z={};
    if(r.valorOriginal!=null)z.valorOriginal=r.valorOriginal;if(r.saldoAgora!=null)z.saldoAgora=r.saldoAgora;if(r.usouTudo)z.usouTudo=true;if(r.em)z.em=r.em;c.ciclos[ini]=z;});
  cs.sort((x,y)=>x.ordem-y.ordem||(x.id<y.id?-1:x.id>y.id?1:0));
  return cs.slice(0,8);}
const publico=c=>{const o=Object.assign({},c);delete o.ordem;delete o.guardado;return o;};
CP.cartoesVR=function(){return lerCartoes().map(publico);};
CP.cartaoVR=function(id){const l=CP.cartoesVR();return l.find(c=>c.id===id)||l[0];};
// guarda UM cartão (só o registro dele; o dos outros cartões e dos ajustes não é tocado). Não regrava se nada mudou.
function gravarCartao(c,ordem){const cfg=CP.dados().config,id="vr-"+c.id,ex=TEM(cfg,id)?cfg[id]:null,vivo=ex&&!ex._del?ex:null;
  const campos={nome:c.nome,diaCredito:c.diaCredito,deFinancas:!!c.deFinancas,ordem:vivo&&isFinite(+vivo.ordem)?+vivo.ordem:ordem};
  if(c.valorOriginal!=null)campos.valorOriginal=c.valorOriginal;
  if(vivo&&["nome","diaCredito","deFinancas","ordem","valorOriginal"].every(k=>estavel(vivo[k]==null?null:vivo[k])===estavel(campos[k]==null?null:campos[k])))return false;
  const r=vivo||Object.assign({id},ex?{_em:ex._em}:{});["nome","diaCredito","deFinancas","ordem","valorOriginal"].forEach(k=>{if(campos[k]==null)delete r[k];else r[k]=campos[k];});
  CP.salvarReg("config",r);return true;}
// guarda/apaga o registro de UM ciclo de um cartão (campos vazios = apaga o registro)
function gravarCiclo(cid,inicio,campos){const cfg=CP.dados().config,id=idCiclo(cid,inicio),ex=TEM(cfg,id)?cfg[id]:null,vivo=ex&&!ex._del?ex:null;
  const lim={};["valorOriginal","saldoAgora","usouTudo","em"].forEach(k=>{if(campos&&campos[k]!=null&&campos[k]!==false)lim[k]=campos[k];});
  if(!Object.keys(lim).length){if(vivo)CP.apagar("config",id);return;}
  const r=vivo||Object.assign({id},ex?{_em:ex._em}:{});
  if(vivo&&["valorOriginal","saldoAgora","usouTudo","em"].every(k=>estavel(vivo[k]==null?null:vivo[k])===estavel(lim[k]==null?null:lim[k])))return;
  ["valorOriginal","saldoAgora","usouTudo","em"].forEach(k=>{if(lim[k]==null)delete r[k];else r[k]=lim[k];});CP.salvarReg("config",r);}
CP.salvarCartaoVR=function(c){c=limparCartoes([c])[0];if(!c)throw new Error("Cartão inválido (precisa de um id simples, como mae).");
  const lista=lerCartoes(),antigo=lista.find(x=>x.id===c.id);
  if(!antigo&&lista.length>=8)throw new Error("No máximo 8 cartões.");
  if(!lista.some(x=>x.guardado)&&c.id!=="vr")gravarCartao(CARTAO_PADRAO(),0); // o "VR" padrão (virtual) passa a existir de verdade: continua o principal
  const guardados=lista.filter(x=>x.guardado);
  gravarCartao(c,guardados.length?Math.max(...guardados.map(x=>x.ordem))+1:(c.id==="vr"?0:1)); // o principal é o de menor "ordem"; cartão novo vai para o fim
  Object.keys(c.ciclos).forEach(k=>gravarCiclo(c.id,k,c.ciclos[k]));
  if(antigo&&!Object.keys(c.ciclos).length)c.ciclos=publico(antigo).ciclos;
  return c;};
// lista inteira de cartões (compatibilidade com CP.salvarConfig({cartoesVR}) e com a config antiga): grava os que mudaram e apaga os que sumiram
function definirCartoes(l){l=limparCartoes(l);const atuais=lerCartoes();
  l.forEach((c,i)=>{gravarCartao(c,i);Object.keys(c.ciclos).forEach(k=>gravarCiclo(c.id,k,c.ciclos[k]));});
  atuais.forEach(c=>{if(c.guardado&&!l.some(x=>x.id===c.id))apagarCartao(c.id);});}
function apagarCartao(id){const cfg=CP.dados().config;CP.apagar("config","vr-"+id);
  Object.keys(cfg).forEach(k=>{const m=RX_CICLO.exec(k);if(m&&m[1]===id&&!cfg[k]._del)CP.apagar("config",k);});}
CP.removerCartaoVR=function(id){const l=lerCartoes();if(l.length<=1)return false;apagarCartao(id);return true;};
function mudarCiclo(cartaoId,ref,fn){const c=CP.cartoesVR().find(x=>x.id===cartaoId);if(!c)throw new Error("Cartão não encontrado.");
  const ci=CP.cicloVR(ref,c.diaCredito);const a=Object.assign({},c.ciclos[ci.id]||{});fn(a);
  gravarCiclo(c.id,ci.id,a);return ci;}
// valor original do ciclo: o editado > o das finanças (Editar dados, mês do rótulo) > o valor padrão do cartão
CP.originalCiclo=function(cartaoId,ref){const c=CP.cartaoVR(cartaoId),ci=CP.cicloVR(ref,c.diaCredito),a=c.ciclos[ci.id]||{};
  if(a.valorOriginal!=null)return{valor:a.valorOriginal,origem:"editado",ciclo:ci};
  if(c.deFinancas){const v=CP.vaRecebido(ci.ym);if(v!=null&&v>0)return{valor:v,origem:"financas",ciclo:ci};}
  if(c.valorOriginal!=null)return{valor:c.valorOriginal,origem:"cartao",ciclo:ci};
  return{valor:null,origem:"nenhum",ciclo:ci};};
// editar o valor original deste ciclo (null = voltar ao das finanças)
CP.definirOriginalCiclo=function(cartaoId,ref,valor){const v=valor==null||valor===""?null:CP.numBR(valor);
  return mudarCiclo(cartaoId,ref,a=>{if(v==null)delete a.valorOriginal;else a.valorOriginal=r2(Math.min(1e7,Math.max(0,v)));});};
// "usou tudo? quanto tem agora?": saldo REAL do cartão numa data (as compras da Lista até essa data já estão nele)
CP.ajustarSaldoCartao=function(cartaoId,ref,o){o=o||{};const em=dataOk(o.em)?o.em:hoje();
  return mudarCiclo(cartaoId,ref,a=>{if(o.usouTudo){a.usouTudo=true;a.saldoAgora=0;}else{const v=CP.numBR(o.saldoAgora);if(o.saldoAgora==null||o.saldoAgora===""||!isFinite(v))throw new Error("Digite quanto tem no cartão agora.");delete a.usouTudo;a.saldoAgora=r2(Math.min(1e7,Math.max(0,v)));}a.em=em;});};
CP.limparAjusteSaldo=(cartaoId,ref)=>mudarCiclo(cartaoId,ref,a=>{delete a.saldoAgora;delete a.usouTudo;delete a.em;});
// quanto de cada compra saiu de cada cartão (compra sem cartão = cartão principal; cartão apagado = principal)
CP.vaPorCartao=function(c){const t=CP.vaDaCompra(c);if(!(t>0))return[];const ids=CP.cartoesVR().map(x=>x.id),prin=ids[0];
  if(Array.isArray(c.cartoes)&&c.cartoes.length)return c.cartoes.filter(x=>x&&+x.valor>0).map(x=>({id:ids.includes(x.id)?x.id:prin,valor:r2(+x.valor)}));
  return[{id:ids.includes(c.cartaoId)?c.cartaoId:prin,valor:t}];};
// compras que usaram este cartão neste ciclo: [{compra, va}]
CP.comprasDoCiclo=function(cartaoId,ref){const c=CP.cartaoVR(cartaoId),ci=CP.cicloVR(ref,c.diaCredito),out=[];
  CP.comprasVivas().forEach(x=>{if(!dataOk(x.data)||x.data<ci.inicio||x.data>ci.fim)return;
    const v=CP.vaPorCartao(x).filter(k=>k.id===c.id).reduce((s,k)=>s+k.valor,0);if(v>0)out.push({compra:x,va:r2(v)});});
  return out;};
CP.saldoCartao=function(cartaoId,ref){const c=CP.cartaoVR(cartaoId),ci=CP.cicloVR(ref||hoje(),c.diaCredito),a=c.ciclos[ci.id]||{};
  const orig=CP.originalCiclo(c.id,ci.inicio),cs=CP.comprasDoCiclo(c.id,ci.inicio);
  const soma=f=>r2(cs.filter(f).reduce((s,x)=>s+x.va,0));
  const gastoLista=soma(()=>true),avisos=[];const o={cartaoId:c.id,nome:c.nome,ciclo:ci,original:orig.valor,origemOriginal:orig.origem,gastoLista,nCompras:cs.length,
    saldoAgora:null,usouTudo:false,em:"",gastoForaLista:null,saldo:null,semAjuste:true,avisos};
  if(a.saldoAgora!=null){const ate=soma(x=>x.compra.data<=a.em),dep=soma(x=>x.compra.data>a.em);
    o.semAjuste=false;o.saldoAgora=a.saldoAgora;o.usouTudo=!!a.usouTudo;o.em=a.em||"";o.gastoListaAntes=ate;o.gastoListaDepois=dep;
    if(orig.valor!=null){const fora=r2(orig.valor-a.saldoAgora-ate);o.gastoForaLista=Math.max(0,fora);if(fora<0)avisos.push("O saldo informado é maior do que o valor original menos as compras da Lista: confira o valor original do cartão.");}
    o.saldo=r2(a.saldoAgora-dep);}
  else if(orig.valor!=null){o.saldo=r2(orig.valor-gastoLista);}
  else avisos.push("Sem o valor original deste cartão neste ciclo: digite-o (ou o que tem agora).");
  if(o.saldo!=null&&o.saldo<0)avisos.push("As compras passam do saldo do cartão em "+dinheiro(-o.saldo)+".");
  return o;};
CP.resumoCartoes=ref=>CP.cartoesVR().map(c=>CP.saldoCartao(c.id,ref));

// ---------- comparações de preço por produto/marca ----------
// pontos de preço: uma linha de compra com produto cadastrado e preço
CP.pontosPreco=function(){const out=[];
  CP.comprasVivas().forEach(c=>(c.itens||[]).forEach(x=>{const p=x.produtoId&&CP.por("produtos",x.produtoId);const vu=+x.vUnit;if(!p||!(vu>0))return;
    const pm=CP.partirProdutoMarca(p.nome),marcaN=x.marca?norm(x.marca):pm.marcaN,md=CP.medida(x.desc||x.nome||p.nome);
    out.push({data:c.data,ym:ymDe(c.data),mercadoId:c.mercadoId||"",produtoId:p.id,nome:pm.produto+(x.marca&&!pm.marcaN?"/"+String(x.marca):pm.marca?"/"+pm.marca:""),
      produtoN:pm.produtoN,marcaN,chave:marcaN?pm.produtoN+"/"+marcaN:pm.produtoN,preco:vu,porBase:md&&md.q>0?r2(vu/md.q):null,base:md?md.base:null,qtd:+x.qtd||1});}));
  return out;};
function resumirPontos(pts){const n=pts.length,preco=r2(pts.reduce((s,x)=>s+x.preco,0)/n),base=pts.every(x=>x.porBase&&x.base===pts[0].base)?pts[0].base:null;
  return{n,preco,porBase:base?r2(pts.reduce((s,x)=>s+x.porBase,0)/n):null,base,ultimo:pts.map(x=>x.data).sort().pop()||"",qtd:r2(pts.reduce((s,x)=>s+x.qtd,0))};}
function agrupar(pts,fk){const m=mapa();pts.forEach(x=>{const k=fk(x);(m[k]=m[k]||[]).push(x);});return m;}
// variação entre dois resumos (usa preço por kg/L quando os dois têm a mesma medida)
function variacao(a,b){const usaBase=!!(a.porBase&&b.porBase&&a.base&&a.base===b.base),pa=usaBase?a.porBase:a.preco,pb=usaBase?b.porBase:b.preco;
  return{precoA:pa,precoB:pb,dif:r2(pb-pa),pct:pa>0?Math.round((pb/pa-1)*1000)/10:null,base:usaBase?a.base:null};}
CP.variacaoPreco=variacao;
// mercado × mercado para UM produto (ou "produto/marca"): preço médio por mercado, do mais barato ao mais caro. Sem marca = qualquer marca.
CP.precosPorMercado=function(nome,o){o=o||{};const pts=(o.pts||CP.pontosPreco()).filter(x=>CP.mesmoProduto(nome,x.nome)&&(!o.ym||x.ym===o.ym));
  const por=agrupar(pts,x=>x.mercadoId),linhas=Object.keys(por).map(mid=>{const r=resumirPontos(por[mid]);
    return Object.assign({mercadoId:mid,mercado:CP.nomeMercado(mid),marcas:[...new Set(por[mid].map(x=>x.marcaN).filter(Boolean))]},r);});
  const usaBase=linhas.length>0&&linhas.every(l=>l.porBase&&l.base===linhas[0].base);
  const v=l=>usaBase?l.porBase:l.preco;linhas.sort((a,b)=>v(a)-v(b));
  const melhor=linhas[0]||null;linhas.forEach(l=>{l.valor=v(l);l.acimaDoMelhor=melhor?r2(v(l)-v(melhor)):0;});
  return{nome,porBase:usaBase,base:usaBase?linhas[0].base:null,linhas,melhor};};
// todos os produtos/marcas comprados em 2+ mercados (no mês `ym`, ou em todo o histórico)
CP.compararMercados=function(ym){const todos=CP.pontosPreco(),pts=todos.filter(x=>!ym||x.ym===ym),out=[];const porChave=agrupar(pts,x=>x.chave);
  Object.keys(porChave).forEach(k=>{const por=agrupar(porChave[k],x=>x.mercadoId);if(Object.keys(por).length<2)return;
    const r=CP.precosPorMercado(porChave[k][0].nome,{ym,pts:todos});out.push({chave:k,nome:porChave[k][0].nome,porBase:r.porBase,base:r.base,linhas:r.linhas,melhor:r.melhor,
      economia:r.linhas.length?r2(r.linhas[r.linhas.length-1].valor-r.melhor.valor):0});});
  return out.sort((a,b)=>b.economia-a.economia);};
// MESMO mercado, mês a mês: quanto gastou e como mudou o preço de cada produto/marca comprado nos dois meses
const totalNoMercado=(ym,mid)=>{const cs=CP.comprasDoMes(ym).filter(c=>(c.mercadoId||"")===mid);return{n:cs.length,total:r2(cs.reduce((s,c)=>s+CP.totalCompra(c),0))};};
function precosDoMercado(mid,ym,pts){return agrupar(pts.filter(x=>x.mercadoId===mid&&x.ym===ym),x=>x.chave);}
CP.mesmoMercadoMesAMes=function(mercadoId,ymA,ymB){const pts=CP.pontosPreco(),A=precosDoMercado(mercadoId,ymA,pts),B=precosDoMercado(mercadoId,ymB,pts),prods=[];
  Object.keys(A).forEach(k=>{if(!B[k])return;const a=resumirPontos(A[k]),b=resumirPontos(B[k]),v=variacao(a,b);
    prods.push(Object.assign({chave:k,nome:A[k][0].nome,tipo:Math.abs(v.dif)<0.005?"igual":v.dif>0?"subiu":"caiu"},v));});
  prods.sort((p,q)=>Math.abs(q.pct||0)-Math.abs(p.pct||0));
  const ta=totalNoMercado(ymA,mercadoId),tb=totalNoMercado(ymB,mercadoId);
  return{mercadoId,mercado:CP.nomeMercado(mercadoId),ymA,ymB,totalA:ta.total,totalB:tb.total,nA:ta.n,nB:tb.n,dif:r2(tb.total-ta.total),produtos:prods,
    soEmA:Object.keys(A).filter(k=>!B[k]).map(k=>A[k][0].nome),soEmB:Object.keys(B).filter(k=>!A[k]).map(k=>B[k][0].nome)};};
// "mudança de mercado": o mesmo produto/marca comprado num mercado em A e em OUTRO em B, lado a lado
// (NÃO é aumento: é outro lugar; por isso tem rótulo próprio e fica separado do "subiu")
const principalDe=pts=>{const por=agrupar(pts,x=>x.mercadoId);const mid=Object.keys(por).sort((a,b)=>por[b].length-por[a].length||String(por[b][0].data).localeCompare(String(por[a][0].data)))[0];
  return Object.assign({mercadoId:mid,mercado:CP.nomeMercado(mid)},resumirPontos(por[mid]));};
CP.mudancaDeMercado=function(ymA,ymB){const pts=CP.pontosPreco(),A=agrupar(pts.filter(x=>x.ym===ymA),x=>x.chave),B=agrupar(pts.filter(x=>x.ym===ymB),x=>x.chave),out=[];
  Object.keys(A).forEach(k=>{if(!B[k])return;const ma=new Set(A[k].map(x=>x.mercadoId));if(B[k].some(x=>ma.has(x.mercadoId)))return; // algum mercado em comum: é comparação do mesmo mercado
    const deA=principalDe(A[k]),deB=principalDe(B[k]),v=variacao(deA,deB);
    out.push({chave:k,nome:A[k][0].nome,rotulo:"mudou de mercado",deA,deB,precoA:v.precoA,precoB:v.precoB,dif:v.dif,pct:v.pct,base:v.base});});
  return out.sort((a,b)=>Math.abs(b.pct||0)-Math.abs(a.pct||0));};
// preços que subiram de um mês (A) para o outro (B): mesmo produto/marca no MESMO mercado; quem mudou de mercado vem separado, lado a lado
CP.precosQueSubiram=function(ymA,ymB){const pts=CP.pontosPreco(),A=agrupar(pts.filter(x=>x.ym===ymA),x=>x.chave+"@"+x.mercadoId),B=agrupar(pts.filter(x=>x.ym===ymB),x=>x.chave+"@"+x.mercadoId);

// ---------- ETAPA 8 — lista do próximo ciclo (dia 25) ----------
// "sobrou": quanto ainda tem em casa de um produto (para calcular o consumo do ciclo). Vale só para o ciclo em que foi dito.
CP.registrarSobra=function(pid,qtd,dataISO){const p=CP.por("produtos",pid);if(!p)return false;const q=CP.numBR(qtd);if(!isFinite(q)||q<0)return false;
  p.sobra={qtd:r2(q),em:dataOk(dataISO)?dataISO:hoje()};CP.salvarReg("produtos",p);return true;};
const unBase=u=>String(u||"un").toLowerCase();
const arredondarQtd=(q,un)=>/^(kg|l|lt|litro|litros)$/.test(unBase(un))?Math.ceil(q*10-1e-9)/10:Math.ceil(q-1e-9);
// Para cada produto comprado no ciclo atual:  usou = comprou − sobrou;  consumo/dia = usou ÷ dias já passados;
// precisa no próximo ciclo = consumo/dia × dias do próximo ciclo;  sugerido = precisa − sobrou  (nunca negativo).
// Sem "sobrou" informado, conta como se tudo tivesse sido usado (e avisa). opts: {aPedido, antecedencia (5), diaCredito, sobras:{produtoId:qtd}}
CP.proximaLista=function(hojeISO,opts){opts=opts||{};const h=dataOk(hojeISO)?hojeISO:hoje();
  const dia=opts.diaCredito||CP.cartoesVR()[0].diaCredito,atual=CP.cicloVR(h,dia),prox=CP.cicloSeguinte(atual);
  const faltam=dias(h,atual.proxInicio),ant=opts.antecedencia==null?5:+opts.antecedencia,devido=faltam>=1&&faltam<=ant;
  const base={devido,aPedido:!!opts.aPedido,hoje:h,atual,proximo:prox,diasAteCredito:faltam,produtos:[],total:0,avisos:[],vrProximo:null,cabeNoVR:null};
  if(!devido&&!opts.aPedido)return base;
  const passados=Math.max(1,Math.min(atual.dias,dias(atual.inicio,h)+1));
  if(passados<10)base.avisos.push("O ciclo começou há só "+passados+" dia(s): a sugestão ainda é pouco confiável.");
  const por=mapa();CP.comprasVivas().forEach(c=>{if(!dataOk(c.data)||c.data<atual.inicio||c.data>atual.fim)return;
    (c.itens||[]).forEach(x=>{if(!x.produtoId)return;const z=por[x.produtoId]=por[x.produtoId]||{qtd:0,gasto:0,un:""};z.qtd+=+x.qtd||0;z.gasto+=+x.vTotal||0;if(x.un)z.un=x.un;});});
  const noAberto=new Set();CP.listasAbertas().forEach(l=>CP.itensDa(l.id).filter(i=>i.estado==="pendente").forEach(i=>noAberto.add(i.produtoId)));
  const sobras=opts.sobras||{};
  Object.keys(por).forEach(pid=>{const p=CP.por("produtos",pid);if(!p||!(por[pid].qtd>0))return;const z=por[pid],un=unBase(z.un||p.un);
    let sobrou=null;if(TEM(sobras,pid)&&isFinite(+sobras[pid]))sobrou=Math.max(0,+sobras[pid]);else if(p.sobra&&p.sobra.em>=atual.inicio&&p.sobra.em<=atual.fim)sobrou=+p.sobra.qtd;
    const informada=sobrou!=null;if(!informada)sobrou=0;sobrou=Math.min(sobrou,z.qtd);
    const usou=r2(z.qtd-sobrou),cdia=usou/passados,precisa=cdia*prox.dias,sug=Math.max(0,precisa-sobrou);
    let qtdS=sug>0?arredondarQtd(sug,un):0;if(qtdS>sug*1.25&&sug<=z.qtd*1.25)qtdS=Math.min(qtdS,arredondarQtd(z.qtd,un)); // só quando o arredondamento para cima INFLA a conta (1,11 → 2); crescer por ciclo mais longo (26 → 31) continua valendo // não sugere o DOBRO do comprado só por causa do arredondamento para cima
    const u=CP.ultimoPreco(pid);
    const porque="Comprou "+nBR(z.qtd,3)+" "+un+" ("+dinheiro(z.gasto)+")"+(informada?" e sobrou "+nBR(sobrou,3)+" "+un:" e não disse quanto sobrou: contei como usado")+
      ". Usou "+nBR(usou,3)+" "+un+" em "+passados+" dia(s) ("+nBR(cdia,3)+" "+un+"/dia). O próximo ciclo tem "+prox.dias+" dias: precisa de "+nBR(precisa,2)+" "+un+(sobrou?", menos "+nBR(sobrou,3)+" "+un+" que sobrou":"")+
      (qtdS>0?" → sugiro "+nBR(qtdS,3)+" "+un+".":" → não precisa comprar.");
    base.produtos.push({produtoId:pid,nome:p.nome,un,qtdSugerida:qtdS,porque,comprou:r2(z.qtd),gasto:r2(z.gasto),sobrou:r2(sobrou),sobraInformada:informada,usou,consumoDia:Math.round(cdia*1000)/1000,
      diasPassados:passados,precisa:r2(precisa),valorEstimado:u&&qtdS>0?r2(u.vUnit*qtdS):0,jaNaLista:noAberto.has(pid)});});
  base.produtos.sort((a,b)=>b.gasto-a.gasto);
  base.total=r2(base.produtos.reduce((s,x)=>s+x.valorEstimado,0));
  const vr=CP.vaRecebido(prox.ym);if(vr!=null&&vr>0){base.vrProximo=vr;base.cabeNoVR=base.total<=vr;}
  if(!base.produtos.length)base.avisos.push("Nenhuma compra com itens neste ciclo: nada para propor ainda.");
  if(base.produtos.some(x=>!x.sobraInformada))base.avisos.push("Alguns produtos estão sem o \"quanto sobrou\": informe para a sugestão ficar mais certa.");
  return base;};

// no arquivo vira marcador de apagado (carimbado agora) — assim, com a conta ligada, a nuvem e os outros aparelhos acompanham em vez de
// devolver tudo. Os ajustes (coleção config: cartões, intermediário, nomes dos aparelhos) nunca são tocados. Devolve {apagados}.
CP.importar=function(txt,substituir){const j=JSON.parse(txt);if(!j||j.tipo!=="compras-familia")throw new Error("Este arquivo não é um backup das compras.");

// ---------- arquivar listas fechadas ----------
// Uma lista fechada há muito tempo só ocupa espaço (e tempo de sincronização): os ITENS dela viram marcadores de apagado. A lista fica (com
// "arquivada") e as COMPRAS não são tocadas — o histórico de preços e de compras sai das compras, não dos itens da lista.
function planoArquivo(diasMin){const h=hoje(),out=[];let itens=0,antes=0,depois=0;
  CP.vivos("listas").forEach(l=>{if(l.status!=="fechada")return;const f=dataIsoOk(l.fechada)?l.fechada:dataIsoOk(l.criada)?l.criada:"";if(!f||dias(f,h)<=diasMin)return;
    const its=CP.itensDa(l.id);if(!its.length)return;out.push({lista:l,itens:its});itens+=its.length;
    its.forEach(i=>{antes+=bytesDe(JSON.stringify(i));depois+=bytesDe(JSON.stringify(marcadorDe(i)))+30;});});
  return{listas:out.length,itens,liberado:Math.max(0,antes-depois),liberadoDepois:Math.max(0,depois),plano:out};}
// só conta (sem mexer em nada): quantas listas e itens seriam arquivados
CP.previaArquivar=function(diasMin){const p=planoArquivo(+diasMin||60);return{listas:p.listas,itens:p.itens,liberado:p.liberado,liberadoDepois:p.liberadoDepois};};
// arquiva as listas fechadas há MAIS de diasMin dias. "liberado" = espaço que sai já (estimado); "liberadoDepois" = o que ainda ocupam os marcadores
// de apagado (saem sozinhos depois de 180 dias, quando todos os aparelhos já viram)
CP.arquivarListas=function(diasMin){const p=planoArquivo(+diasMin||60);
  p.plano.forEach(x=>{x.itens.forEach(i=>CP.apagar("itens",i.id));x.lista.arquivada=hoje();CP.salvarReg("listas",x.lista);});
  if(p.listas)CP.gravar();
  return{listas:p.listas,itens:p.itens,liberado:p.liberado,liberadoDepois:p.liberadoDepois};};

// As regras atuais do Firestore já cobrem estes documentos (mesma exigência de versão e tamanho).

// soma da família por dia: este aparelho + os registros ap-<outro aparelho> (cada um publica os seus dias)
CP.usoResumo=function(){const eu=CP.eu();const soma={};let aparelhos=1;const tam=Object.assign({},uso.tam);
  const add=(dias)=>Object.keys(dias).forEach(k=>{const s=soma[k]||(soma[k]={w:0,l:0,e:0});s.w+=dias[k].w;s.l+=dias[k].l;s.e+=dias[k].e;});
  add(uso.dias);
  CP.vivos("config").forEach(r=>{if(typeof r.id!=="string"||!r.id.startsWith("ap-")||r.id==="ap-"+eu.id||!r.uso)return;aparelhos++;add(limparDias(r.uso));
    const t=limparTam(r.tam);Object.keys(t).forEach(k=>{if(t[k]>(tam[k]||0))tam[k]=t[k];});});
  const h=CP.hoje(),ult=[];for(let i=0;i<30;i++){const d=new Date();d.setDate(d.getDate()-i);ult.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"));}
  const zero={w:0,l:0,e:0},hojeV=soma[h]||zero,pior={w:0,l:0,e:0},sem=ult.slice(0,7),media={w:0,l:0,e:0};
  ult.forEach(d=>{const s=soma[d];if(!s)return;["w","l","e"].forEach(k=>{if(s[k]>pior[k])pior[k]=s[k];});});
  sem.forEach(d=>{const s=soma[d];if(s)["w","l","e"].forEach(k=>{media[k]+=s[k]/7;});});
  const pct=(v,l)=>Math.round(v/l*1000)/10,nivel=p=>p>=85?"vermelho":p>=60?"ambar":"ok";
  const itens=[{k:"w",nome:"Intermediário (Cloudflare)",un:"pedidos por dia",lim:LIM_USO.w},{k:"l",nome:"Firestore — leituras",un:"leituras por dia",lim:LIM_USO.l},{k:"e",nome:"Firestore — gravações",un:"gravações por dia",lim:LIM_USO.e}]
    .map(x=>{const hj=hojeV[x.k],pi=pior[x.k],me=Math.round(media[x.k]);return Object.assign(x,{hoje:hj,pior:pi,media:me,mes:me*30,pctHoje:pct(hj,x.lim),pctPior:pct(pi,x.lim),pctMedia:pct(me,x.lim),nivel:nivel(pct(hj,x.lim)),nivelPior:nivel(pct(pi,x.lim))});});
  const docs=Object.keys(tam).sort().map(k=>({nome:k,bytes:tam[k],pct:pct(tam[k],LIM_USO.doc),nivel:nivel(pct(tam[k],LIM_USO.doc))}));
  const maxPct=Math.max(0,...itens.map(x=>Math.max(x.pctHoje,x.pctPior)),...docs.map(x=>x.pct));
  return{itens,docs,aparelhos,maxPct,nivel:nivel(maxPct),limDoc:LIM_USO.doc};};
// publica os números deste aparelho no registro ap-<id> (no máximo a cada 30 min; só existe depois que a pessoa escolhe um nome)
CP.publicarUso=function(forcar){try{const eu=CP.eu(),id="ap-"+eu.id;if(!CP.nomeDefinido()||!CP.ID_OK.test(id))return false;
  const ex=CP.por("config",id);if(!ex)return false;
  if(!forcar&&Date.now()-(+ex.usoEm||0)<1800000)return false;
  const u=CP.usoLocal();if(CP.estavel(ex.uso||{})===CP.estavel(u.dias)&&CP.estavel(ex.tam||{})===CP.estavel(u.tam))return false;
  ex.uso=u.dias;ex.tam=u.tam;ex.usoEm=Date.now();CP.salvarReg("config",ex);CP.gravar();return true;}catch(e){return false;}};
// envoltório de window.fetch: só CONTA e repassa TUDO exatamente como veio (argumentos, this e o retorno). Se a contagem falhar
// (qualquer erro), é ignorada; o pedido segue como se o contador não existisse.
function instalarContador(){try{if(typeof window==="undefined"||typeof window.fetch!=="function"||window.fetch.__uso)return;
  const orig=window.fetch;
  const f=function(){try{CP.contarPedido(arguments[0],arguments[1]);}catch(e){}return orig.apply(this,arguments);};
  f.__uso=true;window.fetch=f;}catch(e){}}
instalarContador();

const LOG=KEY+"__compras_log";
CP.registrar=function(ev){try{const l=JSON.parse(localStorage.getItem(LOG)||"[]");l.push({t:Date.now(),ev:String(ev).slice(0,200)});localStorage.setItem(LOG,JSON.stringify(l.slice(-40)));}catch(e){}};
