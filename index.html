  ${linhas.map(linhaTab).join("")}
  <tr style="border-top:2px solid var(--border)"><td><b>Total confirmado</b></td><td></td><td class="n"><b>${fmt(orcRealizados)}</b></td><td class="n"><b>${fmt(realTot)}</b></td><td class="n ${difTot>0.005?'rose':'teal'}"><b>${difTot>=0?"+":""}${fmt(difTot)}</b></td><td></td><td></td></tr></table>
  <p class="note">💡 As contas que mais estouram são candidatas a trocar o <b>método de estimativa</b> (aba Editar dados, coluna "Estimar por"). Se a água sempre estoura a mediana, experimente "Maior recente" para orçar com folga.</p></div>`;
}

// ============ DÍVIDAS: quitação antecipada + avalanche + juros ============
function setDescQuit(n,v){const cfg=state.parcelas&&state.parcelas[n];if(!cfg)return;cfg.descQuit=Math.max(0,Math.min(100,+v||0));save();render();}
function setQuitN(n,v){const cfg=state.parcelas&&state.parcelas[n];if(!cfg)return;cfg.quitN=Math.max(0,+v||0);save();render();}
// juros pagos num mês (todas as parceladas): valor lançado/pago − parcela original
function jurosNoMes(ym){const m=meses().find(x=>x.ym===ym);if(!m)return 0;let t=0;
  Object.keys(state.parcelas||{}).forEach(n=>{const cfg=state.parcelas[n];if(!cfg||!(+cfg.valorOrig>0))return;
    const v=+m.contas[n]||0;if(!v)return;
    const pago=(m.pagoReal&&+m.pagoReal[n]>0)?+m.pagoReal[n]:v;
    t+=Math.max(0,pago-+cfg.valorOrig);});
  return t;}
function vDividas(){
  const ymRef=meses()[meses().length-1].ym;
  const ativas=Object.keys(state.parcelas||{}).map(n=>({n,cfg:state.parcelas[n],pi:parcelaInfo(n,ymRef)}))
    .filter(x=>x.pi&&!x.pi.quitada);
  if(!ativas.length)return '<div class="card"><p class="note">Nenhum parcelamento configurado. Marque contas como parceladas no ⏳ da aba Editar dados.</p></div>';
  // avalanche: custo extra mensal por R$ devido
  const rank=ativas.map(x=>{
    const por=(+x.cfg.multa||0)+(+x.cfg.diasTipico||0)*(+x.cfg.moraDia||0);
    const atrasando=!!x.cfg.atrasoDesde&&(!x.cfg.regularizaEm||x.cfg.regularizaEm>ymRef);
    const custoMes=atrasando?por:0;
    const taxa=x.pi.valor>0?custoMes/x.pi.valor*100:0;
    return{...x,por,atrasando,custoMes,taxa};})
    .sort((a,b)=>(b.taxa-a.taxa)||(a.pi.restante-b.pi.restante));
  return `
  <div class="card"><h3>🎯 Quitação antecipada — pagar parcelas de trás para frente</h3>
  <p class="note" style="margin-top:2px">Pela lei (CDC art. 52 §2º), quitar antecipadamente dá direito a <b>redução proporcional dos juros</b>. O % exato quem informa é o banco — ligue, pergunte "quanto fica para quitar N parcelas hoje?" e coloque o desconto aqui. Em renegociações com bancos e cartões, o desconto costuma ser bem maior.</p>
  ${ativas.map(x=>{const nn=jsAttr(x.n);
    const d=+x.cfg.descQuit||0;const N=Math.max(0,Math.min(+x.cfg.quitN||0,x.pi.faltam));
    const face=N*x.pi.valor;const hoje=face*(1-d/100);const descR=face-hoje;
    const rk=rank.find(r=>r.n===x.n);
    const jurosEvit=(rk&&rk.atrasando)?N*rk.por:0;
    const fimNovo=N>0?ymAdd(x.pi.fim,-N):x.pi.fim;
    return `<div style="margin-top:10px;padding:10px;border:1px solid var(--border);border-radius:10px">
    <div class="flexbet"><b>${esc(x.n)}${x.pi.antes?` <span class="pill" style="background:#e0e7ff;color:#4338ca;font-size:10px">começa ${lbl(x.pi.inicio)}</span>`:''}</b>
      <span class="row" style="gap:6px"><span class="note" style="margin:0">${(()=>{const pa=pagoAcumulado(x.n,ymRef);return pa&&pa.pg?"já pagou <b>"+fmt(pa.total)+"</b> ("+pa.pg+" parc.) · ":"";})()}faltam ${x.pi.faltam} × ${fmt(x.pi.valor)} · termina ${lbl(x.pi.fim)}</span>
      <button class="btn danger" style="padding:2px 8px;font-size:11px" title="Remove a configuração de parcelamento (a conta e os valores dos meses ficam)" onclick="if(confirm('Remover ${jsAttr(x.n)} da lista de dívidas? (a configuração de parcelamento será apagada; os valores lançados nos meses não mudam)'))setParcela('${nn}',null,0)">✕ remover</button></span></div>
    <div class="row" style="margin-top:6px">
      <label style="font-size:12px">Quitar as últimas <input type="number" min="0" max="${x.pi.faltam}" value="${N||''}" placeholder="N" style="width:60px" onchange="setQuitN('${nn}',+this.value)"> parcelas</label>
      <label style="font-size:12px">com desconto de <input type="number" min="0" max="100" step="0.1" value="${d||''}" placeholder="%" style="width:65px" onchange="setDescQuit('${nn}',+this.value)"> %</label>
    </div>
    ${N>0?`<table style="font-size:12px;margin-top:6px;max-width:460px">
      <tr><td>Valor de face (${N} × ${fmt(x.pi.valor)})</td><td class="n">${fmt(face)}</td></tr>
      <tr><td><b>Pago hoje com ${d}% de desconto</b></td><td class="n"><b>${fmt(hoje)}</b></td></tr>
      <tr><td>Desconto ganho</td><td class="n" style="color:#0d9488">−${fmt(descR)}</td></tr>
      ${jurosEvit>0?`<tr><td>Juros de atraso evitados (~${fmt(rk.por)}/parcela)</td><td class="n" style="color:#0d9488">−${fmt(jurosEvit)}</td></tr>`:''}
      <tr style="border-top:1px solid var(--border)"><td style="padding-top:5px"><b>💰 Economia total</b></td><td class="n" style="padding-top:5px;color:#0d9488"><b>${fmt(descR+jurosEvit)}</b></td></tr>
      <tr><td>Contrato encurta para</td><td class="n"><b>${lbl(fimNovo)}</b> (${N} mês(es) antes)</td></tr>
    </table>`:'<p class="note" style="margin-top:4px">Informe quantas parcelas quitar para simular.</p>'}
    </div>`;}).join("")}</div>

  <div class="card"><h3>🏔️ Ordem de quitação (avalanche) — qual matar primeiro</h3>
  <table><tr><th>#</th><th>Dívida</th><th class="n">Já pagou</th><th class="n">Saldo restante</th><th class="n">Custo extra/mês</th><th class="n">Custo por R$ devido</th><th>Acaba em</th></tr>
  ${rank.map((x,i)=>`<tr><td><b>${i+1}º</b></td><td>${esc(x.n)}${x.atrasando?' <span class="pill rose" style="font-size:10px">atrasando</span>':''}</td>
    <td class="n" style="color:#0f766e">${(()=>{const pa=pagoAcumulado(x.n,ymRef);return pa&&pa.pg?fmt(pa.total):"—";})()}</td>
    <td class="n">${fmt(x.pi.restante)}</td>
    <td class="n" style="color:${x.custoMes>0?'#be123c':'var(--mut)'}">${x.custoMes>0?"+"+fmt(x.custoMes):"—"}</td>
    <td class="n">${x.taxa>0?x.taxa.toFixed(2)+"%/mês":"—"}</td><td>${lbl(x.pi.fim)}</td></tr>`).join("")}</table>
  <p class="note">Sobrou dinheiro? Amortize na ordem acima: primeiro a dívida com maior <b>custo por real devido</b> (juros de atraso ativos pesam mais). Empate = menor saldo primeiro (quitar rápido libera fluxo mensal). Sem custo configurado, a ordem vira "menor saldo primeiro".</p></div>

  <div class="card"><h3>📉 Juros/multa pagos mês a mês</h3><div class="chartbox"><canvas id="cJurosMes"></canvas></div>
  <p class="note">Soma, em cada mês registrado, do que foi pago acima da parcela original em todas as dívidas parceladas. A missão é ver essas barras irem a zero.</p></div>`;
}

// ===== METAS DE CURTO PRAZO + ALOCADOR =====
function addMetaCurto(){const nome=prompt("Nome da meta (ex.: Reserva mudança, Natal):");if(!nome)return;
  state.metasCurto.push({id:uid(),nome,alvo:1000,prazo:ymAdd(meses()[meses().length-1].ym,3),guardado:0});save();render();}
function delMetaCurto(id){
  const mt=state.metasCurto.find(x=>x.id===id);
  if(mt&&!confirm('Excluir a meta "'+mt.nome+'"'+(mt.guardado>0?" (já tinha "+fmt(mt.guardado)+" guardado)":"")+"?"))return;
  marcarApagado(id);state.metasCurto=state.metasCurto.filter(x=>x.id!==id);save();render();
}
function setAloc(k,v){state.aloc.itens[k]=Math.max(0,+v||0);save();render();}
function addAporte(){
  const ym=document.getElementById("apMes").value;
  const v=+document.getElementById("apVal").value||0;
  const nota=document.getElementById("apNota").value.trim()||"Aporte";
  if(!ym||!v){alert("Escolha o mês e o valor do aporte.");return;}
  state.aportes.push({id:uid(),ym,valor:Math.round(v*100)/100,nota,aplicado:false});
  save();render();
}
function delAporte(id){
  const a=state.aportes.find(x=>x.id===id);if(!a)return;
  if(a.aplicado){
    const m=state.meses.find(x=>x.ym===a.ym);
    if(m&&confirm("Este aporte já foi somado ao Extra de "+lbl(a.ym)+". Remover também "+fmt(a.valor)+" do Extra do mês?"))
      m.extra=Math.round(Math.max(0,(+m.extra||0)-a.valor)*100)/100;
  }
  marcarApagado(id);state.aportes=state.aportes.filter(x=>x.id!==id);save();render();
}
// aplica aportes pendentes de um mês específico (chamado ao criar mês novo)
function aplicarAportesDoMes(ym){
  const m=state.meses.find(x=>x.ym===ym);if(!m)return[];
  const pend=state.aportes.filter(a=>!a.aplicado&&a.ym===ym);
  pend.forEach(a=>{m.extra=Math.round(((+m.extra||0)+a.valor)*100)/100;a.aplicado=true;});
  return pend;
}
function aplicarAloc(){
  let n=0;state.metasCurto.forEach(mt=>{const v=+state.aloc.itens["meta:"+mt.id]||0;
    if(v>0){mt.guardado=Math.round((mt.guardado+v)*100)/100;state.aloc.itens["meta:"+mt.id]=0;n++;}});
  // aportes: meses existentes recebem no Extra agora; futuros ficam programados
  let ap=0,prog=0;
  state.aportes.filter(a=>!a.aplicado).forEach(a=>{
    const m=state.meses.find(x=>x.ym===a.ym);
    if(m){m.extra=Math.round(((+m.extra||0)+a.valor)*100)/100;a.aplicado=true;ap++;}
    else prog++;
  });
  Object.keys(state.aloc.itens).forEach(k=>{if(!k.startsWith("meta:"))state.aloc.itens[k]=0;});state.aloc.montante=0;
  save();render();
  const partes=[];
  if(n)partes.push(n+" meta(s) receberam o valor");
  if(ap)partes.push(ap+" aporte(s) somados ao Extra dos meses");
  if(prog)partes.push(prog+" aporte(s) programado(s) — entram sozinhos quando você criar o mês");
  alert(partes.length?("Aplicado! "+partes.join(" · ")+"."):"Nada alocado para aplicar. Preencha metas ou aportes por mês.");
}

// ============ CATEGORIAS (lista única: contas, gastos avulsos, itens de fatura, viagem) ============
// Quanto foi para cada categoria num conjunto de meses — tudo junto: contas (com itens de fatura
// detalhados), gastos avulsos do mês e gastos de viagem. "Renda extra" não entra (é entrada).
function gastoPorCategoria(yms){
  const o={},add=(c,v)=>{if(!(+v))return;c=c||"Outros";o[c]=r2((o[c]||0)+(+v));};
  meses().filter(m=>yms.includes(m.ym)).forEach(m=>{const pc=porCat(m);Object.entries(pc).forEach(([c,v])=>add(c,v));});
  yms.forEach(ym=>(state.movs[ym]||[]).filter(x=>x.tipo!=="renda"&&!x._ferias).forEach(x=>add(x.cat,x.valor)));
  (state.ferias||[]).forEach(f=>((f.viagem&&f.viagem.gastos)||[]).forEach(g=>{if(yms.includes((g.data||"").slice(0,7))&&+g.valor>0)add(g.cat,g.valor);}));
  return o;
}
function usoCategoria(c){
  let contas=0,movs=0,viagem=0,fatura=0;
  allContas().forEach(n=>{if(catOf(n)===c)contas++;});
  Object.values(state.movs||{}).forEach(a=>(a||[]).forEach(x=>{if(x.cat===c)movs++;}));
  (state.ferias||[]).forEach(f=>((f.viagem&&f.viagem.gastos)||[]).forEach(g=>{if(g.cat===c)viagem++;}));
  meses().forEach(m=>Object.values(m.itensFatura||{}).forEach(a=>(a||[]).forEach(it=>{if(it.cat===c)fatura++;})));
  return{contas,movs,viagem,fatura,total:contas+movs+viagem+fatura};
}
// renomear (ou juntar, se o nome novo já existe) propaga para tudo que guarda o nome da categoria
function renomearCategoria(de,para){
  if(!para||para===de)return;

  Object.keys(state.catConta||{}).forEach(n=>{state.catConta[n]=troca(state.catConta[n]);});
  allContas().forEach(n=>{if(!state.catConta[n]&&CAT[n]===de){state.catConta[n]=para;}});
  Object.values(state.movs||{}).forEach(a=>(a||[]).forEach(x=>{x.cat=troca(x.cat);}));
  (state.ferias||[]).forEach(f=>((f.viagem&&f.viagem.gastos)||[]).forEach(g=>{g.cat=troca(g.cat);}));
  meses().forEach(m=>Object.values(m.itensFatura||{}).forEach(a=>(a||[]).forEach(it=>{it.cat=troca(it.cat);})));
  Object.keys(state.catsAprendidas||{}).forEach(k=>{state.catsAprendidas[k]=troca(state.catsAprendidas[k]);});
  if(state.metasCat&&de in state.metasCat){state.metasCat[para]=(+state.metasCat[para]||0)+(+state.metasCat[de]||0);delete state.metasCat[de];}
  const cor=corCategoria(de);if(!state.coresCat)state.coresCat={};if(!state.coresCat[para])state.coresCat[para]=cor;delete state.coresCat[de];

  if(state.catContaCores)delete state.catContaCores[de];if(state.catsUserCores)delete state.catsUserCores[de];

  state.catsOcultas=state.catsOcultas.filter(x=>x!==para);
}

// ---- leitura de arquivos de banco ----
function decodificarTexto(buf){ // bancos brasileiros às vezes mandam em Windows-1252
  try{return new TextDecoder("utf-8",{fatal:true}).decode(buf);}catch(e){return new TextDecoder("windows-1252").decode(buf);}
}
function numBR(t){t=String(t||"").trim().replace(/R\$\s?/i,"").replace(/\s/g,"");if(!t)return NaN;
  const neg=/^-|^\(.*\)$|-$/.test(t);t=t.replace(/[()\-+]/g,"");
  if(/,\d{1,2}$/.test(t))t=t.replace(/\./g,"").replace(",",".");else t=t.replace(/,/g,"");
  const v=parseFloat(t);return neg?-v:v;}
function dataBR(t){t=String(t||"").trim();let m;
  if((m=t.match(/^(\d{4})-(\d{2})-(\d{2})/)))return m[1]+"-"+m[2]+"-"+m[3];
  if((m=t.match(/^(\d{2})\/(\d{2})\/(\d{4})/)))return m[3]+"-"+m[2]+"-"+m[1];
  if((m=t.match(/^(\d{2})\/(\d{2})\/(\d{2})$/)))return "20"+m[3]+"-"+m[2]+"-"+m[1];
  if((m=t.match(/^(\d{4})(\d{2})(\d{2})/)))return m[1]+"-"+m[2]+"-"+m[3];
  return null;}
function lerOFX(txt){
  const out=[];const blocos=txt.split(/<STMTTRN>/i).slice(1);
  const tag=(b,n)=>{const m=b.match(new RegExp("<"+n+">([^<\\r\\n]*)","i"));return m?m[1].trim():"";};
  blocos.forEach(b=>{const valor=numBR(tag(b,"TRNAMT").replace(",","."));const data=dataBR(tag(b,"DTPOSTED"));
    const desc=tag(b,"MEMO")||tag(b,"NAME")||"(sem descrição)";if(!data||!isFinite(valor))return;
    out.push({data,desc,valor,fitid:tag(b,"FITID")});});
  return{linhas:out,cartao:/<CCSTMTRS>/i.test(txt)};
}
function linhasCSV(txt){
  const ls=txt.replace(/^\uFEFF/,"").split(/\r?\n/).filter(l=>l.trim());if(!ls.length)return{cab:[],rows:[]};
  const sep=(ls[0].match(/;/g)||[]).length>(ls[0].match(/,/g)||[]).length?";":",";
  const parse=l=>{const o=[];let cur="",q=false;for(let i=0;i<l.length;i++){const ch=l[i];
    if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(ch===sep&&!q){o.push(cur);cur="";}else cur+=ch;}o.push(cur);return o.map(x=>x.trim());};
  const rows=ls.map(parse);return{cab:rows[0],rows:rows.slice(1)};
}
function lerCSV(txt){
  const{cab,rows}=linhasCSV(txt);if(!rows.length)return{linhas:[],cartao:false};
  const h=cab.map(normTxt);
  const achar=(rx,teste)=>{let i=h.findIndex(x=>rx.test(x));if(i<0&&teste)i=cab.findIndex((_,j)=>rows.slice(0,5).every(r=>teste(r[j])));return i;};
  const iData=achar(/^(data|date|dt)/,v=>!!dataBR(v));
  const iValor=achar(/^(valor|amount|vlr|quantia)/,v=>isFinite(numBR(v)));
  let iDesc=achar(/(descri|title|historico|estabelecimento|lancamento|detalhe|memo)/);
  if(iDesc<0)iDesc=cab.findIndex((_,j)=>j!==iData&&j!==iValor);
  if(iData<0||iValor<0)throw new Error("Não reconheci as colunas de data e valor deste CSV.");
  const linhas=rows.map(r=>({data:dataBR(r[iData]),desc:(r[iDesc]||"(sem descrição)").trim(),valor:numBR(r[iValor]),fitid:""})).filter(x=>x.data&&isFinite(x.valor));
  // fatura de cartão (formato "date,title,amount" de bancos digitais): compras vêm POSITIVAS
  const cartao=h.includes("title")||(linhas.length>0&&linhas.filter(x=>x.valor>0).length/linhas.length>0.7);
  return{linhas,cartao};
}
function hashTxt(t){let h=5381;for(const ch of String(t))h=((h*33)^ch.charCodeAt(0))>>>0;return h.toString(36);}

function pareceTransferencia(desc){const d=normTxt(desc);return /pagamento (de )?fatura|pgto fatura|pagamento recebido|transferencia (entre|mesma titularidade)|aplicacao|resgate/.test(d);}
async function lerExtrato(inp){
  const arq=inp.files[0];if(!arq)return;
  try{
    const txt=decodificarTexto(await arq.arrayBuffer());
    const r=/<OFX>|OFXHEADER/i.test(txt)?lerOFX(txt):lerCSV(txt);
    if(!r.linhas.length)throw new Error("Nenhum lançamento encontrado no arquivo.");
    const ids=idsExistentes();
    const vistos={};
    extratoPrev={arquivo:arq.name,cartao:r.cartao,destino:"mes",contaFatura:"",linhas:r.linhas.map(x=>{
      const gasto=r.cartao?x.valor>0:x.valor<0,valor=Math.abs(r2(x.valor));
      const base=[x.fitid||"",x.data,valor,x.desc].join("|"),oc=vistos[base]=(vistos[base]||0)+1;
      const id="ext_"+hashTxt(base+(oc>1?"#"+oc:""));
      const conta=gasto?pareceConta(x.desc):null,dup=ids.has(id),transf=pareceTransferencia(x.desc);
      const motivo=dup?"já importado":conta?"parece a conta \u201c"+conta+"\u201d":transf?"transferência/pagamento de fatura":!gasto?"recebimento (o salário já está na renda)":"";

    const detal=allContas().filter(n=>ehDetalhavel(n));if(r.cartao&&detal.length){extratoPrev.destino="fatura";extratoPrev.contaFatura=detal[0];}

  render();
}

// ---- lembretes de vencimento (.ics para Google Agenda / Calendário do iPhone) ----
function icsData(d){return d.replace(/-/g,"");}
function icsTexto(t){return String(t).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");}
function gerarICS(comValores){
  const hoje=hojeISO(),ultimo=meses()[meses().length-1],agora=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const linhas=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Minhas Financas//Lembretes//PT-BR","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Contas a pagar"];
  const contas=allContas().filter(n=>vencDe(n));
  contas.forEach(n=>{
    const dia=vencDe(n),ym=hoje.slice(0,7);
    const diaEm=y=>y+"-"+String(Math.min(dia,new Date(+y.slice(0,4),+y.slice(5),0).getDate())).padStart(2,"0");
    let ini=diaEm(ym);if(ini<hoje)ini=diaEm(ymAdd(ym,1));
    const fim=new Date(ini+"T00:00:00");fim.setDate(fim.getDate()+1);
    const p=parcelaInfo&&parcelaInfo(n,ym);
    const v=ultimo&&+ultimo.contas[n]?" — ~"+fmt(+ultimo.contas[n]):"";
    linhas.push("BEGIN:VEVENT","UID:conta-"+hashTxt(n)+"@minhas-financas","DTSTAMP:"+agora,
      "DTSTART;VALUE=DATE:"+icsData(ini),"DTEND;VALUE=DATE:"+icsData(isoData(fim)),
      "RRULE:FREQ=MONTHLY;"+(dia>28?"BYMONTHDAY="+Array.from({length:dia-27},(_,i)=>28+i).join(",")+";BYSETPOS=-1":"BYMONTHDAY="+dia)+(p&&p.fim&&!p.quitada?";UNTIL="+icsData(p.fim+"-28"):""),
      "SUMMARY:"+icsTexto("Pagar "+n+(comValores?v:"")),
      "DESCRIPTION:"+icsTexto("Vencimento todo dia "+dia+(dia>28?" (ou o último dia, nos meses mais curtos)":"")+(p&&!p.quitada&&!p.antes?" · parcela até "+lbl(p.fim):"")+". Marque como paga na aba Status do mês."),
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsTexto("Vence amanhã: "+n),"TRIGGER:-PT15H","END:VALARM","END:VEVENT");
  });
  linhas.push("END:VCALENDAR");
  return{texto:linhas.join("\r\n")+"\r\n",n:contas.length};
}
function baixarICS(){
  const comValores=!!(document.getElementById("icsValores")||{}).checked;
  const r=gerarICS(comValores);if(!r.n){alert("Nenhuma conta tem dia de vencimento. Defina na aba Editar dados (coluna \"Vence dia\").");return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([r.texto],{type:"text/calendar"}));a.download="lembretes-contas.ics";a.click();
}

// genérico/editável — nenhum cálculo assume 30 dias fixos.
function feriasGet(id){return(state.ferias||[]).find(x=>x.id===id);}
function addDiasISO(iso,k){const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+k);return isoData(d);}
function ymOfIso(iso){return iso.slice(0,7);}
function fimFerias(f){return addDiasISO(f.inicio,Math.max(1,+f.diasGozo||1)-1);}
function mesesAfetadosFerias(f){
  if(!f.inicio)return[];
  const ymA=ymOfIso(f.inicio),ymB=ymOfIso(fimFerias(f));
  const out=[];let cur=ymA;
  while(true){out.push(cur);if(cur>=ymB||out.length>36)break;cur=ymAdd(cur,1);}
  return out;
}
function diasFeriasNoMes(f,ym){
  const diasNoMes=new Date(+ym.slice(0,4),+ym.slice(5),0).getDate();
  const iniMes=ym+"-01",fimMes=ym+"-"+String(diasNoMes).padStart(2,"0");
  const ini=f.inicio>iniMes?f.inicio:iniMes,fim=fimFerias(f)<fimMes?fimFerias(f):fimMes;
  if(ini>fim)return 0;
  return Math.round((new Date(fim+"T00:00:00")-new Date(ini+"T00:00:00"))/86400000)+1;
}
function brutoFerias(f){const ov=f.override||{};return ov.bruto!=null?+ov.bruto:(+state.folha.bruto||0);}
function calcFerias(f){
  const ov=f.override||{};
  const bd=brutoFerias(f)/30;
  const diasVendidos=clamp(+f.venderDias||0,0,10);
  const diasGozados=Math.max(0,+f.diasGozo||0);
  const baseFerias=r2(bd*diasGozados);
  const terco=r2(baseFerias/3);
  const brutoFeriasTot=r2(baseFerias+terco); // base de INSS/IRRF das férias, calculada separada do salário
  const abonoBase=r2(bd*diasVendidos);
  const abonoAuto=r2(abonoBase+abonoBase/3); // abono pecuniário + 1/3, isento de INSS/IRRF
  const abono=ov.abono!=null?+ov.abono:abonoAuto;
  const inssAuto=r2(calcINSS(brutoFeriasTot));
  const inss=ov.inss!=null?+ov.inss:inssAuto;
  const dep=+state.folha.dep||0;
  const baseIR=Math.max(brutoFeriasTot-inss-dep*(state.folhaCfg.depDed||0),0);
  const irrfAuto=r2(calcIRRF(baseIR,brutoFeriasTot));
  const irrf=ov.irrf!=null?+ov.irrf:irrfAuto;
  const adto13Auto=f.adiantar13?r2(brutoFerias(f)/2):0;
  const adto13=f.adiantar13?(ov.adto13!=null?+ov.adto13:adto13Auto):0;
  const liquidoFerias=r2(brutoFeriasTot-inss-irrf+abono);
  const totalReceber=r2(liquidoFerias+adto13);
  const mesPagamentoAuto=f.inicio?ymOfIso(addDiasISO(f.inicio,-2)):mesAtualYm();
  const mesPagamento=ov.mesPagamento||mesPagamentoAuto;
  return{bd,diasVendidos,diasGozados,baseFerias,terco,brutoFeriasTot,abonoBase,abono,inss,irrf,baseIR,adto13,
    liquidoFerias,totalReceber,mesPagamento,
    autoAbono:ov.abono==null,autoInss:ov.inss==null,autoIrrf:ov.irrf==null,autoAdto13:ov.adto13==null,autoMesPg:!ov.mesPagamento,
    abonoAuto,inssAuto,irrfAuto,adto13Auto,mesPagamentoAuto};
}
// A folha paga com defasagem: o salário que cai no mês M é o trabalhado no mês M-defasagem
// (confirmado com holerite real — competência Setembro/26, pago 01/10/26 = defasagem de 1 mês).
// Por isso o "buraco" das férias não aparece no mês em que elas começam, e sim ~1 mês depois.
function defasagemFerias(f){return f.defasagemPagto!=null?+f.defasagemPagto:1;}
// Salário líquido de um mês SEM férias. Vem da Folha (mais confiável que o último mês lançado,
// que pode já ter sido reduzido ao aplicar as férias); override manual em f.override.salarioBase.
function salarioNormalFerias(f){
  const ov=f.override||{};
  if(ov.salarioBase!=null)return +ov.salarioBase;
  if(+state.folha.bruto>0)return r2(folhaCalc().liq);
  return mesesA().length?mesesA()[mesesA().length-1].salario:0;
}
// Saldo de salário de um mês civil que teve dias de férias, calculado como a folha faz:
// bruto/30 × dias trabalhados (mês comercial de 30 dias), INSS só do que falta para o teto
// (as férias daquele mês já consumiram parte dele), IRRF próprio (com o redutor da Lei 15.270),
// e os benefícios/descontos fixos da Folha (creche, VA, seguro, PGBL, outros) cheios.
function saldoSalarioFerias(f,civilRef){
  const F=state.folha,C=state.folhaCfg,c=calcFerias(f);
  const diasFer=diasFeriasNoMes(f,civilRef);
  const diasNoMesCivil=new Date(+civilRef.slice(0,4),+civilRef.slice(5),0).getDate();
  const diasTrab=diasFer>=diasNoMesCivil?0:Math.max(0,30-diasFer);
  const bruto=brutoFerias(f);
  const saldo=r2(bruto/30*diasTrab);
  const prop=c.diasGozados>0?diasFer/c.diasGozados:0;
  const feriasNoMes=r2(c.brutoFeriasTot*prop);   // parte das férias (+1/3) que pertence a esse mês
  const inssFeriasNoMes=r2(c.inss*prop);         // INSS dessa parte, já descontado no recibo de férias
  const inss=r2(Math.max(0,calcINSS(saldo+feriasNoMes)-inssFeriasNoMes));
  const pgbl=+F.pgbl||0,outros=(F.outros||[]).reduce((s,o)=>s+(+o.valor||0),0);
  const baseIR=Math.max(saldo-inss-pgbl-(+F.dep||0)*C.depDed,0);
  const irrf=r2(calcIRRF(baseIR,saldo));
  const creche=+F.creche||0,va=+F.va||0,seguro=+F.seguro||0;
  const liq=r2(saldo+creche-inss-irrf-va-seguro-pgbl-outros);
  return{diasFer,diasTrab,saldo,valorDia:r2(bruto/30),creche,inss,irrf,va,seguro,pgbl,outros,liq};
}
// ---- 13º salário (Lei 4.090/1962 e Lei 4.749/1965) ----
// 1ª parcela: até 30/11, 50% do bruto (avos), SEM desconto de INSS/IRRF.
// 2ª parcela: até 20/12, bruto integral (avos) − INSS − IRRF (tributação exclusiva, mesma tabela
// do salário mensal, calculada sobre o 13º integral) − a 1ª parcela já paga.
// "avos" é genérico/editável (12 = ano completo; menos se admitido/afastado durante o ano).
function calc13(f){
  const tz=f.treze||{};const ov=tz.override||{};
  const avos=clamp(tz.avos!=null?+tz.avos:12,0,12);
  const brutoTotal=r2(brutoFerias(f)*avos/12);
  const pct1=clamp(tz.pctParc1!=null?+tz.pctParc1:50,0,100);
  const parc1Auto=r2(brutoTotal*pct1/100);
  const adiantou=!!f.adiantar13;
  const parc1=adiantou?r2(calcFerias(f).adto13):(ov.parc1!=null?+ov.parc1:parc1Auto);
  const inssAuto=r2(calcINSS(brutoTotal));
  const inss=ov.inss!=null?+ov.inss:inssAuto;
  const dep=+state.folha.dep||0;
  const baseIR=Math.max(brutoTotal-inss-dep*(state.folhaCfg.depDed||0),0);
  const irrfAuto=r2(calcIRRF(baseIR));
  const irrf=ov.irrf!=null?+ov.irrf:irrfAuto;
  const parc2=r2(brutoTotal-parc1-inss-irrf);
  const anoRef=f.inicio?+f.inicio.slice(0,4):+hojeISO().slice(0,4);
  const ymParc1=ov.ymParc1||(anoRef+"-11");
  const ymParc2=ov.ymParc2||(anoRef+"-12");
  return{adiantou,avos,brutoTotal,pct1,parc1,parc1Auto,inss,inssAuto,irrf,irrfAuto,baseIR,parc2,ymParc1,ymParc2,
    autoParc1:ov.parc1==null,autoInss:ov.inss==null,autoIrrf:ov.irrf==null,
    autoYmParc1:!ov.ymParc1,autoYmParc2:!ov.ymParc2,total:r2(parc1+parc2)};
}
function setTrezeCampo(id,campo,valor){const f=feriasGet(id);if(!f)return;if(!f.treze)f.treze={};f.treze[campo]=valor;save();render();}
function setTrezeOverride(id,campo,valor){
  if((campo==="ymParc1"||campo==="ymParc2")&&valor!==null&&!ymValido(valor))return;
  const f=feriasGet(id);if(!f)return;if(!f.treze)f.treze={};if(!f.treze.override)f.treze.override={};
  if(valor===null)delete f.treze.override[campo];else f.treze.override[campo]=valor;save();render();
}
// Linha do tempo: o mês em que as férias COMEÇAM + os 2 seguintes (abril → abr/mai/jun).
// Se o recibo de férias cair antes (férias começando dia 1º ou 2), esse mês entra também, antes.
// Cada mês: salário que cai nele (do mês civil anterior, por causa da defasagem — cheio se aquele
// mês não teve férias, saldo de salário se teve), + recibo de férias, + 13º, + extra livre.
function linhaDoTempoFerias(f){
  if(!f.inicio)return[];
  const c=calcFerias(f),c13=calc13(f),defas=defasagemFerias(f),salNormal=salarioNormalFerias(f);
  const extras=f.extrasLinhaTempo||{},ovLinha=f.overrideLinha||{};
  const ymIni=ymOfIso(f.inicio),ymUltFer=ymOfIso(fimFerias(f)),ymFim=[ymAdd(ymIni,2),ymAdd(ymUltFer,defas)].sort().pop();
  const rows=[];
  for(let ym=c.mesPagamento<ymIni?c.mesPagamento:ymIni;ym<=ymFim&&rows.length<6;ym=ymAdd(ym,1)){
    const civilRef=ymAdd(ym,-defas);
    const sal=diasFeriasNoMes(f,civilRef)>0?saldoSalarioFerias(f,civilRef):null;
    const salAuto=sal?sal.liq:salNormal;
    const salLiq=ovLinha[ym]!=null?+ovLinha[ym]:salAuto;
    const ex=extras[ym]||{nome:"",valor:0};
    const pagFerias=ym===c.mesPagamento?c.totalReceber:0;
    let treze13=0,nomeTreze="";
    if(ym===c13.ymParc1&&!c13.adiantou){treze13=c13.parc1;nomeTreze="1ª parcela";}
    else if(ym===c13.ymParc2){treze13=c13.parc2;nomeTreze="2ª parcela";}
    rows.push({ymPag:ym,civilRef,sal,salNormal,salAuto,salReduzido:salLiq,autoSal:ovLinha[ym]==null,
      buraco:r2(Math.max(0,salNormal-salLiq)),pagFerias,treze13,nomeTreze,
      extraNome:ex.nome||"",extraValor:+ex.valor||0,antes:ym<ymIni,
      total:r2(salLiq+pagFerias+treze13+(+ex.valor||0))});
  }
  return rows;
}
function setOverrideLinha(id,ym,v){const f=feriasGet(id);if(!f)return;if(!f.overrideLinha)f.overrideLinha={};if(v===null)delete f.overrideLinha[ym];else f.overrideLinha[ym]=+v;save();render();}
function mesesPagamentoFerias(f){return f.inicio?linhaDoTempoFerias(f).map(r=>r.ymPag):[];}
// ---- Reserva e envelope, do jeito que o usuário pensa ----
// O salário de cada mês paga as contas daquele mês. O recibo de férias fica separado: dele sai
// o que vai FALTAR nos meses seguintes (contas − salário reduzido); o resto é o envelope da viagem.
// Gasto previsto de cada mês: manual > contas já lançadas no mês > contas do mês das férias
// (referência: "o que deu em outubro") > média dos últimos 3 meses > 1 salário (sem histórico).
// Contas previstas. O mês das férias usa as próprias contas se já lançadas. Os meses seguintes
// seguem o método escolhido (f.metodoGasto): "ultimo" = contas do último mês lançado até o mês das
// férias; "media3" = média dos 3 últimos meses com contas até ali; "manual" = f.gastoManual.
// Valor digitado direto num mês (f.gastoLinha[ym]) sempre vence.
const METODOS_GASTO={ultimo:"Último mês",media3:"Média dos 3 últimos meses",manual:"Digitar um valor"};
function mesesComContasAte(ym){return meses().filter(x=>x.ym<=ym&&totalContas(x)>0);}
function gastoPorMetodo(f){
  const ymIni=f.inicio?ymOfIso(f.inicio):mesAtualYm(),mt=f.metodoGasto||"ultimo";
  if(mt==="manual")return{valor:+f.gastoManual||0,fonte:"valor digitado"};
  const ms=mesesComContasAte(ymIni);
  if(!ms.length)return{valor:salarioNormalFerias(f),fonte:"sem contas lançadas: 1 salário"};
  if(mt==="media3"){const u=ms.slice(-3);return{valor:r2(u.reduce((s,x)=>s+totalContas(x),0)/u.length),fonte:"média de "+u.map(x=>lbl(x.ym)).join(", ")};}
  const u=ms[ms.length-1];return{valor:r2(totalContas(u)),fonte:"contas de "+lbl(u.ym)};
}
function gastoPrevistoMes(f,ym){
  const ov=(f.gastoLinha||{})[ym];
  if(ov!=null)return{valor:+ov,fonte:"digitado neste mês"};
  const ymIni=f.inicio?ymOfIso(f.inicio):null;
  if(ym<=ymIni){const m=meses().find(x=>x.ym===ym);if(m&&totalContas(m)>0)return{valor:r2(totalContas(m)),fonte:"contas de "+lbl(ym)};}
  return gastoPorMetodo(f);
}
// 13º fora da conta por padrão: a 1ª parcela cai no fim de novembro, depois das contas.
function caixaFerias(f){
  const rows=linhaDoTempoFerias(f);if(!rows.length)return{rows:[],recibo:0,faltaMesFerias:0,reservaAuto:0,usar13:false};
  const ymIni=ymOfIso(f.inicio),usar13=!!f.usar13Reserva;
  const cx=rows.map(r=>{const g=gastoPrevistoMes(f,r.ymPag);
    const entraSemFerias=r2(r.total-r.pagFerias-(usar13?0:r.treze13)); // salário + extra (+13º se marcado)
    return{...r,entraSemFerias,gasto:g.valor,fonteGasto:g.fonte,saldo:r2(entraSemFerias-g.valor),depois:r.ymPag>ymIni};});
  const recibo=r2(cx.reduce((s,r)=>s+r.pagFerias,0));
  // se o salário do mês das férias não cobrir as contas dele, essa diferença também sai do recibo
  const faltaMesFerias=r2(Math.max(0,-cx.filter(r=>!r.depois).reduce((s,r)=>s+r.saldo,0)));
  let acc=0,need=0;
  cx.filter(r=>r.depois).forEach(r=>{acc=r2(acc+r.saldo);r.acumulado=acc;need=Math.max(need,-acc);});
  return{rows:cx,recibo,faltaMesFerias,reservaAuto:r2(need),usar13};
}
function reservaSugeridaFerias(f){
  return(f.reservaPosFerias&&f.reservaPosFerias.definida!=null)?+f.reservaPosFerias.definida:caixaFerias(f).reservaAuto;
}
function sobraMinFerias(f){return f.usarSobraMin?(+state.sobraAlvo||0):0;}
function envelopeSugeridoFerias(f){
  const cx=caixaFerias(f);
  // sobra mínima da Visão geral só entra se o usuário marcar (f.usarSobraMin), padrão: fora
  return Math.max(0,r2(cx.recibo-cx.faltaMesFerias-reservaSugeridaFerias(f)-sobraMinFerias(f)));
}
function setGastoLinha(id,ym,v){const f=feriasGet(id);if(!f)return;if(!f.gastoLinha)f.gastoLinha={};if(v===null||v==="")delete f.gastoLinha[ym];else f.gastoLinha[ym]=+v;save();render();}
// ---- Datas da VIAGEM (pode ser só parte das férias). Padrão: o período inteiro das férias. ----
// Cada plano tem destino e datas próprios (padrão: as férias inteiras). Sem plano passado,
// vale o plano escolhido (em uso).
function idaViagem(f,p){p=p||planoAtivo(f);return(p&&p.ida)||f.inicio||"";}
function voltaViagem(f,p){p=p||planoAtivo(f);return(p&&p.volta)||(f.inicio?fimFerias(f):"");}
function diasViagem(f,p){const a=idaViagem(f,p),b=voltaViagem(f,p);if(!a||!b||b<a)return 0;return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000)+1;}
function setPlanoData(id,pid,campo,v){if(v&&!dataValida(v))return;setPlanoCampo(id,pid,campo,v||null);}
function envelopeTetoFerias(f){return(f.envelope&&f.envelope.teto!=null)?+f.envelope.teto:envelopeSugeridoFerias(f);}
// gastos lançados contam para a viagem escolhida (cada gasto guarda o plano em que foi lançado)
function gastosDoPlano(f){const p=planoAtivo(f);return((f.viagem&&f.viagem.gastos)||[]).filter(g=>!p||!g.planoId||g.planoId===p.id);}
function envelopeGastoFerias(f){return r2(gastosDoPlano(f).reduce((s,g)=>s+(+g.valor||0),0));}
function envelopeRestoFerias(f){return r2(envelopeTetoFerias(f)-envelopeGastoFerias(f));}
function diasRestantesViagem(f){
  const ini=idaViagem(f),fim=voltaViagem(f);if(!ini||!fim)return 0;const hoje=hojeISO();
  if(hoje<ini)return diasViagem(f);
  if(hoje>fim)return 0;
  return Math.round((new Date(fim+"T00:00:00")-new Date(hoje+"T00:00:00"))/86400000)+1;
}
// ---- inteligência local: estimativa de alimentação/dia a partir do próprio histórico de avulsos ----
function sugestaoAlimentacaoDia(){
  const todos=[];Object.values(state.movs||{}).forEach(arr=>(arr||[]).forEach(x=>{if(x.tipo!=="renda"&&x.cat==="Alimentação fora")todos.push(+x.valor||0);}));
  return todos.length?r2(todos.reduce((s,v)=>s+v,0)/todos.length):60;
}
function contasNaViagem(f){
  const ini=idaViagem(f),fim=voltaViagem(f);if(!ini||!fim)return[];
  const out=[];const yms=[];for(let ym=ymOfIso(ini);ym<=ymOfIso(fim)&&yms.length<4;ym=ymAdd(ym,1))yms.push(ym);
  yms.forEach(ym=>{
    const m=meses().find(x=>x.ym===ym);if(!m)return;
    Object.entries(m.contas).forEach(([n,v])=>{
      if(!(+v>0))return;if(!vencDe(n))return;
      const venc=dataVenc(n,ym);if(!venc)return;
      if(venc>=ini&&venc<=fim)out.push({n,v:+v,venc,ym});
    });
  });
  return out.sort((a,b)=>a.venc.localeCompare(b.venc));
}
// ---- transporte / custo da viagem ----
function custoTrecho(t){
  if(t.modo==="carro"){
    const kmTot=(+t.kmIda||0)*(t.idaEVolta?2:1);
    const comb=(+t.consumoKmL>0)?r2(kmTot/(+t.consumoKmL)*(+t.precoLitro||0)):0;
    return r2(comb+(+t.pedagioIda||0)+(t.idaEVolta?(+t.pedagioVolta||0):0)+(+t.estacionamento||0));
  }
  if(t.modo==="aviao")return r2((+t.qtdAdulto||0)*(+t.valorAdulto||0)+(+t.qtdCrianca||0)*(+t.valorCrianca||0)+(+t.bagagem||0)+(+t.taxaAssento||0)+(+t.transfer||0));
  return r2(+t.valor||0); // ônibus/app/aluguel/outro
}
function noitesHosp(h,f,p){return +h.noites>0?+h.noites:Math.max(0,diasViagem(f,p)-1);}
function custoHospedagem(h,f,p){if(+h.totalManual>0)return r2(+h.totalManual);return r2((+h.diaria||0)*(f?noitesHosp(h,f,p):(+h.noites||0)));}
// Alimentação: nada vem preenchido sozinho. Por pessoa, o valor de cada refeição feita FORA do
// hotel (as que a diária já inclui não contam) + lanches/extras por dia. Planos antigos que tinham
// "R$/pessoa/dia" passam esse valor para "lanches/extras" (o total continua o mesmo).
const REFEICOES=[["cafe","café da manhã"],["almoco","almoço"],["jantar","jantar"]];
function alimentacaoDe(p){const a=p.alimentacao||{};const inc=(p.hospedagem&&p.hospedagem.inclui)||{};
  return{a,inc,extras:a.extras!=null?+a.extras:(p.alimentacaoDiaPorPessoa!=null?+p.alimentacaoDiaPorPessoa:0)};}
function custoAlimentacao(p,f){
  const dias=Math.max(1,diasViagem(f,p)||1),pes=+p.pessoas||1,{a,inc,extras}=alimentacaoDe(p);
  const porDia=REFEICOES.reduce((s,[k])=>s+(inc[k]?0:(+a[k]||0)),0)+extras;
  return r2(porDia*pes*dias);
}
function setRefeicao(id,pid,k,v){const f=feriasGet(id);const p=f&&(f.viagem.planos||[]).find(x=>x.id===pid);if(!p)return;
  if(!p.alimentacao)p.alimentacao={};p.alimentacao[k]=v===""?null:+v;if(k==="extras")delete p.alimentacaoDiaPorPessoa;save();render();}
function setHotelInclui(id,pid,k,v){const f=feriasGet(id);const p=f&&(f.viagem.planos||[]).find(x=>x.id===pid);if(!p)return;
  if(!p.hospedagem.inclui)p.hospedagem.inclui={};p.hospedagem.inclui[k]=!!v;save();render();}
function custoItensPlano(p){return r2((p.itens||[]).reduce((s,i)=>s+(+i.valor||0),0));}
function custoPlano(p,f){
  const trechos=r2((p.trechos||[]).reduce((s,t)=>s+custoTrecho(t),0));
  return r2(trechos+custoHospedagem(p.hospedagem||{},f,p)+custoAlimentacao(p,f)+custoItensPlano(p));
}
function partesPlano(p,f){return{transporte:r2((p.trechos||[]).reduce((s,t)=>s+custoTrecho(t),0)),hospedagem:custoHospedagem(p.hospedagem||{},f,p),alimentacao:custoAlimentacao(p,f),passeios:custoItensPlano(p)};}
// Ritmo do envelope dia a dia: gasto acumulado real × ritmo ideal (teto distribuído igual pelos dias).
// Gasto lançado antes do primeiro dia entra no 1º dia; dias futuros ficam sem valor real.
function ritmoEnvelope(f){
  const p=planoAtivo(f),ini=idaViagem(f),n=diasViagem(f);if(!p||!ini||!n)return null;
  const teto=envelopeTetoFerias(f),hoje=hojeISO(),g=gastosDoPlano(f);
  const dias=[],real=[],ideal=[];let acc=0;
  for(let i=0;i<n;i++){const d=addDiasISO(ini,i);dias.push(d);
    acc=r2(acc+g.filter(x=>(i===0?(x.data||"")<=d:(x.data||"")===d)).reduce((s,x)=>s+(+x.valor||0),0));
    real.push(d<=hoje?acc:null);ideal.push(r2(teto*(i+1)/n));}
  const posteriores=g.filter(x=>(x.data||"")>dias[n-1]).reduce((s,x)=>s+(+x.valor||0),0);
  if(posteriores&&hoje>dias[n-1])real[n-1]=r2(real[n-1]+posteriores);
  return{dias,real,ideal,teto};
}

// ---- Saldo de dias no período aquisitivo (CLT art. 134 e 143) ----
// Até 3 períodos; um com pelo menos 14 dias, os outros com pelo menos 5; venda de até 1/3 do direito.
function saldoAquisitivo(f){
  const grupo=(state.ferias||[]).filter(x=>(x.aquisitivo||"atual")===(f.aquisitivo||"atual"));
  const direito=+f.diasDireito||30;
  const gozados=grupo.reduce((s,x)=>s+(+x.diasGozo||0),0),vendidos=grupo.reduce((s,x)=>s+(+x.venderDias||0),0);
  const restam=direito-gozados-vendidos,av=[];
  if(grupo.length>3)av.push("A CLT permite dividir em no máximo 3 períodos — aqui há "+grupo.length+".");
  if(grupo.length&&Math.max(...grupo.map(x=>+x.diasGozo||0))<14)av.push("Um dos períodos precisa ter pelo menos 14 dias.");
  grupo.filter(x=>(+x.diasGozo||0)>0&&(+x.diasGozo||0)<5).forEach(x=>av.push('"'+esc(x.nome||"Férias")+'" tem '+x.diasGozo+" dias — o mínimo por período é 5."));
  if(vendidos>Math.floor(direito/3))av.push("Dá para vender no máximo "+Math.floor(direito/3)+" dias (1/3 do direito) — estão marcados "+vendidos+".");
  if(restam<0)av.push("Passou "+(-restam)+" dia(s) do direito de "+direito+".");
  return{grupo,direito,gozados,vendidos,restam,avisos:av};
}

// Aplica UMA linha da linha do tempo (índice 0,1,2) ao mês real correspondente:
// reduz o salário (se aquele mês civil de referência teve dias de férias) e/ou soma ao
// Extra (pagamento das férias, só na linha 0, + o extra manual da linha, ex.: 13º).
function aplicarLinhaFerias(id,i){
  const f=feriasGet(id);if(!f)return;
  const r=linhaDoTempoFerias(f)[i];if(!r)return;
  let m=state.meses.find(x=>x.ym===r.ymPag);
  if(!m){if(!confirm("O mês "+lbl(r.ymPag)+" ainda não existe. Criar agora (com as contas do último mês, marcadas como provisórias) e aplicar?"))return;
    m=criarMes(r.ymPag);}
  const reduz=r.buraco>0.005;
  const extraSoma=r2(r.pagFerias+r.treze13+r.extraValor);
  const partes=[];
  if(reduz)partes.push("Salário: "+fmt(m.salario)+" → "+fmt(r.salReduzido)+" (dias de férias no mês de "+lbl(r.civilRef)+")");
  const jaAplicado=+((f.aplicado||{})[r.ymPag]||0);
  const extraNovo=r2((+m.extra||0)-jaAplicado+extraSoma);
  if(extraSoma>0||jaAplicado)partes.push("Extra: "+fmt(m.extra||0)+" → "+fmt(extraNovo)+(jaAplicado?" (troca os "+fmt(jaAplicado)+" aplicados antes)":" (+"+fmt(extraSoma)+")"));
  if(!partes.length){alert("Nada a aplicar nesta linha.");return;}
  if(!confirm("Aplicar em "+lbl(r.ymPag)+"?\n\n"+partes.join("\n")))return;
  if(reduz){if(m._salarioPreFerias==null)m._salarioPreFerias=m.salario;m.salario=r.salReduzido;}
  if(extraSoma>0||jaAplicado){m.extra=extraNovo;if(!f.aplicado)f.aplicado={};f.aplicado[r.ymPag]=extraSoma;}
  if(i===0)f._aplicadoMes=r.ymPag;
  save();alert("Aplicado em "+lbl(r.ymPag)+".");render();
}

// ---- férias → cenário na Simulação ----
// Cada efeito vira um "reforço" (positivo) ou gasto (negativo) no mês certo, relativo ao mês-base
// da Simulação: recibo de férias, salário reduzido dos meses seguintes, 13º e o custo da viagem
// escolhida. Refazer substitui o cenário anterior das mesmas férias (não duplica).
function cenarioDasFerias(f){
  const S=state.simg,base=baseMesRef(),fora=[];const ex=[];
  const k=ym=>mesesEntre(base.ym,ym);
  const add=(nome,valor,ym)=>{if(!(Math.abs(valor)>0.005))return;const kk=k(ym);if(kk<1||kk>12){fora.push(nome+" ("+lbl(ym)+")");return;}ex.push({nome,valor:r2(valor),mesIni:kk,meses:1,fonte:"ferias"});};
  const c=calcFerias(f),c13=calc13(f);
  add("Recibo de férias",c.totalReceber,c.mesPagamento);
  linhaDoTempoFerias(f).forEach(r=>{if(r.buraco>0.005)add("Salário reduzido ("+lbl(r.civilRef)+")",-r.buraco,r.ymPag);});
  if(!c13.adiantou)add("13º — 1ª parcela",c13.parc1,c13.ymParc1);add("13º — 2ª parcela",c13.parc2,c13.ymParc2);
  const p=planoAtivo(f);if(p)add("Viagem: "+(p.nome||"viagem")+(p.destino?" ("+p.destino+")":""),-custoPlano(p,f),ymOfIso(idaViagem(f,p)||f.inicio));
  return{cenario:{nome:"Férias — "+(f.nome||"Férias")+" (automático)",itens:[],extras:ex,_ferias:f.id},fora,base:base.ym};
}
function criarCenarioFerias(id){
  const f=feriasGet(id);if(!f||!f.inicio){alert("Defina a data de início das férias primeiro.");return;}
  if(!meses().length){alert("Cadastre pelo menos um mês em Editar dados — a Simulação parte dele.");return;}
  const r=cenarioDasFerias(f);const S=state.simg;

}

// ---- distância automática (OpenStreetMap: Nominatim + OSRM — gratuitos, sem chave) ----
// Só os nomes das duas cidades são enviados. Pedágio não tem serviço gratuito confiável: o link
// abre a rota no Google Maps, que mostra os pedágios.
async function geocodificar(q){
  const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q="+encodeURIComponent(q),{headers:{"Accept-Language":"pt-BR"}});
  const j=await r.json().catch(()=>[]);if(!r.ok||!j.length)throw new Error("Não achei “"+q+"” no mapa. Tente “Cidade, UF”.");
  return{lat:+j[0].lat,lon:+j[0].lon};}
async function rotaCarro(a,b){
  const r=await fetch("https://router.project-osrm.org/route/v1/driving/"+a.lon+","+a.lat+";"+b.lon+","+b.lat+"?overview=false");
  const j=await r.json().catch(()=>({}));if(!r.ok||j.code!=="Ok"||!j.routes||!j.routes.length)throw new Error("Não consegui calcular a rota.");
  return{km:j.routes[0].distance/1000,horas:j.routes[0].duration/3600};}
function setCasaCidade(v){state.casaCidade=(v||"").trim();save();render();}
async function calcularKm(id,pid,tid){
  const f=feriasGet(id),p=f&&(f.viagem.planos||[]).find(x=>x.id===pid),t=p&&(p.trechos||[]).find(x=>x.id===tid);if(!t)return;
  const de=(t.origem||state.casaCidade||"").trim(),para=(t.destinoTrecho||p.destino||"").trim();
  if(!de){alert("Preencha “Saindo de” (sua cidade) no topo da seção 5.");return;}
  if(!para){alert("Preencha o destino da viagem.");return;}
  try{t._calc="calculando…";render();
    const[a,b]=await Promise.all([geocodificar(de),geocodificar(para)]);const r=await rotaCarro(a,b);
    t.kmIda=Math.round(r.km);t.horasIda=r2(r.horas);t.kmAuto=de+" → "+para;delete t._calc;save();render();
  }catch(e){delete t._calc;render();alert(e.message+" (sem internet? dá para digitar o km à mão)");}
}

  const cx=caixaFerias(f);const ymIniF=f.inicio?ymOfIso(f.inicio):"";

function b64de(u8){let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function deB64(t){const b=atob(t),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function derivarChave(senha,saltB64){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:deB64(saltB64),iterations:310000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["encrypt","decrypt"]);
  return b64de(new Uint8Array(await crypto.subtle.exportKey("raw",k)));}
const chaveAES=(c)=>crypto.subtle.importKey("raw",deB64(c||sync.chave),"AES-GCM",false,["encrypt","decrypt"]);
async function gzip(u8,comprimir){if(typeof CompressionStream==="undefined")return null;
  const t=comprimir?new CompressionStream("gzip"):new DecompressionStream("gzip");
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(t)).arrayBuffer());}
async function cifrar(objeto,chave){
  const txt=new TextEncoder().encode(JSON.stringify(objeto)),z=await gzip(txt,true),iv=crypto.getRandomValues(new Uint8Array(12));
  const c=await crypto.subtle.encrypt({name:"AES-GCM",iv},await chaveAES(chave),z||txt);
  return{cifra:b64de(new Uint8Array(c)),iv:b64de(iv),gz:!!z};}
async function decifrar(d,chave){
  let p;try{p=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:deB64(d.iv)},await chaveAES(chave),deB64(d.cifra)));}
  catch(e){throw new Error("Senha da família incorreta (não consegui abrir os dados da nuvem).");}
  return JSON.parse(new TextDecoder().decode(d.gz?await gzip(p,false):p));}

// ---- o ciclo: baixa o que há de novo, junta, e sobe se houver mudança local ----
async function sincronizar(manual){

  syncEmCurso=(async()=>{
    try{
      if(typeof navigator!=="undefined"&&navigator.onLine===false){statusSync("offline");return;}

        // 1ª sincronização desta janela: junta com a nuvem mesmo se a versão bate — o que está no
        // aparelho pode ter sido regravado por uma janela antiga sem que o controle de versão saiba
        if(rem&&(rem.versao!==sync.versao||primeiraSync)){

          // sem base (aparelho novo nesta conta ou recém-atualizado): a nuvem vence os conflitos;
          // deste aparelho só entram registros novos (gastos, meses) que a nuvem ainda não tem
          state=migrarEstado(mesclarEstados(state,remoto,base,base?null:{bVence:true}));reaplicarRenomes();salvarLocal();
          registrar("recebeu da nuvem (v"+rem.versao+", enviado por "+(remoto._ultimoEnvio?nomeDe(remoto,remoto._ultimoEnvio.id):(rem.por||"?"))+(base?"":", sem base")+")");
          sync.versao=rem.versao;sync.porUltimo=rem.por;gravarSync();renderSeguro();
          if(!tinhaPendente)gravarBase(remoto);

        }

        if(!aparelhoAvisado){const a=(state._aparelhos||{})[idAparelho()];if(!a||a.versao!==APP_VERSAO_TXT||Date.now()-(+a.visto||0)>6*3600000){sync.pendente=true;}}

        registrarAparelho();aparelhoAvisado=true;

        if(d.cifra.length>900000)throw new Error("Os dados passaram do tamanho máximo de um documento. Avise para dividirmos o armazenamento.");
        // 3 tentativas com a checagem; na 4ª (logo depois de baixar e juntar de novo) grava direto
        const w=await fsGravar(d,rem&&rem.updateTime,t===3&&!!rem);
        if(w.conflito){ultimoConflito=w.detalhe;continue;} // outro aparelho gravou no meio: baixa de novo e junta
        salvarLocal(); // o registro do aparelho também fica gravado aqui
        registrar("enviou para a nuvem (v"+d.versao+")");
        sync.versao=d.versao;sync.pendente=JSON.stringify(state)!==enviado;sync.ultimo=Date.now();sync.porUltimo=sync.email;gravarSync();gravarBase(JSON.parse(enviado));statusSync("ok");

      }

    }catch(e){registrar("erro: "+e.message);statusSync(/Failed to fetch|NetworkError|Load failed/i.test(e.message)?"offline":"erro",e.message);}

}

  <div class="row" style="margin-top:10px">

    <label class="btn" style="cursor:pointer" title="Troca TUDO deste aparelho pelo conteúdo do arquivo">⬆ Importar substituindo <input type="file" accept=".json" style="display:none" onchange="importar(this)"></label>
    <button class="btn danger" onclick="resetar()">Apagar tudo e recomeçar vazio</button>
  </div></div>
  ${(()=>{const lista=listarBackupsAuto();if(!lista.length)return"";
    return `<div class="card"><h3>🕑 Backups automáticos (neste navegador)</h3>
    <p class="note">A cada alteração salva, o painel guarda uma cópia do dia. Mantém os últimos 5 dias — útil se algo der errado ou um arquivo importado substituir dados por engano.</p>
    <table><tr><th>Dia</th><th></th></tr>
    ${lista.slice().reverse().map(x=>`<tr><td>${x.dia}</td><td><button class="btn" style="padding:2px 10px" onclick="restaurarBackupAuto('${x.dia}')">restaurar</button></td></tr>`).join("")}
    </table></div>`;})()}
  <div class="card"><h3>Como usar em vários aparelhos</h3>
  <p class="note">• <b>Celular (iPhone):</b> abra o endereço do app no Safari → Compartilhar → <b>Adicionar à Tela de Início</b>. Abra sempre pelo ícone: funciona sem internet.<br>
  • <b>Computador:</b> use o mesmo endereço no navegador (salve nos favoritos).<br>
  • <b>Mesmos dados em todos:</b> entre na mesma conta (card acima) e use a mesma <b>senha da família</b> em cada aparelho; cada pessoa da casa pode ter o seu login. As mudanças chegam sozinhas em poucos segundos.<br>

// O backup leva a categoria e o tipo efetivos de cada conta e as categorias de gasto usadas,
// para que ele abra igual numa versão do app com categorias-padrão diferentes (ex.: a do iPhone).
function estadoParaExportar(){
  const o=JSON.parse(JSON.stringify(state));o.catConta=o.catConta||{};o.tipos=o.tipos||{};o.catsUser=o.catsUser||[];o.catsUserCores=o.catsUserCores||{};o.catContaCores=o.catContaCores||{};
  allContas().forEach(n=>{if(!o.catConta[n])o.catConta[n]=catOf(n);if(!(n in o.tipos))o.tipos[n]=tipoOf(n)==="Fixo"?1:0;});
  catList().forEach(c=>{if(!o.catContaCores[c])o.catContaCores[c]=catColor(c);});
  const usadas=new Set();Object.values(o.movs||{}).forEach(a=>(a||[]).forEach(x=>x.cat&&usadas.add(x.cat)));
  (o.ferias||[]).forEach(f=>((f.viagem&&f.viagem.gastos)||[]).forEach(g=>g.cat&&usadas.add(g.cat)));
  usadas.forEach(c=>{if(c!=="Outros"&&c!=="Renda extra"&&!o.catsUser.includes(c)&&CATMOV[c]){o.catsUser.push(c);o.catsUserCores[c]=CATMOV[c];}});
  return o;
}
function exportar(){
  const blob=new Blob([JSON.stringify(estadoParaExportar(),null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="financas-"+new Date().toISOString().slice(0,10)+".json";a.click();
}
function importar(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const bruto=JSON.parse(r.result);
    backupRotativo(); // guarda o estado atual antes de substituir, dá para desfazer na aba Backup
    state=migrarEstado(bruto);avisoCorrompido=null;
    save();render();alert("Backup importado!");}catch(e){alert("Arquivo inválido: "+e.message);}};
  r.readAsText(f);
}
function importarJuntar(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const outro=migrarEstado(JSON.parse(r.result));
    const antes={meses:state.meses.length,movs:Object.values(state.movs||{}).reduce((s,a)=>s+(a||[]).length,0)};
    backupRotativo();
    state=mesclarEstados(state,outro);reaplicarRenomes();state=migrarEstado(state);
    const depois={meses:state.meses.length,movs:Object.values(state.movs||{}).reduce((s,a)=>s+(a||[]).length,0)};
    save();render();
    alert("Dados juntados.\n\nMeses: "+antes.meses+" → "+depois.meses+"\nLançamentos avulsos: "+antes.movs+" → "+depois.movs+"\n\nNada deste aparelho foi apagado. Onde os dois lados tinham valores diferentes, valeu o que foi editado por último. Se algo ficou errado, restaure o backup automático de hoje.");
  }catch(e){alert("Arquivo inválido: "+e.message);}};
  r.readAsText(f);
}
function resetar(){if(confirm("Isso apaga TODOS os dados deste navegador e volta ao painel vazio. Exporte um backup antes, se quiser guardar algo. Continuar?")){backupRotativo();state=JSON.parse(JSON.stringify(DEFAULT));save();render();}}

    const m=meses().find(x=>x.ym===pagSel);
    if(m){
      const P=state.pagos[pagSel]||{};
      const itens=Object.entries(m.contas).filter(([,v])=>+v>0).map(([n,v])=>({n,v:+v,pago:!!P[n]}));
      const pago=itens.filter(x=>x.pago).reduce((s,x)=>s+((m.pagoReal&&+m.pagoReal[x.n])||x.v),0);
      const pend=itens.filter(x=>!x.pago).reduce((s,x)=>s+x.v,0);
      chart("cPagDonut",{type:"doughnut",data:{labels:["Pago","Pendente"],datasets:[{data:[+pago.toFixed(2),+pend.toFixed(2)],backgroundColor:["#0d9488","#fda4af"]}]},
        options:{maintainAspectRatio:false,plugins:{legend:{position:"bottom"},tooltip:{callbacks:{label:c=>c.label+": "+fmt(c.raw)}}}}});
      const porCatP={};itens.filter(x=>!x.pago).forEach(x=>{const c=catOf(x.n);porCatP[c]=(porCatP[c]||0)+x.v;});
      const e=Object.entries(porCatP).sort((a,b)=>b[1]-a[1]);
      chart("cPagCat",{type:"bar",data:{labels:e.map(x=>x[0]),datasets:[{data:e.map(x=>+x[1].toFixed(2)),backgroundColor:e.map(x=>catColor(x[0])),borderRadius:5}]},
        options:{indexAxis:"y",maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.raw)}}}}});
    }
  }
  if(tab==="agenda"){
    const base=Math.max(holt(ms.map(totalContas)),0);
    const rendaPrev=Math.max(holt(ms.map(renda)),0);
    const labs=[],dBase=[],dAg=[],dSob=[];
    for(let k=1;k<=6;k++){const ym=ymAdd(ms[ms.length-1].ym,k);labs.push(lbl(ym));
      const ag=futurosNovos(ym).reduce((s,f)=>s+f.valor,0);
      dBase.push(Math.round(base));dAg.push(Math.round(ag));dSob.push(Math.round(rendaPrev-base-ag));}
    chart("cAgenda",{type:"bar",data:{labels:labs,datasets:[
      {label:"Contas (padrão)",data:dBase,backgroundColor:"#cbd5e1",stack:"s"},
      {label:"Agenda",data:dAg,backgroundColor:"#d97706",stack:"s"},
      {type:"line",label:"Sobra projetada",data:dSob,borderColor:"#6366f1",backgroundColor:"#6366f1",tension:.3}]},
      options:{maintainAspectRatio:false,plugins:{legend:{position:"bottom"},tooltip:{callbacks:{label:c=>c.dataset.label+": "+fmt0(c.raw)}}}}});
  }
  if(tab==="dividas"){
    const msJ=mesesA();
    chart("cJurosMes",{type:"bar",data:{labels:msJ.map(m=>lbl(m.ym)),datasets:[{label:"Juros/multa pagos",data:msJ.map(m=>+jurosNoMes(m.ym).toFixed(2)),backgroundColor:msJ.map(m=>jurosNoMes(m.ym)>0?"#fda4af":"#e2e8f0"),borderRadius:4}]},
      options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>"Juros pagos: "+fmt(c.raw)}}}}});
  }
  if(tab==="orcado"){
    const m=meses().find(x=>x.ym===orcSel);
    if(m){
      const cats=comparaPorCat(m);
      if(cats.length){
        chart("cOrcCat",{type:"bar",data:{labels:cats.map(c=>c.cat),datasets:[
          {label:"Orçado",data:cats.map(c=>+c.orc.toFixed(2)),backgroundColor:"#cbd5e1",borderRadius:4},
          {label:"Realizado",data:cats.map(c=>+c.real.toFixed(2)),backgroundColor:cats.map(c=>c.dif>0?"#fda4af":"#5eead4"),borderRadius:4}]},
          options:{maintainAspectRatio:false,plugins:{legend:{position:"bottom"},tooltip:{callbacks:{label:c=>c.dataset.label+": "+fmt(c.raw)}}},scales:{y:{ticks:{font:{size:9}}},x:{ticks:{font:{size:9}}}}}});
      }
    }
  }
  if(tab==="categorias"){
    const ms=meses();const yms=catPeriodo==="todos"?ms.map(m=>m.ym):ms.slice(-(+catPeriodo)).map(m=>m.ym);
    const e=Object.entries(gastoPorCategoria(yms)).sort((a,b)=>b[1]-a[1]);
    if(e.length)chart("cCatTudo",{type:"doughnut",data:{labels:e.map(x=>x[0]),datasets:[{data:e.map(x=>x[1]),backgroundColor:e.map(x=>corCategoria(x[0])),borderWidth:0}]},
      options:{maintainAspectRatio:false,plugins:{legend:{position:"right"},tooltip:{callbacks:{label:c=>c.label+": "+fmt(c.raw)}}}}});
  }
  if(tab==="ferias"){
    const f=(state.ferias||[]).find(x=>x.id===ferSel);
    if(f&&f.inicio){
      const tip={callbacks:{label:c=>c.dataset.label+": "+fmt(c.raw)}};
      const cx=caixaFerias(f);
      if(cx.rows.length)chart("cFerMeses",{type:"bar",data:{labels:cx.rows.map(r=>lbl(r.ymPag)),datasets:[
        {label:"Salário",data:cx.rows.map(r=>r.salReduzido),backgroundColor:"#0d9488",stack:"s",borderRadius:3},
        {label:"Recibo de férias",data:cx.rows.map(r=>r.pagFerias),backgroundColor:"#6366f1",stack:"s",borderRadius:3},
        {label:"13º",data:cx.rows.map(r=>r.treze13),backgroundColor:cx.usar13?"#f59e0b":"#fcd34d",stack:"s",borderRadius:3},
        {label:"Outro",data:cx.rows.map(r=>r.extraValor),backgroundColor:"#94a3b8",stack:"s",borderRadius:3},
        {type:"line",label:"Contas previstas",data:cx.rows.map(r=>r.gasto),borderColor:"#e11d48",backgroundColor:"#e11d48",borderWidth:2,pointRadius:4,tension:0}]},
        options:{maintainAspectRatio:false,scales:{x:{stacked:true},y:{stacked:true}},plugins:{legend:{position:"bottom"},tooltip:tip}}});
      const pls=f.viagem.planos||[];
      if(pls.length){const pp=pls.map(pl=>partesPlano(pl,f)),env=envelopeTetoFerias(f),nomes=pls.map(pl=>(pl.nome||"Viagem")+(pl.destino&&pl.destino!==pl.nome?" ("+pl.destino+")":""));
        chart("cFerViagens",{type:"bar",data:{labels:nomes,datasets:[
          {label:"Transporte",data:pp.map(x=>x.transporte),backgroundColor:"#6366f1",stack:"v"},
          {label:"Hospedagem",data:pp.map(x=>x.hospedagem),backgroundColor:"#0d9488",stack:"v"},
          {label:"Alimentação",data:pp.map(x=>x.alimentacao),backgroundColor:"#f59e0b",stack:"v"},
          {label:"Passeios e outros",data:pp.map(x=>x.passeios),backgroundColor:"#a855f7",stack:"v"},
          {type:"line",label:"Envelope",data:nomes.map(()=>env),borderColor:"#e11d48",borderDash:[6,4],pointRadius:0,borderWidth:2}]},
          options:{maintainAspectRatio:false,scales:{x:{stacked:true},y:{stacked:true}},plugins:{legend:{position:"bottom"},tooltip:tip}}});}
      const rt=ritmoEnvelope(f);
      if(rt)chart("cFerRitmo",{type:"line",data:{labels:rt.dias.map(d=>d.slice(8,10)+"/"+d.slice(5,7)),datasets:[
        {label:"Gasto acumulado",data:rt.real,borderColor:"#6366f1",backgroundColor:"rgba(99,102,241,.12)",fill:true,tension:.2,spanGaps:false},
        {label:"Ritmo ideal",data:rt.ideal,borderColor:"#94a3b8",borderDash:[6,4],pointRadius:0,fill:false},
        {label:"Teto do envelope",data:rt.dias.map(()=>rt.teto),borderColor:"#e11d48",pointRadius:0,borderWidth:1,fill:false}]},
        options:{maintainAspectRatio:false,plugins:{legend:{position:"bottom"},tooltip:tip}}});
    }
  }
}
aplicarTema();aplicarOlho();render();statusSync("");sincronizar();
</script>
