CP.novoMercadoConf=function(){const n=prompt("Nome do mercado:");if(!n)return;const m=CP.garantirMercado({nome:n});CP.gravar();CP.rc("mercadoId",m.id);};
CP.cancelarConf=function(){if(rasc&&rasc.etapa!=="fonte"&&!confirm("Descartar esta conferência?"))return;CP.fecharCamera();rasc=null;gravarRasc();ui.colar=false;ui.aba="lista";CP.render();};
CP.semNota=function(){const lid=rasc&&rasc.listaId;rasc=CP.rascunhoManual(lid);gravarRasc();CP.render();};
CP.confirmarCompra=function(){if(!rasc)return;
  clearTimeout(tRasc);tRasc=null;gravarRasc();
  if(CP.pagamentoPendente(rasc)){alert("Antes de salvar, diga como esta compra foi paga (a nota traz uma forma de pagamento que o app não reconheceu).");return;}
  if(rasc.origem!=="nfce"&&rasc.listaId&&CP.itensDa(rasc.listaId).some(i=>i.compraId)&&!confirm("Esta lista já teve uma compra salva. Salvar outra pode contar o vale-alimentação duas vezes. Salvar mesmo assim?"))return;
  // item "a mais" digitado e não adicionado: não pode sumir em silêncio
  const exd=val("cpExDesc").trim();if(exd){if(confirm("Você digitou “"+exd+"” em item a mais, mas não tocou em + adicionar. Adicionar à compra agora?")){const q=CP.numBR(val("cpExQtd"))||1,v=CP.numBR(val("cpExV"));rasc.linhas.push({desc:exd,cod:"",qtd:q,un:"UN",vUnit:v,vTotal:CP.r2(q*v),itemId:null,conf:1});gravarRasc();}}
  if(!rasc.linhas.length&&!(+rasc.total>0)){alert("Adicione pelo menos um item ou o total pago.");return;}
  {const sp=rasc.origem!=="nfce"?semPreco(rasc):0;if(sp&&!confirm(sp+(sp===1?" item está":" itens estão")+" sem preço (entra como R$ 0,00 e atrapalha as comparações). Salvar mesmo assim?"))return;}
  if(!rasc.mercadoId&&!(rasc.mercado&&(rasc.mercado.cnpj||rasc.mercado.nome))&&!confirm("Salvar sem dizer o mercado? (o histórico por mercado fica sem esta compra)"))return;
  try{const r=CP.salvarCompra(rasc);const ym=CP.ymDe(r.compra.data),res=CP.resumoMes(ym);
    rasc=null;gravarRasc();ui.colar=false;ui.aba="historico";ui.mes=ym;CP.render();
    toast(`✔ Compra salva: <b>${F(CP.totalCompra(r.compra))}</b>`+(res.vaSaldo!=null?`<br>💳 VA restante em ${lblMes(ym)}: <b class="${res.vaSaldo>=0?"teal":"rose"}">${F(res.vaSaldo)}</b>`:"")+(r.analise.extras.length?`<br>➕ a mais: ${F(r.analise.somaExtras)}`:"")+(r.faltou?`<br>⚠️ ${r.faltou} item(ns) faltaram → próxima lista`:""));
  }catch(e){alert(e.message);}};
// QR → link/chave → itens (pelo intermediário) ou só o cabeçalho
async function processarNota(texto){
  const lid=rasc&&rasc.listaId;let erroLeitura="";
  try{
    const direto=CP.lerNota(texto);
    if(direto.itens.length){rasc=CP.rascunhoDaNota(direto,lid);rasc.linhasDaNota=true;gravarRasc();CP.render();return;}
    const link=CP.linkNota(texto),k=CP.lerChave(texto);
    if(!link&&!k){alert("Não reconheci uma nota fiscal neste texto/QR.");return;}
    if(link&&CP.temIntermediario()){toast("⏳ Buscando os itens da nota…");
      try{const n=await CP.baixarNota(link);rasc=CP.rascunhoDaNota(n,lid);rasc.linhasDaNota=true;rasc.link=link;gravarRasc();CP.render();return;}
      catch(e){erroLeitura=CP.erroNota(e);toast("⚠️ Não consegui abrir a nota pelo intermediário. Veja o passo a passo na tela.");}}
    // sem itens: monta com o que a chave diz (mercado, data) e os itens pegos da lista; os preços você completa ou cola o texto
    const base=CP.rascunhoManual(lid);Object.assign(base,{origem:"nfce",chave:k?k.chave:"",link:link||"",mercado:{cnpj:k?k.cnpj:""},data:CP.hoje()});
    base.origem="manual";base.chaveLida=true;rasc=base;rasc.link=link||"";if(erroLeitura)rasc.erroNota=erroLeitura;gravarRasc();CP.render();
  }catch(e){alert(e.message);}}
CP.lerColado=function(){const t=val("cpColar");if(!t.trim())return;
  // colou o texto da nota depois de já ter o cabeçalho: mantém a lista e a data escolhidas
  processarNota(t);};
// "Colar o que copiei": lê a área de transferência com o toque da pessoa; negado/indisponível -> cai no campo de texto
CP.colarCopiado=async function(){let t="";
  try{if(navigator.clipboard&&navigator.clipboard.readText)t=String(await navigator.clipboard.readText()||"");}catch(e){t="";}
  if(t.trim()){await processarNota(t);return;}
  if(rasc)rasc.etapa="fonte";ui.colar=true;CP.render();toast("ℹ️ Não consegui ler o que você copiou. Cole no campo abaixo (segure o dedo no campo → Colar) e toque em Ler.");};
CP.abrirCamera=async function(){const box=$("cpCamera"),v=$("cpVideo");if(!box||!v)return;box.style.display="block";
  try{await CP.lerCamera(v,t=>{box.style.display="none";processarNota(t);});}
  catch(e){box.style.display="none";alert((e&&e.name==="NotAllowedError"?"Sem permissão para a câmera. ":"")+(e.message||e)+"\nUse a opção “Foto do QR” ou cole o link.");}};
CP.fecharCamera=function(){CP.pararCamera();CP.abrindoCamera=false;const b=$("cpCamera");if(b)b.style.display="none";if(CP.renderPendente&&listaAberta())CP.render();};
CP.fotoQR=async function(inp){const f=inp.files&&inp.files[0];if(!f)return;try{processarNota(await CP.lerFoto(f));}catch(e){alert(e.message);}};

function telaHistorico(){const meses=CP.mesesComCompras();const atual=CP.ymAtual();
  if(!ui.mes)ui.mes=meses.includes(atual)?atual:(meses[meses.length-1]||atual);
  const op=[...new Set(meses.concat([atual,ui.mes]))].sort().reverse();

  const fechadas=CP.vivos("listas").filter(l=>l.status==="fechada").sort((a,b)=>String(b.fechada||b.criada).localeCompare(String(a.fechada||a.criada))).slice(0,12);
  return `<div class="card"><div class="flexbet"><select onchange="CP.ui.mes=this.value;CP.render()">${op.map(m=>`<option value="${m}" ${m===ui.mes?"selected":""}>${lblMes(m)}</option>`).join("")}</select>
      <span class="note" style="margin:0">${r.n} compra(s) · total <b>${F(r.total)}</b>${r.extras?` · a mais ${F(r.extras)}`:""}</span></div>
    <div style="margin-top:8px">${cardVA(ui.mes)}</div></div>
  ${cs.map(c=>{const ex=(c.itens||[]).filter(x=>x.extra);return `<details class="card cp-compra"><summary><div class="flexbet"><span><b>${dataBR(c.data)}</b> · ${esc(CP.nomeMercado(c.mercadoId))}</span><span><b>${F(CP.totalCompra(c))}</b> <span class="pill">${esc(PAG[c.pagamento]||c.pagamento||"")}</span></span></div>
      <div class="note" style="margin:0">${(c.itens||[]).length} itens${ex.length?` · ${ex.length} a mais (${F(ex.reduce((s,x)=>s+(+x.vTotal||0),0))})`:""}${c.quem?" · por "+esc(c.quem):""}${c.origem==="nfce"?" · nota fiscal":""}</div></summary>
    <table style="margin-top:6px"><tr><th>Item</th><th class="n">Qtd</th><th class="n">Unit.</th><th class="n">Total</th></tr>${(c.itens||[]).map(x=>`<tr><td>${esc(x.desc)}${x.extra?' <span class="pill rose">a mais</span>':""}</td><td class="n">${esc(fmtQtd(x.qtd))}</td><td class="n">${F(x.vUnit)}</td><td class="n">${F(x.vTotal)}</td></tr>`).join("")}</table>
    ${c.desconto?`<p class="note">Descontos: ${F(c.desconto)}</p>`:""}${c.pagamento==="misto"?`<p class="note">VA: ${F(c.valorVA)} · outro: ${F(CP.totalCompra(c)-c.valorVA)}</p>`:""}
    <div class="row" style="margin-top:8px"><button class="btn danger" onclick="CP.apagarCompra('${A(c.id)}')">apagar esta compra</button></div></details>`;}).join("")||`<div class="card"><p class="note">Nenhuma compra registrada em ${lblMes(ui.mes)}.</p></div>`}
  ${fechadas.length?`<div class="card"><h3>Listas anteriores</h3>${fechadas.map(l=>{const its=CP.itensDa(l.id);const f=its.filter(i=>i.estado==="faltou").length,o=its.filter(i=>i.estado==="outroMercado").length;
    return `<div class="flexbet cp-lin"><span>${esc(l.nome)} <span class="note" style="margin:0">${dataBR(l.fechada||l.criada)}</span></span><span class="note" style="margin:0">${l.arquivada&&!its.length?"arquivada (itens apagados)":its.length+" itens"}${f?` · ${f} faltaram`:""}${o?` · ${o} em outro mercado`:""} <a href="#" onclick="CP.reabrirLista('${A(l.id)}');return false">reabrir</a></span></div>`;}).join("")}</div>`:""}`;}
CP.apagarCompra=function(id){if(!confirm("Apagar esta compra do histórico?"))return;CP.apagar("compras",id);CP.precisaAnos=true;CP.gravar();CP.render();};
CP.reabrirLista=function(id){const l=CP.por("listas",id);if(!l)return;l.status="aberta";CP.salvarReg("listas",l);CP.gravar();ui.lista=id;CP.irAba("lista");};

// ---------- MESES (comparar) ----------
function telaMeses(){const ms=CP.mesesComCompras();const at=CP.ymAtual();
  const todos=[...new Set(ms.concat([at]))].sort();
  if(!ui.cmpB)ui.cmpB=todos[todos.length-1];if(!ui.cmpA)ui.cmpA=todos.length>1?todos[todos.length-2]:CP.ymMais(ui.cmpB,-1);
  const ult=todos.slice(-12);const rs=ult.map(CP.resumoMes);
  const cmp=CP.compararMeses(ui.cmpA,ui.cmpB);
  const sel=(k,v)=>`<select onchange="CP.ui.${k}=this.value;CP.render()">${[...new Set(todos.concat([v]))].sort().reverse().map(m=>`<option value="${m}" ${m===v?"selected":""}>${lblMes(m)}</option>`).join("")}</select>`;
  const seta=d=>d>0?`<span class="up">▲ ${F(d)}</span>`:d<0?`<span class="down">▼ ${F(-d)}</span>`:"—";
  const topB=Object.entries(cmp.B.porProduto).sort((a,b)=>b[1]-a[1]).slice(0,10);
  return `<div class="card"><h3>Compras por mês</h3><div class="chartbox sm"><canvas id="cpGMeses"></canvas></div></div>
  <div class="card"><div style="overflow-x:auto"><table><tr><th>Mês</th><th class="n">Total</th><th class="n">Compras</th><th class="n">Ticket médio</th><th class="n">VA recebido</th><th class="n">VA gasto</th><th class="n">Saldo VA</th><th class="n">Mercado nas Contas Casa</th><th class="n">vs. mês anterior</th></tr>
    ${rs.slice().reverse().map((r,i,arr)=>{const ant=arr[i+1];return `<tr><td>${lblMes(r.ym)}</td><td class="n"><b>${F(r.total)}</b></td><td class="n">${r.n}</td><td class="n">${r.n?F(r.total/r.n):"—"}</td>
      <td class="n">${r.vaRecebido==null?"—":F(r.vaRecebido)}</td><td class="n">${F(r.va)}</td><td class="n ${r.vaSaldo<0?"rose":""}">${r.vaSaldo==null?"—":F(r.vaSaldo)}</td><td class="n">${r.mercadoFinancas==null?"—":F(r.mercadoFinancas)}</td><td class="n">${ant?seta(CP.r2(r.total-ant.total)):"—"}</td></tr>`;}).join("")}</table></div>
    <p class="note">"Mercado nas Contas Casa" é o que as finanças têm na categoria Mercado (contas + gastos avulsos), só para comparar — nada é alterado lá.</p></div>
  <div class="card"><h3>Comparar dois meses</h3><div class="row">${sel("cmpA",ui.cmpA)} → ${sel("cmpB",ui.cmpB)}<span>diferença: <b>${seta(cmp.total)}</b></span></div>
    <h3 style="margin-top:12px">Por seção</h3><table><tr><th>Seção</th><th class="n">${lblMes(ui.cmpA)}</th><th class="n">${lblMes(ui.cmpB)}</th><th class="n">Diferença</th></tr>
      ${cmp.secoes.map(s=>`<tr><td>${esc(s.nome)}</td><td class="n">${F(s.a)}</td><td class="n">${F(s.b)}</td><td class="n">${seta(s.dif)}</td></tr>`).join("")||'<tr><td colspan="4" class="note">Sem compras nesses meses.</td></tr>'}</table>
    <h3 style="margin-top:12px">Produtos que mais mudaram</h3><table><tr><th>Produto</th><th class="n">${lblMes(ui.cmpA)}</th><th class="n">${lblMes(ui.cmpB)}</th><th class="n">Diferença</th></tr>
      ${cmp.produtos.slice(0,12).map(s=>`<tr><td>${esc(s.nome)}</td><td class="n">${F(s.a)}</td><td class="n">${F(s.b)}</td><td class="n">${seta(s.dif)}</td></tr>`).join("")}</table>
    <h3 style="margin-top:12px">Onde mais gastei em ${lblMes(ui.cmpB)}</h3><table>${topB.map(([n,v],i)=>`<tr><td>${i+1}. ${esc(n)}</td><td class="n">${F(v)}</td></tr>`).join("")||'<tr><td class="note">Sem itens detalhados.</td></tr>'}</table>
    <h3 style="margin-top:12px">Por mercado</h3><table>${cmp.mercados.map(s=>`<tr><td>${esc(s.nome)}</td><td class="n">${F(s.a)}</td><td class="n">${F(s.b)}</td><td class="n">${seta(s.dif)}</td></tr>`).join("")}</table>
    ${blocoInflacao(ui.cmpA,ui.cmpB)}</div>${blocoComparacoes(ui.cmpA,ui.cmpB)}`;}
// preços entre os dois meses: (1) mesmo produto/marca no MESMO mercado: subiu/caiu; (2) mudou de mercado: lado a lado (não é aumento); (3) mesmo mercado mês a mês
const pctTxt=p=>p==null?"":(p>0?"+":"")+CP.fmtPct(p,1);
function blocoComparacoes(a,b){let q=null;try{q=CP.precosQueSubiram(a,b);}catch(e){return"";}
  const lin=x=>`<tr><td>${esc(x.nome)}<div class="note" style="margin:0">${esc(x.mercado)}</div></td><td class="n" data-l="${lblMes(a)}">${F(x.precoA)}${x.base?"/"+esc(x.base):""}</td><td class="n" data-l="${lblMes(b)}">${F(x.precoB)}${x.base?"/"+esc(x.base):""}</td><td class="n ${x.dif>0?"rose":"teal"}" data-l="Variação">${pctTxt(x.pct)}</td></tr>`;
  const m=q.mesmoMercado,mu=q.mudaramDeMercado||[];
  const merc=CP.vivos("mercados").filter(x=>CP.comprasDoMes(a).some(c=>c.mercadoId===x.id)&&CP.comprasDoMes(b).some(c=>c.mercadoId===x.id));
  return `<div class="card"><h3>🏷️ Preços: ${lblMes(a)} → ${lblMes(b)}</h3><p class="note" style="margin-top:0">Produto/marca iguais, comparados <b>no mesmo mercado</b>. Quando o lugar mudou, o app mostra os dois lado a lado (não chama de aumento).</p>
    ${m.subiram.length?`<h3 style="margin-top:8px">Subiram</h3><div style="overflow-x:auto"><table class="tb-cards"><tr class="cab"><th>Produto</th><th class="n">${lblMes(a)}</th><th class="n">${lblMes(b)}</th><th class="n">Variação</th></tr>${m.subiram.slice(0,12).map(lin).join("")}</table></div>`:'<p class="note">Nenhum preço subiu no mesmo mercado.</p>'}
    ${m.cairam.length?`<h3 style="margin-top:8px">Caíram</h3><div style="overflow-x:auto"><table class="tb-cards"><tr class="cab"><th>Produto</th><th class="n">${lblMes(a)}</th><th class="n">${lblMes(b)}</th><th class="n">Variação</th></tr>${m.cairam.slice(0,8).map(lin).join("")}</table></div>`:""}
    ${mu.length?`<h3 style="margin-top:8px">Mudou de mercado (lado a lado)</h3>${mu.slice(0,10).map(x=>`<div class="cp-linha"><b>${esc(x.nome)}</b><div class="note" style="margin:0">${lblMes(a)}: ${esc(x.deA.mercado)} · <b>${F(x.precoA)}</b>${x.base?"/"+esc(x.base):""} &nbsp;|&nbsp; ${lblMes(b)}: ${esc(x.deB.mercado)} · <b>${F(x.precoB)}</b>${x.base?"/"+esc(x.base):""}</div></div>`).join("")}`:""}
    ${merc.map(x=>{let r=null;try{r=CP.mesmoMercadoMesAMes(x.id,a,b);}catch(e){}return r?`<p class="note" style="margin:8px 0 0">📍 <b>${esc(r.mercado)}</b>: ${F(r.totalA)} → ${F(r.totalB)} (${r.dif>0?"+":""}${F(r.dif)}) em ${r.nA}→${r.nB} compra(s)</p>`:"";}).join("")}</div>`;}
// "inflação da sua cesta": mesmos produtos comprados nos dois meses, preço unitário médio de cada mês
function blocoInflacao(a,b){const med=(ym)=>{const o=Object.create(null);CP.comprasDoMes(ym).forEach(c=>(c.itens||[]).forEach(x=>{if(!x.produtoId||!(+x.vUnit>0))return;const k=x.produtoId+"@"+(c.mercadoId||"");(o[k]=o[k]||[]).push(+x.vUnit);})); // chave = produto + mercado: mudar de mercado não é inflação
    const r=Object.create(null);for(const k in o)r[k]=o[k].reduce((s,v)=>s+v,0)/o[k].length;return r;};
  const A_=med(a),B_=med(b),comuns=Object.keys(A_).filter(k=>k in B_);if(comuns.length<3)return"";
  const v=comuns.reduce((s,k)=>s+B_[k]/A_[k],0)/comuns.length-1;
  const lista=comuns.map(k=>({p:CP.por("produtos",k.split("@")[0]),d:B_[k]/A_[k]-1})).filter(x=>x.p).sort((x,y)=>y.d-x.d);
  return `<h3 style="margin-top:12px">Inflação da sua cesta</h3><p class="note" style="margin-top:0">${comuns.length} produtos comprados <b>no mesmo mercado</b> nos dois meses: em média <b class="${v>0?"rose":"teal"}">${v>0?"+":""}${CP.fmtPct(v*100,1)}</b> no preço unitário.</p>
    <table>${lista.slice(0,5).concat(lista.length>8?lista.slice(-3):[]).map(x=>`<tr><td>${esc(x.p.nome)}</td><td class="n ${x.d>0?"rose":"teal"}">${x.d>0?"+":""}${CP.fmtPct(x.d*100,1)}</td></tr>`).join("")}</table>`;}

// ---------- PREÇOS ----------
function telaPrecos(){const f=CP.norm(ui.filtroPreco);const rs=CP.resumoPrecos().filter(r=>!f||CP.norm(r.p.nome).includes(f));
  return `<div class="card"><div class="row"><input id="cpFiltroPreco" placeholder="procurar produto" value="${esc(ui.filtroPreco)}" oninput="CP.ui.filtroPreco=this.value" onchange="CP.render()" style="flex:1"><button class="btn" onclick="CP.ui.filtroPreco=document.getElementById('cpFiltroPreco').value;CP.renderPendente=false;CP.render()">🔎</button></div>
    <p class="note">Preços tirados das suas compras. Toque num produto para ver o histórico. Para preços de hoje nos sites dos mercados, use a <a href="#" onclick="HUB.abrir('busca');return false">Busca de produto</a>.</p></div>
  ${blocoMercadoXMercado()}
  <div class="card"><div style="overflow-x:auto"><table class="tb-cards"><tr class="cab"><th>Produto</th><th class="n">Último</th><th>Onde</th><th class="n">Menor</th><th class="n">Média</th><th class="n">R$/kg ou L</th></tr>
    ${rs.map(r=>{const u=r.ultimo;const mais=ui.abertoPreco===r.p.id;return `<tr onclick="CP.ui.abertoPreco=${mais?"null":"'"+A(r.p.id)+"'"};CP.render()" style="cursor:pointer"><td><b>${esc(r.p.nome)}</b></td><td class="n" data-l="Último">${F(u.vUnit)}</td><td data-l="Onde">${esc(u.mercado)} <span class="note" style="margin:0">${dataBR(u.data)}</span></td><td class="n" data-l="Menor">${F(r.menor)}</td><td class="n" data-l="Média">${F(r.media)}</td><td class="n" data-l="R$/kg ou L">${u.porBase?F(u.porBase)+"/"+u.base:"—"}</td></tr>
      ${mais?`<tr><td colspan="6"><div class="cp-hist">${r.ultimoPorMercado.length>1?`<b>Hoje, pelo último preço:</b> mais barato no ${esc(r.ultimoPorMercado[0].mercado)} (${F(r.ultimoPorMercado[0].vUnit)})<br>`:""}${r.h.slice(0,15).map(x=>`${dataBR(x.data)} · ${esc(x.mercado)} · ${F(x.vUnit)}${x.porBase?" ("+F(x.porBase)+"/"+x.base+")":""} <span class="note" style="margin:0">${esc(x.desc)}</span>`).join("<br>")}</div></td></tr>`:""}`;}).join("")||'<tr><td colspan="6" class="note">Ainda sem preços. Eles aparecem conforme você registra as compras (melhor ainda pela nota fiscal).</td></tr>'}</table></div></div>`;}

// mercado × mercado: produtos/marcas comprados em 2 ou mais mercados, do mais barato ao mais caro
function blocoMercadoXMercado(){let l=[];try{l=CP.compararMercados().slice(0,8);}catch(e){}if(!l.length)return"";
  return `<div class="card"><h3>⚖️ Mercado × mercado</h3><p class="note" style="margin-top:0">Mesmo produto/marca comprado em mais de um lugar. Sem marca = qualquer marca.</p>
    ${l.map(x=>`<div class="cp-linha"><b>${esc(x.nome)}</b>${x.economia>0?` <span class="pill teal">${F(x.economia)} de diferença</span>`:""}<div class="note" style="margin:0">${x.linhas.map(k=>esc(k.mercado)+" <b>"+F(k.valor)+"</b>"+(x.porBase&&x.base?"/"+esc(x.base):"")).join(" · ")}</div></div>`).join("")}</div>`;}

// ---------- MERCADOS ----------
function telaMercados(){const cs=CP.comprasVivas();
  const ms=CP.vivos("mercados").map(m=>{const x=cs.filter(c=>c.mercadoId===m.id);return{m,n:x.length,total:x.reduce((s,c)=>s+CP.totalCompra(c),0),ult:x[0]&&x[0].data};}).sort((a,b)=>b.total-a.total);
  return `<div class="card"><h3>Lugares onde vocês compram</h3><p class="note" style="margin-top:0">Os mercados entram sozinhos pela nota (CNPJ). Marque a localização ("estou aqui") para a Busca de produto calcular a distância.</p>
    <div style="overflow-x:auto"><table class="tb-cards"><tr class="cab"><th>Mercado</th><th class="n">Visitas</th><th class="n">Total</th><th class="n">Ticket médio</th><th>Última</th><th>Local</th><th></th></tr>
    ${ms.map(({m,n,total,ult})=>`<tr><td><b>${esc(m.apelido||m.nome)}</b>${m.apelido?`<div class="note" style="margin:0">${esc(m.nome)}</div>`:""}${m.rede?` <span class="pill">${esc(m.rede)}</span>`:""}${m.cnpj?`<div class="note" style="margin:0">CNPJ ${esc(CP.fmtCnpj(m.cnpj))}</div>`:""}${m.endereco?`<div class="note" style="margin:0">${esc(m.endereco)}</div>`:""}</td>
      <td class="n" data-l="Visitas">${n}</td><td class="n" data-l="Total">${F(total)}</td><td class="n" data-l="Ticket médio">${n?F(total/n):"—"}</td><td data-l="Última">${ult?dataBR(ult):"—"}</td>
      <td data-l="Local">${m.lat?`<a href="https://www.openstreetmap.org/?mlat=${+m.lat}&mlon=${+m.lon}#map=17/${+m.lat}/${+m.lon}" target="_blank" rel="noopener noreferrer">mapa</a>`:""} <button class="btn cp-mini" onclick="CP.mercadoAqui('${A(m.id)}')">📍 estou aqui</button></td>
      <td><button class="btn cp-mini" onclick="CP.apelidoMercado('${A(m.id)}')">✏️</button></td></tr>`).join("")||'<tr><td colspan="7" class="note">Nenhum mercado ainda.</td></tr>'}</table></div>
    <div class="row" style="margin-top:8px"><button class="btn" onclick="CP.novoMercado()">+ mercado (sem nota)</button></div></div>`;}
CP.apelidoMercado=function(id){const m=CP.por("mercados",id);if(!m)return;const a=prompt("Apelido (ex.: Savegnago do centro):",m.apelido||"");if(a==null)return;m.apelido=a.slice(0,60);if(!m.rede)m.rede=CP.redeDe(a);CP.salvarReg("mercados",m);CP.gravar();CP.render();};
CP.novoMercado=function(){const n=prompt("Nome do mercado:");if(!n)return;CP.garantirMercado({nome:n});CP.gravar();CP.render();};
CP.posicao=function(){return new Promise((ok,erro)=>{if(!navigator.geolocation)return erro(new Error("Este aparelho não informa a localização."));
  navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lon:p.coords.longitude,prec:p.coords.accuracy}),e=>erro(new Error(e.code===1?"Sem permissão para a localização.":"Não consegui a localização ("+e.message+").")),{enableHighAccuracy:true,timeout:15000,maximumAge:120000});});};
CP.mercadoAqui=async function(id){const m=CP.por("mercados",id);if(!m)return;
  try{const p=await CP.posicao();if(!confirm(`Marcar ${m.apelido||m.nome} na sua posição atual (precisão ~${Math.round(p.prec)} m)?`))return;
    m.lat=Math.round(p.lat*1e5)/1e5;m.lon=Math.round(p.lon*1e5)/1e5;CP.salvarReg("mercados",m);CP.gravar();CP.render();}catch(e){alert(e.message);}};

// ---------- AJUSTES ----------
// quem usa a conta e em que versão (lido das finanças: state._aparelhos, só leitura) — para saber como está o app da outra pessoa
function blocoAparelhos(){let aps=[];try{Object.entries(state._aparelhos||{}).forEach(([id,a])=>{if(a&&typeof a==="object")aps.push({id,nome:String(a.nome||"?"),versao:String(a.versao||""),visto:+a.visto||0});});}catch(e){}
  // nome que a pessoa escolheu na Lista (guardado na própria Lista; as finanças só são LIDAS aqui)
  try{CP.aparelhosLista().forEach(l=>{const x=aps.find(a=>a.id===l.id);
    if(x){x.nomeLista=l.nome;if(l.visto>x.visto){x.visto=l.visto;if(l.versao)x.versao=l.versao;}else if(!x.versao)x.versao=l.versao;}
    else aps.push({id:l.id,nome:l.nome||"?",nomeLista:l.nome,versao:l.versao,visto:l.visto});});}catch(e){}
  aps.sort((a,b)=>b.visto-a.visto);
  if(!aps.length)return"";let meu="";try{meu=CP.eu().id;}catch(e){}
  return `<div class="card"><h3>📱 Aparelhos da família</h3><p class="note" style="margin-top:0">Quem já abriu o app com a conta conectada e em qual versão está. Versão em vermelho: está desatualizada — feche e abra o app nesse aparelho.</p>
    <div style="overflow-x:auto"><table><tr><th>Aparelho</th><th>Versão</th><th>Última vez</th></tr>${aps.map(a=>{let velho=false;try{velho=!!a.versao&&cmpVersao(a.versao,APP_VERSAO_TXT)<0;}catch(e){}
      const nm=a.nomeLista?esc(a.nomeLista)+(a.nome&&a.nome!==a.nomeLista&&a.nome!=="?"?` <span class="note" style="margin:0">(${esc(a.nome)})</span>`:""):esc(a.nome);
      return `<tr><td>${nm}${a.id===meu?' <span class="pill teal">este</span>':""}</td><td${velho?' style="color:#be123c;font-weight:700"':""}>${esc(a.versao||"?")}</td><td>${a.visto?esc(new Date(+a.visto).toLocaleString("pt-BR")):"—"}</td></tr>`;}).join("")}</table></div></div>`;}
CP.blocoAparelhos=blocoAparelhos;
function blocoMemoria(){const t=CP.tamanho(),pct=Math.min(100,Math.round(t.total/t.limite*100));
  return `<div class="card"><h3>💾 Memória deste aparelho</h3><p class="note" style="margin-top:0">O navegador guarda tudo (finanças e compras) no mesmo espaço, de cerca de 5 milhões de caracteres. Usado: <b>${pct}%</b> (as compras ocupam ${Math.round(t.compras/1000)} mil).${pct>=70?' <b style="color:#be123c">Está ficando cheio: exporte um backup abaixo.</b>':""}</p>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="Memória usada"><div style="width:${pct}%;${pct>=70?"background:var(--rose)":""}"></div></div></div>`;}
// listas fechadas há mais de 60 dias: arquivar apaga só os ITENS delas (a lista, as compras e o histórico de preços ficam como estão)
const DIAS_ARQ=60;
function blocoArquivar(){let p={listas:0,itens:0,liberado:0};try{p=CP.previaArquivar(DIAS_ARQ);}catch(e){}

const BP={};
try{(function(BP){
"use strict";
// dinheiro sempre como NÚMERO antes de ir para a tela (defesa extra: nada vindo da nuvem vira HTML)
const F=v=>fmt(+v||0);
const st={termo:"",qtd:1,pos:null,lugar:"",perto:[],res:null,cesta:null,carregando:"",erro:"",modo:"produto",filtro:"geral",osm:{estado:"",erro:"",em:0},addMerc:false,addMsg:null,precosLista:null,endTxt:"",endMsg:"",impTxt:"",impMsg:"",cand:[],catBusy:false,catTimer:0,catErroEm:0};

try{const p=JSON.parse(localStorage.getItem(CH_POS)||"null");if(p&&typeof p==="object"&&Number.isFinite(p.lat)&&Number.isFinite(p.lon)&&Math.abs(p.lat)<=90&&Math.abs(p.lon)<=180&&Date.now()-(+p.em||0)<(p.fonte==="endereco"?24:6)*3600000){st.pos=p;if(p.fonte==="endereco")st.lugar=String(p.lugar||"").slice(0,100);}}catch(e){}
// sites com catálogo público (VTEX). Só estes endereços passam pelo intermediário.

const SITES={"Savegnago":"https://www.savegnago.com.br","Atacadão":"https://www.atacadao.com.br"};
const SITES_SEM_API={"Carrefour":"https://mercado.carrefour.com.br","Tenda":"https://www.tendaatacado.com.br"};

// erros de rede em português curto (nada de "Failed to fetch", "403", "tempo esgotado da nuvem")
BP.erroCurto=function(e){const m=String((e&&e.message)||e||"");let st=e&&e.status;if(!st){const x=/respondeu (\d{3})/.exec(m);if(x)st=+x[1];}
  if((e&&e.tempo)||/tempo esgotado|AbortError|timed? ?out/i.test(m))return"demorou demais para responder";
  if(st===403)return"o intermediário não libera este endereço";
  if(st===404)return"o site não tem esta consulta de preços";
  if(st===429)return"muitas consultas seguidas; tente em alguns minutos";
  if(st===502)return"o site do mercado não respondeu";
  if(st===504)return"o site do mercado demorou demais";
  if(st===413)return"a resposta do site veio grande demais";

BP.buscarEndereco=async function(){const q=val("bpEnd").replace(/\s+/g," ").trim().slice(0,160);st.endTxt=q;st.endMsg="";st.cand=[];

function gravarGeo(c){const ks=Object.keys(c);if(ks.length>60)ks.sort((a,b)=>(c[a].em||0)-(c[b].em||0)).slice(0,ks.length-60).forEach(k=>delete c[k]);try{localStorage.setItem(CH_GEO,JSON.stringify(c));}catch(e){}}

async function geoCatalogo(c){const cid=cidadeAtual(),sufixo=cid?", "+cid+", Brasil":", Brasil";

// procura a posição de até 6 lojas por vez (e de 4 em 4 segundos as seguintes); só com posição e sem rede falhando

const OVERPASS=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];

BP.mercadosPerto=async function(forcar){if(!st.pos)return[];const raio=CP.config().raioKm||8;
  const chave=st.pos.lat.toFixed(2)+","+st.pos.lon.toFixed(2)+","+raio;
  try{const c=JSON.parse(localStorage.getItem(CH_OSM)||"null");if(!forcar&&c&&c.chave===chave&&Array.isArray(c.lista)&&Date.now()-(+c.em||0)<86400000){st.perto=c.lista;st.osm={estado:"ok",erro:"",em:+c.em||Date.now()};return st.perto;}}catch(e){}

  let j=null,ult=null;

      const uo=base+"?data="+encodeURIComponent(q),oo={referrerPolicy:"no-referrer"};
      const r=await(CP.fetchT?CP.fetchT(uo,oo,15000,"do mapa (OpenStreetMap)"):fetch(uo,oo));
      if(!r.ok){const x=new Error("o mapa respondeu "+r.status);x.status=r.status;throw x;}
      const t=await r.json();

      if(!t||typeof t!=="object"||!Array.isArray(t.elements)||(!t.elements.length&&/runtime error|timed out|too busy|rate_limited/i.test(String(t.remark||""))))throw new Error("o mapa está sobrecarregado agora");

  if(!j){st.osm={estado:"falhou",erro:BP.erroCurto(ult),em:Date.now()};return st.perto;}

    const nome=t.name||t.brand||"Mercado";return{nome:String(nome).slice(0,80),rede:CP.redeDe((t.brand||"")+" "+nome)||nomeCadastrado((t.brand||"")+" "+nome),lat,lon,

    .filter(x=>x.lat!=null).sort((a,b)=>a.dist-b.dist);
  st.osm={estado:"ok",erro:"",em:Date.now()};
  try{localStorage.setItem(CH_OSM,JSON.stringify({chave,em:Date.now(),lista:st.perto}));}catch(e){}
  return st.perto;};

BP.lerVtex=function(json,rede,base,termo){const out=[];if(!Array.isArray(json))return out;

// ---------- ranking: valor + distância ----------
// custo efetivo = preço × quantidade + ida e volta × custo por km (se marcado). Para comparar embalagens
// diferentes, a ordem usa o preço por kg/L quando todas as ofertas têm essa medida.
// cfg.custoKm = o custo por km EM USO (veículo, se informado; senão o fixo): quem chama monta com cfgDesloc()
const cfgDesloc=()=>Object.assign({},CP.config(),{custoKm:CP.custoKmUsado().valor});
BP.ranquear=function(ofertas,qtd,lojas,cfg){qtd=+qtd||1;
  ofertas.forEach(o=>{if(o.fonte==="site"){const l=lojas[o.rede];o.dist=l?l.dist:null;o.loja=l?l.nome:"";o.lojaLat=l&&l.lat;o.lojaLon=l&&l.lon;}
    o.desloc=cfg.contarDeslocamento&&o.dist!=null?CP.r2(2*o.dist*(+cfg.custoKm||0)):0;
    o.semDesloc=cfg.contarDeslocamento&&o.dist==null&&o.fonte==="site"?(st.pos?"loja":"pos"):"";o.custo=CP.r2(o.preco*qtd+o.desloc);});
  const todosBase=ofertas.length&&ofertas.every(o=>o.porBase&&o.base===ofertas[0].base);
  const chave=o=>todosBase&&!cfg.contarDeslocamento?o.porBase:o.custo;
  ofertas.sort((a,b)=>chave(a)-chave(b)||(a.dist??99)-(b.dist??99));

    const perto=ofertas.filter(o=>o.dist!=null).sort((a,b)=>a.dist-b.dist)[0];if(perto)perto.selo=(perto.selo||[]).concat("📍 mais perto");

// ---------- honestidade: o que foi consultado de fato ----------

BP.situacaoFontes=function(consultas,historico,o){o=o||{};consultas=consultas||{};const hist=(historico||[]).filter(x=>x&&x.rede);

    const f={rede,estado:"",rotulo:"",motivo:"",n:0,em:0,historicoN:h.length,historicoUltimo:ult,historicoIdadeDias:ult?CP.dias(ult,hoje):null,link:SA[rede]||SL[rede]||"",tipo:TEM(SA,rede)?"consulta":TEM(SL,rede)?"link":"historico",erroCurto:""};

    .sort((a,b)=>["agora","so-historico","indisponivel"].indexOf(a.estado)-["agora","so-historico","indisponivel"].indexOf(b.estado)||a.rede.localeCompare(b.rede,"pt-BR"));};

BP.buscar=async function(){const termo=(($("bpTermo")||{}).value||st.termo).trim();st.qtd=Math.max(1,Math.round(CP.numBR(($("bpQtd")||{}).value)))||st.qtd||1;

// lista inteira: em qual mercado a cesta sai mais barata (e se vale dividir entre dois)

    const tarefas=[];its.forEach(i=>redes.forEach(r=>{const t=()=>buscarSite(r,consultaDoItem(i.nome)).then(x=>({i,r,x}));t.rede=r;tarefas.push(t);}));

    st.cesta={lista,dupla,n:its.length,nome:l.nome,semResposta:redes.filter(r=>!porRede[r].itens.length),

// ---------- filtros (a ordenação é refeita SEM nova consulta) ----------
// geral = valor + distância (a ordem do ranquear) · barato = menor preço (por kg/L quando há medida) · perto = menor distância ·

BP.visao=function(todas,filtro){let l=(todas||[]).slice();
  if(filtro==="hoje")l=l.filter(o=>o.fonte==="site");
  const bases={};l.forEach(o=>{if(o.porBase&&o.base)bases[o.base]=(bases[o.base]||0)+1;});
  const dom=Object.keys(bases).sort((a,b)=>bases[b]-bases[a])[0]||"";
  if(filtro==="barato")l.sort((a,b)=>{const ka=dom&&a.base===dom&&a.porBase?[0,a.porBase]:[1,a.preco],kb=dom&&b.base===dom&&b.porBase?[0,b.porBase]:[1,b.preco];return ka[0]-kb[0]||ka[1]-kb[1]||(a.dist??99)-(b.dist??99);});

// 2) roda a análise
BP.rodarAnalise=async function(){const R=st.precosLista;if(!R||R.estado!=="previa")return;const pv=BP.previaAnalise();

  const consultas={};redes.forEach(r=>{const p=porRede[r];consultas[r]=p.erros===p.tot?{erro:p.ult}:{ok:true,n:p.n,em:Date.now()};});
  const itens={},mercados={};redes.forEach(r=>{mercados[r]={rede:r,achou:0,total:0,faltam:[],aprox:0};});let dividido=0,nDiv=0;const sem=[],conta={};
  its.forEach(it=>{const c=consultaDoItem(it.nome),por={};let melhor=null;
    redes.forEach(r=>{const b=ofs[r]&&ofs[r][c]?BP.melhorDoItem(it,ofs[r][c]):null;if(b){por[r]=b;mercados[r].achou++;mercados[r].total=CP.r2(mercados[r].total+b.v);if(b.aprox)mercados[r].aprox++;if(!melhor||b.v<melhor.v)melhor=Object.assign({rede:r},b);}else mercados[r].faltam.push(it.id);});
    itens[it.id]={por,melhor};if(melhor){dividido=CP.r2(dividido+melhor.v);nDiv++;conta[melhor.rede]=(conta[melhor.rede]||0)+1;}else sem.push(it.id);});
  // opções: tudo em UM mercado (só os itens que ele tem) e o plano misto (cada item no mais barato); custo = itens + deslocamento (ida e volta)
  const opcoes=Object.values(mercados).filter(m=>m.achou).map(m=>{const di=BP.deslocInfo(m.rede),d=di.v;return{chave:m.rede,tipo:"mercado",rede:m.rede,achou:m.achou,total:m.total,desloc:d,semDesloc:di.sem,custo:CP.r2(m.total+d),faltam:m.faltam.length,aprox:m.aprox};});
  const usadas=Object.keys(conta);
  if(usadas.length>=2){const d=CP.r2(usadas.reduce((s,r)=>s+BP.desloc(r),0));opcoes.push({chave:"misto",tipo:"misto",redes:usadas,achou:nDiv,total:dividido,desloc:d,semDesloc:usadas.some(r=>BP.deslocInfo(r).sem)?(st.pos?"loja":"pos"):"",custo:CP.r2(dividido+d),faltam:sem.length,aprox:0});}
  const maxAchou=Math.max(0,...opcoes.map(o=>o.achou));
  const melhorOp=opcoes.filter(o=>o.achou===maxAchou).sort((a,b)=>a.custo-b.custo)[0]||null;
  opcoes.sort((a,b)=>b.achou-a.achou||a.custo-b.custo);
  const lista=Object.values(mercados).filter(m=>m.achou).sort((a,b)=>b.achou-a.achou||a.total-b.total);
  Object.assign(R,{itens,mercados:lista,melhorMercado:lista[0]||null,opcoes,melhorOpcao:melhorOp&&melhorOp.chave,conta,dividido:{total:dividido,n:nDiv},semResultado:sem,analisados:its.map(i=>i.id),em:Date.now(),
    fontes:BP.situacaoFontes(consultas,[],{})});
  try{R.habitual=BP.foraDoHabitual(R,its);}catch(e){R.habitual=[];}
  fim("ok");};
// "preço fora do habitual": mais barato AGORA em OUTRO mercado do que o último preço que você pagou (diferença >= 10% e >= R$ 0,50 por unidade/kg).
// Mudou de mercado = lado a lado, nunca "aumento". Só avisa quando é mais barato; preço maior não vira alerta.
BP.foraDoHabitual=function(R,its){const out=[];const mesma=(a,b)=>{a=CP.norm(a);b=CP.norm(b);return!!a&&!!b&&(a===b||a.includes(b)||b.includes(a));};
  (its||[]).forEach(it=>{const x=R.itens[it.id],m=x&&x.melhor;if(!m||m.aprox||!it.produtoId)return;
    const u=CP.ultimoPreco(it.produtoId);if(!u||!(u.vUnit>0))return;const mu=CP.por("mercados",u.mercadoId),ultRede=mu?(mu.rede||mu.apelido||mu.nome):"";
    if(!ultRede||mesma(ultRede,m.rede))return; // mesmo mercado de sempre: não é o caso
    const dif=CP.r2(u.vUnit-m.unit);if(dif>=0.5&&dif/u.vUnit>=0.10)out.push({nome:it.nome,rede:m.rede,hoje:m.unit,antes:CP.r2(u.vUnit),ultRede,ultMercado:CP.nomeMercado(u.mercadoId),dif,data:u.data,base:m.porBase?"kg/L":""});});
  return out.sort((a,b)=>b.dif-a.dif);};
// o plano escolhido na proposta vira mercado + preço de referência nos itens recém-criados da lista do próximo ciclo
BP.aplicarEscolhaProxima=function(lid){const R=st.precosLista;if(!R||R.origem!=="proxima"||R.estado!=="ok"||!R.escolhida)return 0;let n=0;
  CP.itensDa(lid).forEach(i=>{const x=i.produtoId&&R.itens["p-"+i.produtoId];if(!x)return;const rede=R.escolhida==="misto"?(x.melhor&&x.melhor.rede):R.escolhida,b=rede&&x.por[rede];
    if(!b)return;const m=CP.mercadoDaRede(rede);if(!m)return;CP.definirMercadoItem(i.id,m);CP.definirPrecoRef(i.id,b.unit,rede);n++;});
  if(n)CP.gravar();st.precosLista=null;return n;};
// 3) a pessoa escolhe: um mercado ou o plano misto. Cada item analisado recebe o mercado (mercadoId) e o preço de referência de hoje.
// Itens sem preço no mercado escolhido ficam como estavam (a pessoa troca à mão no editor do item).
BP.escolherOpcao=function(chave){const R=st.precosLista;if(!R||R.estado!=="ok")return 0;let n=0;
  if(R.origem==="proxima"){R.escolhida=chave;try{CP.render();}catch(e){}return(R.analisados||[]).length;} // a lista ainda não existe: ao CRIAR, os itens já nascem com mercado e preço
  const merc={};const idDe=r=>merc[r]||(merc[r]=CP.mercadoDaRede(r));
  (R.analisados||[]).forEach(id=>{const x=R.itens[id],i=CP.por("itens",id);if(!x||!i||i.estado!=="pendente")return;
    const rede=chave==="misto"?(x.melhor&&x.melhor.rede):chave,b=rede&&x.por[rede];if(!b)return;
    const m=idDe(rede);if(!m)return;CP.definirMercadoItem(id,m);CP.definirPrecoRef(id,b.unit,rede);n++;});
  R.escolhida=chave;CP.gravar();try{CP.render();}catch(e){}return n;};
BP.limparPrecos=function(){st.precosLista=null;try{CP.render();}catch(e){}};

      if(rt)chart("cFerRitmo",{type:"line",data:{labels:rt.dias.map(d=>d.slice(8,10)+"/"+d.slice(5,7)),datasets:[
        {label:"Gasto acumulado",data:rt.real,borderColor:"#6366f1",backgroundColor:"rgba(99,102,241,.12)",fill:true,tension:.2,spanGaps:false},
        {label:"Ritmo ideal",data:rt.ideal,borderColor:"#94a3b8",borderDash:[6,4],pointRadius:0,fill:false},
        {label:"Teto do envelope",data:rt.dias.map(()=>rt.teto),borderColor:"#e11d48",pointRadius:0,borderWidth:1,fill:false}]},
        options:{maintainAspectRatio:false,plugins:{legend:{position:"bottom"},tooltip:tip}}});
    }
  }
}
