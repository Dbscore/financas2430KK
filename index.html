<style>
  /* ---------- cores (claro) — tudo usa estas variáveis, o modo escuro só troca os valores ---------- */

  *{box-sizing:border-box;margin:0;padding:0;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;}
  html,body{overflow-x:hidden;}

    .card{padding:12px;border-radius:12px;}

    th,td{white-space:normal;padding:6px 5px;} td.n,th.n{white-space:nowrap;}

    .chartbox{height:230px;} .chartbox.sm{height:210px;}

    #alerta .card{padding:8px 10px;} #alerta .card span{font-size:12px!important;} #alerta .btn{min-height:32px;font-size:13px;padding:3px 9px;}
  }
  /* ---- Olho / modo privacidade ---- */
  body.olho-fechado #olhoBtn{background:var(--teal);border-color:var(--teal);color:#fff;}
  /* fmt/fmt0 já trocam o texto por "••••"; os dois pontos abaixo cobrem o que NÃO passa por eles:
     campos numéricos editáveis (mostram o valor real para edição) e os gráficos (Chart.js desenha

  body.olho-fechado input[type=number]{color:transparent;text-shadow:0 0 6px #33415555;}
  body.olho-fechado canvas{filter:blur(7px);}

<script>
// ============ DADOS-SEMENTE ============
// Texto digitado pelo usuário (nomes de contas, lançamentos, metas...) nunca entra cru no HTML:
// esc() para texto na tela e em value="..."; jsAttr() para dentro de onclick="f('...')".
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const jsAttr=s=>esc(String(s??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\n/g,"\\n"));
const CAT = {
  "Aluguel":"Moradia","Condomínio":"Moradia","Luz":"Moradia","Água":"Moradia","Gás":"Moradia","Internet":"Moradia",
  "Carro":"Transporte","IPVA":"Transporte","Cartão de crédito":"Dívidas e cartões","Empréstimo":"Dívidas e cartões",
  "Celular":"Pessoal","Escola / filhos":"Filha","Lazer":"Lazer","Outros":"Outros"
};
const CATCOLORS = {"Moradia":"#0d9488","Transporte":"#6366f1","Dívidas e cartões":"#e11d48","Pessoal":"#84cc16","Filha":"#0ea5e9","Lazer":"#a855f7","Outros":"#94a3b8"};
// categorias para gastos avulsos do dia a dia (aba Sobras)
const CATMOV={
  "Mercado":"#16a34a","Alimentação fora":"#f59e0b","Bebidas":"#7c3aed","Saúde/Farmácia":"#dc2626",
  "Filhos":"#0ea5e9","Transporte/Combustível":"#6366f1","Lazer":"#a855f7","Casa":"#0d9488",
  "Vestuário":"#db2777","Presentes":"#e11d48","Assinaturas":"#64748b","Renda extra":"#059669","Outros":"#94a3b8"};
// Categoria automática pela descrição. Compara PALAVRAS inteiras (sem acento), não pedaços:
// "bar" não pega mais "barato", "99" não pega "R$ 99", "plano" só pega a palavra plano.
// Termo com * no fim = começo de palavra ("supermerc*" pega supermercado). Com espaço = expressão.
// Antes das regras vem o que o app APRENDEU: quando você corrige uma categoria, aquela descrição
// passa a ir sempre para a categoria escolhida (state.catsAprendidas).
const normTxt=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
const CATMOV_REGRAS=[
  ["Bebidas",["cerveja*","cervej*","bebida*","vinho*","whisky","vodka","bar","boteco","adega","drink*","chopp","breja"]],
  ["Saúde/Farmácia",["farmacia*","remedio*","drogaria*","drogasil","medic*","consulta*","dentista","exame*","vacina*","hospital*","laboratorio*"]],
  ["Filhos",["fralda*","escola","creche","brinquedo*","pediatra","papinha","bebe","mamadeira"]],
  ["Mercado",["mercado*","supermerc*","hortifruti","feira","acougue","padaria","atacad*","assai","carrefour","compras do mes","compra do mes"]],
  ["Alimentação fora",["ifood","restaurante*","lanche*","lanchonete","pizza*","hamburg*","marmita","almoco","jantar","cafe","cafeteria","delivery","rappi","sorvete*","sorveteria"]],
  ["Transporte/Combustível",["gasolina","combustivel","posto","uber","99pop","99 taxi","onibus","estacionamento","pedagio*","etanol","alcool","diesel","sem parar","veloe"]],
  ["Lazer",["cinema","show","viagem","passeio*","netflix","spotify","jogo","jogos","game*","parque*","balada","festa","ingresso*","thermas","hotel","pousada"]],
  ["Casa",["movel","moveis","eletro*","reforma","ferramenta*","decoracao","utilidade*","panela*","cama","colchao","material de construcao"]],
  ["Vestuário",["roupa*","calcado*","tenis","sapato*","vestido*","camisa*","camiseta*","calca","bermuda*"]],
  ["Presentes",["presente*","aniversario*"]],
  ["Assinaturas",["assinatura*","mensalidade*","academia","gym","streaming","plano de saude","plano celular"]],
  ["Renda extra",["recebi","freela*","freelance","bico","vendi","reembolso*","pix recebido","salario","bonus","comissao"]]
];
function classificaMov(txt){
  const t=normTxt(txt);if(!t)return null;
  const ap=state&&state.catsAprendidas&&state.catsAprendidas[t];if(ap)return ap;
  const pal=t.split(/[^a-z0-9]+/).filter(Boolean);
  const casa=k=>k.includes(" ")?(" "+pal.join(" ")+" ").includes(" "+k+" "):k.endsWith("*")?pal.some(p=>p.startsWith(k.slice(0,-1))):pal.includes(k);
  for(const[cat,termos]of CATMOV_REGRAS)if(termos.some(casa))return cat;
  return null; // deixa em branco p/ o usuário escolher
}
function aprenderCategoria(desc,cat){const t=normTxt(desc);if(!t||!cat)return;if(!state.catsAprendidas)state.catsAprendidas={};
  const regra=(()=>{const a=state.catsAprendidas[t];delete state.catsAprendidas[t];const r=classificaMov(desc);if(a)state.catsAprendidas[t]=a;return r;})();
  if(regra===cat)delete state.catsAprendidas[t];else state.catsAprendidas[t]=cat;}
// ---- Categorias unificadas: UMA lista para contas, gastos avulsos, itens de fatura e viagem ----
// (antes eram duas listas separadas). Cor: a escolhida pelo usuário > padrão > paleta.
const PALETA_CAT=["#f97316","#14b8a6","#8b5cf6","#ec4899","#22c55e","#eab308","#3b82f6","#ef4444","#06b6d4","#84cc16"];
function categorias(){
  const s=new Set([...Object.keys(CATCOLORS),...Object.keys(CATMOV).filter(c=>c!=="Renda extra"),...Object.keys(state.coresCat||{}),
    ...Object.keys(state.catContaCores||{}),...(state.catsUser||[]),...Object.values(state.catConta||{})]);
  (state.catsOcultas||[]).forEach(c=>s.delete(c));s.delete("Outros");
  return[...s].sort((a,b)=>a.localeCompare(b,"pt-BR")).concat("Outros");
}
const categoriasDeGasto=()=>categorias();
function corCategoria(c){
  const u=(state.coresCat||{})[c]||CATCOLORS[c]||CATMOV[c]||(state.catContaCores||{})[c]||(state.catsUserCores||{})[c];if(u)return u;
  let h=0;for(const ch of String(c))h=(h*31+ch.charCodeAt(0))>>>0;return PALETA_CAT[h%PALETA_CAT.length];
}
function catsMovList(){return categorias();}
function corCat(c){return corCategoria(c);}
const FIXO_DEFAULT = {"Aluguel":1,"Condomínio":1,"Internet":1,"Celular":1,"Carro":1,"IPVA":1,"Empréstimo":1,"Escola / filhos":1,
  "Luz":0,"Água":0,"Gás":0,"Cartão de crédito":0,"Lazer":0,"Outros":0};
// Dados históricos reais (salário, contas, dívidas) NÃO ficam no código — ver dados-pessoais/

// ou digitados nas abas Editar dados / Folha / Dívidas.
const SEED = [];
const PAGOS_SEED={};
const KEY="financas-v2";
const DEFAULT={titulo:"Minhas Finanças",meses:SEED,tipos:{...FIXO_DEFAULT},
  meta:{alvo:0,atual:0,aporte:0,taxa:8},
  simg:{texto:"",itens:[],extras:[],guardado:{total:0,meses:0},base:null,salBase:null,baseOver:{},retirada:0,reserva:0,sobraMin:0,cenarios:[],horizonte:12,simView:"reforco"},
  futuros:[],pagos:PAGOS_SEED,alertEmail:"",movs:{},catsUser:[],catsUserCores:{},catConta:{},catContaCores:{},vencDia:{},detalhavel:{},metasCurto:[],aloc:{montante:0,itens:{}},aportes:[],parcelas:{},provMetodo:{},prevSel:["__total__"],metasCat:{},visSel:"todos",sobraAlvo:0,_aparelhos:{},
  folha:{bruto:0,creche:0,pgbl:0,va:0,seguro:0,vaCred:0,dep:0,inssManual:null,irrfManual:null,outros:[]},
  folhaCfg:{inssTetoSal:8475.55,inssTeto:988.07,depDed:189.59,inssFaixas:[[1621.00,7.5],[2902.84,9],[4354.27,12],[8475.55,14]],
    irrf:[[2428.80,0,0],[2826.65,7.5,182.16],[3751.05,15,394.16],[4664.68,22.5,675.49],[999999999,27.5,908.73]],

// ---- Migração: única função, usada tanto no load() quanto no importar() ----
// Garante que um estado vindo de qualquer versão anterior (ou de um backup antigo)
// fique com todos os campos no formato atual. Idempotente: pode rodar mais de uma vez.
function migrarEstado(oIn){
  const o={...DEFAULT,...oIn};
  if(!o.simg||!Array.isArray(o.simg.itens))o.simg=JSON.parse(JSON.stringify(DEFAULT.simg));
  if(!Array.isArray(o.simg.extras))o.simg.extras=[];
  if(!o.simg.baseOver)o.simg.baseOver={};
  if(!o.simg.horizonte)o.simg.horizonte=12;
  if(!o.simg.simView)o.simg.simView="reforco";
  if(!o.simg.guardado)o.simg.guardado={total:0,meses:0};
  o.simg.cenarios=(o.simg.cenarios||[]).map(c=>{
    if(c&&c.cfg)return{nome:c.nome,itens:c.cfg.itens||[],extras:c.cfg.extras||[],guardado:c.cfg.guardado||{total:0,meses:0}};
    return c;}).filter(c=>c&&Array.isArray(c.itens));
  // unifica extras (mes->mesIni/meses) e absorve guardado como um extra diluído
  o.simg.cenarios.forEach(c=>{
    c.extras=(c.extras||[]).map(e=>({nome:e.nome,valor:+e.valor||0,mesIni:+(e.mesIni||e.mes||1),meses:+(e.meses>1?e.meses:1)||1,fonte:e.fonte||"extra"}));
    if(c.guardado&&+c.guardado.total>0&&!c.extras.some(e=>e.fonte==="guardado")){
      c.extras.push({nome:"Dinheiro guardado",valor:+c.guardado.total,mesIni:1,meses:+c.guardado.meses||1,fonte:"guardado"});
    }
    delete c.guardado;
  });
  if((o.simg.itens||[]).length&&!o.simg.cenarios.length){
    o.simg.cenarios=[{nome:o.simg.texto||"Cenário 1",itens:o.simg.itens,extras:o.simg.extras||[],guardado:o.simg.guardado||{total:0,meses:0}}];
    o.simg.itens=[];o.simg.extras=[];o.simg.guardado={total:0,meses:0};}
  if(!o.meta||typeof o.meta!=="object")o.meta={...DEFAULT.meta,alvo:+o.meta||0}; // backup antigo/errado com a meta como número
  if(!Array.isArray(o.futuros))o.futuros=[];
  if(!Array.isArray(o.meses))o.meses=[];
  if(!o.pagos||typeof o.pagos!=="object")o.pagos={};
  if(!o.movs||typeof o.movs!=="object")o.movs={};
  if(!Array.isArray(o.catsUser))o.catsUser=[];
  if(!o.catsUserCores)o.catsUserCores={};
  if(!o.provMetodo)o.provMetodo={};
  if(!o.catConta)o.catConta={};
  if(!o.catContaCores)o.catContaCores={};
  if(!o.vencDia)o.vencDia={};
  if(!o.detalhavel)o.detalhavel={};
  if(!o.parcelas)o.parcelas={};
  if(!Array.isArray(o.metasCurto))o.metasCurto=[];
  if(!o.aloc||typeof o.aloc!=="object")o.aloc={montante:0,itens:{}};
  if(!o.aloc.itens)o.aloc.itens={};
  if(!Array.isArray(o.aportes))o.aportes=[];
  o.meses.forEach(mm=>{if(!mm.orcado)mm.orcado={};});
  o._pagosInit=1; // (a migração antiga que marcava jan–jul/2026 como pagas foi removida: valia só para a planilha original)
  if(!o.tipos)o.tipos={...FIXO_DEFAULT};
  if(!o.folha)o.folha=JSON.parse(JSON.stringify(DEFAULT.folha));
  if(!Array.isArray(o.folha.outros))o.folha.outros=[];
  if(!o.folhaCfg)o.folhaCfg=JSON.parse(JSON.stringify(DEFAULT.folhaCfg));
  if(!Array.isArray(o.folhaCfg.inssFaixas))o.folhaCfg.inssFaixas=JSON.parse(JSON.stringify(DEFAULT.folhaCfg.inssFaixas));
  if(!o.folhaCfg.redutor)o.folhaCfg.redutor=JSON.parse(JSON.stringify(DEFAULT.folhaCfg.redutor));
  if(!o._pgblFix){o._pgblFix=1;}
  if(!o._vaFix){o._vaFix=1;}
  if(!o._act26){o._act26=1;}
  if(!o.coresCat)o.coresCat={};if(!o.catsAprendidas)o.catsAprendidas={};if(!Array.isArray(o.catsOcultas))o.catsOcultas=[];
  if(!o._pagoRealFix){o.meses.forEach(m=>{Object.entries(m.pagoReal||{}).forEach(([n,v])=>{if(+v>0&&o.pagos&&o.pagos[m.ym]&&o.pagos[m.ym][n]&&+m.contas[n]!==+v){
      if(!m.orcado)m.orcado={};if(!(n in m.orcado))m.orcado[n]=+m.contas[n];m.contas[n]=+v;}});});o._pagoRealFix=1;}
  if(!o._aparelhos||typeof o._aparelhos!=="object"||Array.isArray(o._aparelhos))o._aparelhos={};
  if(!Array.isArray(o.ferias))o.ferias=[];
  o.ferias.forEach(fr=>{const v=fr.viagem||(fr.viagem={planos:[],gastos:[]});
    (v.planos||[]).forEach(pl=>{if(pl.destino==null)pl.destino=v.destino||"";if(pl.ida==null&&v.ida)pl.ida=v.ida;if(pl.volta==null&&v.volta)pl.volta=v.volta;});
    (v.gastos||[]).forEach(g=>{if(!g.planoId)g.planoId=v.planoAtivoId||null;});
    (v.planos||[]).forEach(pl=>{if(pl.alimentacaoDiaPorPessoa!=null&&!(pl.alimentacao&&pl.alimentacao.extras!=null)){pl.alimentacao={...(pl.alimentacao||{}),extras:+pl.alimentacaoDiaPorPessoa};}delete pl.alimentacaoDiaPorPessoa;
      if(pl.hospedagem&&!pl.hospedagem.inclui)pl.hospedagem.inclui={};});
    if(fr.diasDireito==null)fr.diasDireito=30;if(fr.aquisitivo==null)fr.aquisitivo="atual";});
  return o;
}
let avisoCorrompido=null; // setado se o load() precisou recuperar de um JSON corrompido
// lsConhecido: o texto salvo no aparelho que ESTA janela conhece (leu ou gravou por último). Se o
// que está lá for diferente, outra janela/aba do app gravou no meio — ver absorverOutraAba().
let lsConhecido=null;
let state=load();
function load(){
  try{
    const s=localStorage.getItem(KEY);lsConhecido=s;
    if(!s)return JSON.parse(JSON.stringify(DEFAULT));
    let parsed;
    try{parsed=JSON.parse(s);}
    catch(eParse){
      // JSON corrompido: NUNCA sobrescrever — guarda uma cópia à parte e avisa.
      const chaveBkp=KEY+"__corrompido_"+new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
      try{localStorage.setItem(chaveBkp,s);}catch(e2){}
      avisoCorrompido=chaveBkp;
      return JSON.parse(JSON.stringify(DEFAULT));
    }
    return migrarEstado(parsed);
  }catch(e){
    // erro inesperado fora do parse (ex.: localStorage bloqueado) — também não sobrescreve.
    avisoCorrompido="erro:"+(e&&e.message||e);
    return JSON.parse(JSON.stringify(DEFAULT));
  }
}
function renderAvisoCorrompido(){
  if(!avisoCorrompido)return"";
  const chave=avisoCorrompido;
  return `<div class="card" style="border-color:var(--rose);background:#fff1f2">
    <h3 style="color:var(--rose)">⚠️ Não consegui ler seus dados salvos</h3>
    <p class="note">O painel abriu <b>vazio</b> de propósito, para não arriscar apagar nada. Os dados antigos (possivelmente corrompidos) ficaram guardados em outra chave do seu navegador${chave.startsWith("erro:")?"":" (<code>"+chave+"</code>)"} e <b>não foram sobrescritos</b> — se você salvar algo agora, confirme antes se não quer tentar recuperá-los.</p>
    <p class="note">Se tiver um backup exportado (.json), importe pela aba Backup. Avise quem mantém o painel para investigar essa chave antes de continuar usando.</p>
    <button class="btn" onclick="avisoCorrompido=null;render()">Entendi, continuar</button>
  </div>`;
}
// ---- Backup automático rotativo: guarda até 5 cópias do estado, uma por dia ----
const KEY_BKP=KEY+"__auto";
function backupRotativo(){
  try{
    const hoje=new Date().toISOString().slice(0,10);
    const lista=JSON.parse(localStorage.getItem(KEY_BKP)||"[]");
    if(lista.length&&lista[lista.length-1].dia===hoje){lista[lista.length-1].json=JSON.stringify(state);}
    else lista.push({dia:hoje,json:JSON.stringify(state)});
    while(lista.length>5)lista.shift();
    localStorage.setItem(KEY_BKP,JSON.stringify(lista));
  }catch(e){/* backup automático é best-effort; nunca deve quebrar o salvamento principal */}
}
function listarBackupsAuto(){try{return JSON.parse(localStorage.getItem(KEY_BKP)||"[]");}catch(e){return[];}}
function restaurarBackupAuto(dia){
  const lista=listarBackupsAuto();const item=lista.find(x=>x.dia===dia);if(!item)return;
  if(!confirm("Restaurar o backup automático de "+dia+"? Isso substitui os dados atuais (o estado atual também foi salvo automaticamente antes, então nada se perde)."))return;
  backupRotativo();
  state=migrarEstado(JSON.parse(item.json));avisoCorrompido=null;save();render();
  alert("Backup de "+dia+" restaurado.");
}

// Cada janela grava em KEY+"__app" a versão do código que está rodando. Se outra janela abriu uma
// versão MAIS NOVA, esta (velha) para de gravar no aparelho e recarrega — era assim que uma janela
// antiga esquecida aberta apagava o mês novo criado na janela nova.
const KEY_APP=KEY+"__app";
const cmpVersao=(a,b)=>String(a).localeCompare(String(b),"en",{numeric:true});
function janelaVelha(){
  if(typeof APP_VERSAO_TXT==="undefined")return false;
  let v=null;try{v=localStorage.getItem(KEY_APP);}catch(e){}
  if(!v||cmpVersao(v,APP_VERSAO_TXT)<=0)return false;
  registrar("janela velha ("+APP_VERSAO_TXT+" < "+v+"): não gravou");
  if(!janelaVelha.avisou&&typeof location!=="undefined"&&location.reload){janelaVelha.avisou=1;
    alert("Esta janela está com uma versão antiga do app (há uma mais nova aberta em outra janela). Ela vai recarregar agora.");location.reload();}
  return true;
}

// ---- Diagnóstico: últimos 40 eventos de gravação/sincronização (aba Backup → card da conta) ----
const KEY_LOG=KEY+"__log";
function registrar(ev){try{
  const ms=(state&&state.meses)||[],ult=ms.map(m=>m.ym).sort().slice(-1)[0]||"-";
  const l=JSON.parse(localStorage.getItem(KEY_LOG)||"[]");
  const ant=l[l.length-1],resumo=ms.length+" meses · último "+ult;
  if(ant&&ant.ev===ev&&ant.r===resumo&&Date.now()-ant.t<60000)ant.t=Date.now(); // não repete "salvo" a cada tecla
  else l.push({t:Date.now(),ev,r:resumo});
  while(l.length>40)l.shift();localStorage.setItem(KEY_LOG,JSON.stringify(l));}catch(e){}}
function lerLog(){try{return JSON.parse(localStorage.getItem(KEY_LOG)||"[]");}catch(e){return[];}}
// Várias janelas do app abertas no mesmo navegador (app instalado + aba, duas abas) dividem o mesmo
// armazenamento, mas cada uma tem o seu "state" na memória. Sem isto, uma janela aberta antes de uma
// importação continuava com os dados velhos e, ao salvar ou sincronizar, gravava-os por cima.
// Aqui, se outra janela gravou desde a última vez que esta leu/gravou, junta em 3 vias: base = o que
// esta janela conhecia; vale o que cada uma mudou em relação a isso. Devolve true se absorveu algo.
function absorverOutraAba(){
  if(janelaVelha())return false;
  let atual;try{atual=localStorage.getItem(KEY);}catch(e){return false;}
  if(atual==null||atual===lsConhecido)return false;
  try{
    const outro=migrarEstado(JSON.parse(atual));
    const base=lsConhecido?migrarEstado(JSON.parse(lsConhecido)):null;
    state=migrarEstado(mesclarEstados(state,outro,base,base?null:{bVence:true}));
    if(typeof reaplicarRenomes==="function")reaplicarRenomes();
  }catch(e){return false;}
  lsConhecido=atual;registrar("juntou com outra janela");
  if(typeof recarregarSync==="function")recarregarSync();
  return true;
}
if(typeof window!=="undefined"&&window.addEventListener)window.addEventListener("storage",e=>{
  if(e.key===KEY){if(absorverOutraAba()&&typeof render==="function")(typeof renderSeguro==="function"?renderSeguro:render)();}
  else if(e.key===KEY+"__sync"&&typeof recarregarSync==="function")recarregarSync();});

// ---- Exclusões registradas: sem isso, ao juntar dados de dois aparelhos o que foi apagado num
// deles "voltaria" do outro. Guarda {chave: quando}. Registros de lista usam o id (ou ym, nos
// meses); chaves de objeto usam o caminho ("/meses/2026-10/contas/Luz"). ----
function marcarApagado(k){if(!state._apagados)state._apagados={};state._apagados[k]=Date.now();}
// recriar algo que já foi apagado (mesmo mês, mesma conta, mesmo parcelamento): o marcador vira
// negativo = "revivido em"; na junção vale o marcador mais recente (exclusão ou revivência)
function marcarRevivido(k){if(state._apagados&&state._apagados[k]>0)state._apagados[k]=-Date.now();}

// ---- Juntar dois estados (sincronização e "Importar e juntar") ----
// Junção em TRÊS vias quando há "base" (como os dados estavam na última sincronização deste
// aparelho): para cada campo, se só um lado mudou em relação à base, vale esse lado — assim uma
// alteração qualquer no outro aparelho não desfaz o que foi feito aqui. Só quando OS DOIS mudaram o
// mesmo campo vale o lado editado por último (_atualizadoEm). Sem base (1ª vez, "Importar e
// juntar"), é a junção de duas vias de antes.
// Listas de registros com id (ou ym): união por chave; só sai o que foi apagado com marcarApagado()
// (marcador em _apagados). Registro ausente de um lado, sem marcador, continua.
function iguais(x,y){
  if(x===y)return true;if(typeof x!==typeof y||x===null||y===null||typeof x!=="object")return false;
  if(Array.isArray(x)!==Array.isArray(y))return false;
  if(Array.isArray(x)){if(x.length!==y.length)return false;for(let i=0;i<x.length;i++)if(!iguais(x[i],y[i]))return false;return true;}
  const kx=Object.keys(x),ky=Object.keys(y);if(kx.length!==ky.length)return false;for(const k of kx)if(!(k in y)||!iguais(x[k],y[k]))return false;return true;
}
function mesclarEstados(a,b,base,opc){
  // opc.bVence: sem base, quem vence nos conflitos é b (a nuvem) — um aparelho recém-atualizado
  // não sabe o que mudou nele, então não pode sobrescrever a nuvem com valores possivelmente velhos
  const aVence=opc&&opc.bVence?false:(+a._atualizadoEm||0)>=(+b._atualizadoEm||0);
  const tomb={...(b._apagados||{}),...(a._apagados||{})};
  Object.keys(b._apagados||{}).forEach(k=>{const x=tomb[k]||0,y=b._apagados[k];tomb[k]=Math.abs(y)>Math.abs(x)?y:x;});
  const apagado=k=>(tomb[k]||0)>0;
  const NADA={}; // marcador de "não existe"
  const obj=x=>x&&typeof x==="object"&&!Array.isArray(x);
  const chave=x=>obj(x)?(x.id!=null?x.id:(x.ym!=null?x.ym:null)):null;
  const temRegistros=v=>Array.isArray(v)&&v.length>0&&v.every(e=>chave(e)!=null);
  function m(x,y,z,path){
    if(iguais(x,y))return x;
    // regra das 3 vias (só um lado mudou em relação à base → vale esse lado). NÃO vale para listas de
    // registros nem para objetos que as contêm: lá a junção é item a item, senão um lado com dados
    // velhos (que nunca teve o mês novo) levaria a lista inteira e o mês sumiria.
    const tresVias=()=>{if(z!==NADA){if(iguais(x,z))return{v:y};if(iguais(y,z))return{v:x};}return null;};
    if(Array.isArray(x)&&Array.isArray(y)){
      const zArr=Array.isArray(z)?z:[];
      const todos=[...x,...y];
      if(!(todos.length&&todos.every(e=>chave(e)!=null))){const r=tresVias();if(r)return r.v;}
      else{
        const mz=new Map(zArr.filter(e=>chave(e)!=null).map(e=>[String(chave(e)),e]));
        const ordem=[],mapa=new Map();
        const add=(e,lado)=>{const k=String(chave(e));if(apagado(k))return;if(!mapa.has(k)){mapa.set(k,{});ordem.push(k);}mapa.get(k)[lado]=e;};
        (aVence?x:y).forEach(e=>add(e,aVence?"x":"y"));(aVence?y:x).forEach(e=>add(e,aVence?"y":"x"));
        const out=[];
        ordem.forEach(k=>{const v=mapa.get(k),zb=mz.has(k)?mz.get(k):NADA;
          if(v.x&&v.y){out.push(m(v.x,v.y,zb,path+"/"+k));return;}
          // só um lado tem: fica. Sumir de um lado sem marcador em _apagados NÃO é exclusão — uma janela
          // ou aparelho com dados velhos (que nunca teve o registro) não pode apagar um mês novo.
          // Exclusões de verdade passam por marcarApagado() e já foram barradas no add() acima.
          out.push(v.x||v.y);});
        return out;
      }
      return aVence?x:y;
    }
    if(obj(x)&&obj(y)){
      const zo=obj(z)?z:null,o={};
      new Set([...Object.keys(x),...Object.keys(y)]).forEach(k=>{
        const p=path+"/"+k;if(apagado(p)||k==="_apagados")return;
        const zk=zo&&(k in zo)?zo[k]:NADA;
        if(k in x&&k in y){o[k]=m(x[k],y[k],zk,p);return;}
        const v=k in x?x[k]:y[k];
        if(zk!==NADA&&iguais(v,zk)&&!temRegistros(v))return; // o outro lado removeu esta chave e este não mexeu (lista de registros: só com marcador)
        o[k]=v;
      });
      return o;
    }
    {const r=tresVias();if(r)return r.v;}
    return aVence?x:y;
  }
  const r=m(a,b,base?base:NADA,"");
  const limite=Date.now()-180*86400000; // esquece exclusões com mais de 6 meses
  r._apagados={};Object.entries(tomb).forEach(([k,t])=>{if(Math.abs(t)>limite)r._apagados[k]=t;});
  r._atualizadoEm=Math.max(+a._atualizadoEm||0,+b._atualizadoEm||0);
  return r;
}
// renomear/mesclar conta mexe em muitos lugares; guardamos o histórico e reaplicamos depois de juntar
function reaplicarRenomes(){
  (state._renomes||[]).slice().sort((x,y)=>x.ts-y.ts).forEach(r=>{if(allContas().includes(r.de))mesclarContas(r.de,r.para,true);});
}

// SOBRA — uma definição só no app inteiro: o que entra no mês menos o que sai.

function avulsosDoMes(ym){let gasto=0,renda=0;((state.movs&&state.movs[ym])||[]).forEach(x=>{if(x.tipo==="renda")renda+=(+x.valor||0);else gasto+=(+x.valor||0);});return{gasto:r2(gasto),renda:r2(renda)};}
const sobraContas=m=>r2(renda(m)-totalContas(m));

// "resto" não detalhado = total da conta − soma dos itens (nunca negativo)
function restoFatura(m,n){return Math.max((+m.contas[n]||0)-somaItens(m,n),0);}
function addItemFatura(idx,n){

const tipoOf=n=>{if(state.tipos&&n in state.tipos)return state.tipos[n]?"Fixo":"Variável";return FIXO_DEFAULT[n]?"Fixo":"Variável";};
const setTipo=(n,v)=>{state.tipos[n]=v?1:0;save();};
function renomear(){const t=prompt("Nome do painel:",state.titulo);if(t){state.titulo=t;save();document.getElementById("titulo").textContent=t;document.title=t;}}
const porCat=m=>{const o={};for(const[k,v]of Object.entries(m.contas)){
  const val=+v||0;if(!val)continue;
  if(ehDetalhavel(k)&&itensFatura(m,k).length){
    const soma=somaItens(m,k),f=soma>val?val/soma:1; // itens passando do total da fatura: proporcional
    itensFatura(m,k).forEach(it=>{const c=it.cat||catOf(k);o[c]=(o[c]||0)+(+it.valor||0)*f;});
    const resto=restoFatura(m,k);if(resto>0){const c=catOf(k);o[c]=(o[c]||0)+resto;}
  }else{const c=catOf(k);o[c]=(o[c]||0)+val;}
}return o;};
const clamp=(v,a,b)=>Math.min(Math.max(v,a),b);
const ymAdd=(ym,k)=>{const d=new Date(+ym.slice(0,4),+ym.slice(5)-1+k,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");};

function holt(ys,a=0.5,b=0.3){
  const at=ys.filter(v=>v!==null&&v!==undefined);
  if(at.length<2)return at[0]||0;
  let l=at[0],t=at[1]-at[0];
  for(let i=1;i<at.length;i++){const pl=l;l=a*at[i]+(1-a)*(l+t);t=b*(l-pl)+(1-b)*t;}
  return l+t;
}
const fixosDoMes=m=>Object.entries(m.contas).filter(([n])=>tipoOf(n)==="Fixo").reduce((s,[,v])=>s+(+v||0),0);
// Score de saúde (0–100), sempre sobre o mês e com as MESMAS definições do resto do app:
//  40 · sobra ÷ renda (cheio a partir de 20%)   30 · fixos ÷ renda (cheio até 50%, zero a partir de 80%)
//  20 · dívidas ÷ renda (cheio até 15%, zero a partir de 40%) — dívida = conta na categoria
//       "Dívidas e cartões" OU com parcelamento configurado (financiamento, empréstimo...)
//  10 · consistência: meses com sobra positiva entre os 3 últimos
// renda aqui = renda + recebimentos avulsos (a mesma base da sobra única).
function ehDivida(n){return catOf(n)==="Dívidas e cartões"||!!(state.parcelas&&state.parcelas[n]);}
function scoreMes(idx){
  const ms=mesesA();const m=ms[idx];if(!m)return null;
  const r=r2(renda(m)+avulsosDoMes(m.ym).renda);if(r<=0)return null;
  const sb=sobra(m),fix=fixosDoMes(m);
  const contasDiv=Object.entries(m.contas).filter(([n,v])=>+v>0&&ehDivida(n));
  const div=r2(contasDiv.reduce((s,[,v])=>s+(+v||0),0));
  const p1=clamp((sb/r)/0.20,0,1)*40;
  const p2=clamp((0.80-fix/r)/0.30,0,1)*30;
  const p3=clamp((0.40-div/r)/0.25,0,1)*20;
  const w=ms.slice(Math.max(idx-2,0),idx+1);
  const pos=w.filter(x=>sobra(x)>0).length;
  const p4=(pos/w.length)*10;
  return{total:Math.round(p1+p2+p3+p4),p1:Math.round(p1),p2:Math.round(p2),p3:Math.round(p3),p4:Math.round(p4),
    det:{ym:m.ym,renda:r,sobra:sb,fixos:r2(fix),dividas:div,contasDiv:contasDiv.map(([n,v])=>[n,+v]),pos,janela:w.map(x=>[x.ym,sobra(x)])}};
}
function sazonalidade(){
  const ms=mesesA();
  if(ms.length<12)return{ok:false,faltam:12-ms.length,itens:[]};
  const itens=[];
  for(const c of allContas()){
    const pts=ms.map(m=>({mm:+m.ym.slice(5),v:+m.contas[c]||0}));
    const at=pts.filter(p=>p.v>0);if(at.length<4)continue;
    const media=at.reduce((s,p)=>s+p.v,0)/at.length;
    const porMes={};pts.forEach(p=>{(porMes[p.mm]=porMes[p.mm]||[]).push(p.v);});
    for(const mm in porMes){
      const md=porMes[mm].reduce((s,v)=>s+v,0)/porMes[mm].length;
      if(md>media*1.5&&md>100)itens.push("<b>"+c+"</b> historicamente pesa em "+NM[mm-1]+" ("+fmt0(md)+" vs média "+fmt0(media)+").");
    }
  }
  return{ok:true,itens:itens.slice(0,6)};
}
function linreg(ys){const n=ys.length;if(n<2)return{a:ys[0]||0,b:0};let sx=0,sy=0,sxy=0,sxx=0;ys.forEach((y,i)=>{sx+=i;sy+=y;sxy+=i*y;sxx+=i*i;});const b=(n*sxy-sx*sy)/(n*sxx-sx*sx||1);const a=(sy-b*sx)/n;return{a,b};}
const mm3=ys=>ys.slice(-3).reduce((s,v)=>s+v,0)/Math.min(3,ys.length||1);
const mediana=ys=>{const a=[...ys].sort((x,y)=>x-y);const n=a.length;return n?(n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2):0;};

function pendenciasDe(ym){

function vencDe(n){return state.vencDia&&+state.vencDia[n]||0;}

// dias até o vencimento de uma conta no mês corrente (negativo = atrasada). null se sem dia definido.
function diasAteVenc(n){
  const dia=vencDe(n);if(!dia)return null;
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const alvo=new Date(hoje.getFullYear(),hoje.getMonth(),Math.min(dia,new Date(hoje.getFullYear(),hoje.getMonth()+1,0).getDate()));
  return Math.round((alvo-hoje)/86400000);
}
// vencimentos do mês corrente ainda não pagos
function vencimentosPendentes(){
  const ym=mesAtualYm();const m=meses().find(x=>x.ym===ym);if(!m)return[];
  const P=state.pagos[ym]||{};
  return Object.entries(m.contas).filter(([n,v])=>+v>0&&!P[n]&&vencDe(n))
    .map(([n,v])=>({n,v:+v,dias:diasAteVenc(n),dia:vencDe(n)}))

}
function renderAlerta(){
  const el=document.getElementById("alerta");if(!el)return;

  if(alertaOff||!["inicio","mes"].includes(grupoDe(tab).id)){el.innerHTML="";return;}
  let html="";
  // A) vencimentos próximos/atrasados do mês corrente
  const vp=vencimentosPendentes();
  const atras=vp.filter(x=>x.dias<0);
  const hoje=vp.filter(x=>x.dias===0);
  const breve=vp.filter(x=>x.dias>0&&x.dias<=3);
  if(atras.length||hoje.length||breve.length){
    const partes=[];
    if(atras.length)partes.push('<b style="color:#be123c">'+atras.length+' atrasada(s)</b> ('+atras.map(x=>esc(x.n)+" há "+(-x.dias)+"d").join(", ")+")");
    if(hoje.length)partes.push('<b style="color:#be123c">vence HOJE:</b> '+hoje.map(x=>esc(x.n)+" ("+fmt(x.v)+")").join(", "));
    if(breve.length)partes.push('<b style="color:#b45309">vence em breve:</b> '+breve.map(x=>esc(x.n)+" em "+x.dias+"d").join(", "));
    const cor=(atras.length||hoje.length)?"var(--rose)":"var(--amber)";
    const bg=(atras.length||hoje.length)?"#fff1f2":"#fffbeb";
    html+=`<div class="card" style="border-color:${cor};background:${bg};display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <span style="font-size:13px">📅 ${partes.join(" · ")}</span>
      <span class="row"><button class="btn" onclick="go('pagto')">ver Status</button></span></div>`;
  }
  // B) pendências gerais do último mês do histórico (nada a checar sem nenhum mês cadastrado)
  const last=meses()[meses().length-1];
  if(!last){el.innerHTML=html;return;}

  const tot=pend.reduce((s,x)=>s+x.v,0);

  el.innerHTML=html;
}

// ============ MOVIMENTOS DO MÊS (caixa real) ============
const movsDoMes=ym=>(state.movs[ym]||[]).slice().sort((a,b)=>(a.dia||0)-(b.dia||0));
function pagoNoMes(ym){ // soma das contas marcadas como pagas na aba Status
  const m=meses().find(x=>x.ym===ym);if(!m)return 0;
  const P=state.pagos[ym]||{};
  return r2(Object.entries(m.contas).reduce((s,[n,v])=>s+((+v>0&&P[n])?((m.pagoReal&&+m.pagoReal[n])||+v):0),0));
}
function contasDoMes(ym){const m=meses().find(x=>x.ym===ym);return m?totalContas(m):0;}
// caixa que sobra AGORA: renda - contas já pagas - gastos avulsos + rendas extras
function caixaReal(ym){
  const m=meses().find(x=>x.ym===ym);if(!m)return{ini:0,pago:0,gasto:0,extra:0,saldo:0,previsto:0};
  const r=renda(m);
  const pago=pagoNoMes(ym);
  const movs=state.movs[ym]||[];
  const gasto=r2(movs.filter(x=>x.tipo!=="renda").reduce((s,x)=>s+(+x.valor||0),0));
  const extra=r2(movs.filter(x=>x.tipo==="renda").reduce((s,x)=>s+(+x.valor||0),0));
  const contasTot=r2(totalContas(m));
  const P=state.pagos[ym]||{};
  const aPagar=r2(Object.entries(m.contas).reduce((s,[n,v])=>s+((+v>0&&!P[n])?+v:0),0)); // contas ainda não pagas
  const inicial=r2(+((state.saldoInicial||{})[ym])||0); // o que já havia na conta no começo do mês (opcional)
  const saldoAgora=r2(inicial+r+extra-pago-gasto);
  return{
    renda:r, pago, gasto, extra, inicial,
    saldoAgora,                              // o que tem em conta considerando só o já pago
    aPagar,
    saldoFim:r2(saldoAgora-aPagar),          // projeção fim do mês: todas as contas pagas
    contasTot
  };
}
function setSaldoInicial(ym,v){if(!state.saldoInicial)state.saldoInicial={};if(v===""||v==null)delete state.saldoInicial[ym];else state.saldoInicial[ym]=+v;save();render();}
function conciliar(ym){
  const el=document.getElementById("concSaldo");const banco=+((el&&el.value)||NaN);
  if(!isFinite(banco)){alert("Digite o saldo real que aparece no banco.");return;}
  const C=caixaReal(ym);const dif=r2(banco-C.saldoAgora);
  if(Math.abs(dif)<0.005){alert("✅ Bateu! Ferramenta e banco mostram "+fmt(banco)+".");return;}
  const lado=dif<0?"O banco tem MENOS que a ferramenta (faltou lançar um gasto ou um débito foi maior).":"O banco tem MAIS que a ferramenta (faltou lançar um recebimento ou um débito foi menor).";
  if(confirm("Diferença: "+fmt(dif)+" ("+fmt(banco)+" no banco × "+fmt(C.saldoAgora)+" aqui).\n"+lado+"\n\nRegistrar um AJUSTE DE CONCILIAÇÃO de "+fmt(Math.abs(dif))+" para alinhar? (vira um lançamento avulso, dá para excluir depois)")){
    if(!state.movs[ym])state.movs[ym]=[];
    state.movs[ym].push({id:uid(),nome:"Ajuste de conciliação (banco "+fmt(banco)+")",valor:Math.abs(dif),tipo:dif<0?"gasto":"renda",cat:"Outros",dia:new Date().getDate()});
    save();render();
  }
}

function vSobras(){

  if(!sobSel||!all.some(m=>m.ym===sobSel)){

// ============ COMPARAR ============
let cmpA=null,cmpB=null;
function vComparar(){
  const ms=mesesA();
  if(ms.length<2)return'<div class="card"><p class="note">Para comparar, é preciso ter pelo menos 2 meses cadastrados (aba Editar dados).</p></div>';
  if(cmpA===null||cmpA>=ms.length||cmpB>=ms.length){cmpA=ms.length-2;cmpB=ms.length-1;}
  const opts=i=>ms.map((m,j)=>`<option value="${j}" ${j===i?'selected':''}>${lbl(m.ym)}</option>`).join("");
  const A=ms[cmpA],B=ms[cmpB];
  const nomes=[...new Set([...Object.keys(A.contas),...Object.keys(B.contas)])];
  const rows=nomes.map(n=>({n,a:+A.contas[n]||0,b:+B.contas[n]||0})).map(r=>({...r,d:r.b-r.a})).sort((x,y)=>y.d-x.d);
  const dTot=totalContas(B)-totalContas(A);
  const sobe=rows.filter(r=>r.d>1),desce=rows.filter(r=>r.d<-1);
  return `
  <div class="card"><div class="row">
    <span>Comparar</span><select onchange="cmpA=+this.value;render()">${opts(cmpA)}</select>
    <span>com</span><select onchange="cmpB=+this.value;render()">${opts(cmpB)}</select>
    <span class="pill ${dTot>0?'rose':'teal'}">${dTot>0?'▲ contas subiram':'▼ contas caíram'} ${fmt0(Math.abs(dTot))}</span>
  </div></div>
  <div class="card"><h3>O que mudou de ${lbl(A.ym)} para ${lbl(B.ym)}</h3><div class="chartbox"><canvas id="cDelta"></canvas></div></div>
  <div class="grid g2">
    <div class="card"><h3 class="rose">Aumentaram (${sobe.length})</h3><table><tr><th>Conta</th><th class="n">${lbl(A.ym)}</th><th class="n">${lbl(B.ym)}</th><th class="n">Δ</th></tr>
      ${sobe.map(r=>`<tr><td>${esc(r.n)}</td><td class="n">${fmt0(r.a)}</td><td class="n">${fmt0(r.b)}</td><td class="n up">+${fmt0(r.d)}</td></tr>`).join("")||"<tr><td colspan=4>—</td></tr>"}</table></div>
    <div class="card"><h3 class="teal">Diminuíram (${desce.length})</h3><table><tr><th>Conta</th><th class="n">${lbl(A.ym)}</th><th class="n">${lbl(B.ym)}</th><th class="n">Δ</th></tr>
      ${desce.map(r=>`<tr><td>${esc(r.n)}</td><td class="n">${fmt0(r.a)}</td><td class="n">${fmt0(r.b)}</td><td class="n down">${fmt0(r.d)}</td></tr>`).join("")||"<tr><td colspan=4>—</td></tr>"}</table></div>
  </div>`;
}

// ============ CONTAS / TENDÊNCIAS ============
let contaSel=null;
function allContas(){const s=new Set();meses().forEach(m=>Object.keys(m.contas).forEach(k=>s.add(k)));return[...s].sort();}
function serieConta(n){return mesesA().map(m=>+m.contas[n]||0);}
function fixosMed(){const l3=mesesA().slice(-3);return l3.reduce((s,m)=>s+Object.entries(m.contas).filter(([n])=>tipoOf(n)==="Fixo").reduce((a,[,v])=>a+(+v||0),0),0)/l3.length;}
function variaveisMed(){const l3=mesesA().slice(-3);return l3.reduce((s,m)=>s+Object.entries(m.contas).filter(([n])=>tipoOf(n)==="Variável").reduce((a,[,v])=>a+(+v||0),0),0)/l3.length;}
// mudança de patamar: último(s) valor(es) estáveis num nível diferente da mediana anterior
function patamarInfo(n){
  const ys=serieConta(n).map((v,i)=>({v:+v||0,ym:mesesA()[i].ym})).filter(x=>x.v>0);
  if(ys.length<3)return null;
  const ult=ys[ys.length-1],ant=ys[ys.length-2];
  const prev=ys.slice(0,-1).slice(-6).map(x=>x.v);
  const medPrev=mediana(prev);
  if(!(medPrev>0))return null;
  const dif=ult.v-medPrev,pct=dif/medPrev*100;
  if(Math.abs(pct)<10||Math.abs(dif)<30)return null;
  // confirmado se os 2 últimos estão do mesmo lado e próximos entre si
  const confirmado=Math.abs(ant.v-medPrev)/medPrev>=0.1&&Math.sign(ant.v-medPrev)===Math.sign(dif)&&Math.abs(ult.v-ant.v)/ult.v<0.1;
  return{medPrev,ult:ult.v,ymUlt:ult.ym,dif,pct,confirmado};
}
function vContas(){
  const nomes=allContas();if(!contaSel||!nomes.includes(contaSel))contaSel=nomes[0];
  const rows=nomes.map(n=>{const ys=serieConta(n);const{b}=linreg(ys);const med=ys.reduce((s,v)=>s+v,0)/ys.length;
    return{n,med,ult:ys[ys.length-1],b};}).sort((x,y)=>y.med-x.med);
  return `
  <div class="card"><div class="row"><span>Conta:</span>

  if(k==="__variaveis__")return ms.map(m=>Object.entries(m.contas).filter(([n])=>tipoOf(n)==="Variável").reduce((s,[,v])=>s+(+v||0),0));
  return ms.map(m=>+m.contas[k]||0);}
function radar(){
  const ms=mesesA();const n=ms.length;const out=[];
  if(n<3)return out;
  for(const c of allContas()){
    const ys=serieConta(c);const at=ys.filter(v=>v>0);
    if(at.length<2)continue;
    const med=mediana(at);const last=ys[n-1];
    if(n>=4&&ys[n-1]>ys[n-2]&&ys[n-2]>ys[n-3]&&ys[n-3]>ys[n-4]&&ys[n-4]>0)
      out.push(["amber","▲ <b>"+esc(c)+"</b> subiu 3 meses seguidos ("+fmt0(ys[n-4])+" → "+fmt0(last)+")."]);
    if(last>0&&med>0&&last>med*1.3)
      out.push(["rose","<b>"+esc(c)+"</b> fechou o último mês "+Math.round((last/med-1)*100)+"% acima da sua mediana ("+fmt0(med)+") — vale investigar."]);
    if(tipoOf(c)==="Fixo"&&at.length>=3){
      const mean=at.reduce((s,v)=>s+v,0)/at.length;
      const cv=Math.sqrt(at.reduce((s,v)=>s+(v-mean)**2,0)/at.length)/mean;
      if(cv>0.15)out.push(["amber","<b>"+esc(c)+"</b> está marcada como fixa, mas oscila "+Math.round(cv*100)+"% — considere reclassificar como variável (aba Editar)."]);
    }
    if(at.length/n<=0.6&&at.length>=2)
      out.push(["teal","<b>"+esc(c)+"</b> é sazonal/intermitente (aparece em "+at.length+" de "+n+" meses) — a previsão linear dela vale pouco; planeje pelo valor cheio quando ocorrer."]);
  }
  const sb=ms.map(sobra);
  if(n>=4&&sb[n-1]<sb[n-2]&&sb[n-2]<sb[n-3])out.push(["rose","Sua <b>sobra</b> caiu 2 meses seguidos ("+fmt0(sb[n-3])+" → "+fmt0(sb[n-1])+")."]);
  const ult=ms[n-1];const pc=porCat(ult);
  for(const c in state.metasCat){const mt=+state.metasCat[c]||0;const g=pc[c]||0;
    if(mt>0&&g>mt)out.push(["rose","Meta de <b>"+c+"</b> estourada em "+lbl(ult.ym)+": "+fmt0(g)+" de "+fmt0(mt)+" (+"+fmt0(g-mt)+")."]);
    else if(mt>0&&g>mt*0.9)out.push(["amber","<b>"+esc(c)+"</b> já usou "+Math.round(g/mt*100)+"% da meta em "+lbl(ult.ym)+"."]);}
  if(n>=2){const s1=scoreMes(n-1),s0=scoreMes(n-2);
    if(s1&&s0&&s1.total<s0.total-10)out.push(["rose","Seu <b>score de saúde financeira</b> caiu de "+s0.total+" para "+s1.total+" — veja os componentes na Visão geral."]);}
  const nx=ymAdd(ms[n-1].ym,1);const nv=futurosNovos(nx);
  if(nv.length)out.push(["amber","📅 <b>"+lbl(nx)+"</b> tem "+fmt0(nv.reduce((s,f)=>s+f.valor,0))+" de compromissos novos agendados: "+nv.map(f=>f.nome).join(", ")+"."]);
  const sz=sazonalidade();
  if(sz.ok)sz.itens.forEach(t=>out.push(["teal","📅 "+t]));
  (state.ferias||[]).forEach(f=>{
    if(!f.inicio||f.inicio<hojeISO())return;
    const diasFalta=Math.round((new Date(f.inicio+"T00:00:00")-new Date(hojeISO()+"T00:00:00"))/86400000);
    if(diasFalta<=60){
      const res=reservaSugeridaFerias(f),env=envelopeTetoFerias(f);
      out.push(["amber","🏖️ <b>"+(f.nome||"Férias")+"</b> em "+diasFalta+" dia(s) — reserve <b>"+fmt0(res)+"</b> para o mês seguinte e separe até <b>"+fmt0(env)+"</b> para a viagem (aba Férias)."]);
    }
  });
  return out.slice(0,11);
}

const KEYWORDS=[
 {re:/(casa|apart|apto|aluguel|imovel|moradia|mudanc|kitnet)/,alvo:"__moradia__"},

function baseMesRef(){

function baseRowsGet(){
  const S=state.simg;
  if(S.baseOver&&Object.keys(S.baseOver).length&&!Array.isArray(S.baseRows)){
    const M=baseMesRef();
    S.baseRows=allContas().map(n=>({nome:n,valor:(n in S.baseOver)?+S.baseOver[n]:(+M.contas[n]||0)})).filter(r=>r.valor>0);
    S.baseOver={};salvarLocal(); // conversão de formato antigo, não é edição do usuário
  }
  if(Array.isArray(S.baseRows))return S.baseRows;
  const M=baseMesRef();
  return Object.entries(M.contas).filter(([,v])=>+v>0).map(([n,v])=>({nome:n,valor:+v}));
}

function simBase(){

  const rows=baseRowsGet();
  const mediaConta=n=>rows.filter(r=>r.nome===n).reduce((s,r)=>s+(+r.valor||0),0);

function projCfg(cfg,N){
  const ms=mesesA();const M=ms.find(x=>x.ym===cfg.base)||ms[ms.length-1];
  const baseC={};
  if(Array.isArray(cfg.rows)){cfg.rows.forEach(r=>{baseC[r.nome]=(baseC[r.nome]||0)+(+r.valor||0);});}
  else{const ov=cfg.baseOver||{};allContas().forEach(n=>{const v=(n in ov)?+ov[n]:(+M.contas[n]||0);if(v>0)baseC[n]=v;});}
  const sal=(cfg.salBase!=null&&cfg.salBase!=="")?+cfg.salBase:(+M.salario||0);
  const out=[];let acc=0;
  for(let k=1;k<=N;k++){
    const c={...baseC};
    (cfg.itens||[]).forEach((it,ix)=>{
      const ativo=!it.dur||k<=it.dur;
      if(it.modo==="substituir"&&it.alvo){
        const tg=it.alvo==="__moradia__"?["Aluguel","Condomínio"]:[it.alvo];
        if(ativo)tg.forEach(t=>{if(t in c)c[t]=0;});
        c["__n"+ix]=ativo?+it.valor||0:0;
      }else{c["__e"+ix]=ativo?+it.valor||0:0;}
    });
    const despesa=Object.values(c).reduce((s,v)=>s+(+v||0),0);
    const extrasK=(cfg.extras||[]).reduce((s,e)=>{
      const ini=+(e.mesIni||1),mm=Math.max(1,+(e.meses||1));
      return s+((k>=ini&&k<ini+mm)?(+e.valor||0)/mm:0);
    },0);
    const rendaK=sal+extrasK;
    const sb=rendaK-despesa;acc+=sb;
    out.push({k,renda:rendaK,rendaFixa:sal,despesa,sobra:sb,sobraFixa:sal-despesa,extrasK,acc});
  }
  return out;
}
function interpretar(txt){
  const t=norm(txt);
  const nums=(txt.match(/\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?/g)||[])
    .map(x=>parseFloat(x.replace(/\./g,"").replace(",",".")))
    .filter(v=>v>0);
  let dur=0;const md=t.match(/(?:por|durante)\s*(\d{1,3})\s*(?:mes|meses)/)||t.match(/(\d{1,3})\s*(?:x|parcelas|vezes)\b/);
  if(md)dur=+md[1];
  let valor=0;
  if(nums.length){const cand=dur?nums.filter(v=>v!==dur):nums;valor=Math.max(...(cand.length?cand:nums));}
  const B=simBase();const rowNames=[...new Set(B.rows.map(r=>r.nome))];
  let alvo=null;
  for(const k of KEYWORDS){if(k.re.test(t)){alvo=k.alvo;break;}}
  if(!alvo){
    for(const n of rowNames){const words=norm(n).split(/[^a-z0-9]+/).filter(w=>w.length>3);
      if(words.some(w=>t.includes(w))){alvo=n;break;}}
  }
  const atual=alvo==="__moradia__"?B.mediaConta("Aluguel")+B.mediaConta("Condomínio"):alvo?B.mediaConta(alvo):0;
  const modo=(alvo&&atual>1)?"substituir":"extra";
  return{modo,alvo:modo==="substituir"?alvo:null,valor,dur};
}

}

function vStatus(){
  const all=meses();
  if(!pagSel||!all.some(m=>m.ym===pagSel))pagSel=all[all.length-1].ym;
  const m=all.find(x=>x.ym===pagSel);
  const P=state.pagos[pagSel]||{};
  const itens=Object.entries(m.contas).filter(([,v])=>+v>0).map(([n,v])=>({n,v:+v,pago:!!P[n]}));
  const total=itens.reduce((s,x)=>s+x.v,0);
  const pago=itens.filter(x=>x.pago).reduce((s,x)=>s+((m.pagoReal&&+m.pagoReal[x.n])||x.v),0);
  const pend=itens.filter(x=>!x.pago).reduce((s,x)=>s+x.v,0);
  const nPend=itens.filter(x=>!x.pago).length;
  const pct=total>0?pago/total*100:0;
  const r=renda(m);
  const pendFixas=itens.filter(x=>!x.pago&&tipoOf(x.n)==="Fixo");
  const maior=itens.filter(x=>!x.pago).sort((a,b)=>b.v-a.v)[0];
  const hist=all.filter(x=>!x.rascunho&&x.ym!==pagSel).slice(-3);
  const medHist=hist.length?hist.reduce((s,x)=>s+totalContas(x),0)/hist.length:0;
  const pill=(c,t)=>`<p class="note" style="margin-top:6px"><span class="pill ${c==='teal'?'teal':'rose'}" style="${c==='amber'?'background:#fef3c7;color:#92400e':''}">${c==='teal'?'✔':'⚠'}</span> ${t}</p>`;
  const alerts=[];
  if(pend<=0&&total>0)alerts.push(["teal","🎉 <b>Mês quitado!</b> Todas as "+itens.length+" contas de "+lbl(pagSel)+" estão pagas ("+fmt(total)+")."]);
  else{
    if(maior)alerts.push(["amber","Maior pendência: <b>"+maior.n+"</b> ("+fmt(maior.v)+") — "+Math.round(maior.v/pend*100)+"% do que falta."]);
    if(pendFixas.length)alerts.push(["amber",pendFixas.length+" conta(s) <b>fixa(s)</b> pendente(s) ("+fmt(pendFixas.reduce((s,x)=>s+x.v,0))+") — priorize: fixas atrasadas geram multa/juros."]);
    if(r>0){const sb=sobra(m);alerts.push([sb>=0?"teal":"rose","Pagas todas as contas (e os gastos do dia a dia já lançados), sobram <b>"+fmt(sb)+"</b> no mês."]);}
  }
  if(medHist>0&&total>medHist*1.1)alerts.push(["amber","O total deste mês ("+fmt(total)+") está "+Math.round((total/medHist-1)*100)+"% acima da média dos últimos meses ("+fmt(medHist)+")."]);
  const nProv=contarProv(m);
  if(nProv)alerts.push(["amber",nProv+" valor(es) ainda <b>provisório(s)</b> (estimados do mês anterior) — o total pode mudar quando os valores reais chegarem. Ajuste na aba Editar dados."]);
  return `

    const linhaVenc=x=>{const cor=x.dias<0?"#be123c":x.dias===0?"#be123c":x.dias<=3?"#b45309":"#0d9488";

function calcINSS(bruto){
  const C=state.folhaCfg;
  if(bruto>=C.inssTetoSal)return C.inssTeto;
  // faixas progressivas (limite, alíquota %) — editáveis em Parâmetros; a última vai até o teto
  const fx=(C.inssFaixas||DEFAULT.folhaCfg.inssFaixas).map(([l,a],i,arr)=>[i===arr.length-1?C.inssTetoSal:+l,+a/100]);
  let v=0,ant=0;
  for(const[lim,al]of fx){if(bruto>ant)v+=(Math.min(bruto,lim)-ant)*al;ant=lim;}
  return Math.min(v,C.inssTeto);
}
// rendTrib (opcional) = rendimento tributável bruto do mês; quando informado, aplica o redutor
// da Lei 15.270/2025 (vigente desde jan/2026): isenção até R$ 5.000 e redução parcial até R$ 7.350.
// Não é passado para o 13º (tributação exclusiva). Parâmetros editáveis em folhaCfg.redutor.
function calcIRRF(base,rendTrib){
  const C=state.folhaCfg;
  let ir=0;
  for(const[lim,al,ded]of C.irrf){if(base<=lim){ir=Math.max(base*al/100-ded,0);break;}}
  const R=C.redutor;
  if(rendTrib!=null&&R&&R.ativo){
    const red=rendTrib<=R.limIsencao?ir:(rendTrib<=R.limRedutor?Math.max(0,R.a-R.b*rendTrib):0);
    ir=Math.max(0,ir-red);
  }
  return ir;
}
function folhaCalc(){
  const F=state.folha;const C=state.folhaCfg;
  const inss=F.inssManual!=null?F.inssManual:calcINSS(F.bruto);
  const baseIR=Math.max(F.bruto-inss-(+F.pgbl||0)-(+F.dep||0)*C.depDed,0);
  const irrf=F.irrfManual!=null?F.irrfManual:calcIRRF(baseIR,F.bruto);
  const outros=(F.outros||[]).reduce((s,o)=>s+(+o.valor||0),0);
  const liq=F.bruto+(+F.creche||0)-inss-irrf-(+F.va||0)-(+F.seguro||0)-(+F.pgbl||0)-outros;
  return{inss,irrf,baseIR,outros,liq};
}

function classificaHolerite(texto){
  const T=texto.toUpperCase();
  // grab(palavra, modo, excluir): procura a palavra e pega o valor da linha (o último dos 2 primeiros
  // números depois dela = coluna Provento/Desconto). "excluir" ignora ocorrências cujo texto logo
  // antes bate (ex.: "DEP. IRRF" e "BASE CÁLC. IRRF" do cabeçalho/rodapé, que não são o desconto).
  const grab=(kw,which,excluir)=>{
    const re=new RegExp(kw,"g");let m;const vals=[];
    while((m=re.exec(T))){
      if(excluir&&new RegExp(excluir).test(T.slice(Math.max(0,m.index-18),m.index)))continue;
      const win=T.slice(m.index,m.index+(which==="ultimo"?140:90));
      const todos=[...win.matchAll(/(\d{1,3}(?:\.\d{3})*,\d{2})/g)].map(x=>brl(x[1]));
      const ns=which==="ultimo"?todos:todos.slice(0,2);
      if(ns.length)vals.push(ns[ns.length-1]);
    }
    if(!vals.length)return null;
    return which==="max"?Math.max(...vals):which==="ultimo"?vals[vals.length-1]:vals[0];
  };
  const CAB="DEP\\.?\\s*$|C[AÁ]LC\\.?\\s*$|BASE\\s*$|CONTRIBUI[CÇ][AÃ]O\\.?\\s*$|SAL\\.?\\s*$";
  const out={outros:[]};
  out.bruto=grab("SAL[AÁ]RIO\\s+(?:MES|BASE|DO\\s+C[AÁ]LCULO)","max")??grab("SAL[AÁ]RIO","max");
  out.creche=grab("CRECHE");
  out.inss=grab("INSS\\s*-")??grab("INSS",null,CAB);
  out.irrf=grab("IRRF\\s*-")??grab("IMPOSTO DE RENDA")??grab("IRRF",null,CAB)??grab("\\bIRF\\b",null,CAB);
  out.va=grab("VA\\s*-\\s*DESC")??grab("VALE\\s*ALIMENT")??grab("ALIMENTA[CÇ][AÃ]O\\s*-?\\s*DESC");
  out.seguro=grab("SEGURO");
  out.pgbl=grab("PGBL")??grab("PREVID[EÊ]NCIA");
  out.liquido=grab("L[IÍ]QUIDO\\s+A\\s+RECEBER","ultimo")??grab("L[IÍ]QUIDO","ultimo");
  const extras=[["Coparticipação médica","(?:CONSULTAS|COPART|MEDIC[OA]?\\b)"],["Farmácia","FARM[AÁ]CIA"],["Convênio odontológico","ODONTO"],["Empréstimo consignado","CONSIGN"]];
  for(const[nm,kw]of extras){const v=grab(kw);if(v)out.outros.push({nome:nm,valor:v});}
  return out;
}
async function lerHolerite(inp){
  const f=inp.files[0];if(!f)return;
  const st=document.getElementById("pdfStatus");
  if(typeof pdfjsLib==="undefined"){st.textContent="Leitor de PDF não carregou (sem internet na 1ª vez?). Preencha manualmente.";return;}
  st.textContent="Lendo PDF…";
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const buf=await f.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    let texto="";
    for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p);const tc=await pg.getTextContent();
      texto+=tc.items.map(it=>it.str).join(" ")+"\n";}
    const r=classificaHolerite(texto);
    const F=state.folha;let achou=[];
    if(r.bruto){F.bruto=r.bruto;achou.push("bruto "+fmt0(r.bruto));}
    F.creche=r.creche!=null?r.creche:0;if(r.creche!=null)achou.push("creche");
    if(r.inss!=null){F.inssManual=r.inss;achou.push("INSS");}
    if(r.irrf!=null){F.irrfManual=r.irrf;achou.push("IRRF");}
    F.va=r.va!=null?r.va:0;if(r.va!=null)achou.push("VA");
    F.seguro=r.seguro!=null?r.seguro:0;if(r.seguro!=null)achou.push("seguro");
    F.pgbl=r.pgbl!=null?r.pgbl:0;if(r.pgbl!=null)achou.push("PGBL");
    F.outros=r.outros;if(r.outros.length)achou.push(r.outros.length+" desconto(s) avulso(s)");
    save();render();
    const st2=document.getElementById("pdfStatus");
    if(st2)st2.textContent=achou.length?("Extraído: "+achou.join(", ")+". Confira os campos"+(r.liquido?" — líquido no holerite: "+fmt(r.liquido)+".":".")):"Não reconheci os campos deste layout — preencha manualmente.";
  }catch(e){const st2=document.getElementById("pdfStatus");if(st2)st2.textContent="Erro ao ler o PDF: "+e.message;}
}

const METODOS={ult:"Último mês",med3:"Mediana 3m",avg3:"Média 3m",max:"Maior recente",min:"Menor recente"};

function serieAntes(n,ym){return meses().filter(x=>x.ym<ym&&!x.rascunho).map(x=>+x.contas[n]||0);}
function estimaConta(n,ym,mt){
  mt=mt||metodoDe(n);
  const serie=serieAntes(n,ym).filter(v=>v>0);
  if(!serie.length)return 0;
  const ult3=serie.slice(-3);
  if(mt==="med3")return mediana(ult3);
  if(mt==="avg3")return ult3.reduce((s,v)=>s+v,0)/ult3.length;
  if(mt==="max")return Math.max(...ult3);

  return serie[serie.length-1]; // ult
}

  let n=0;nomes.forEach(k=>{

// realizado = valor confirmado (não-provisório). Se ainda provisório, não conta como "real".
function temReal(m,n){return (+m.contas[n]>0)&&!(m.prov&&m.prov[n]);}
// linhas de comparação de um mês: só contas que têm orçado definido
function comparaMes(m){
  const out=[];
  Object.keys(m.orcado||{}).forEach(n=>{
    const orc=+m.orcado[n]||0;if(!orc)return;
    const real=+m.contas[n]||0;
    const confirmado=temReal(m,n);
    out.push({n,orc,real,confirmado,dif:real-orc,pct:orc>0?(real-orc)/orc*100:0,cat:catOf(n)});
  });
  return out.sort((a,b)=>Math.abs(b.dif)-Math.abs(a.dif));
}
function comparaPorCat(m){
  const o={};comparaMes(m).filter(r=>r.confirmado).forEach(r=>{
    if(!o[r.cat])o[r.cat]={orc:0,real:0};o[r.cat].orc+=r.orc;o[r.cat].real+=r.real;});
  return Object.entries(o).map(([cat,v])=>({cat,orc:v.orc,real:v.real,dif:v.real-v.orc,pct:v.orc>0?(v.real-v.orc)/v.orc*100:0}))
    .sort((a,b)=>Math.abs(b.dif)-Math.abs(a.dif));
}

const parcelaCfg=n=>(state.parcelas&&state.parcelas[n])||null;
const mesesEntre=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5)-+a.slice(5));
function valorParcela(n,ym){const m=meses().find(x=>x.ym===ym);if(m&&+m.contas[n]>0)return +m.contas[n];
  const hist=meses().filter(x=>x.ym<=ym&&+x.contas[n]>0);return hist.length?+hist[hist.length-1].contas[n]:0;}
function parcelaInfo(n,ym){
  const cfg=parcelaCfg(n);if(!cfg||!cfg.inicio||!(+cfg.total>0))return null;
  const total=+cfg.total;
  const k=mesesEntre(cfg.inicio,ym)+1;             // nº da parcela neste mês
  const fim=ymAdd(cfg.inicio,total-1);             // mês da última parcela
  const v=valorParcOrig(n,ym);
  if(k<1)return{antes:true,k:0,total,fim,inicio:cfg.inicio,valor:v,faltam:total,restante:total*v};
  if(k>total)return{quitada:true,k:total,total,fim,inicio:cfg.inicio,valor:v,faltam:0,restante:0};
  const faltam=total-k;                            // após pagar a deste mês
  return{k,total,fim,inicio:cfg.inicio,valor:v,faltam,restante:faltam*v};
}
function setParcela(n,inicio,total,multa,moraDia,defasado,atrasoDesde,diasTipico,valorOrig){if(!state.parcelas)state.parcelas={};
  if(inicio&&+total>0)marcarRevivido("/parcelas/"+n);
  if(inicio&&+total>0)state.parcelas[n]={inicio,total:+total,multa:+multa||0,moraDia:+moraDia||0,defasado:!!defasado,atrasoDesde:atrasoDesde||null,diasTipico:+diasTipico||0,valorOrig:+valorOrig||0};

// valor ORIGINAL da parcela (do contrato); se não configurado, usa o valor lançado no mês
function valorParcOrig(n,ym){const cfg=parcelaCfg(n);return (cfg&&+cfg.valorOrig>0)?+cfg.valorOrig:valorParcela(n,ym);}
// total já pago numa dívida parcelada: meses registrados = exato; antes da ferramenta = estimado
function pagoAcumulado(n,ym){const cfg=parcelaCfg(n);if(!cfg)return null;
  const pg=pagasAte(n,ym);const v=valorParcOrig(n,ym);
  if(pg<=0)return{pg:0,cnt:0,preCnt:0,preBase:0,preJuros:0,exatoReg:0,jurosReg:0,total:0};
  const ji=jurosInfo(n,ym,pg)||{pago:0,juros:0,cnt:0};
  const cnt=Math.min(ji.cnt,pg);
  const preCnt=Math.max(0,pg-cnt);
  const preBase=r2(preCnt*v);
  let preJuros=0;
  if(cfg.atrasoDesde&&preCnt>0){
    const regs=meses().filter(x=>x.ym>=cfg.inicio&&(+x.contas[n]||0)>0).map(x=>x.ym).sort();
    const firstReg=regs[0]||ym;
    const iniAtr=cfg.atrasoDesde>cfg.inicio?cfg.atrasoDesde:cfg.inicio;
    if(iniAtr<firstReg){
      const por=(+cfg.multa||0)+(+cfg.diasTipico||0)*(+cfg.moraDia||0);
      preJuros=r2(Math.min(mesesEntre(iniAtr,firstReg),preCnt)*por);
    }
  }
  return{pg,cnt,preCnt,preBase,preJuros,exatoReg:r2(ji.pago),jurosReg:r2(ji.juros),total:r2(preBase+preJuros+ji.pago)};}
function setRegulariza(n,ym){const cfg=state.parcelas&&state.parcelas[n];if(!cfg)return;cfg.regularizaEm=ym||null;save();render();}
// cenários de juros futuros: continuar atrasando × regularizar em cfg.regularizaEm
function cenariosJuros(n,ym){const cfg=parcelaCfg(n);if(!cfg)return null;
  const ca=custoAtraso(n,ym);if(!ca||!(ca.por>0))return null;
  const continuar=ca.futuro; // todas as restantes atrasadas
  const reg=cfg.regularizaEm||null;
  let atrFut=ca.faltam; // sem regularização definida = continuar
  if(reg)atrFut=Math.max(0,Math.min(mesesEntre(ym,reg)-1,ca.faltam)); // paga em dia a partir de reg
  const regJuros=atrFut*ca.por;
  return{por:ca.por,jaPagos:ca.custo,faltam:ca.faltam,reg,atrFut,
    continuar,regJuros,economia:continuar-regJuros,
    totalContinuar:ca.custo+continuar,totalReg:ca.custo+regJuros};}
// nº de parcelas efetivamente pagas até o mês ym (com defasagem, a paga em ym é a do mês anterior)
function pagasAte(n,ym){const cfg=parcelaCfg(n);if(!cfg)return 0;
  const k=mesesEntre(cfg.inicio,ym)+1;const kk=cfg.defasado?k-1:k;
  return Math.max(0,Math.min(kk,+cfg.total));}
// custo do atraso crônico: nº de parcelas pagas atrasadas × (multa + diasTipico × mora)
function custoAtraso(n,ym){const cfg=parcelaCfg(n);if(!cfg)return null;
  const v=valorParcOrig(n,ym);
  const por=(+cfg.multa||0)+(+cfg.diasTipico||0)*(+cfg.moraDia||0);
  const pg=pagasAte(n,ym);
  let nAtr=0;
  if(cfg.atrasoDesde){const ini=cfg.atrasoDesde>cfg.inicio?cfg.atrasoDesde:cfg.inicio;
    nAtr=Math.max(0,Math.min(mesesEntre(ini,ym)+1,pg));}
  const custo=nAtr*por;
  const faltam=+cfg.total-pg;
  const futuro=faltam*por;
  return{v,por,pg,nAtr,custo,faltam,futuro,
    origPago:pg*v,comPago:pg*v+custo,
    contratoSem:+cfg.total*v,projetadoCom:+cfg.total*v+custo+futuro};}

            ${venc&&temJuros?`<button class="btn primary" style="padding:3px 8px;font-size:12px" title="Grava como pago real E aplica no campo Valor do mês (o orçado guarda a parcela original)" onclick="usarSimulado(${IX},'${nn}',${vFinal.toFixed(2)})">✓ usar simulado e aplicar no mês (${fmt(vFinal)})</button>`:''}
            ${pr?`<span class="pill" style="${pr>pi.valor+0.005?'background:#ffe4e6;color:#be123c':'background:#ccfbf1;color:#0f766e'}">${pr>pi.valor+0.005?"+"+fmt(pr-pi.valor)+" de juros neste mês":"sem juros"}</span>${Math.abs(pr-(+m.contas[n]||0))>0.005?`<button class="btn" style="padding:2px 8px;font-size:11px" title="O valor do mês (${fmt(+m.contas[n]||0)}) difere do pago real — clique para igualar" onclick="usarSimulado(${IX},'${nn}',${pr})">aplicar no valor do mês</button>`:''}<button class="btn" style="padding:2px 6px;font-size:11px" onclick="setPagoReal(${IX},'${nn}',0)">limpar</button>`:''}
          </div>
          <p class="note" style="margin-top:4px">O valor real pago entra no caixa da <b>Gerenciar sobra</b> e no "Já pago" do <b>Status</b> — assim o dinheiro bate com o extrato mesmo pagando com juros.</p>
        </div>`:''}`;})()}
    </td></tr>`:''}`;}).join("")}</table>
  <div class="row" style="margin-top:10px">
    <input id="ncNome" placeholder="Nova conta (ex.: Seguro carro)" style="flex:1;min-width:160px">
    <input id="ncVal" type="number" step="0.01" placeholder="Valor">
    <button class="btn primary" onclick="addConta(${IX})">Adicionar</button>
  </div></div>`;
}
// cria um mês qualquer (ex.: nov/dez a partir das férias) copiando as contas do mês anterior mais
// próximo como provisórias (viram "orçado"), com o salário normal da Folha
function criarMes(ym){
  const ja=state.meses.find(x=>x.ym===ym);if(ja)return ja;
  const ant=meses().filter(x=>x.ym<ym).slice(-1)[0]||meses().slice(-1)[0];
  const contas={},prov={},orcado={};
  if(ant)Object.entries(ant.contas).forEach(([k,v])=>{if(+v>0){contas[k]=+v;prov[k]=true;orcado[k]=+v;}});
  const sal=+state.folha.bruto>0?r2(folhaCalc().liq):(ant?ant.salario:0);
  const m={ym,salario:sal,extra:0,va:vaACT(ym)||(ant?ant.va:0),rascunho:true,contas,prov,orcado};
  marcarRevivido(ym);state.meses.push(m);aplicarAportesDoMes(ym);return m;
}
function incluirNasAnalises(ym,sim){
  const m=state.meses.find(x=>x.ym===ym);if(!m)return;
  const ultAntes=(mesesA().slice(-1)[0]||{}).ym;
  m.rascunho=!sim;
  // a Visão geral estava fixada no mês mais recente → acompanha o mês que acabou de entrar
  if(sim&&state.visSel&&state.visSel!=="todos"&&state.visSel===ultAntes&&ym>ultAntes)state.visSel=ym;
  save();render();
}
function novoMes(copiar){
  const ms=meses();const last=ms[ms.length-1];
  if(!last){ // primeiro mês do painel: nasce zerado, mês corrente
    const hoje=new Date();const ym=hoje.getFullYear()+"-"+String(hoje.getMonth()+1).padStart(2,"0");
    marcarRevivido(ym);state.meses.push({ym,salario:0,extra:0,va:0,rascunho:true,contas:{},prov:{},orcado:{}});
    edSel=0;edYm=ym;save();render();return;
  }
  const d=new Date(+last.ym.slice(0,4),+last.ym.slice(5),1);
  const ym=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  if(state.meses.some(m=>m.ym===ym)){alert("O mês "+lbl(ym)+" já existe.");return;}
  const quit=k=>{const pi=parcelaInfo(k,ym);return pi&&pi.quitada;};
  const contas=Object.fromEntries(Object.entries(last.contas).filter(([k])=>!quit(k)).map(([k,v])=>[k,copiar?v:0]));
  (state.futuros||[]).forEach(f=>{if(f.nome in contas&&!ativoEm(f,ym))contas[f.nome]=0;});
  const ag=futurosEm(ym);ag.forEach(f=>{if(!(f.nome in contas)||!contas[f.nome])contas[f.nome]=f.valor;});
  const vaNovo=vaACT(ym)||last.va; 
  const prov={},orcado={};if(copiar)Object.keys(contas).forEach(k=>{if(+contas[k]>0){prov[k]=true;orcado[k]=+contas[k];}}); // valores copiados = provisórios e viram orçado
  marcarRevivido(ym);state.meses.push({ym,salario:last.salario,extra:copiar?last.extra:0,va:vaNovo,rascunho:true,contas,prov,orcado});
  const aps=aplicarAportesDoMes(ym);
  edSel=meses().length-1;edYm=ym;save();render();
  const avisos=[];
  if(ag.length)avisos.push("Agenda aplicada: "+ag.map(f=>f.nome+" ("+fmt0(f.valor)+")").join(", "));
  if(aps.length)avisos.push("Aportes programados somados ao Extra: "+aps.map(a=>a.nota+" ("+fmt(a.valor)+")").join(", "));
  const ferNoMes=(state.ferias||[]).filter(f=>f.inicio&&mesesPagamentoFerias(f).includes(ym));
  if(ferNoMes.length)avisos.push("Este mês tem férias previstas ("+ferNoMes.map(f=>f.nome||"Férias").join(", ")+") — confira a aba Férias para aplicar o líquido e o salário proporcional.");
  if(avisos.length)alert(lbl(ym)+":\n\n"+avisos.join("\n"));
}
function mesclarContas(old,novo,silencioso){
  let movidos=0,somados=0,avisoParc="";
  // captura categoria/tipo EFETIVOS antes de mexer (inclui padrões da planilha)
  const catExplicitaNovo=(state.catConta&&state.catConta[novo])||CAT[novo]||null;
  const catVelha=catOf(old);
  const tipoDefinidoNovo=(state.tipos&&(novo in state.tipos))||(novo in FIXO_DEFAULT);
  const tipoVelho=tipoOf(old);
  state.meses.forEach(m=>{
    const a=+m.contas[old]||0,b=+m.contas[novo]||0;
    const temA=(old in m.contas),temB=(novo in m.contas);
    if(temA){
      if(a>0&&b>0){m.contas[novo]=Math.round((a+b)*100)/100;somados++;}
      else if(a>0||!temB){m.contas[novo]=a>0?a:(temB?b:a);if(a>0)movidos++;}
      delete m.contas[old];
    }
    if(m.prov){const pv=(m.prov[old]&&a>0)||(m.prov[novo]&&b>0);if(pv)m.prov[novo]=true;else delete m.prov[novo];delete m.prov[old];}
    if(m.orcado&&(old in m.orcado)){m.orcado[novo]=Math.round((((+m.orcado[novo])||0)+(+m.orcado[old]||0))*100)/100;delete m.orcado[old];}
    if(m.pagoReal&&(old in m.pagoReal)){m.pagoReal[novo]=Math.round((((+m.pagoReal[novo])||0)+(+m.pagoReal[old]||0))*100)/100;delete m.pagoReal[old];}
    if(m.itensFatura&&(old in m.itensFatura)){m.itensFatura[novo]=[...(m.itensFatura[novo]||[]),...m.itensFatura[old]];delete m.itensFatura[old];}
    const P=state.pagos[m.ym];
    if(P&&(old in P||novo in P)){
      const pago=(a>0&&b>0)?(!!P[old]&&!!P[novo]):(a>0?!!P[old]:!!P[novo]);
      if(pago)P[novo]=true;else delete P[novo];delete P[old];
    }
  });
  ["tipos","catConta","vencDia","detalhavel","provMetodo"].forEach(k=>{
    const o=state[k];if(!o)return;
    if((old in o)&&!(novo in o))o[novo]=o[old];
    if(old in o)delete o[old];});
  if(state.parcelas){
    if(state.parcelas[old]&&state.parcelas[novo])avisoParc="\n⚠ As duas tinham parcelamento — mantive o de \""+novo+"\"; confira no ⏳.";
    if(state.parcelas[old]&&!state.parcelas[novo])state.parcelas[novo]=state.parcelas[old];
    delete state.parcelas[old];
  }
  // destino sem categoria/tipo próprios herda os efetivos da origem
  if(!catExplicitaNovo&&catVelha&&catVelha!=="Outros"){if(!state.catConta)state.catConta={};state.catConta[novo]=catVelha;}
  if(!tipoDefinidoNovo){if(!state.tipos)state.tipos={};state.tipos[novo]=tipoVelho==="Fixo"?1:0;}
  if(state.aloc&&state.aloc.itens&&(("div:"+old) in state.aloc.itens)){
    state.aloc.itens["div:"+novo]=(+state.aloc.itens["div:"+novo]||0)+(+state.aloc.itens["div:"+old]||0);
    delete state.aloc.itens["div:"+old];}
  (state.futuros||[]).forEach(f=>{if(f.nome===old)f.nome=novo;});
  ((state.simg&&state.simg.cenarios)||[]).forEach(c=>(c.itens||[]).forEach(it=>{if(it.alvo===old)it.alvo=novo;}));
  if(state.simg&&Array.isArray(state.simg.baseRows))state.simg.baseRows.forEach(r=>{if(r.nome===old)r.nome=novo;});
  delete edParcOpen[old];delete edDetOpen[old];delete calcSel[old];delete simPagData[old];
  if(contaSel===old)contaSel=novo;
  if(silencioso)return;
  registrarRenome(old,novo);save();render();
  alert('Mescladas: "'+old+'" + "'+novo+'" → "'+novo+'"\n\n• '+movidos+' mês(es) com valor movido\n• '+somados+' mês(es) onde AMBAS tinham valor (somei — confira se não era duplicidade)'+avisoParc+'\n\nO histórico agora é um só: gráficos, tendências e previsão da conta enxergam a linha completa.');
}
function registrarRenome(de,para){if(!state._renomes)state._renomes=[];state._renomes.push({id:uid(),de,para,ts:Date.now()});}
function renomearConta(old){
  const novo=(prompt('Novo nome para "'+old+'":',old)||"").trim();
  if(!novo||novo===old)return;
  if(allContas().includes(novo)){
    if(!confirm('Já existe uma conta chamada "'+novo+'".\n\nOK = MESCLAR os históricos em um só:\n• mês onde só uma tem valor → vale esse valor\n• mês onde as DUAS têm valor → soma (o resumo avisa quantos)\n• configurações (categoria, vencimento, parcelamento...) de "'+novo+'" prevalecem; o que ela não tiver, herda de "'+old+'"\n\nCancelar = desistir e escolher outro nome.'))return;
    mesclarContas(old,novo);return;
  }
  const cat=catOf(old),tipo=tipoOf(old); // captura efetivos (inclui padrões da planilha)
  state.meses.forEach(m=>{
    if(old in m.contas){m.contas[novo]=m.contas[old];delete m.contas[old];}
    if(m.prov&&old in m.prov){m.prov[novo]=m.prov[old];delete m.prov[old];}
    if(m.orcado&&old in m.orcado){m.orcado[novo]=m.orcado[old];delete m.orcado[old];}
    if(m.pagoReal&&old in m.pagoReal){m.pagoReal[novo]=m.pagoReal[old];delete m.pagoReal[old];}
    if(m.itensFatura&&old in m.itensFatura){m.itensFatura[novo]=m.itensFatura[old];delete m.itensFatura[old];}
  });
  Object.keys(state.pagos||{}).forEach(ym=>{const P=state.pagos[ym];if(P&&old in P){P[novo]=P[old];delete P[old];}});
  ["tipos","catConta","vencDia","detalhavel","parcelas","provMetodo"].forEach(k=>{
    const o=state[k];if(o&&old in o){o[novo]=o[old];delete o[old];}});
  if(!state.catConta)state.catConta={};state.catConta[novo]=cat;
  if(!state.tipos)state.tipos={};state.tipos[novo]=tipo==="Fixo"?1:0;
  if(state.aloc&&state.aloc.itens&&(("div:"+old) in state.aloc.itens)){state.aloc.itens["div:"+novo]=state.aloc.itens["div:"+old];delete state.aloc.itens["div:"+old];}
  (state.futuros||[]).forEach(f=>{if(f.nome===old)f.nome=novo;});
  ((state.simg&&state.simg.cenarios)||[]).forEach(c=>(c.itens||[]).forEach(it=>{if(it.alvo===old)it.alvo=novo;}));
  if(state.simg&&Array.isArray(state.simg.baseRows))state.simg.baseRows.forEach(r=>{if(r.nome===old)r.nome=novo;});
  delete edParcOpen[old];delete edDetOpen[old];delete calcSel[old];delete simPagData[old];
  if(contaSel===old)contaSel=novo;
  registrarRenome(old,novo);save();render();
  alert('Renomeada: "'+old+'" → "'+novo+'"\n\nPropagado em: todos os meses, status de pagamento, parcelamento/dívidas, vencimento, categoria, tipo, orçado, fatura, agenda e cenários de simulação.');
}
function delMes(i){if(confirm("Excluir "+lbl(state.meses[i].ym)+"?")){marcarApagado(state.meses[i].ym);state.meses.splice(i,1);edSel=null;edYm=null;save();render();}}
function delConta(i,n){if(!confirm('Remover "'+n+'" de '+lbl(state.meses[i].ym)+"? (só deste mês; o histórico dos outros meses não é afetado)"))return;delete state.meses[i].contas[n];marcarApagado("/meses/"+state.meses[i].ym+"/contas/"+n);save();render();}

let orcSel=null;
function vOrcado(){
  const all=meses();
  if(!orcSel||!all.some(m=>m.ym===orcSel))orcSel=all[all.length-1].ym;
  const m=all.find(x=>x.ym===orcSel);
  const linhas=comparaMes(m);
  const comReal=linhas.filter(r=>r.confirmado);
  const pend=linhas.filter(r=>!r.confirmado);
  const orcTot=linhas.reduce((s,r)=>s+r.orc,0);
  const realTot=comReal.reduce((s,r)=>s+r.real,0);
  const orcRealizados=comReal.reduce((s,r)=>s+r.orc,0); // orçado só das que já têm real
  const difTot=realTot-orcRealizados;
  const cats=comparaPorCat(m);
  const pill=(c,t)=>`<p class="note" style="margin-top:6px"><span class="pill ${c==='teal'?'teal':'rose'}" style="${c==='amber'?'background:#fef3c7;color:#92400e':''}">${c==='teal'?'✔':'⚠'}</span> ${t}</p>`;
  // precisão: média do |erro%| das contas confirmadas
  const precisao=comReal.length?comReal.reduce((s,r)=>s+Math.abs(r.pct),0)/comReal.length:null;
  const estouros=comReal.filter(r=>r.dif>0.005).sort((a,b)=>b.dif-a.dif);
  const economias=comReal.filter(r=>r.dif<-0.005).sort((a,b)=>a.dif-b.dif);

  if(!linhas.length){
    return `<div class="card"><div class="row"><span>Mês:</span><select onchange="orcSel=this.value;render()">${[...all].reverse().map(x=>`<option value="${x.ym}" ${x.ym===orcSel?"selected":""}>${lbl(x.ym)}</option>`).join("")}</select></div></div>
    <div class="card"><h3>Orçado × Realizado — ${lbl(orcSel)}</h3>
    <p class="note">Ainda não há valores <b>orçados</b> para este mês. O orçado é capturado automaticamente quando você usa valores <b>provisórios</b> na aba Editar dados (o botão ↩ que estima a conta). Quando você confirmar o valor real, a comparação aparece aqui.</p>
    <p class="note">💡 Fluxo: em Editar dados, clique em ↩ para estimar uma conta (fica vermelha = orçado congelado) → quando a conta real chegar, digite por cima → volte aqui e veja se você acertou a previsão.</p></div>`;
  }

  const alerts=[];
  if(precisao!=null){
    if(precisao<=5)alerts.push(["teal","Sua previsão está <b>afiada</b>: erro médio de apenas "+precisao.toFixed(1)+"% nas contas confirmadas."]);
    else if(precisao<=15)alerts.push(["amber","Previsão razoável: erro médio de "+precisao.toFixed(1)+"%. Dá para calibrar alguns métodos de estimativa."]);
    else alerts.push(["rose","Previsão precisa de ajuste: erro médio de "+precisao.toFixed(1)+"%. Veja abaixo quais contas mais escapam e troque o método de estimativa delas."]);
  }
  if(estouros.length){const e=estouros[0];alerts.push(["amber","Maior estouro: <b>"+esc(e.n)+"</b> orçou "+fmt(e.orc)+" e gastou "+fmt(e.real)+" (+"+fmt(e.dif)+", "+e.pct.toFixed(0)+"% acima)."]);}
  if(difTot>0.005)alerts.push(["rose","No total, você <b>estourou "+fmt(difTot)+"</b> sobre o que havia orçado nas contas já confirmadas ("+fmt(orcRealizados)+")."]);
  else if(difTot<-0.005)alerts.push(["teal","No total, você gastou <b>"+fmt(-difTot)+" a menos</b> que o orçado nas contas confirmadas. 👏"]);
  if(pend.length)alerts.push(["amber",pend.length+" conta(s) ainda provisória(s) — a comparação delas fecha quando você confirmar o valor real."]);

  const linhaTab=r=>{const cor=!r.confirmado?"var(--mut)":r.dif>0.005?"#be123c":r.dif<-0.005?"#0d9488":"var(--ink)";
    const tag=!r.confirmado?'<span class="pill" style="background:#ffe4e6;color:#be123c;font-size:10px">provisório</span>':(r.dif>0.005?'<span class="pill rose">estourou</span>':r.dif<-0.005?'<span class="pill teal">economizou</span>':'<span class="pill teal">na mosca</span>');
    return `<tr><td>${esc(r.n)}</td><td>${esc(r.cat)}</td><td class="n">${fmt(r.orc)}</td><td class="n">${r.confirmado?fmt(r.real):'<span style="color:#be123c">— (prov.)</span>'}</td>

  </div>

  <div class="card">${alerts.map(a=>pill(a[0],a[1])).join("")}</div>

  <div class="grid g2">
    <div class="card"><h3>Orçado × Real por categoria</h3><div class="chartbox sm"><canvas id="cOrcCat"></canvas></div>

    </div>
  </div>

  <div class="card"><h3>Detalhe — ${lbl(orcSel)}</h3>
