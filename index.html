<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Minhas Finanças</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  /* ---------- cores (claro) — tudo usa estas variáveis, o modo escuro só troca os valores ---------- */
  :root{--bg:#f8fafc;--card:#fff;--card2:#f8fafc;--border:#e2e8f0;--border2:#f1f5f9;--txt:#1e293b;--mut:#64748b;
    --campo:#fff;--campoBorda:#cbd5e1;--tabsBg:#e9eef4;--barra:#f1f5f9;--sombra:rgba(15,23,42,.10);
    --teal:#0d9488;--rose:#e11d48;--indigo:#6366f1;--amber:#d97706;--pillRose:#ffe4e6;--pillTeal:#ccfbf1;
    --alertaRosa:#fff1f2;--alertaAmbar:#fffbeb;color-scheme:light;}
  :root[data-tema="escuro"]{--bg:#0b1220;--card:#111a2b;--card2:#0f1828;--border:#24324c;--border2:#1a253a;--txt:#e2e8f0;--mut:#94a3b8;
    --campo:#0d1525;--campoBorda:#34445e;--tabsBg:#17223a;--barra:#1e2a42;--sombra:rgba(0,0,0,.45);
    --teal:#2dd4bf;--rose:#fb7185;--indigo:#818cf8;--amber:#fbbf24;--pillRose:#4a1d2a;--pillTeal:#0f3d38;
    --alertaRosa:#2a1219;--alertaAmbar:#2b2210;color-scheme:dark;}
  /* modo escuro: cores fixas escritas nas telas ganham versão escura */
  :root[data-tema="escuro"] [style*="background:#f1f5f9"]{background:#1a2539!important}
  :root[data-tema="escuro"] [style*="background:#fef3c7"]{background:#3a2a0a!important}
  :root[data-tema="escuro"] [style*="background:#ede9fe"]{background:#2a2148!important}
  :root[data-tema="escuro"] [style*="background:#ffe4e6"]{background:#3b1620!important}
  :root[data-tema="escuro"] [style*="background:#fff1f2"]{background:#2a1219!important}
  :root[data-tema="escuro"] [style*="background:#f8fafc"]{background:var(--card2)!important}
  :root[data-tema="escuro"] [style*="background:#eef2ff"]{background:#1c2347!important}
  :root[data-tema="escuro"] [style*="background:#faf5ff"]{background:#221a36!important}
  :root[data-tema="escuro"] [style*="background:#f0fdfa"]{background:#0f2a28!important}
  :root[data-tema="escuro"] [style*="background:#e0e7ff"]{background:#1e2550!important}
  :root[data-tema="escuro"] [style*="background:#ccfbf1"]{background:#0f3a35!important}
  :root[data-tema="escuro"] [style*="color:#be123c"]{color:#fda4af!important}
  :root[data-tema="escuro"] [style*="color:#6d28d9"]{color:#c4b5fd!important}
  :root[data-tema="escuro"] [style*="color:#92400e"]{color:#fcd34d!important}
  :root[data-tema="escuro"] [style*="color:#64748b"]{color:#94a3b8!important}
  :root[data-tema="escuro"] [style*="color:#b45309"]{color:#fbbf24!important}
  :root[data-tema="escuro"] [style*="color:#0f766e"]{color:#5eead4!important}
  :root[data-tema="escuro"] [style*="color:#0d9488"]{color:#2dd4bf!important}
  :root[data-tema="escuro"] [style*="color:#4338ca"],:root[data-tema="escuro"] [style*="color:#4f46e5"]{color:#a5b4fc!important}
  :root[data-tema="escuro"] [style*="color:#475569"]{color:#cbd5e1!important}
  :root[data-tema="escuro"] [style*="color:#059669"]{color:#34d399!important}
  :root[data-tema="escuro"] [style*="border:1px solid #f1f5f9"]{border-color:var(--border2)!important}
  :root[data-tema="escuro"] [style*="#a7f3d0"]{border-color:#134e4a!important}

  *{box-sizing:border-box;margin:0;padding:0;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;}
  html,body{overflow-x:hidden;}
  body{background:var(--bg);color:var(--txt);padding:16px;-webkit-text-size-adjust:100%;}
  .wrap{max-width:1000px;margin:0 auto;min-width:0;}
  h1{font-size:22px;} .sub{font-size:13px;color:var(--mut);margin-bottom:14px;}
  .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);font-weight:700;}
  .topo{display:flex;align-items:center;gap:8px;}
  .topo h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .icone-btn{width:38px;height:38px;flex:0 0 38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mut);
    border:1px solid var(--border);background:var(--card);cursor:pointer;box-shadow:0 1px 4px var(--sombra);}
  /* ---------- navegação: 5 grupos + abas do grupo ---------- */
  .grupos{display:flex;gap:4px;background:var(--tabsBg);padding:4px;border-radius:12px;width:fit-content;margin:12px 0 8px;}
  .grupos button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;display:flex;align-items:center;gap:6px;}
  .grupos button svg{width:18px;height:18px;}
  .grupos button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 2px var(--sombra);}
  .subabas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .subabas button{border:1px solid var(--border);background:var(--card);color:var(--mut);padding:6px 13px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .subabas button.on{background:var(--teal);border-color:var(--teal);color:#fff;}
  .grid{display:grid;gap:12px;margin-bottom:12px;} .grid>.card{margin-bottom:0;} .g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));} .g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px;min-width:0;}
  .metric .lbl{font-size:12px;color:var(--mut);} .metric .val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
  .metric .sm{font-size:11px;color:var(--mut);margin-top:2px;}
  .teal{color:var(--teal);} .rose{color:var(--rose);} .indigo{color:var(--indigo);} .amber{color:var(--amber);}
  h3{font-size:14px;margin-bottom:8px;}
  select,input,button.btn,textarea{font-size:13px;padding:7px 10px;border:1px solid var(--campoBorda);border-radius:8px;background:var(--campo);color:var(--txt);}
  button.btn{cursor:pointer;font-weight:600;} button.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;}
  button.btn.danger{color:var(--rose);} button.btn:disabled{opacity:.5;cursor:default;}
  label.btn{cursor:pointer;font-size:13px;font-weight:600;padding:7px 10px;border:1px solid var(--campoBorda);border-radius:8px;background:var(--campo);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);}
  td{padding:6px 8px;border-bottom:1px solid var(--border2);font-variant-numeric:tabular-nums;}
  td.n{text-align:right;} th.n{text-align:right;}
  .up{color:var(--rose);font-weight:600;} .down{color:var(--teal);font-weight:600;}
  .pill{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;}
  .pill.rose{background:var(--pillRose);} .pill.teal{background:var(--pillTeal);}
  .chartbox{position:relative;height:300px;}
  .chartbox.sm{height:240px;}
  .chartbox.mini{height:160px;}
  .simboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;align-items:start;}
  .scard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;min-width:0;}
  .scard h4{font-size:13px;margin:10px 0 4px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-size:11px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .note{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.5;}
  .bar{height:10px;background:var(--barra);border-radius:99px;overflow:hidden;margin-top:6px;}
  .bar>div{height:100%;background:var(--teal);border-radius:99px;transition:width .4s;}
  input[type=number]{width:110px;text-align:right;}
  .flexbet{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  summary{color:var(--txt);}
  /* ---------- botão + e folha de lançamento rápido ---------- */
  .fab{position:fixed;right:20px;bottom:24px;z-index:61;width:56px;height:56px;border-radius:50%;border:0;background:var(--teal);color:#fff;
    font-size:30px;line-height:1;cursor:pointer;box-shadow:0 6px 18px var(--sombra);}
  .folha-lanc{position:fixed;inset:0;z-index:70;background:rgba(2,6,23,.45);display:none;align-items:flex-end;justify-content:center;}
  .folha-lanc.aberta{display:flex;}
  .folha-lanc>div{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 30px var(--sombra);max-height:92vh;overflow:auto;}
  .folha-lanc label{display:block;font-size:12px;color:var(--mut);margin-top:10px;}
  .folha-lanc input,.folha-lanc select,.folha-lanc input[type=number]{width:100%;margin-top:4px;text-align:left;}
  /* ---------- celular ---------- */
  @media(max-width:700px){
    /* Editar dados → contas: cada conta em 3 linhas, com o VALOR sempre à vista (antes ficava fora da tela, à direita).
       Só reposiciona as mesmas células — nada muda nos campos nem no que eles fazem. */
    .tb-contas>tbody>tr:first-child{display:none;}
    .tb-contas>tbody>tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border2);}
    .tb-contas>tbody>tr>td{border:0;padding:0;min-width:0;}
    .tb-contas>tbody>tr>td:nth-child(1){grid-area:1/1;}
    .tb-contas>tbody>tr>td:nth-child(2){grid-area:1/2;font-weight:600;}
    .tb-contas>tbody>tr>td:nth-child(7){grid-area:1/3;}
    .tb-contas>tbody>tr>td:nth-child(8){grid-area:1/4;}
    .tb-contas>tbody>tr>td:nth-child(3){grid-area:2/1/2/3;}
    .tb-contas>tbody>tr>td:nth-child(4){grid-area:2/3;}
    .tb-contas>tbody>tr>td:nth-child(5){grid-area:2/4;}
    .tb-contas>tbody>tr>td:nth-child(6){grid-area:3/1/3/3;}
    .tb-contas>tbody>tr>td:nth-child(9){grid-area:3/3/3/5;text-align:right;}
    .tb-contas>tbody>tr>td[colspan]{grid-area:auto/1/auto/-1;}
    .tb-contas>tbody>tr>td>select{width:100%;}
    /* Gerenciar sobra → lançamentos: valor e saldo sempre à vista */
    .tb-lanc>tbody>tr:first-child{display:none;}
    .tb-lanc>tbody>tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:4px 8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border2);}
    .tb-lanc>tbody>tr>td{border:0;padding:0;min-width:0;}
    .tb-lanc>tbody>tr>td:nth-child(1){grid-area:1/1;color:var(--mut);}
    .tb-lanc>tbody>tr>td:nth-child(2){grid-area:1/2;}
    .tb-lanc>tbody>tr>td:nth-child(4){grid-area:1/3;}
    .tb-lanc>tbody>tr>td:nth-child(6){grid-area:1/4;}
    .tb-lanc>tbody>tr>td:nth-child(3){grid-area:2/1/2/3;}
    .tb-lanc>tbody>tr>td:nth-child(5){grid-area:2/3/2/5;font-size:11px;color:var(--mut);}
    .tb-lanc>tbody>tr>td:nth-child(5)::before{content:"saldo após ";}
    .tb-lanc>tbody>tr>td>select{width:100%;}
    /* Início → metas por categoria: nome e valor numa linha; meta e barra na de baixo */
    .meta-cat>span:first-child{width:auto!important;flex:1 1 55%;}
    .meta-cat>span:last-child{width:auto!important;order:2;}
    .meta-cat::after{content:"";order:2;flex-basis:100%;height:0;} /* quebra a linha depois do valor */
    .meta-cat>input{order:3;}
    .meta-cat>.bar{order:4;flex:1 1 40%!important;}
    body{padding:8px 8px calc(78px + env(safe-area-inset-bottom));}
    .eyebrow,.sub,#savestate{display:none;}
    h1{font-size:19px;}
    .grupos{position:fixed;left:0;right:0;bottom:0;z-index:60;width:auto;margin:0;border-radius:0;justify-content:space-around;
      background:var(--card);border-top:1px solid var(--border);padding:6px 2px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px var(--sombra);}
    .grupos button{flex:1;flex-direction:column;gap:3px;font-size:11px;padding:5px 2px;}
    .grupos button svg{width:22px;height:22px;}
    .grupos button.on{background:transparent;box-shadow:none;color:var(--teal);}
    .subabas{flex-wrap:nowrap;overflow-x:auto;margin:10px -8px 10px;padding:0 8px 2px;scrollbar-width:none;}
    .subabas::-webkit-scrollbar{display:none;}
    .subabas button{flex:0 0 auto;padding:8px 14px;font-size:14px;}
    .card{padding:12px;border-radius:12px;}
    .g2{grid-template-columns:minmax(0,1fr);} .g4{grid-template-columns:repeat(2,minmax(0,1fr));}
    .simboard{grid-template-columns:minmax(0,1fr);}
    .metric .val{font-size:18px;}
    /* tabelas: o texto quebra linha e os números nunca somem; se ainda não couber, o card rola de lado */
    .card,.scard{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    th,td{white-space:normal;padding:6px 5px;} td.n,th.n{white-space:nowrap;}
    .scard input[type=number]{width:96px;}
    select,input,button.btn,textarea,label.btn{font-size:16px;min-height:40px;}
    input[type=checkbox]{min-height:0;}
    input[type=number]{width:100px;}
    .chartbox{height:230px;} .chartbox.sm{height:210px;}
    .fab{right:12px;bottom:calc(78px + env(safe-area-inset-bottom));width:50px;height:50px;font-size:27px;}
    #alerta .card{padding:8px 10px;} #alerta .card span{font-size:12px!important;} #alerta .btn{min-height:32px;font-size:13px;padding:3px 9px;}
  }
  /* ---- Olho / modo privacidade ---- */
  body.olho-fechado #olhoBtn{background:var(--teal);border-color:var(--teal);color:#fff;}
  /* fmt/fmt0 já trocam o texto por "••••"; os dois pontos abaixo cobrem o que NÃO passa por eles:
     campos numéricos editáveis (mostram o valor real para edição) e os gráficos (Chart.js desenha
     os números direto no canvas). Ambos continuam clicáveis/funcionais, só ficam ilegíveis. */
  body.olho-fechado input[type=number]{color:transparent;text-shadow:0 0 6px #33415555;}
  body.olho-fechado canvas{filter:blur(7px);}
</style>

<body>
<div class="wrap">
  <p class="eyebrow">Finanças da família</p>
  <div class="topo">
    <h1 id="titulo" style="cursor:pointer" title="Clique para renomear" onclick="renomear()">Minhas Finanças</h1>
    <span id="syncstate" class="note" style="cursor:pointer;margin:0" title="Toque para sincronizar agora" onclick="if(typeof sincronizar==='function')sincronizar(true);go('backup')"></span>
    <span id="savestate" class="note" style="margin:0"></span>
    <button id="temaBtn" class="icone-btn" title="Tema" onclick="trocarTema()"></button>
    <button id="olhoBtn" class="icone-btn" title="Ocultar valores" onclick="toggleOlho()"></button>
  </div>
  <p class="sub">Dados salvos neste aparelho e, se você entrar na conta, sincronizados com criptografia · backups na aba Backup</p>
  <nav class="grupos" id="grupos"></nav>
  <div class="subabas" id="subabas"></div>
  <div id="alerta"></div>
  <div id="view"></div>
</div>
<button class="fab" id="fab" title="Lançar gasto ou recebimento" onclick="abrirLancamento()">+</button>
<div class="folha-lanc" id="folhaLanc" onclick="if(event.target===this)fecharLancamento()"><div id="folhaLancConteudo"></div></div>

<script>
// ============ DADOS-SEMENTE ============
// Texto digitado pelo usuário (nomes de contas, lançamentos, metas...) nunca entra cru no HTML:
// esc() para texto na tela e em value="..."; jsAttr() para dentro de onclick="f('...')".
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const jsAttr=s=>esc(String(s??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\n/g,"\\n"));
const CAT = {
  "Aluguel":"Moradia","Condomínio":"Moradia","Luz":"Moradia","Água":"Moradia","Gás":"Moradia","Internet":"Moradia",
  "Carro":"Transporte","IPVA":"Transporte","Cartão de crédito":"Dívidas e cartões","Empréstimo":"Dívidas e cartões",
  "Celular":"Pessoal","Escola / filhos":"Filha","Lazer":"Lazer","Outros":"Outros"
};
const CATCOLORS = {"Moradia":"#0d9488","Transporte":"#6366f1","Dívidas e cartões":"#e11d48","Pessoal":"#84cc16","Filha":"#0ea5e9","Lazer":"#a855f7","Outros":"#94a3b8"};
// categorias para gastos avulsos do dia a dia (aba Sobras)
const CATMOV={
  "Mercado":"#16a34a","Alimentação fora":"#f59e0b","Bebidas":"#7c3aed","Saúde/Farmácia":"#dc2626",
  "Filhos":"#0ea5e9","Transporte/Combustível":"#6366f1","Lazer":"#a855f7","Casa":"#0d9488",
  "Vestuário":"#db2777","Presentes":"#e11d48","Assinaturas":"#64748b","Renda extra":"#059669","Outros":"#94a3b8"};
// Categoria automática pela descrição. Compara PALAVRAS inteiras (sem acento), não pedaços:
// "bar" não pega mais "barato", "99" não pega "R$ 99", "plano" só pega a palavra plano.
// Termo com * no fim = começo de palavra ("supermerc*" pega supermercado). Com espaço = expressão.
// Antes das regras vem o que o app APRENDEU: quando você corrige uma categoria, aquela descrição
// passa a ir sempre para a categoria escolhida (state.catsAprendidas).
const normTxt=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
const CATMOV_REGRAS=[
  ["Bebidas",["cerveja*","cervej*","bebida*","vinho*","whisky","vodka","bar","boteco","adega","drink*","chopp","breja"]],
  ["Saúde/Farmácia",["farmacia*","remedio*","drogaria*","drogasil","medic*","consulta*","dentista","exame*","vacina*","hospital*","laboratorio*"]],
  ["Filhos",["fralda*","escola","creche","brinquedo*","pediatra","papinha","bebe","mamadeira"]],
  ["Mercado",["mercado*","supermerc*","hortifruti","feira","acougue","padaria","atacad*","assai","carrefour","compras do mes","compra do mes"]],
  ["Alimentação fora",["ifood","restaurante*","lanche*","lanchonete","pizza*","hamburg*","marmita","almoco","jantar","cafe","cafeteria","delivery","rappi","sorvete*","sorveteria"]],
  ["Transporte/Combustível",["gasolina","combustivel","posto","uber","99pop","99 taxi","onibus","estacionamento","pedagio*","etanol","alcool","diesel","sem parar","veloe"]],
  ["Lazer",["cinema","show","viagem","passeio*","netflix","spotify","jogo","jogos","game*","parque*","balada","festa","ingresso*","thermas","hotel","pousada"]],
  ["Casa",["movel","moveis","eletro*","reforma","ferramenta*","decoracao","utilidade*","panela*","cama","colchao","material de construcao"]],
  ["Vestuário",["roupa*","calcado*","tenis","sapato*","vestido*","camisa*","camiseta*","calca","bermuda*"]],
  ["Presentes",["presente*","aniversario*"]],
  ["Assinaturas",["assinatura*","mensalidade*","academia","gym","streaming","plano de saude","plano celular"]],
  ["Renda extra",["recebi","freela*","freelance","bico","vendi","reembolso*","pix recebido","salario","bonus","comissao"]]
];
function classificaMov(txt){
  const t=normTxt(txt);if(!t)return null;
  const ap=state&&state.catsAprendidas&&state.catsAprendidas[t];if(ap)return ap;
  const pal=t.split(/[^a-z0-9]+/).filter(Boolean);
  const casa=k=>k.includes(" ")?(" "+pal.join(" ")+" ").includes(" "+k+" "):k.endsWith("*")?pal.some(p=>p.startsWith(k.slice(0,-1))):pal.includes(k);
  for(const[cat,termos]of CATMOV_REGRAS)if(termos.some(casa))return cat;
  return null; // deixa em branco p/ o usuário escolher
}
function aprenderCategoria(desc,cat){const t=normTxt(desc);if(!t||!cat)return;if(!state.catsAprendidas)state.catsAprendidas={};
  const regra=(()=>{const a=state.catsAprendidas[t];delete state.catsAprendidas[t];const r=classificaMov(desc);if(a)state.catsAprendidas[t]=a;return r;})();
  if(regra===cat)delete state.catsAprendidas[t];else state.catsAprendidas[t]=cat;}

const KEY_BKP=KEY+"__auto";
function backupRotativo(){
  try{

    if(lista.length&&lista[lista.length-1].dia===hoje){lista[lista.length-1].json=JSON.stringify(state);}
    else lista.push({dia:hoje,json:JSON.stringify(state)});
    while(lista.length>5)lista.shift();

function desfazerImportacao(){const x=lerAntes();if(!x)return;

function absorverOutraAba(){

// ---- Juntar dois estados (sincronização e "Importar e juntar") ----
// Junção em TRÊS vias quando há "base" (como os dados estavam na última sincronização deste
// aparelho): para cada campo, se só um lado mudou em relação à base, vale esse lado — assim uma
// alteração qualquer no outro aparelho não desfaz o que foi feito aqui. Só quando OS DOIS mudaram o
// mesmo campo vale o lado editado por último (_atualizadoEm). Sem base (1ª vez, "Importar e
// juntar"), é a junção de duas vias de antes.
// Listas de registros com id (ou ym): união por chave; só sai o que foi apagado com marcarApagado()
// (marcador em _apagados). Registro ausente de um lado, sem marcador, continua.
function iguais(x,y){
  if(x===y)return true;if(typeof x!==typeof y||x===null||y===null||typeof x!=="object")return false;
  if(Array.isArray(x)!==Array.isArray(y))return false;
  if(Array.isArray(x)){if(x.length!==y.length)return false;for(let i=0;i<x.length;i++)if(!iguais(x[i],y[i]))return false;return true;}
  const kx=Object.keys(x),ky=Object.keys(y);if(kx.length!==ky.length)return false;for(const k of kx)if(!(k in y)||!iguais(x[k],y[k]))return false;return true;
}
function mesclarEstados(a,b,base,opc){
  // opc.bVence: sem base, quem vence nos conflitos é b (a nuvem) — um aparelho recém-atualizado
  // não sabe o que mudou nele, então não pode sobrescrever a nuvem com valores possivelmente velhos
  const aVence=opc&&opc.bVence?false:(+a._atualizadoEm||0)>=(+b._atualizadoEm||0);
  const tomb={...(b._apagados||{}),...(a._apagados||{})};
  Object.keys(b._apagados||{}).forEach(k=>{const x=tomb[k]||0,y=b._apagados[k];tomb[k]=Math.abs(y)>Math.abs(x)?y:x;});
  const apagado=k=>(tomb[k]||0)>0;
  const NADA={}; // marcador de "não existe"
  const obj=x=>x&&typeof x==="object"&&!Array.isArray(x);
  const chave=x=>obj(x)?(x.id!=null?x.id:(x.ym!=null?x.ym:null)):null;
  const temRegistros=v=>Array.isArray(v)&&v.length>0&&v.every(e=>chave(e)!=null);
  function m(x,y,z,path,av){if(av===undefined)av=aVence;
    if(iguais(x,y))return x;
    // regra das 3 vias (só um lado mudou em relação à base → vale esse lado). NÃO vale para listas de
    // registros nem para objetos que as contêm: lá a junção é item a item, senão um lado com dados
    // velhos (que nunca teve o mês novo) levaria a lista inteira e o mês sumiria.
    const tresVias=()=>{if(z!==NADA){if(iguais(x,z))return{v:y};if(iguais(y,z))return{v:x};}return null;};
    if(Array.isArray(x)&&Array.isArray(y)){
      const zArr=Array.isArray(z)?z:[];
      const todos=[...x,...y];
      if(!(todos.length&&todos.every(e=>chave(e)!=null))){const r=tresVias();if(r)return r.v;}
      else{
        const mz=new Map(zArr.filter(e=>chave(e)!=null).map(e=>[String(chave(e)),e]));
        const ordem=[],mapa=new Map();
        const add=(e,lado)=>{const k=String(chave(e));if(apagado(k))return;if(!mapa.has(k)){mapa.set(k,{});ordem.push(k);}mapa.get(k)[lado]=e;};
        (av?x:y).forEach(e=>add(e,av?"x":"y"));(av?y:x).forEach(e=>add(e,av?"y":"x"));
        const out=[];
        ordem.forEach(k=>{const v=mapa.get(k),zb=mz.has(k)?mz.get(k):NADA;
          if(v.x&&v.y){ // registro com carimbo próprio (_em, ex.: meses): conflito decidido pela edição DELE, não do app todo
            const avR=(v.x._em||v.y._em)?(+v.x._em||0)>=(+v.y._em||0):av;
            out.push(m(v.x,v.y,zb,path+"/"+k,avR));return;}
          // só um lado tem: fica. Sumir de um lado sem marcador em _apagados NÃO é exclusão — uma janela
          // ou aparelho com dados velhos (que nunca teve o registro) não pode apagar um mês novo.
          // Exclusões de verdade passam por marcarApagado() e já foram barradas no add() acima.
          out.push(v.x||v.y);});
        return out;
      }
      return av?x:y;
    }
    if(obj(x)&&obj(y)){
      const zo=obj(z)?z:null,o={};
      new Set([...Object.keys(x),...Object.keys(y)]).forEach(k=>{
        const p=path+"/"+k;if(apagado(p)||k==="_apagados")return;
        const zk=zo&&(k in zo)?zo[k]:NADA;
        if(k in x&&k in y){o[k]=m(x[k],y[k],zk,p,av);return;}
        const v=k in x?x[k]:y[k];
        if(zk!==NADA&&iguais(v,zk)&&!temRegistros(v))return; // o outro lado removeu esta chave e este não mexeu (lista de registros: só com marcador)
        o[k]=v;
      });
      return o;
    }
    {const r=tresVias();if(r)return r.v;}
    return av?x:y;
  }
  const r=m(a,b,base?base:NADA,"");
  const limite=Date.now()-180*86400000; // esquece exclusões com mais de 6 meses
  r._apagados={};Object.entries(tomb).forEach(([k,t])=>{if(Math.abs(t)>limite)r._apagados[k]=t;});
  r._atualizadoEm=Math.max(+a._atualizadoEm||0,+b._atualizadoEm||0);
  return r;
}

}

// ---- Números no padrão do Brasil (F-NUM): ponto = milhar, vírgula = decimal ----
// numBR: ÚNICO leitor de número digitado/colado do app (campos, holerite, extrato, simulação).
//  com vírgula: vírgula é o decimal e os pontos são milhar ("1.550,30", "1550,30"); "1,299.50" (americano) também;
//  sem vírgula: "1.550" / "1.234.567" = milhar (não começa com 0: "0.123" é decimal); "12.5" / "1550.30" = decimal. Aceita "R$", espaços, "-" ou "(…)" = negativo.
//  pontoDecimal=true (OFX): sem vírgula o ponto é sempre decimal. Devolve NaN se não houver número.
function numBR(t,pontoDecimal){
  t=String(t==null?"":t).trim().replace(/R\$\s?/gi,"").replace(/\s/g,"");if(!t)return NaN;
  const neg=/^[-\u2212]|^\(.*\)$|[-\u2212]$/.test(t);
  const m=t.replace(/[()+\-\u2212]/g,"").match(/\d[\d.,]*|[.,]\d+/);if(!m)return NaN;t=m[0];
  const ic=t.lastIndexOf(","),ip=t.lastIndexOf(".");let s;
  if(ic>=0){
    if(ip>ic||t.indexOf(",")!==ic)s=t.replace(/,/g,"");           // 1,299.50 · 1,234,567
    else s=t.replace(/\./g,"").replace(",",".");                    // 1.550,30 · 1550,30
  }else if(!pontoDecimal&&/^[1-9]\d{0,2}(\.\d{3})+$/.test(t))s=t.replace(/\./g,""); // 1.550 · 1.234.567
  else s=t;                                                        // 12.5 · 1550.30
  const v=parseFloat(s);return isNaN(v)?NaN:(neg&&v!==0?-v:v);
}

function holt(ys,a=0.5,b=0.3){
  const at=ys.filter(v=>v!==null&&v!==undefined);
  if(at.length<2)return at[0]||0;
  let l=at[0],t=at[1]-at[0];
  for(let i=1;i<at.length;i++){const pl=l;l=a*at[i]+(1-a)*(l+t);t=b*(l-pl)+(1-b)*t;}
  return l+t;
}
const fixosDoMes=m=>Object.entries(m.contas).filter(([n])=>tipoOf(n)==="Fixo").reduce((s,[,v])=>s+(+v||0),0);
// Score de saúde (0–100), sempre sobre o mês e com as MESMAS definições do resto do app:
//  40 · sobra ÷ renda (cheio a partir de 20%)   30 · fixos ÷ renda (cheio até 50%, zero a partir de 80%)
//  20 · dívidas ÷ renda (cheio até 15%, zero a partir de 40%) — dívida = conta na categoria
//       "Dívidas e cartões" OU com parcelamento configurado (financiamento, empréstimo...)
//  10 · consistência: meses com sobra positiva entre os 3 últimos
// renda aqui = renda + recebimentos avulsos (a mesma base da sobra única).
function ehDivida(n){return catOf(n)==="Dívidas e cartões"||!!(state.parcelas&&state.parcelas[n]);}
function scoreMes(idx){
  const ms=mesesA();const m=ms[idx];if(!m)return null;
  const r=r2(renda(m)+avulsosDoMes(m.ym).renda);if(r<=0)return null;
  const sb=sobra(m),fix=fixosDoMes(m);
  const contasDiv=Object.entries(m.contas).filter(([n,v])=>+v>0&&ehDivida(n));
  const div=r2(contasDiv.reduce((s,[,v])=>s+(+v||0),0));
  const p1=clamp((sb/r)/0.20,0,1)*40;
  const p2=clamp((0.80-fix/r)/0.30,0,1)*30;
  const p3=clamp((0.40-div/r)/0.25,0,1)*20;
  const w=ms.slice(Math.max(idx-2,0),idx+1);
  const pos=w.filter(x=>sobra(x)>0).length;
  const p4=(pos/w.length)*10;
  return{total:Math.round(p1+p2+p3+p4),p1:Math.round(p1),p2:Math.round(p2),p3:Math.round(p3),p4:Math.round(p4),
    det:{ym:m.ym,renda:r,sobra:sb,fixos:r2(fix),dividas:div,contasDiv:contasDiv.map(([n,v])=>[n,+v]),pos,janela:w.map(x=>[x.ym,sobra(x)])}};
}
function sazonalidade(){

}
function linreg(ys){const n=ys.length;if(n<2)return{a:ys[0]||0,b:0};let sx=0,sy=0,sxy=0,sxx=0;ys.forEach((y,i)=>{sx+=i;sy+=y;sxy+=i*y;sxx+=i*i;});const b=(n*sxy-sx*sy)/(n*sxx-sx*sx||1);const a=(sy-b*sx)/n;return{a,b};}

function pendenciasDe(ym){
  const m=meses().find(x=>x.ym===ym);if(!m)return[];
  const P=state.pagos[ym]||{};

function vencDe(n){return state.vencDia&&+state.vencDia[n]||0;}

// dias até o vencimento de uma conta no mês corrente (negativo = atrasada). null se sem dia definido.
function diasAteVenc(n){
  const dia=vencDe(n);if(!dia)return null;
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const alvo=new Date(hoje.getFullYear(),hoje.getMonth(),Math.min(dia,new Date(hoje.getFullYear(),hoje.getMonth()+1,0).getDate()));
  return Math.round((alvo-hoje)/86400000);
}
// vencimentos do mês corrente ainda não pagos
function vencimentosPendentes(){
  const ym=mesAtualYm();const m=meses().find(x=>x.ym===ym);if(!m)return[];
  const P=state.pagos[ym]||{};
  return Object.entries(m.contas).filter(([n,v])=>+v>0&&!P[n]&&vencDe(n))
    .map(([n,v])=>({n,v:+v,dias:diasAteVenc(n),dia:vencDe(n)}))
    .sort((a,b)=>a.dias-b.dias);
}

// ---- Campos de número no padrão do Brasil (F-NUM) ----
// Todo campo com o atributo data-num é texto com teclado decimal e mostra "1.550,30". Digitar "1550,30", "1.550,30" ou "1550.30" dá 1550.3.
// Os handlers antigos (onchange="...=+this.value") continuam iguais: no evento change (fase de captura, antes deles)
// o campo troca o texto digitado pelo número com ponto decimal ("1550.3"); depois que o handler roda, volta a mostrar "1.550,30".
// Campos sem onchange (lidos por botão, via numBR) já ficam formatados na hora. O estado guarda número JS normal.
function campoMostrar(el,n){const mn=String(el.getAttribute("step")||"")==="0.01"?2:0;
  el.value=isFinite(n)?n.toLocaleString("pt-BR",{minimumFractionDigits:mn,maximumFractionDigits:Math.max(mn,6)}):"";}
// campo que pode ser NEGATIVO (ex.: saldo da conta no vermelho): o teclado numérico do iPhone não tem o "-", então ganha um botão ± ao lado
function campoSinal(el){if(!el||!el.hasAttribute||!el.hasAttribute("data-neg")||el.getAttribute("data-sinal"))return;el.setAttribute("data-sinal","1");
  if(!el.parentNode||!document.createElement)return;
  const b=document.createElement("button");b.type="button";b.className="btn";b.textContent="±";b.title="Trocar sinal: positivo ↔ negativo";b.setAttribute("aria-label","Trocar o sinal do valor (positivo ou negativo)");
  b.style.cssText="min-width:44px;min-height:44px;margin-left:6px;font-size:18px";
  b.onclick=()=>{const t=String(el.value||"").trim(),n=numBR(t);
    if(!t||t==="-"){el.value=t==="-"?"":"-";if(el.focus)el.focus();return;} // campo vazio: só põe o "-" e deixa a pessoa digitar os números
    campoMostrar(el,-n);try{el.dispatchEvent(new Event("change",{bubbles:true}));}catch(e){}if(el.focus)el.focus();};
  el.parentNode.insertBefore(b,el.nextSibling);}
function campoPreparar(el){ // ao desenhar: valor de máquina ("1550.3") -> "1.550,30"
  campoSinal(el);
  if(!el||el.getAttribute("data-fmt"))return;el.setAttribute("data-fmt","1");
  const v=el.value;if(v===""||v==null)return;
  if(/^-?\d+(\.\d+)?(e[+-]?\d+)?$/i.test(v))campoMostrar(el,Number(v));}
function campoMudou(el){ // ao digitar: entende o formato do Brasil
  el.setAttribute("data-fmt","1");const n=numBR(el.value);
  if(el.getAttribute("onchange")){el.value=isNaN(n)?"":String(n);   // o handler antigo lê +this.value
    setTimeout(()=>{if(el.isConnected!==false)campoMostrar(el,n);},0);}
  else campoMostrar(el,n);}
try{if(typeof document!=="undefined"&&document.addEventListener){
  document.addEventListener("change",e=>{const t=e.target;if(t&&t.getAttribute&&t.getAttribute("data-num")!==null)campoMudou(t);},true);
  document.addEventListener("focusin",e=>{const t=e.target;if(t&&t.getAttribute&&t.getAttribute("data-num")!==null)campoPreparar(t);},true);
  if(typeof MutationObserver==="function"&&document.documentElement)new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){
    if(n.nodeType!==1)continue;if(n.matches&&n.matches("input[data-num]"))campoPreparar(n);
    if(n.querySelectorAll)n.querySelectorAll("input[data-num]").forEach(campoPreparar);}}).observe(document.documentElement,{childList:true,subtree:true});
}}catch(e){}

function vVisao(){
  const ms=mesesA();const all=meses();
  const sel=state.visSel&&ms.some(m=>m.ym===state.visSel)?state.visSel:"todos";
  const isM=sel!=="todos";

  const mva=ms.reduce((s,m)=>s+(+m.va||0),0)/ms.length;

// ============ SOBRAS (mês a mês) ============
// ============ MOVIMENTOS DO MÊS (caixa real) ============
const movsDoMes=ym=>(state.movs[ym]||[]).slice().sort((a,b)=>(a.dia||0)-(b.dia||0));
function pagoNoMes(ym){ // soma das contas marcadas como pagas na aba Status
  const m=meses().find(x=>x.ym===ym);if(!m)return 0;
  const P=state.pagos[ym]||{};
  return r2(Object.entries(m.contas).reduce((s,[n,v])=>s+((+v>0&&P[n])?((m.pagoReal&&+m.pagoReal[n])||+v):0),0));
}
function contasDoMes(ym){const m=meses().find(x=>x.ym===ym);return m?totalContas(m):0;}
// caixa que sobra AGORA: renda - contas já pagas - gastos avulsos + rendas extras
function caixaReal(ym){
  const m=meses().find(x=>x.ym===ym);if(!m)return{ini:0,pago:0,gasto:0,extra:0,saldo:0,previsto:0};
  const r=renda(m);
  const pago=pagoNoMes(ym);
  const movs=state.movs[ym]||[];
  const gasto=r2(movs.filter(x=>x.tipo!=="renda").reduce((s,x)=>s+(+x.valor||0),0));
  const extra=r2(movs.filter(x=>x.tipo==="renda").reduce((s,x)=>s+(+x.valor||0),0));
  const contasTot=r2(totalContas(m));
  const P=state.pagos[ym]||{};
  const aPagar=r2(Object.entries(m.contas).reduce((s,[n,v])=>s+((+v>0&&!P[n])?+v:0),0)); // contas ainda não pagas
  const inicial=r2(+((state.saldoInicial||{})[ym])||0); // o que já havia na conta no começo do mês (opcional)
  const saldoAgora=r2(inicial+r+extra-pago-gasto);
  return{
    renda:r, pago, gasto, extra, inicial,
    saldoAgora,                              // o que tem em conta considerando só o já pago
    aPagar,
    saldoFim:r2(saldoAgora-aPagar),          // projeção fim do mês: todas as contas pagas
    contasTot
  };
}
// card rápido do Início: a sobra em conta agora do mês corrente (ou do último mês cadastrado), sem entrar em Mês → Gerenciar sobra
function cardSobraAgora(){
  const all=meses();if(!all.length)return"";
  const ym=all.some(m=>m.ym===mesAtualYm())?mesAtualYm():all[all.length-1].ym,C=caixaReal(ym);
  return `<div class="card" style="border-color:var(--indigo)"><div class="flexbet"><h3 style="margin:0">💰 Sobra em conta agora — ${lbl(ym)}</h3>
      <b class="${C.saldoAgora>=0?"teal":"rose"}" style="font-size:20px">${fmt(C.saldoAgora)}</b></div>
    <p class="note" style="margin-top:4px">Falta pagar ${fmt(C.aPagar)} em contas · fim do mês, com tudo pago: <b class="${C.saldoFim>=0?"teal":"rose"}">${fmt(C.saldoFim)}</b></p>
    <div class="row" style="margin-top:6px"><button class="btn primary" onclick="abrirLancamento()">+ Lançar</button>
      <button class="btn" onclick="sobSel='${ym}';go('sobras')">ver detalhes →</button></div></div>`;
}
function setSaldoInicial(ym,v){if(!state.saldoInicial)state.saldoInicial={};if(v===""||v==null)delete state.saldoInicial[ym];else state.saldoInicial[ym]=+v;save();render();}
function conciliar(ym){
  const el=document.getElementById("concSaldo");const banco=numBR(el&&el.value);
  if(!isFinite(banco)){alert("Digite o saldo real que aparece no banco.");return;}
  const C=caixaReal(ym);const dif=r2(banco-C.saldoAgora);
  if(Math.abs(dif)<0.005){alert("✅ Bateu! Ferramenta e banco mostram "+fmt(banco)+".");return;}
  const lado=dif<0?"O banco tem MENOS que a ferramenta (faltou lançar um gasto ou um débito foi maior).":"O banco tem MAIS que a ferramenta (faltou lançar um recebimento ou um débito foi menor).";
  if(confirm("Diferença: "+fmt(dif)+" ("+fmt(banco)+" no banco × "+fmt(C.saldoAgora)+" aqui).\n"+lado+"\n\nRegistrar um AJUSTE DE CONCILIAÇÃO de "+fmt(Math.abs(dif))+" para alinhar? (vira um lançamento avulso, dá para excluir depois)")){
    if(!state.movs[ym])state.movs[ym]=[];
    state.movs[ym].push({id:uid(),nome:"Ajuste de conciliação (banco "+fmt(banco)+")",valor:Math.abs(dif),tipo:dif<0?"gasto":"renda",cat:"Outros",dia:new Date().getDate()});
    save();render();
  }
}
function addMov(ym){
  const nome=document.getElementById("mvNome").value.trim();
  const valor=numBR(document.getElementById("mvVal").value)||0;
  const tipo=document.getElementById("mvTipo").value;
  let cat=document.getElementById("mvCat").value;
  const dia=numBR(document.getElementById("mvDia").value)||new Date().getDate();
  if(!nome||!valor){alert("Preencha descrição e valor.");return;}
  if(tipo==="renda")cat="Renda extra";
  else if(!cat||cat==="auto")cat=classificaMov(nome)||"Outros";
  if(!state.movs[ym])state.movs[ym]=[];
  state.movs[ym].push({id:uid(),nome,valor,tipo,cat,dia});
  save();render();
}
function delMov(ym,id){
  const mv=(state.movs[ym]||[]).find(x=>x.id===id);
  if(mv&&!confirm('Excluir o lançamento "'+mv.nome+'" ('+fmt(mv.valor)+')?'))return;
  marcarApagado(id);
  state.movs[ym]=(state.movs[ym]||[]).filter(x=>x.id!==id);save();render();
}
function setMovCat(ym,id,c){const mv=(state.movs[ym]||[]).find(x=>x.id===id);if(mv){mv.cat=c;aprenderCategoria(mv.nome,c);save();render();}}
function novaCatUser(){
  const c=prompt("Nome da nova categoria:");if(!c)return;

let sobSel=null;
function vSobras(){
  const ms=mesesA();const all=meses();
  // mês aberto por padrão: o mês corrente, se já existir; senão o último cadastrado
  if(!sobSel||!all.some(m=>m.ym===sobSel)){
    const atual=all.find(m=>m.ym===mesAtualYm());
    sobSel=atual?atual.ym:all[all.length-1].ym;
  }
  const m=all.find(x=>x.ym===sobSel);
  const C=caixaReal(sobSel);
  const movs=movsDoMes(sobSel);
  const P=state.pagos[sobSel]||{};
  const nContas=Object.values(m.contas).filter(v=>+v>0).length;
  const nPagas=Object.entries(m.contas).filter(([n,v])=>+v>0&&P[n]).length;
  const tudoPago=nPagas===nContas&&nContas>0;
  // acumulado histórico (extrato) — igual antes, mas só meses reais nas análises
  let acc=0;
  const rows=ms.map(x=>{const r=renda(x),c=totalContas(x),sb=r-c;acc+=sb;return{ym:x.ym,r,c,sb,acc};});

  // gastos avulsos por categoria (mês selecionado)
  const porCatMov={};movs.filter(x=>x.tipo!=="renda").forEach(x=>{porCatMov[x.cat]=(porCatMov[x.cat]||0)+(+x.valor||0);});
  const catsOrd=Object.entries(porCatMov).sort((a,b)=>b[1]-a[1]);
  const catsSel=catsMovList();

  // insights
  const ins=[];
  if(tudoPago)ins.push(["teal","Todas as "+nContas+" contas fixas de "+lbl(sobSel)+" estão pagas. O que está em conta agora é seu caixa livre."]);
  else ins.push(["amber","Ainda faltam <b>"+fmt(C.aPagar)+"</b> em contas a pagar ("+(nContas-nPagas)+" de "+nContas+") — marque na aba Status. A projeção de fim de mês já considera elas."]);
  if(C.gasto>0){const maiorCat=catsOrd[0];if(maiorCat)ins.push(["amber","Maior gasto avulso do mês: <b>"+maiorCat[0]+"</b> ("+fmt(maiorCat[1])+", "+fmtNum(maiorCat[1]/C.gasto*100,0)+"% dos avulsos)."]);}
  if(C.saldoFim<0)ins.push(["rose","Projeção de fim de mês <b>NEGATIVA</b> ("+fmt(C.saldoFim)+") — os gastos avulsos já comprometeram a sobra. Segure o ritmo."]);
  else if(C.saldoFim<500)ins.push(["amber","Projeção de fim de mês apertada: "+fmt(C.saldoFim)+". Cuidado com novos gastos."]);
  else ins.push(["teal","Projeção saudável: se nada mudar, fecha o mês com <b>"+fmt(C.saldoFim)+"</b> livre."]);

  return `
  <div class="card"><div class="row">
    <span>Mês:</span><select onchange="sobSel=this.value;render()">${[...all].reverse().map(x=>`<option value="${x.ym}" ${x.ym===sobSel?"selected":""}>${lbl(x.ym)}</option>`).join("")}</select>

  </div></div>

  <div class="grid g4">
    <div class="card metric"><div class="lbl">Renda do mês${C.extra>0?" + extras":""}</div><div class="val teal">${fmt(C.renda+C.extra)}</div><div class="sm">salário/extra${C.extra>0?" + "+fmt(C.extra)+" avulso":""}</div></div>
    <div class="card metric"><div class="lbl">Contas pagas</div><div class="val">${fmt(C.pago)}</div><div class="sm">${nPagas} de ${nContas} · falta ${fmt(C.aPagar)}</div></div>
    <div class="card metric"><div class="lbl">Gastos avulsos</div><div class="val rose">${fmt(C.gasto)}</div><div class="sm">${movs.filter(x=>x.tipo!=="renda").length} lançamento(s)</div></div>
    <div class="card metric" style="border-color:var(--indigo)"><div class="lbl">💰 Sobra em conta agora</div><div class="val ${C.saldoAgora>=0?'teal':'rose'}">${fmt(C.saldoAgora)}</div><div class="sm">renda − pago − avulsos</div></div>
  </div>

  <div class="card" style="border-color:var(--indigo)"><div class="flexbet"><h3>💰 Quanto sobra na sua conta — ${lbl(sobSel)}</h3>
    ${tudoPago?'<span class="pill teal">todas as contas pagas</span>':`<span class="pill" style="background:#fef3c7;color:#92400e">${nContas-nPagas} conta(s) a pagar</span>`}</div>
    <table style="max-width:560px">
      <tr><td>Saldo no começo do mês <span class="note" style="margin:0">(o que já estava na conta — opcional, para a conciliação bater)</span></td><td class="n"><input type="text" inputmode="decimal" data-num data-neg step="0.01" value="${C.inicial||""}" placeholder="0,00" style="width:110px" onchange="setSaldoInicial('${sobSel}',this.value)"></td></tr>

let cmpA=null,cmpB=null;
function vComparar(){

// ============ CONTAS / TENDÊNCIAS ============
let contaSel=null;
function allContas(){const s=new Set();meses().forEach(m=>Object.keys(m.contas).forEach(k=>s.add(k)));return[...s].sort();}
function serieConta(n){return mesesA().map(m=>+m.contas[n]||0);}
function fixosMed(){const l3=mesesA().slice(-3);return l3.reduce((s,m)=>s+Object.entries(m.contas).filter(([n])=>tipoOf(n)==="Fixo").reduce((a,[,v])=>a+(+v||0),0),0)/l3.length;}
function variaveisMed(){const l3=mesesA().slice(-3);return l3.reduce((s,m)=>s+Object.entries(m.contas).filter(([n])=>tipoOf(n)==="Variável").reduce((a,[,v])=>a+(+v||0),0),0)/l3.length;}
// mudança de patamar: último(s) valor(es) estáveis num nível diferente da mediana anterior
function patamarInfo(n){
  const ys=serieConta(n).map((v,i)=>({v:+v||0,ym:mesesA()[i].ym})).filter(x=>x.v>0);
  if(ys.length<3)return null;
  const ult=ys[ys.length-1],ant=ys[ys.length-2];
  const prev=ys.slice(0,-1).slice(-6).map(x=>x.v);
  const medPrev=mediana(prev);
  if(!(medPrev>0))return null;
  const dif=ult.v-medPrev,pct=dif/medPrev*100;
  if(Math.abs(pct)<10||Math.abs(dif)<30)return null;
  // confirmado se os 2 últimos estão do mesmo lado e próximos entre si
  const confirmado=Math.abs(ant.v-medPrev)/medPrev>=0.1&&Math.sign(ant.v-medPrev)===Math.sign(dif)&&Math.abs(ult.v-ant.v)/ult.v<0.1;
  return{medPrev,ult:ult.v,ymUlt:ult.ym,dif,pct,confirmado};
}
function vContas(){
  const nomes=allContas();if(!contaSel||!nomes.includes(contaSel))contaSel=nomes[0];
  const rows=nomes.map(n=>{const ys=serieConta(n);const{b}=linreg(ys);const med=ys.reduce((s,v)=>s+v,0)/ys.length;
    return{n,med,ult:ys[ys.length-1],b};}).sort((x,y)=>y.med-x.med);
  return `
  <div class="card"><div class="row"><span>Conta:</span>
    <select onchange="contaSel=this.value;render()">${nomes.map(n=>`<option ${n===contaSel?'selected':''}>${esc(n)}</option>`).join("")}</select>
    <span class="note">categoria: ${catOf(contaSel)} · tipo: ${tipoOf(contaSel)}</span></div>
    <div class="chartbox sm" style="margin-top:10px"><canvas id="cConta"></canvas></div>
    ${(()=>{const p=patamarInfo(contaSel);if(!p)return"";
      return `<div style="margin-top:8px;padding:8px 10px;border:1px solid ${p.dif>0?'#fda4af':'#a7f3d0'};border-radius:10px;background:${p.dif>0?'#fff1f2':'#f0fdfa'}">
      <b style="font-size:13px">${p.dif>0?'📈':'📉'} Mudança de patamar ${p.confirmado?'confirmada (2+ meses no novo nível)':'detectada em '+lbl(p.ymUlt)}</b>
      <p style="font-size:13px;margin:4px 0 0">Era <b>~${fmt(p.medPrev)}/mês</b> (mediana anterior) → agora <b>${fmt(p.ult)}/mês</b>:
      <b style="color:${p.dif>0?'#be123c':'#0d9488'}">${p.dif>0?'+':''}${fmt(p.dif)}/mês (${p.pct>0?'+':''}${fmtNum(p.pct,0)}%)</b>
      = <b style="color:${p.dif>0?'#be123c':'#0d9488'}">${p.dif>0?'+':''}${fmt(p.dif*12)}/ano</b>.</p>
      <p class="note" style="margin-top:4px">${p.dif>0?'Se for o novo normal (casa nova, reajuste), esse é o custo permanente da mudança — ajuste a meta da categoria e a "sobra desejada" na Balança. A linha tracejada no gráfico mostra o patamar antigo.':'Nível caiu — se for permanente (renegociação, mudança), é um "aumento de salário": direcione a diferença para metas ou quitação de dívidas.'}</p></div>`;})()}</div>
  <div class="card"><h3>Todas as contas — média, último valor e tendência</h3>
  <p class="note">Gastos fixos (média 3m): <b>${fmt0(fixosMed())}</b> · variáveis: <b>${fmt0(variaveisMed())}</b> — os fixos são o piso do orçamento; simulações e a Balança usam essa distinção.</p>
  <table><tr><th>Conta</th><th>Categoria</th><th>Tipo</th><th class="n">Média/mês</th><th class="n">Último</th><th class="n">Tendência*</th></tr>
  ${rows.map(r=>`<tr><td>${esc(r.n)}</td><td>${esc(catOf(r.n))}</td><td>${tipoOf(r.n)}</td><td class="n">${fmt0(r.med)}</td><td class="n">${fmt0(r.ult)}</td>
    <td class="n ${r.b>5?'up':r.b<-5?'down':''}">${r.b>5?'▲':r.b<-5?'▼':'▬'} ${fmt0(Math.abs(r.b))}/mês</td></tr>`).join("")}</table>
  <p class="note">*Inclinação da regressão linear sobre o histórico. Contas sazonais (IPVA, cartão) oscilam — olhe o gráfico antes de concluir.</p></div>`;

// ============ PREVISÃO ============
const PREV_CORES=["#e11d48","#0d9488","#6366f1","#d97706"];
const prevNome=k=>({__total__:"Total das contas",__sobra__:"Sobra",__fixas__:"Só contas fixas",__variaveis__:"Só contas variáveis"}[k]||k);
function seriePrevKey(k){const ms=mesesA();
  if(k==="__total__")return ms.map(totalContas);
  if(k==="__sobra__")return ms.map(sobra);
  if(k==="__fixas__")return ms.map(m=>Object.entries(m.contas).filter(([n])=>tipoOf(n)==="Fixo").reduce((s,[,v])=>s+(+v||0),0));
  if(k==="__variaveis__")return ms.map(m=>Object.entries(m.contas).filter(([n])=>tipoOf(n)==="Variável").reduce((s,[,v])=>s+(+v||0),0));
  return ms.map(m=>+m.contas[k]||0);}
function radar(){
  const ms=mesesA();const n=ms.length;const out=[];
  if(n<3)return out;
  for(const c of allContas()){
    const ys=serieConta(c);const at=ys.filter(v=>v>0);
    if(at.length<2)continue;
    const med=mediana(at);const last=ys[n-1];
    if(n>=4&&ys[n-1]>ys[n-2]&&ys[n-2]>ys[n-3]&&ys[n-3]>ys[n-4]&&ys[n-4]>0)
      out.push(["amber","▲ <b>"+esc(c)+"</b> subiu 3 meses seguidos ("+fmt0(ys[n-4])+" → "+fmt0(last)+")."]);
    if(last>0&&med>0&&last>med*1.3)
      out.push(["rose","<b>"+esc(c)+"</b> fechou o último mês "+fmtNum((last/med-1)*100,0)+"% acima da sua mediana ("+fmt0(med)+") — vale investigar."]);
    if(tipoOf(c)==="Fixo"&&at.length>=3){
      const mean=at.reduce((s,v)=>s+v,0)/at.length;
      const cv=Math.sqrt(at.reduce((s,v)=>s+(v-mean)**2,0)/at.length)/mean;
      if(cv>0.15)out.push(["amber","<b>"+esc(c)+"</b> está marcada como fixa, mas oscila "+fmtNum(cv*100,0)+"% — considere reclassificar como variável (aba Editar)."]);
    }
    if(at.length/n<=0.6&&at.length>=2)

const KEYWORDS=[
 {re:/(casa|apart|apto|aluguel|imovel|moradia|mudanc|kitnet)/,alvo:"__moradia__"},
 {re:/(carro|veiculo|moto|caminhonete|suv)/,alvo:"Carro"},

function baseRowsGet(){
  const S=state.simg;

    S.baseRows=allContas().map(n=>({nome:n,valor:(n in S.baseOver)?+S.baseOver[n]:(+M.contas[n]||0)})).filter(r=>r.valor>0);
    S.baseOver={};salvarLocal(); // conversão de formato antigo, não é edição do usuário

function projCfg(cfg,N){
  const ms=mesesA();const M=ms.find(x=>x.ym===cfg.base)||ms[ms.length-1];
  const baseC={};
  if(Array.isArray(cfg.rows)){cfg.rows.forEach(r=>{baseC[r.nome]=(baseC[r.nome]||0)+(+r.valor||0);});}
  else{const ov=cfg.baseOver||{};allContas().forEach(n=>{const v=(n in ov)?+ov[n]:(+M.contas[n]||0);if(v>0)baseC[n]=v;});}
  const sal=(cfg.salBase!=null&&cfg.salBase!=="")?+cfg.salBase:(+M.salario||0);
  const out=[];let acc=0;
  for(let k=1;k<=N;k++){
    const c={...baseC};
    (cfg.itens||[]).forEach((it,ix)=>{
      const ativo=!it.dur||k<=it.dur;
      if(it.modo==="substituir"&&it.alvo){
        const tg=it.alvo==="__moradia__"?["Aluguel","Condomínio"]:[it.alvo];
        if(ativo)tg.forEach(t=>{if(t in c)c[t]=0;});
        c["__n"+ix]=ativo?+it.valor||0:0;
      }else{c["__e"+ix]=ativo?+it.valor||0:0;}
    });
    const despesa=Object.values(c).reduce((s,v)=>s+(+v||0),0);
    const extrasK=(cfg.extras||[]).reduce((s,e)=>{
      const ini=+(e.mesIni||1),mm=Math.max(1,+(e.meses||1));
      return s+((k>=ini&&k<ini+mm)?(+e.valor||0)/mm:0);
    },0);
    const rendaK=sal+extrasK;
    const sb=rendaK-despesa;acc+=sb;
    out.push({k,renda:rendaK,rendaFixa:sal,despesa,sobra:sb,sobraFixa:sal-despesa,extrasK,acc});
  }
  return out;
}
function interpretar(txt){
  const t=norm(txt);
  const nums=(txt.match(/\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?/g)||[])
    .map(x=>numBR(x))
    .filter(v=>v>0);
  let dur=0;const md=t.match(/(?:por|durante)\s*(\d{1,3})\s*(?:mes|meses)/)||t.match(/(\d{1,3})\s*(?:x|parcelas|vezes)\b/);
  if(md)dur=+md[1];
  let valor=0;
  if(nums.length){const cand=dur?nums.filter(v=>v!==dur):nums;valor=Math.max(...(cand.length?cand:nums));}
  const B=simBase();const rowNames=[...new Set(B.rows.map(r=>r.nome))];
  let alvo=null;
  for(const k of KEYWORDS){if(k.re.test(t)){alvo=k.alvo;break;}}
  if(!alvo){
    for(const n of rowNames){const words=norm(n).split(/[^a-z0-9]+/).filter(w=>w.length>3);
      if(words.some(w=>t.includes(w))){alvo=n;break;}}
  }
  const atual=alvo==="__moradia__"?B.mediaConta("Aluguel")+B.mediaConta("Condomínio"):alvo?B.mediaConta(alvo):0;
  const modo=(alvo&&atual>1)?"substituir":"extra";
  return{modo,alvo:modo==="substituir"?alvo:null,valor,dur};
}

    ${c.extras&&c.extras.length?`<table style="font-size:12px;margin-top:5px"><tr><th>Fonte</th><th class="n">Valor total</th><th>A partir de</th><th class="n">÷ meses</th><th class="n">/mês</th><th></th></tr>
    ${c.extras.map((e,j)=>{const mm=Math.max(1,+(e.meses||1));const perMes=(+e.valor||0)/mm;return `<tr>

      <td class="n"><input type="text" inputmode="decimal" data-num step="0.01" value="${e.valor}" style="width:90px;padding:3px 5px;font-size:12px" onchange="state.simg.cenarios[${i}].extras[${j}].valor=+this.value;save();render()"></td>
      <td><select style="padding:3px 5px;font-size:12px" onchange="state.simg.cenarios[${i}].extras[${j}].mesIni=+this.value;save();render()">${[...Array(12)].map((_,k)=>`<option value="${k+1}" ${+(e.mesIni||1)===k+1?"selected":""}>${mesLbl(k+1)}</option>`).join("")}</select></td>
      <td class="n"><input type="text" inputmode="decimal" data-num min="1" max="24" value="${mm}" style="width:50px;padding:3px 5px;font-size:12px" title="1 = entra de uma vez; N = diluído em N meses" onchange="state.simg.cenarios[${i}].extras[${j}].meses=Math.max(1,+this.value||1);save();render()"></td>
      <td class="n ${perMes>=0?"teal":"rose"}">${perMes>=0?"+":"−"}${fmt(Math.abs(perMes))}</td>
      <td><button class="btn danger" style="padding:2px 6px" onclick="state.simg.cenarios[${i}].extras.splice(${j},1);save();render()">✕</button></td></tr>`;}).join("")}</table>
    <p class="note" style="margin-top:4px">Cada fonte pode entrar de uma vez (÷1) ou <b>diluída em N meses</b> a partir do mês escolhido — 13º, PLR e guardado engordam a <b>renda</b> desses meses. Ex.: 7.000 guardado ÷ 4 a partir de ${mesLbl(1)} = +${fmt(7000/4)}/mês por 4 meses.</p>`:'<p class="note" style="margin-top:4px">Adicione 13º, PLR, bônus ou dinheiro guardado. Cada um pode ser diluído em vários meses para reforçar a renda fixa do período.</p>'}
    <h4>Fechamento</h4>
    <table style="font-size:12px">
      <tr><td>Sobra só com salário/mês</td><td class="n ${D.sobraEstr>=S.sobraMin?'teal':D.sobraEstr>=0?'amber':'rose'}"><b>${fmt(D.sobraEstr)}</b></td></tr>
      <tr><td>Sobra média c/ reforços (${N===12?"1 ano":N+"m"})</td><td class="n">${fmt(D.acc/N)}</td></tr>

      <tr><td>Δ vs base</td><td class="n ${D.acc-baseAcc>=0?'down':'up'}">${D.acc-baseAcc>=0?"+":""}${fmt(D.acc-baseAcc)}</td></tr>
    </table>
    <div class="chartbox mini" style="margin-top:6px"><canvas id="cSc${i}"></canvas></div>
  </div>`;};
  return `
  <div class="card"><h3>1 · Base — mês de referência (compartilhada por todos os cenários)</h3>
    <p class="note" style="margin-top:0"><span class="pill teal">🔒</span> Cópia de trabalho: nada aqui altera seus dados reais.</p>
    <div class="row" style="margin-top:8px">
      <select onchange="state.simg.base=this.value;state.simg.baseRows=null;save();render()">
        ${[...ms].reverse().map(m=>`<option value="${m.ym}" ${(S.base||ms[ms.length-1].ym)===m.ym?"selected":""}>${lbl(m.ym)}${m.ym===ms[ms.length-1].ym?" (último)":""}</option>`).join("")}
      </select>
      <label>Salário base <input type="text" inputmode="decimal" data-num step="0.01" value="${S.salBase!=null&&S.salBase!==""?S.salBase:Math.round(B.sal*100)/100}" onchange="state.simg.salBase=this.value;save();render()"></label>
      ${S.salBase!=null&&S.salBase!==""?'<button class="btn" onclick="state.simg.salBase=null;save();render()">↺ do mês</button>':''}
      <label>Sobra mínima <input type="text" inputmode="decimal" data-num step="0.01" value="${S.sobraMin}" onchange="state.simg.sobraMin=+this.value;save();render()"></label>
      <label>Horizonte <select onchange="state.simg.horizonte=+this.value;save();render()">${[1,2,3,6,12].map(h=>`<option value="${h}" ${N===h?"selected":""}>${h===12?"1 ano":h+" "+(h>1?"meses":"mês")}</option>`).join("")}</select></label>
    </div>
    <details style="margin-top:8px" ${B.custom?"open":""}><summary style="cursor:pointer;font-size:13px;font-weight:600">✏️ Contas da base ${B.custom?`(personalizada — ${B.rows.length})`:`(copiadas de ${B.baseLbl})`} · total ${fmt(B.contasAuto)} · sobra ${fmt(B.sobraAuto)}</summary>
      <table style="margin-top:6px"><tr><th>Gasto (renomeável)</th><th class="n">Valor/mês</th><th></th></tr>
      ${B.rows.map((r,i)=>`<tr>
        <td><input value="${r.nome.replace(/"/g,'&quot;')}" style="width:100%;min-width:150px" onchange="materializeBase()[${i}].nome=this.value;save();render()"></td>
        <td class="n"><input type="text" inputmode="decimal" data-num step="0.01" value="${Math.round(r.valor*100)/100}" style="width:100px" onchange="materializeBase()[${i}].valor=+this.value;save();render()"></td>
        <td><button class="btn danger" onclick="materializeBase().splice(${i},1);save();render()">✕</button></td></tr>`).join("")}</table>
      <div class="row" style="margin-top:8px">
        <input id="sbNome" placeholder="Novo gasto na base" style="flex:1;min-width:160px">
        <input id="sbVal" type="text" inputmode="decimal" data-num step="0.01" placeholder="Valor">
        <button class="btn primary" onclick="addBaseGasto()">+ adicionar</button>
        ${B.custom?`<button class="btn" onclick="if(confirm('Recarregar as contas de ${B.baseLbl}?')){state.simg.baseRows=null;save();render();}">↺ recarregar de ${B.baseLbl}</button>`:""}
      </div>
    </details></div>

  <div class="card"><div class="flexbet"><h3>2 · Cenários lado a lado</h3>
    <button class="btn primary" onclick="cenNovo()">+ novo cenário</button></div>
  <div class="simboard" style="margin-top:8px">
    <div class="scard" style="background:#f8fafc">
      <p style="font-weight:700;font-size:14px">Base ${B.baseLbl} (sem mudanças)</p>
      <h4>Fechamento</h4>
      <table style="font-size:12px">
        <tr><td>Renda/mês (salário)</td><td class="n">${fmt(B.sal)}</td></tr>
        <tr><td>Despesas/mês</td><td class="n">${fmt(B.contasAuto)}</td></tr>
        <tr><td>Sobra estrutural/mês</td><td class="n ${B.sobraAuto>=0?'teal':'rose'}"><b>${fmt(B.sobraAuto)}</b></td></tr>
        <tr><td>Acumulado (${N===12?"1 ano":N+"m"})</td><td class="n"><b>${fmt(baseAcc)}</b></td></tr>
      </table>
      <div class="chartbox mini" style="margin-top:6px"><canvas id="cScBase"></canvas></div>
      <p class="note">Referência. Edite salário e contas no painel 1 acima — vale para todos.</p>
    </div>
    ${S.cenarios.map(cardCen).join("")}
  </div>
  ${!S.cenarios.length?'<p class="note" style="margin-top:8px">Crie o primeiro cenário — ex.: "Casa 2.000 sem escola" — e depois duplique (⧉) para variar um detalhe entre eles.</p>':''}
  </div>

  ${S.cenarios.length?`<div class="card"><h3>3 · Comparação — valores lado a lado (${N===12?"1 ano":N+" meses"})</h3>
    <table><tr><th>Métrica</th><th class="n">Base</th>${S.cenarios.map(c=>`<th class="n">${esc(c.nome.length>16?c.nome.slice(0,15)+"…":c.nome)}</th>`).join("")}</tr>
      <tr><td>Renda base/mês (salário)</td><td class="n">${fmt(B.sal)}</td>${cenD.map(()=>`<td class="n">${fmt(B.sal)}</td>`).join("")}</tr>
      <tr><td>Reforços no período (13º/PLR/guardado)</td><td class="n">—</td>${cenD.map(D=>`<td class="n ${D.extrasTot>0?'teal':D.extrasTot<0?'rose':''}">${Math.abs(D.extrasTot)>0.005?(D.extrasTot>0?"+":"−")+fmt(Math.abs(D.extrasTot)):"—"}</td>`).join("")}</tr>
      <tr><td>Despesas estruturais/mês</td><td class="n">${fmt(B.contasAuto)}</td>${cenD.map(D=>`<td class="n">${fmt(D.despesa)}</td>`).join("")}</tr>
      <tr><td><b>Sobra só com salário/mês</b> <span class="note">(o gasto cabe no salário?)</span></td><td class="n">${fmt(B.sobraAuto)}</td>${cenD.map(D=>`<td class="n ${D.sobraEstr>=0?'down':'up'}"><b>${fmt(D.sobraEstr)}</b></td>`).join("")}</tr>
      <tr><td>Sobra média/mês</td><td class="n">${fmt(baseAcc/N)}</td>${cenD.map(D=>`<td class="n">${fmt(D.acc/N)}</td>`).join("")}</tr>
      <tr><td><b>Acumulado</b></td><td class="n"><b>${fmt(baseAcc)}</b></td>${cenD.map(D=>`<td class="n"><b>${fmt(D.acc)}</b></td>`).join("")}</tr>
      <tr><td>Δ vs base</td><td class="n">—</td>${cenD.map(D=>`<td class="n ${D.acc-baseAcc>=0?'down':'up'}">${D.acc-baseAcc>=0?"+":""}${fmt(D.acc-baseAcc)}</td>`).join("")}</tr>
    </table>
    <div class="row" style="margin-top:12px">
      <span class="note" style="margin:0">Ver sobra considerando:</span>
      <button class="btn ${S.simView!=="fixa"?"primary":""}" style="padding:4px 10px;font-size:12px" onclick="state.simg.simView='reforco';save();render()">Renda + reforços</button>
      <button class="btn ${S.simView==="fixa"?"primary":""}" style="padding:4px 10px;font-size:12px" onclick="state.simg.simView='fixa';save();render()">Só salário (renda fixa)</button>
      <span class="note" style="margin:0">${S.simView==="fixa"?"mostrando se o gasto cabe só no salário, sem 13º/PLR/guardado":"mostrando a sobra real do mês, com os reforços diluídos"}</span>
    </div>
    <div class="grid g2" style="margin-top:8px">
      <div><h3>Sobra mês a mês — todos juntos</h3><div class="chartbox sm"><canvas id="cMesTodos"></canvas></div></div>
      <div><h3>Acumulado — corrida final</h3><div class="chartbox sm"><canvas id="cCenComp"></canvas></div></div>
    </div></div>`:""}

  ${SUGS.length?`<div class="card" style="border-color:var(--amber)"><div class="flexbet"><h3>💡 Onde dá para mexer</h3>
    ${S.cenarios.length?`<label style="font-size:12px">aplicar em: <select onchange="state.simg.sugAlvo=+this.value;save()">${S.cenarios.map((c,i)=>`<option value="${i}" ${(+S.sugAlvo||0)===i?"selected":""}>${esc(c.nome)}</option>`).join("")}</select></label>`:""}</div>
    ${SUGS.map((sg,i)=>`<div class="flexbet" style="margin:6px 0;gap:10px">
      <p style="font-size:13px;flex:1">${sg.t}</p>
      <button class="btn" onclick="aplicarSug(${i})">+ aplicar</button></div>`).join("")}</div>`:""}`;
}

// ============ STATUS DO MÊS (pagamentos) ============
let pagSel=null;
function togglePago(ym,nome){
  if(!state.pagos[ym])state.pagos[ym]={};
  state.pagos[ym][nome]=!state.pagos[ym][nome];
  save();render();
}
function marcarTodos(ym,v){
  const m=meses().find(x=>x.ym===ym);if(!m)return;
  state.pagos[ym]={};
  if(v)Object.entries(m.contas).forEach(([n,val])=>{if(+val>0)state.pagos[ym][n]=true;});
  save();render();
}
function vStatus(){
  const all=meses();
  if(!pagSel||!all.some(m=>m.ym===pagSel))pagSel=all[all.length-1].ym;
  const m=all.find(x=>x.ym===pagSel);
  const P=state.pagos[pagSel]||{};
  const itens=Object.entries(m.contas).filter(([,v])=>+v>0).map(([n,v])=>({n,v:+v,pago:!!P[n]}));
  const total=itens.reduce((s,x)=>s+x.v,0);
  const pago=itens.filter(x=>x.pago).reduce((s,x)=>s+((m.pagoReal&&+m.pagoReal[x.n])||x.v),0);
  const pend=itens.filter(x=>!x.pago).reduce((s,x)=>s+x.v,0);
  const nPend=itens.filter(x=>!x.pago).length;
  const pct=total>0?pago/total*100:0;
  const r=renda(m);
  const pendFixas=itens.filter(x=>!x.pago&&tipoOf(x.n)==="Fixo");
  const maior=itens.filter(x=>!x.pago).sort((a,b)=>b.v-a.v)[0];
  const hist=all.filter(x=>x.ym!==pagSel).slice(-3);
  const medHist=hist.length?hist.reduce((s,x)=>s+totalContas(x),0)/hist.length:0;
  const pill=(c,t)=>`<p class="note" style="margin-top:6px"><span class="pill ${c==='teal'?'teal':'rose'}" style="${c==='amber'?'background:#fef3c7;color:#92400e':''}">${c==='teal'?'✔':'⚠'}</span> ${t}</p>`;
  const alerts=[];
  if(pend<=0&&total>0)alerts.push(["teal","🎉 <b>Mês quitado!</b> Todas as "+itens.length+" contas de "+lbl(pagSel)+" estão pagas ("+fmt(total)+")."]);
  else{
    if(maior)alerts.push(["amber","Maior pendência: <b>"+maior.n+"</b> ("+fmt(maior.v)+") — "+fmtNum(maior.v/pend*100,0)+"% do que falta."]);
    if(pendFixas.length)alerts.push(["amber",pendFixas.length+" conta(s) <b>fixa(s)</b> pendente(s) ("+fmt(pendFixas.reduce((s,x)=>s+x.v,0))+") — priorize: fixas atrasadas geram multa/juros."]);
    if(r>0){const sb=sobra(m);alerts.push([sb>=0?"teal":"rose","Pagas todas as contas (e os gastos do dia a dia já lançados), sobram <b>"+fmt(sb)+"</b> no mês."]);}
  }
  if(medHist>0&&total>medHist*1.1)alerts.push(["amber","O total deste mês ("+fmt(total)+") está "+fmtNum((total/medHist-1)*100,0)+"% acima da média dos últimos meses ("+fmt(medHist)+")."]);
  const nProv=contarProv(m);
  if(nProv)alerts.push(["amber",nProv+" valor(es) ainda <b>provisório(s)</b> (estimados do mês anterior) — o total pode mudar quando os valores reais chegarem. Ajuste na aba Editar dados."]);
  return `
  <div class="card"><div class="row">
    <span>Mês:</span><select onchange="pagSel=this.value;render()">${[...all].reverse().map(x=>`<option value="${x.ym}" ${x.ym===pagSel?"selected":""}>${lbl(x.ym)}</option>`).join("")}</select>
    <button class="btn" onclick="marcarTodos('${pagSel}',true)">✔ marcar todas pagas</button>
    <button class="btn" onclick="marcarTodos('${pagSel}',false)">↺ limpar</button>
  </div></div>

  ${(()=>{
    const ehAtual=pagSel===mesAtualYm();
    const vp=vencimentosPendentes();
    if(!ehAtual&&!vp.length)return "";
    const hoje=new Date();const dd=String(hoje.getDate()).padStart(2,"0")+"/"+String(hoje.getMonth()+1).padStart(2,"0");
    const linhaVenc=x=>{const cor=x.dias<0?"#be123c":x.dias===0?"#be123c":x.dias<=3?"#b45309":"#0d9488";
      const txt=x.dias<0?("atrasada há "+(-x.dias)+" dia(s)"):x.dias===0?"vence HOJE":("vence em "+x.dias+" dia(s)");
      return `<tr><td>${esc(x.n)}</td><td class="n">${fmt(x.v)}</td><td>dia ${x.dia}</td><td style="color:${cor};font-weight:600">${txt}</td>
        <td><button class="btn" style="padding:2px 8px" onclick="togglePago('${pagSel}','${jsAttr(x.n)}')">marcar paga</button></td></tr>`;};
    return `<div class="card" style="border-color:var(--indigo)"><div class="flexbet"><h3>📅 Painel de hoje — ${dd}</h3>
      ${ehAtual?'<span class="pill teal">mês corrente</span>':'<span class="pill" style="background:#fef3c7;color:#92400e">vendo outro mês</span>'}</div>
      ${vp.length?`<table><tr><th>Conta a vencer</th><th class="n">Valor</th><th>Vencimento</th><th>Situação</th><th></th></tr>
        ${vp.map(linhaVenc).join("")}</table>
        <p class="note">Ordenadas pela urgência. Defina o dia de vencimento de cada conta na aba <b>Editar dados</b> (coluna "Vence dia").</p>`
      :'<p class="note">Nenhuma conta com vencimento pendente no mês corrente. 👏 Defina os dias de vencimento na aba Editar dados para acompanhar aqui.</p>'}
    </div>`;
  })()}

  <div class="grid g4">
    <div class="card metric"><div class="lbl">Total do mês</div><div class="val">${fmt(total)}</div><div class="sm">${itens.length} contas</div></div>
    <div class="card metric"><div class="lbl">Já pago</div><div class="val teal">${fmt(pago)}</div><div class="sm">${itens.length-nPend} de ${itens.length} contas</div></div>
    <div class="card metric"><div class="lbl">Falta pagar</div><div class="val ${pend>0?'rose':'teal'}">${fmt(pend)}</div><div class="sm">${nPend} conta(s) pendente(s)</div></div>
    <div class="card metric"><div class="lbl">Progresso</div><div class="val ${pct>=100?'teal':pct>=50?'amber':'rose'}">${fmtNum(pct,0)}%</div><div class="bar"><div style="width:${pct}%;background:${pct>=100?"#0d9488":pct>=50?"#d97706":"#e11d48"}"></div></div></div>
  </div>

  <div class="card">${alerts.map(a=>pill(a[0],a[1])).join("")||'<p class="note">Marque as contas conforme for pagando — o painel decrementa e avisa o que falta.</p>'}</div>

  <div class="grid g2">
    <div class="card"><h3>Pago × pendente</h3><div class="chartbox sm"><canvas id="cPagDonut"></canvas></div></div>
    <div class="card"><h3>O que falta, por categoria</h3><div class="chartbox sm"><canvas id="cPagCat"></canvas></div></div>
  </div>

  <div class="card"><h3>🔔 Lembretes</h3>
    <div class="row">
      <label>Meu e-mail <input type="email" value="${state.alertEmail||""}" placeholder="voce@email.com" style="min-width:220px" onchange="state.alertEmail=this.value;save()"></label>
      <button class="btn primary" onclick="emailResumo()">📧 Enviar resumo das pendências</button>
    </div>
    <p class="note">O botão abre seu app de e-mail com a lista de pendências do mês já escrita — é só enviar (funciona no PC e no celular). <b>Envio automático diário não é possível</b> num arquivo local sem servidor — mas você tem dois substitutos bons: (1) toda vez que abrir o painel, o <b>alerta vermelho no topo</b> mostra o que está pendente; (2) crie um evento recorrente diário no Google Agenda ("conferir contas") com lembrete por e-mail/notificação — o Agenda faz o disparo diário por você.</p></div>

  <div class="card"><h3>Contas de ${lbl(pagSel)} — clique para marcar</h3>
  <table><tr><th></th><th>Conta</th><th>Categoria</th><th>Tipo</th><th>Vencimento</th><th class="n">Valor</th><th>Status</th></tr>
  ${itens.sort((a,b)=>(a.pago-b.pago)||(b.v-a.v)).map(x=>`<tr style="${x.pago?'opacity:.55':''}">
    <td><input type="checkbox" style="width:auto;cursor:pointer" ${x.pago?"checked":""} onchange="togglePago('${pagSel}','${jsAttr(x.n)}')"></td>
    <td style="${x.pago?'text-decoration:line-through':''}">${esc(x.n)}${parcelaBadge(x.n,pagSel)}${(()=>{const pi=parcelaInfo(x.n,pagSel);if(!pi||pi.antes||pi.quitada)return"";const pr=(m.pagoReal&&+m.pagoReal[x.n])||0;
      return `<br><span class="note" style="margin:0;font-size:11px">faltam ${pi.faltam} de ${pi.total} · resta ${fmt(pi.restante)} · acaba ${lbl(pi.fim)}${pr?" · pago "+fmt(pr)+(pr>pi.valor+0.005?' <b style=\'color:#be123c\'>(+'+fmt(pr-pi.valor)+' juros)</b>':""):""}</span>`;})()}</td>
    <td>${catOf(x.n)}</td><td>${tipoOf(x.n)}</td>
    <td>${(()=>{const d=vencDe(x.n);if(!d)return '<span class="note" style="margin:0">—</span>';const dias=pagSel===mesAtualYm()?diasAteVenc(x.n):null;
      if(x.pago||dias==null)return "dia "+d;
      const cor=dias<0?"#be123c":dias===0?"#be123c":dias<=3?"#b45309":"var(--mut)";
      const tx=dias<0?("⚠ atrasada "+(-dias)+"d"):dias===0?"⚠ HOJE":dias<=3?("em "+dias+"d"):("dia "+d);

function calcINSS(bruto){
  const C=state.folhaCfg;
  if(bruto>=C.inssTetoSal)return C.inssTeto;
  // faixas progressivas (limite, alíquota %) — editáveis em Parâmetros; a última vai até o teto
  const fx=(C.inssFaixas||DEFAULT.folhaCfg.inssFaixas).map(([l,a],i,arr)=>[i===arr.length-1?C.inssTetoSal:+l,+a/100]);
  let v=0,ant=0;
  for(const[lim,al]of fx){if(bruto>ant)v+=(Math.min(bruto,lim)-ant)*al;ant=lim;}
  return Math.min(v,C.inssTeto);
}
// rendTrib (opcional) = rendimento tributável bruto do mês; quando informado, aplica o redutor
// da Lei 15.270/2025 (vigente desde jan/2026): isenção até R$ 5.000 e redução parcial até R$ 7.350.
// Não é passado para o 13º (tributação exclusiva). Parâmetros editáveis em folhaCfg.redutor.
function calcIRRF(base,rendTrib){
  const C=state.folhaCfg;
  let ir=0;
  for(const[lim,al,ded]of C.irrf){if(base<=lim){ir=Math.max(base*al/100-ded,0);break;}}
  const R=C.redutor;
  if(rendTrib!=null&&R&&R.ativo){
    const red=rendTrib<=R.limIsencao?ir:(rendTrib<=R.limRedutor?Math.max(0,R.a-R.b*rendTrib):0);
    ir=Math.max(0,ir-red);
  }
  return ir;
}
function folhaCalc(){
  const F=state.folha;const C=state.folhaCfg;
  const inss=F.inssManual!=null?F.inssManual:calcINSS(F.bruto);
  const baseIR=Math.max(F.bruto-inss-(+F.pgbl||0)-(+F.dep||0)*C.depDed,0);
  const irrf=F.irrfManual!=null?F.irrfManual:calcIRRF(baseIR,F.bruto);
  const outros=(F.outros||[]).reduce((s,o)=>s+(+o.valor||0),0);
  const liq=F.bruto+(+F.creche||0)-inss-irrf-(+F.va||0)-(+F.seguro||0)-(+F.pgbl||0)-outros;
  return{inss,irrf,baseIR,outros,liq};
}

const brl=x=>numBR(x);
function classificaHolerite(texto){
  const T=texto.toUpperCase();
  // grab(palavra, modo, excluir): procura a palavra e pega o valor da linha (o último dos 2 primeiros
  // números depois dela = coluna Provento/Desconto). "excluir" ignora ocorrências cujo texto logo
  // antes bate (ex.: "DEP. IRRF" e "BASE CÁLC. IRRF" do cabeçalho/rodapé, que não são o desconto).
  const grab=(kw,which,excluir)=>{
    const re=new RegExp(kw,"g");let m;const vals=[];
    while((m=re.exec(T))){
      if(excluir&&new RegExp(excluir).test(T.slice(Math.max(0,m.index-18),m.index)))continue;
      const win=T.slice(m.index,m.index+(which==="ultimo"?140:90));
      const todos=[...win.matchAll(/(\d{1,3}(?:\.\d{3})*,\d{2})/g)].map(x=>brl(x[1]));
      const ns=which==="ultimo"?todos:todos.slice(0,2);
      if(ns.length)vals.push(ns[ns.length-1]);
    }
    if(!vals.length)return null;
    return which==="max"?Math.max(...vals):which==="ultimo"?vals[vals.length-1]:vals[0];
  };
  const CAB="DEP\\.?\\s*$|C[AÁ]LC\\.?\\s*$|BASE\\s*$|CONTRIBUI[CÇ][AÃ]O\\.?\\s*$|SAL\\.?\\s*$";
  const out={outros:[]};
  out.bruto=grab("SAL[AÁ]RIO\\s+(?:MES|BASE|DO\\s+C[AÁ]LCULO)","max")??grab("SAL[AÁ]RIO","max");
  out.creche=grab("CRECHE");
  out.inss=grab("INSS\\s*-")??grab("INSS",null,CAB);
  out.irrf=grab("IRRF\\s*-")??grab("IMPOSTO DE RENDA")??grab("IRRF",null,CAB)??grab("\\bIRF\\b",null,CAB);
  out.va=grab("VA\\s*-\\s*DESC")??grab("VALE\\s*ALIMENT")??grab("ALIMENTA[CÇ][AÃ]O\\s*-?\\s*DESC");
  out.seguro=grab("SEGURO");
  out.pgbl=grab("PGBL")??grab("PREVID[EÊ]NCIA");
  out.liquido=grab("L[IÍ]QUIDO\\s+A\\s+RECEBER","ultimo")??grab("L[IÍ]QUIDO","ultimo");
  const extras=[["Coparticipação médica","(?:CONSULTAS|COPART|MEDIC[OA]?\\b)"],["Farmácia","FARM[AÁ]CIA"],["Convênio odontológico","ODONTO"],["Empréstimo consignado","CONSIGN"]];
  for(const[nm,kw]of extras){const v=grab(kw);if(v)out.outros.push({nome:nm,valor:v});}
  return out;
}
async function lerHolerite(inp){
  const f=inp.files[0];if(!f)return;
  const st=document.getElementById("pdfStatus");
  if(typeof pdfjsLib==="undefined"){st.textContent="Leitor de PDF não carregou (sem internet na 1ª vez?). Preencha manualmente.";return;}
  st.textContent="Lendo PDF…";
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const buf=await f.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    let texto="";
    for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p);const tc=await pg.getTextContent();
      texto+=tc.items.map(it=>it.str).join(" ")+"\n";}
    const r=classificaHolerite(texto);
    const F=state.folha;let achou=[];
    if(r.bruto){F.bruto=r.bruto;achou.push("bruto "+fmt0(r.bruto));}
    F.creche=r.creche!=null?r.creche:0;if(r.creche!=null)achou.push("creche");
    if(r.inss!=null){F.inssManual=r.inss;achou.push("INSS");}
    if(r.irrf!=null){F.irrfManual=r.irrf;achou.push("IRRF");}
    F.va=r.va!=null?r.va:0;if(r.va!=null)achou.push("VA");
    F.seguro=r.seguro!=null?r.seguro:0;if(r.seguro!=null)achou.push("seguro");
    F.pgbl=r.pgbl!=null?r.pgbl:0;if(r.pgbl!=null)achou.push("PGBL");
    F.outros=r.outros;if(r.outros.length)achou.push(r.outros.length+" desconto(s) avulso(s)");
    save();render();
    const st2=document.getElementById("pdfStatus");
    if(st2)st2.textContent=achou.length?("Extraído: "+achou.join(", ")+". Confira os campos"+(r.liquido?" — líquido no holerite: "+fmt(r.liquido)+".":".")):"Não reconheci os campos deste layout — preencha manualmente.";
  }catch(e){const st2=document.getElementById("pdfStatus");if(st2)st2.textContent="Erro ao ler o PDF: "+e.message;}
}
