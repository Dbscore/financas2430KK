function provOf(m,n){return m.prov&&m.prov[n];}
function setProv(idx,n,v){const m=state.meses[idx];if(!m.prov)m.prov={};if(v)m.prov[n]=true;else delete m.prov[n];save();render();}
// método de estimativa por conta (persistido em state.provMetodo[conta])
const METODOS={ult:"Último mês",med3:"Mediana 3m",avg3:"Média 3m",max:"Maior recente",min:"Menor recente"};
function metodoDe(n){return (state.provMetodo&&state.provMetodo[n])||"ult";}
function setMetodo(n,mt){if(!state.provMetodo)state.provMetodo={};state.provMetodo[n]=mt;save();render();}
// série da conta ANTES do mês alvo (não usa o próprio mês nem meses futuros)
function serieAntes(n,ym){return meses().filter(x=>x.ym<ym).map(x=>+x.contas[n]||0);}
function estimaConta(n,ym,mt){
  mt=mt||metodoDe(n);
  const serie=serieAntes(n,ym).filter(v=>v>0);
  if(!serie.length)return 0;
  const ult3=serie.slice(-3);
  if(mt==="med3")return mediana(ult3);
  if(mt==="avg3")return ult3.reduce((s,v)=>s+v,0)/ult3.length;
  if(mt==="max")return Math.max(...ult3);
  if(mt==="min")return Math.min(...ult3);
  return serie[serie.length-1]; // ult
}
function puxarConta(idx,n){ // estima pela regra escolhida e marca como provisório
  const m=state.meses[idx];const v=estimaConta(n,m.ym);
  if(!v){alert("Sem histórico anterior para estimar "+n+".");return;}
  const vv=Math.round(v*100)/100;
  m.contas[n]=vv;
  if(!m.prov)m.prov={};m.prov[n]=true;
  if(!m.orcado)m.orcado={};m.orcado[n]=vv; // congela o orçado (previsto)
  save();render();
}
function puxarTodasPendentes(idx){ // preenche só as contas ZERADAS (não toca no que já tem valor/pago)
  const m=state.meses[idx];if(!m.prov)m.prov={};
  const nomes=new Set();meses().filter(x=>x.ym<m.ym).forEach(x=>Object.keys(x.contas).forEach(k=>nomes.add(k)));
  const recentes=new Set();meses().filter(x=>x.ym<m.ym).slice(-3).forEach(x=>Object.keys(x.contas).forEach(k=>{if(+x.contas[k]>0)recentes.add(k);}));
  let n=0;nomes.forEach(k=>{
    const pi=parcelaInfo(k,m.ym);if(pi&&pi.quitada)return;if(!recentes.has(k))return; // só o que apareceu nos últimos 3 meses
    if(!(+m.contas[k]>0)){const v=estimaConta(k,m.ym);if(v>0){const vv=Math.round(v*100)/100;m.contas[k]=vv;m.prov[k]=true;if(!m.orcado)m.orcado={};m.orcado[k]=vv;n++;}}});
  save();render();
  alert(n?("Preenchidas "+n+" conta(s) vazia(s) pela regra de cada uma, marcadas como provisórias (em vermelho). Contas que já tinham valor NÃO foram alteradas."):"Nenhuma conta zerada para preencher.");
}
function confirmarConta(idx,n){setProv(idx,n,false);}
function confirmarTodas(idx){const m=state.meses[idx];m.prov={};save();render();}
function contarProv(m){return m.prov?Object.keys(m.prov).filter(k=>m.prov[k]).length:0;}
// ===== ORÇADO × REALIZADO =====
function orcadoDe(m,n){return m.orcado&&(n in m.orcado)?+m.orcado[n]:null;}
function setOrcado(idx,n,v){const m=state.meses[idx];if(!m.orcado)m.orcado={};if(v>0)m.orcado[n]=+v;else delete m.orcado[n];save();render();}
// realizado = valor confirmado (não-provisório). Se ainda provisório, não conta como "real".
function temReal(m,n){return (+m.contas[n]>0)&&!(m.prov&&m.prov[n]);}
// linhas de comparação de um mês: só contas que têm orçado definido
function comparaMes(m){
  const out=[];
  Object.keys(m.orcado||{}).forEach(n=>{
    const orc=+m.orcado[n]||0;if(!orc)return;
    const real=+m.contas[n]||0;
    const confirmado=temReal(m,n);
    out.push({n,orc,real,confirmado,dif:real-orc,pct:orc>0?(real-orc)/orc*100:0,cat:catOf(n)});
  });
  return out.sort((a,b)=>Math.abs(b.dif)-Math.abs(a.dif));
}
function comparaPorCat(m){
  const o={};comparaMes(m).filter(r=>r.confirmado).forEach(r=>{
    if(!o[r.cat])o[r.cat]={orc:0,real:0};o[r.cat].orc+=r.orc;o[r.cat].real+=r.real;});
  return Object.entries(o).map(([cat,v])=>({cat,orc:v.orc,real:v.real,dif:v.real-v.orc,pct:v.orc>0?(v.real-v.orc)/v.orc*100:0}))
    .sort((a,b)=>Math.abs(b.dif)-Math.abs(a.dif));
}

// ===== PARCELAMENTOS =====
const parcelaCfg=n=>(state.parcelas&&state.parcelas[n])||null;
const mesesEntre=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5)-+a.slice(5));
function valorParcela(n,ym){const m=meses().find(x=>x.ym===ym);if(m&&+m.contas[n]>0)return +m.contas[n];
  const hist=meses().filter(x=>x.ym<=ym&&+x.contas[n]>0);return hist.length?+hist[hist.length-1].contas[n]:0;}
function parcelaInfo(n,ym){
  const cfg=parcelaCfg(n);if(!cfg||!cfg.inicio||!(+cfg.total>0))return null;
  const total=+cfg.total;
  const k=mesesEntre(cfg.inicio,ym)+1;             // nº da parcela neste mês
  const fim=ymAdd(cfg.inicio,total-1);             // mês da última parcela
  const v=valorParcOrig(n,ym);
  if(k<1)return{antes:true,k:0,total,fim,inicio:cfg.inicio,valor:v,faltam:total,restante:total*v};
  if(k>total)return{quitada:true,k:total,total,fim,inicio:cfg.inicio,valor:v,faltam:0,restante:0};
  const faltam=total-k;                            // após pagar a deste mês
  return{k,total,fim,inicio:cfg.inicio,valor:v,faltam,restante:faltam*v};
}
function setParcela(n,inicio,total,multa,moraDia,defasado,atrasoDesde,diasTipico,valorOrig){if(!state.parcelas)state.parcelas={};
  if(inicio&&+total>0)marcarRevivido("/parcelas/"+n);
  if(inicio&&+total>0)state.parcelas[n]={inicio,total:+total,multa:+multa||0,moraDia:+moraDia||0,defasado:!!defasado,atrasoDesde:atrasoDesde||null,diasTipico:+diasTipico||0,valorOrig:+valorOrig||0};
  else{delete state.parcelas[n];marcarApagado("/parcelas/"+n);}save();render();}
// valor ORIGINAL da parcela (do contrato); se não configurado, usa o valor lançado no mês
function valorParcOrig(n,ym){const cfg=parcelaCfg(n);return (cfg&&+cfg.valorOrig>0)?+cfg.valorOrig:valorParcela(n,ym);}
// total já pago numa dívida parcelada: meses registrados = exato; antes da ferramenta = estimado
function pagoAcumulado(n,ym){const cfg=parcelaCfg(n);if(!cfg)return null;
  const pg=pagasAte(n,ym);const v=valorParcOrig(n,ym);
  if(pg<=0)return{pg:0,cnt:0,preCnt:0,preBase:0,preJuros:0,exatoReg:0,jurosReg:0,total:0};
  const ji=jurosInfo(n,ym,pg)||{pago:0,juros:0,cnt:0};
  const cnt=Math.min(ji.cnt,pg);
  const preCnt=Math.max(0,pg-cnt);
  const preBase=r2(preCnt*v);
  let preJuros=0;
  if(cfg.atrasoDesde&&preCnt>0){
    const regs=meses().filter(x=>x.ym>=cfg.inicio&&(+x.contas[n]||0)>0).map(x=>x.ym).sort();
    const firstReg=regs[0]||ym;
    const iniAtr=cfg.atrasoDesde>cfg.inicio?cfg.atrasoDesde:cfg.inicio;
    if(iniAtr<firstReg){
      const por=(+cfg.multa||0)+(+cfg.diasTipico||0)*(+cfg.moraDia||0);
      preJuros=r2(Math.min(mesesEntre(iniAtr,firstReg),preCnt)*por);
    }
  }
  return{pg,cnt,preCnt,preBase,preJuros,exatoReg:r2(ji.pago),jurosReg:r2(ji.juros),total:r2(preBase+preJuros+ji.pago)};}
function setRegulariza(n,ym){const cfg=state.parcelas&&state.parcelas[n];if(!cfg)return;cfg.regularizaEm=ym||null;save();render();}
// cenários de juros futuros: continuar atrasando × regularizar em cfg.regularizaEm
function cenariosJuros(n,ym){const cfg=parcelaCfg(n);if(!cfg)return null;
  const ca=custoAtraso(n,ym);if(!ca||!(ca.por>0))return null;
  const continuar=ca.futuro; // todas as restantes atrasadas
  const reg=cfg.regularizaEm||null;
  let atrFut=ca.faltam; // sem regularização definida = continuar
  if(reg)atrFut=Math.max(0,Math.min(mesesEntre(ym,reg)-1,ca.faltam)); // paga em dia a partir de reg
  const regJuros=atrFut*ca.por;
  return{por:ca.por,jaPagos:ca.custo,faltam:ca.faltam,reg,atrFut,
    continuar,regJuros,economia:continuar-regJuros,
    totalContinuar:ca.custo+continuar,totalReg:ca.custo+regJuros};}
// nº de parcelas efetivamente pagas até o mês ym (com defasagem, a paga em ym é a do mês anterior)
function pagasAte(n,ym){const cfg=parcelaCfg(n);if(!cfg)return 0;
  const k=mesesEntre(cfg.inicio,ym)+1;const kk=cfg.defasado?k-1:k;
  return Math.max(0,Math.min(kk,+cfg.total));}
// custo do atraso crônico: nº de parcelas pagas atrasadas × (multa + diasTipico × mora)
function custoAtraso(n,ym){const cfg=parcelaCfg(n);if(!cfg)return null;
  const v=valorParcOrig(n,ym);
  const por=(+cfg.multa||0)+(+cfg.diasTipico||0)*(+cfg.moraDia||0);
  const pg=pagasAte(n,ym);
  let nAtr=0;
  if(cfg.atrasoDesde){const ini=cfg.atrasoDesde>cfg.inicio?cfg.atrasoDesde:cfg.inicio;
    nAtr=Math.max(0,Math.min(mesesEntre(ini,ym)+1,pg));}
  const custo=nAtr*por;
  const faltam=+cfg.total-pg;
  const futuro=faltam*por;
  return{v,por,pg,nAtr,custo,faltam,futuro,
    origPago:pg*v,comPago:pg*v+custo,
    contratoSem:+cfg.total*v,projetadoCom:+cfg.total*v+custo+futuro};}
const isoData=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const hojeISO=()=>isoData(new Date());
function dataVenc(n,ym){const d=vencDe(n);if(!d)return null;const ult=new Date(+ym.slice(0,4),+ym.slice(5),0).getDate();return ym+"-"+String(Math.min(d,ult)).padStart(2,"0");}
function diasAtraso(n,ym,dataPag){const dv=dataVenc(n,ym);if(!dv)return 0;
  const a=new Date(dataPag+"T00:00:00"),b=new Date(dv+"T00:00:00");return Math.max(0,Math.round((a-b)/86400000));}
function valorComAtraso(n,ym,dias){const cfg=parcelaCfg(n)||{};const v=valorParcOrig(n,ym);
  return dias>0?v+(+cfg.multa||0)+dias*(+cfg.moraDia||0):v;}
function setPagoReal(idx,n,v){const m=state.meses[idx];if(!m.pagoReal)m.pagoReal={};
  if(v>0){if(!m.orcado)m.orcado={};if(!(n in m.orcado)&&+m.contas[n]>0)m.orcado[n]=+m.contas[n];
    m.pagoReal[n]=Math.round(v*100)/100;m.contas[n]=m.pagoReal[n];if(m.prov)delete m.prov[n];}
  else delete m.pagoReal[n];save();render();}
// aplica o valor pago com juros TAMBÉM no valor efetivo do mês (Editar dados),
// congelando a parcela original como orçado para o estouro aparecer no Orçado × Real
function usarSimulado(idx,n,v){const m=state.meses[idx];const vv=Math.round(v*100)/100;
  const orig=valorParcOrig(n,m.ym); // captura ANTES de sobrescrever o valor do mês
  if(!m.pagoReal)m.pagoReal={};m.pagoReal[n]=vv;
  if(!m.orcado)m.orcado={};
  const cfgP=parcelaCfg(n);
  if(cfgP&&+cfgP.valorOrig>0)m.orcado[n]=Math.round(+cfgP.valorOrig*100)/100; // parcelada: orçado = parcela do contrato
  else if(!(n in m.orcado)&&orig>0)m.orcado[n]=Math.round(orig*100)/100;
  m.contas[n]=vv;                       // valor efetivo do mês
  if(m.prov)delete m.prov[n];           // valor real confirmado, sai do provisório
  save();render();}
// acumulado com × sem juros da parcela, do início até ymLim
function jurosInfo(n,ymLim,maxCnt){const cfg=parcelaCfg(n);if(!cfg)return null;
  let orig=0,pago=0,cnt=0;
  meses().forEach(x=>{if(x.ym>=cfg.inicio&&x.ym<=ymLim){const v=+x.contas[n]||0;
    if(v>0&&(maxCnt==null||cnt<maxCnt)){const base=(+cfg.valorOrig>0)?+cfg.valorOrig:v; // compara contra a parcela ORIGINAL
      orig+=base;pago+=(x.pagoReal&&+x.pagoReal[n]>0)?+x.pagoReal[n]:v;cnt++;}}});
  return{orig,pago,juros:pago-orig,cnt};}

// cria um mês qualquer (ex.: nov/dez a partir das férias) copiando as contas do mês anterior mais
// próximo como provisórias (viram "orçado"), com o salário normal da Folha
function criarMes(ym){
  const ja=state.meses.find(x=>x.ym===ym);if(ja)return ja;
  const ant=meses().filter(x=>x.ym<ym).slice(-1)[0]||meses().slice(-1)[0];
  const contas={},prov={},orcado={};
  if(ant)Object.entries(ant.contas).forEach(([k,v])=>{if(+v>0){contas[k]=+v;prov[k]=true;orcado[k]=+v;}});
  const sal=+state.folha.bruto>0?r2(folhaCalc().liq):(ant?ant.salario:0);
  const m={ym,salario:sal,extra:0,va:vaACT(ym)||(ant?ant.va:0),contas,prov,orcado};
  marcarRevivido(ym);state.meses.push(m);aplicarAportesDoMes(ym);return m;
}
function novoMes(copiar){
  const ms=meses();const last=ms[ms.length-1];
  if(!last){ // primeiro mês do painel: nasce zerado, mês corrente
    const hoje=new Date();const ym=hoje.getFullYear()+"-"+String(hoje.getMonth()+1).padStart(2,"0");
    marcarRevivido(ym);state.meses.push({ym,salario:0,extra:0,va:0,contas:{},prov:{},orcado:{}});
    edSel=0;edYm=ym;save();render();return;
  }
  const d=new Date(+last.ym.slice(0,4),+last.ym.slice(5),1);
  const ym=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  if(state.meses.some(m=>m.ym===ym)){alert("O mês "+lbl(ym)+" já existe.");return;}
  const quit=k=>{const pi=parcelaInfo(k,ym);return pi&&pi.quitada;};
  const contas=Object.fromEntries(Object.entries(last.contas).filter(([k])=>!quit(k)).map(([k,v])=>[k,copiar?v:0]));
  (state.futuros||[]).forEach(f=>{if(f.nome in contas&&!ativoEm(f,ym))contas[f.nome]=0;});
  const ag=futurosEm(ym);ag.forEach(f=>{if(!(f.nome in contas)||!contas[f.nome])contas[f.nome]=f.valor;});
  const vaNovo=vaACT(ym)||last.va; 
  const prov={},orcado={};if(copiar)Object.keys(contas).forEach(k=>{if(+contas[k]>0){prov[k]=true;orcado[k]=+contas[k];}}); // valores copiados = provisórios e viram orçado
  marcarRevivido(ym);state.meses.push({ym,salario:last.salario,extra:copiar?last.extra:0,va:vaNovo,contas,prov,orcado});
  const aps=aplicarAportesDoMes(ym);
  edSel=meses().length-1;edYm=ym;save();render();
  const avisos=[];
  if(ag.length)avisos.push("Agenda aplicada: "+ag.map(f=>f.nome+" ("+fmt0(f.valor)+")").join(", "));
  if(aps.length)avisos.push("Aportes programados somados ao Extra: "+aps.map(a=>a.nota+" ("+fmt(a.valor)+")").join(", "));
  const ferNoMes=(state.ferias||[]).filter(f=>f.inicio&&mesesPagamentoFerias(f).includes(ym));
  if(ferNoMes.length)avisos.push("Este mês tem férias previstas ("+ferNoMes.map(f=>f.nome||"Férias").join(", ")+") — confira a aba Férias para aplicar o líquido e o salário proporcional.");
  if(avisos.length)alert(lbl(ym)+":\n\n"+avisos.join("\n"));
}
function mesclarContas(old,novo,silencioso){
  let movidos=0,somados=0,avisoParc="";
  // captura categoria/tipo EFETIVOS antes de mexer (inclui padrões da planilha)
  const catExplicitaNovo=(state.catConta&&state.catConta[novo])||CAT[novo]||null;
  const catVelha=catOf(old);
  const tipoDefinidoNovo=(state.tipos&&(novo in state.tipos))||(novo in FIXO_DEFAULT);
  const tipoVelho=tipoOf(old);
  state.meses.forEach(m=>{
    const a=+m.contas[old]||0,b=+m.contas[novo]||0;
    const temA=(old in m.contas),temB=(novo in m.contas);
    if(temA){
      if(a>0&&b>0){m.contas[novo]=Math.round((a+b)*100)/100;somados++;}
      else if(a>0||!temB){m.contas[novo]=a>0?a:(temB?b:a);if(a>0)movidos++;}
      delete m.contas[old];
    }
    if(m.prov){const pv=(m.prov[old]&&a>0)||(m.prov[novo]&&b>0);if(pv)m.prov[novo]=true;else delete m.prov[novo];delete m.prov[old];}
    if(m.orcado&&(old in m.orcado)){m.orcado[novo]=Math.round((((+m.orcado[novo])||0)+(+m.orcado[old]||0))*100)/100;delete m.orcado[old];}
    if(m.pagoReal&&(old in m.pagoReal)){m.pagoReal[novo]=Math.round((((+m.pagoReal[novo])||0)+(+m.pagoReal[old]||0))*100)/100;delete m.pagoReal[old];}
    if(m.itensFatura&&(old in m.itensFatura)){m.itensFatura[novo]=[...(m.itensFatura[novo]||[]),...m.itensFatura[old]];delete m.itensFatura[old];}
    const P=state.pagos[m.ym];
    if(P&&(old in P||novo in P)){
      const pago=(a>0&&b>0)?(!!P[old]&&!!P[novo]):(a>0?!!P[old]:!!P[novo]);
      if(pago)P[novo]=true;else delete P[novo];delete P[old];
    }
  });
  ["tipos","catConta","vencDia","detalhavel","provMetodo"].forEach(k=>{
    const o=state[k];if(!o)return;
    if((old in o)&&!(novo in o))o[novo]=o[old];
    if(old in o)delete o[old];});
  if(state.parcelas){
    if(state.parcelas[old]&&state.parcelas[novo])avisoParc="\n⚠ As duas tinham parcelamento — mantive o de \""+novo+"\"; confira no ⏳.";
    if(state.parcelas[old]&&!state.parcelas[novo])state.parcelas[novo]=state.parcelas[old];
    delete state.parcelas[old];
  }
  // destino sem categoria/tipo próprios herda os efetivos da origem
  if(!catExplicitaNovo&&catVelha&&catVelha!=="Outros"){if(!state.catConta)state.catConta={};state.catConta[novo]=catVelha;}
  if(!tipoDefinidoNovo){if(!state.tipos)state.tipos={};state.tipos[novo]=tipoVelho==="Fixo"?1:0;}
  if(state.aloc&&state.aloc.itens&&(("div:"+old) in state.aloc.itens)){
    state.aloc.itens["div:"+novo]=(+state.aloc.itens["div:"+novo]||0)+(+state.aloc.itens["div:"+old]||0);
    delete state.aloc.itens["div:"+old];}
  (state.futuros||[]).forEach(f=>{if(f.nome===old)f.nome=novo;});
  ((state.simg&&state.simg.cenarios)||[]).forEach(c=>(c.itens||[]).forEach(it=>{if(it.alvo===old)it.alvo=novo;}));
  if(state.simg&&Array.isArray(state.simg.baseRows))state.simg.baseRows.forEach(r=>{if(r.nome===old)r.nome=novo;});
  delete edParcOpen[old];delete edDetOpen[old];delete calcSel[old];delete simPagData[old];
  if(contaSel===old)contaSel=novo;
  if(silencioso)return;
  registrarRenome(old,novo);save();render();
  alert('Mescladas: "'+old+'" + "'+novo+'" → "'+novo+'"\n\n• '+movidos+' mês(es) com valor movido\n• '+somados+' mês(es) onde AMBAS tinham valor (somei — confira se não era duplicidade)'+avisoParc+'\n\nO histórico agora é um só: gráficos, tendências e previsão da conta enxergam a linha completa.');
}
function registrarRenome(de,para){if(!state._renomes)state._renomes=[];state._renomes.push({id:uid(),de,para,ts:Date.now()});}
function renomearConta(old){
  const novo=(prompt('Novo nome para "'+old+'":',old)||"").trim();
  if(!novo||novo===old)return;
  if(allContas().includes(novo)){
    if(!confirm('Já existe uma conta chamada "'+novo+'".\n\nOK = MESCLAR os históricos em um só:\n• mês onde só uma tem valor → vale esse valor\n• mês onde as DUAS têm valor → soma (o resumo avisa quantos)\n• configurações (categoria, vencimento, parcelamento...) de "'+novo+'" prevalecem; o que ela não tiver, herda de "'+old+'"\n\nCancelar = desistir e escolher outro nome.'))return;
    mesclarContas(old,novo);return;
  }
  const cat=catOf(old),tipo=tipoOf(old); // captura efetivos (inclui padrões da planilha)
  state.meses.forEach(m=>{
    if(old in m.contas){m.contas[novo]=m.contas[old];delete m.contas[old];}
    if(m.prov&&old in m.prov){m.prov[novo]=m.prov[old];delete m.prov[old];}
    if(m.orcado&&old in m.orcado){m.orcado[novo]=m.orcado[old];delete m.orcado[old];}
    if(m.pagoReal&&old in m.pagoReal){m.pagoReal[novo]=m.pagoReal[old];delete m.pagoReal[old];}
    if(m.itensFatura&&old in m.itensFatura){m.itensFatura[novo]=m.itensFatura[old];delete m.itensFatura[old];}
  });
  Object.keys(state.pagos||{}).forEach(ym=>{const P=state.pagos[ym];if(P&&old in P){P[novo]=P[old];delete P[old];}});
  ["tipos","catConta","vencDia","detalhavel","parcelas","provMetodo"].forEach(k=>{
    const o=state[k];if(o&&old in o){o[novo]=o[old];delete o[old];}});
  if(!state.catConta)state.catConta={};state.catConta[novo]=cat;
  if(!state.tipos)state.tipos={};state.tipos[novo]=tipo==="Fixo"?1:0;
  if(state.aloc&&state.aloc.itens&&(("div:"+old) in state.aloc.itens)){state.aloc.itens["div:"+novo]=state.aloc.itens["div:"+old];delete state.aloc.itens["div:"+old];}
  (state.futuros||[]).forEach(f=>{if(f.nome===old)f.nome=novo;});
  ((state.simg&&state.simg.cenarios)||[]).forEach(c=>(c.itens||[]).forEach(it=>{if(it.alvo===old)it.alvo=novo;}));
  if(state.simg&&Array.isArray(state.simg.baseRows))state.simg.baseRows.forEach(r=>{if(r.nome===old)r.nome=novo;});
  delete edParcOpen[old];delete edDetOpen[old];delete calcSel[old];delete simPagData[old];
  if(contaSel===old)contaSel=novo;
  registrarRenome(old,novo);save();render();
  alert('Renomeada: "'+old+'" → "'+novo+'"\n\nPropagado em: todos os meses, status de pagamento, parcelamento/dívidas, vencimento, categoria, tipo, orçado, fatura, agenda e cenários de simulação.');
}
function delMes(i){if(confirm("Excluir "+lbl(state.meses[i].ym)+"?")){marcarApagado(state.meses[i].ym);state.meses.splice(i,1);edSel=null;edYm=null;save();render();}}
function delConta(i,n){if(!confirm('Remover "'+n+'" de '+lbl(state.meses[i].ym)+"? (só deste mês; o histórico dos outros meses não é afetado)"))return;delete state.meses[i].contas[n];marcarApagado("/meses/"+state.meses[i].ym+"/contas/"+n);save();render();}

let orcSel=null;

  if(!linhas.length){
    return `<div class="card"><div class="row"><span>Mês:</span><select onchange="orcSel=this.value;render()">${[...all].reverse().map(x=>`<option value="${x.ym}" ${x.ym===orcSel?"selected":""}>${lbl(x.ym)}</option>`).join("")}</select></div></div>

    <p class="note">💡 Fluxo: em Editar dados, clique em ↩ para estimar uma conta (fica vermelha = orçado congelado) → quando a conta real chegar, digite por cima → volte aqui e veja se você acertou a previsão.</p></div>`;
  }

  const alerts=[];
  if(precisao!=null){
    if(precisao<=5)alerts.push(["teal","Sua previsão está <b>afiada</b>: erro médio de apenas "+fmtNum(precisao,1)+"% nas contas confirmadas."]);
    else if(precisao<=15)alerts.push(["amber","Previsão razoável: erro médio de "+fmtNum(precisao,1)+"%. Dá para calibrar alguns métodos de estimativa."]);
    else alerts.push(["rose","Previsão precisa de ajuste: erro médio de "+fmtNum(precisao,1)+"%. Veja abaixo quais contas mais escapam e troque o método de estimativa delas."]);
  }
  if(estouros.length){const e=estouros[0];alerts.push(["amber","Maior estouro: <b>"+esc(e.n)+"</b> orçou "+fmt(e.orc)+" e gastou "+fmt(e.real)+" (+"+fmt(e.dif)+", "+fmtNum(e.pct,0)+"% acima)."]);}
  if(difTot>0.005)alerts.push(["rose","No total, você <b>estourou "+fmt(difTot)+"</b> sobre o que havia orçado nas contas já confirmadas ("+fmt(orcRealizados)+")."]);
  else if(difTot<-0.005)alerts.push(["teal","No total, você gastou <b>"+fmt(-difTot)+" a menos</b> que o orçado nas contas confirmadas. 👏"]);
  if(pend.length)alerts.push(["amber",pend.length+" conta(s) ainda provisória(s) — a comparação delas fecha quando você confirmar o valor real."]);

  const linhaTab=r=>{const cor=!r.confirmado?"var(--mut)":r.dif>0.005?"#be123c":r.dif<-0.005?"#0d9488":"var(--ink)";
    const tag=!r.confirmado?'<span class="pill" style="background:#ffe4e6;color:#be123c;font-size:10px">provisório</span>':(r.dif>0.005?'<span class="pill rose">estourou</span>':r.dif<-0.005?'<span class="pill teal">economizou</span>':'<span class="pill teal">na mosca</span>');
    return `<tr><td>${esc(r.n)}</td><td>${esc(r.cat)}</td><td class="n">${fmt(r.orc)}</td><td class="n">${r.confirmado?fmt(r.real):'<span style="color:#be123c">— (prov.)</span>'}</td>
      <td class="n" style="color:${cor};font-weight:600">${r.confirmado?(r.dif>=0?"+":"")+fmt(r.dif):"—"}</td>

// ============ DÍVIDAS: quitação antecipada + avalanche + juros ============
function setDescQuit(n,v){const cfg=state.parcelas&&state.parcelas[n];if(!cfg)return;cfg.descQuit=Math.max(0,Math.min(100,+v||0));save();render();}
function setQuitN(n,v){const cfg=state.parcelas&&state.parcelas[n];if(!cfg)return;cfg.quitN=Math.max(0,+v||0);save();render();}
// juros pagos num mês (todas as parceladas): valor lançado/pago − parcela original
function jurosNoMes(ym){const m=meses().find(x=>x.ym===ym);if(!m)return 0;let t=0;
  Object.keys(state.parcelas||{}).forEach(n=>{const cfg=state.parcelas[n];if(!cfg||!(+cfg.valorOrig>0))return;
    const v=+m.contas[n]||0;if(!v)return;
    const pago=(m.pagoReal&&+m.pagoReal[n]>0)?+m.pagoReal[n]:v;
    t+=Math.max(0,pago-+cfg.valorOrig);});
  return t;}
function vDividas(){
  const ymRef=meses()[meses().length-1].ym;
  const ativas=Object.keys(state.parcelas||{}).map(n=>({n,cfg:state.parcelas[n],pi:parcelaInfo(n,ymRef)}))
    .filter(x=>x.pi&&!x.pi.quitada);
  if(!ativas.length)return '<div class="card"><p class="note">Nenhum parcelamento configurado. Marque contas como parceladas no ⏳ da aba Editar dados.</p></div>';
  // avalanche: custo extra mensal por R$ devido
  const rank=ativas.map(x=>{
    const por=(+x.cfg.multa||0)+(+x.cfg.diasTipico||0)*(+x.cfg.moraDia||0);
    const atrasando=!!x.cfg.atrasoDesde&&(!x.cfg.regularizaEm||x.cfg.regularizaEm>ymRef);
    const custoMes=atrasando?por:0;
    const taxa=x.pi.valor>0?custoMes/x.pi.valor*100:0;
    return{...x,por,atrasando,custoMes,taxa};})
    .sort((a,b)=>(b.taxa-a.taxa)||(a.pi.restante-b.pi.restante));

    const fimNovo=N>0?ymAdd(x.pi.fim,-N):x.pi.fim;

    <div class="flexbet"><b>${esc(x.n)}${x.pi.antes?` <span class="pill" style="background:#e0e7ff;color:#4338ca;font-size:10px">começa ${lbl(x.pi.inicio)}</span>`:''}</b>
      <span class="row" style="gap:6px"><span class="note" style="margin:0">${(()=>{const pa=pagoAcumulado(x.n,ymRef);return pa&&pa.pg?"já pagou <b>"+fmt(pa.total)+"</b> ("+pa.pg+" parc.) · ":"";})()}faltam ${x.pi.faltam} × ${fmt(x.pi.valor)} · termina ${lbl(x.pi.fim)}</span>
      <button class="btn danger" style="padding:2px 8px;font-size:11px" title="Remove a configuração de parcelamento (a conta e os valores dos meses ficam)" onclick="if(confirm('Remover ${jsAttr(x.n)} da lista de dívidas? (a configuração de parcelamento será apagada; os valores lançados nos meses não mudam)'))setParcela('${nn}',null,0)">✕ remover</button></span></div>
    <div class="row" style="margin-top:6px">
      <label style="font-size:12px">Quitar as últimas <input type="text" inputmode="decimal" data-num min="0" max="${x.pi.faltam}" value="${N||''}" placeholder="N" style="width:60px" onchange="setQuitN('${nn}',+this.value)"> parcelas</label>
      <label style="font-size:12px">com desconto de <input type="text" inputmode="decimal" data-num min="0" max="100" step="0.1" value="${d||''}" placeholder="%" style="width:65px" onchange="setDescQuit('${nn}',+this.value)"> %</label>
    </div>
    ${N>0?`<table style="font-size:12px;margin-top:6px;max-width:460px">
      <tr><td>Valor de face (${N} × ${fmt(x.pi.valor)})</td><td class="n">${fmt(face)}</td></tr>
      <tr><td><b>Pago hoje com ${d}% de desconto</b></td><td class="n"><b>${fmt(hoje)}</b></td></tr>
      <tr><td>Desconto ganho</td><td class="n" style="color:#0d9488">−${fmt(descR)}</td></tr>
      ${jurosEvit>0?`<tr><td>Juros de atraso evitados (~${fmt(rk.por)}/parcela)</td><td class="n" style="color:#0d9488">−${fmt(jurosEvit)}</td></tr>`:''}

  marcarApagado(id);state.metasCurto=state.metasCurto.filter(x=>x.id!==id);save();render();

function addAporte(){
  const ym=document.getElementById("apMes").value;
  const v=numBR(document.getElementById("apVal").value)||0;
  const nota=document.getElementById("apNota").value.trim()||"Aporte";
  if(!ym||!v){alert("Escolha o mês e o valor do aporte.");return;}
  state.aportes.push({id:uid(),ym,valor:Math.round(v*100)/100,nota,aplicado:false});

}
function delAporte(id){
  const a=state.aportes.find(x=>x.id===id);if(!a)return;
  if(a.aplicado){
    const m=state.meses.find(x=>x.ym===a.ym);
    if(m&&confirm("Este aporte já foi somado ao Extra de "+lbl(a.ym)+". Remover também "+fmt(a.valor)+" do Extra do mês?"))
      m.extra=Math.round(Math.max(0,(+m.extra||0)-a.valor)*100)/100;

// aplica aportes pendentes de um mês específico (chamado ao criar mês novo)
function aplicarAportesDoMes(ym){
  const m=state.meses.find(x=>x.ym===ym);if(!m)return[];
  const pend=state.aportes.filter(a=>!a.aplicado&&a.ym===ym);
  pend.forEach(a=>{m.extra=Math.round(((+m.extra||0)+a.valor)*100)/100;a.aplicado=true;});
  return pend;
}
function aplicarAloc(){
  let n=0;state.metasCurto.forEach(mt=>{const v=+state.aloc.itens["meta:"+mt.id]||0;
    if(v>0){mt.guardado=Math.round((mt.guardado+v)*100)/100;state.aloc.itens["meta:"+mt.id]=0;n++;}});
  // aportes: meses existentes recebem no Extra agora; futuros ficam programados
  let ap=0,prog=0;
  state.aportes.filter(a=>!a.aplicado).forEach(a=>{
    const m=state.meses.find(x=>x.ym===a.ym);
    if(m){m.extra=Math.round(((+m.extra||0)+a.valor)*100)/100;a.aplicado=true;ap++;}
    else prog++;
  });
  Object.keys(state.aloc.itens).forEach(k=>{if(!k.startsWith("meta:"))state.aloc.itens[k]=0;});state.aloc.montante=0;
  save();render();
  const partes=[];
  if(n)partes.push(n+" meta(s) receberam o valor");

  if(prog)partes.push(prog+" aporte(s) programado(s) — entram sozinhos quando você criar o mês");

}

// ============ CATEGORIAS (lista única: contas, gastos avulsos, itens de fatura, viagem) ============
// Quanto foi para cada categoria num conjunto de meses — tudo junto: contas (com itens de fatura
// detalhados), gastos avulsos do mês e gastos de viagem. "Renda extra" não entra (é entrada).
function gastoPorCategoria(yms){
  const o={},add=(c,v)=>{if(!(+v))return;c=c||"Outros";o[c]=r2((o[c]||0)+(+v));};
  meses().filter(m=>yms.includes(m.ym)).forEach(m=>{const pc=porCat(m);Object.entries(pc).forEach(([c,v])=>add(c,v));});
  yms.forEach(ym=>(state.movs[ym]||[]).filter(x=>x.tipo!=="renda"&&!x._ferias).forEach(x=>add(x.cat,x.valor)));
  (state.ferias||[]).forEach(f=>((f.viagem&&f.viagem.gastos)||[]).forEach(g=>{if(yms.includes((g.data||"").slice(0,7))&&+g.valor>0)add(g.cat,g.valor);}));
  return o;
}
function usoCategoria(c){
  let contas=0,movs=0,viagem=0,fatura=0;
  allContas().forEach(n=>{if(catOf(n)===c)contas++;});
  Object.values(state.movs||{}).forEach(a=>(a||[]).forEach(x=>{if(x.cat===c)movs++;}));
  (state.ferias||[]).forEach(f=>((f.viagem&&f.viagem.gastos)||[]).forEach(g=>{if(g.cat===c)viagem++;}));
  meses().forEach(m=>Object.values(m.itensFatura||{}).forEach(a=>(a||[]).forEach(it=>{if(it.cat===c)fatura++;})));
  return{contas,movs,viagem,fatura,total:contas+movs+viagem+fatura};
}
// renomear (ou juntar, se o nome novo já existe) propaga para tudo que guarda o nome da categoria
function renomearCategoria(de,para){
  if(!para||para===de)return;
  const troca=x=>x===de?para:x;
  Object.keys(state.catConta||{}).forEach(n=>{state.catConta[n]=troca(state.catConta[n]);});
  allContas().forEach(n=>{if(!state.catConta[n]&&CAT[n]===de){state.catConta[n]=para;}});
  Object.values(state.movs||{}).forEach(a=>(a||[]).forEach(x=>{x.cat=troca(x.cat);}));
  (state.ferias||[]).forEach(f=>((f.viagem&&f.viagem.gastos)||[]).forEach(g=>{g.cat=troca(g.cat);}));
  meses().forEach(m=>Object.values(m.itensFatura||{}).forEach(a=>(a||[]).forEach(it=>{it.cat=troca(it.cat);})));
  Object.keys(state.catsAprendidas||{}).forEach(k=>{state.catsAprendidas[k]=troca(state.catsAprendidas[k]);});
  if(state.metasCat&&de in state.metasCat){state.metasCat[para]=(+state.metasCat[para]||0)+(+state.metasCat[de]||0);delete state.metasCat[de];}
  const cor=corCategoria(de);if(!state.coresCat)state.coresCat={};if(!state.coresCat[para])state.coresCat[para]=cor;delete state.coresCat[de];
  state.catsUser=(state.catsUser||[]).map(troca).filter((x,i,a)=>a.indexOf(x)===i);
  if(state.catContaCores)delete state.catContaCores[de];if(state.catsUserCores)delete state.catsUserCores[de];
  if(!state.catsOcultas)state.catsOcultas=[];if(!state.catsOcultas.includes(de))state.catsOcultas.push(de);
  state.catsOcultas=state.catsOcultas.filter(x=>x!==para);
}
function catRenomear(de){
  const para=(prompt('Novo nome para a categoria "'+de+'" (se já existir, as duas viram uma só):',de)||"").trim();
  if(!para||para===de)return;
  const existe=categorias().includes(para);
  if(existe&&!confirm('"'+para+'" já existe. Juntar "'+de+'" dentro de "'+para+'"?'))return;
  renomearCategoria(de,para);save();render();
}
function catNova(){const c=(prompt("Nome da nova categoria:")||"").trim();if(!c)return;
  if(categorias().includes(c)){alert("Já existe.");return;}
  if(!state.coresCat)state.coresCat={};state.coresCat[c]=corCategoria(c);state.catsOcultas=(state.catsOcultas||[]).filter(x=>x!==c);save();render();}
function catCor(c,cor){if(!state.coresCat)state.coresCat={};state.coresCat[c]=cor;save();render();}
function catOcultar(c){if(usoCategoria(c).total){alert("Essa categoria está em uso. Junte com outra (Renomear) em vez de apagar.");return;}
  if(!state.catsOcultas)state.catsOcultas=[];state.catsOcultas.push(c);save();render();}
let catPeriodo="3";
function vCategorias(){
  const ms=meses();const yms=catPeriodo==="todos"?ms.map(m=>m.ym):ms.slice(-(+catPeriodo)).map(m=>m.ym);
  const gasto=gastoPorCategoria(yms);const tot=Object.values(gasto).reduce((s,v)=>s+v,0);
  const lista=categorias().map(c=>({c,u:usoCategoria(c),g:gasto[c]||0})).sort((a,b)=>b.g-a.g||a.c.localeCompare(b.c,"pt-BR"));
  return `<div class="card"><div class="flexbet"><h3 style="margin:0">Para onde vai o dinheiro</h3>
    <select onchange="catPeriodo=this.value;render()">${[["1","último mês"],["3","últimos 3 meses"],["6","últimos 6 meses"],["todos","todos os meses"]].map(([v,t])=>`<option value="${v}" ${catPeriodo===v?"selected":""}>${t}</option>`).join("")}</select></div>
    <p class="note" style="margin-top:4px">Tudo junto: contas (com os itens de fatura detalhados), gastos avulsos do mês e gastos de viagem — ${fmt(tot)} no período.</p>
    ${tot?`<div class="chartbox sm" style="margin-top:8px"><canvas id="cCatTudo"></canvas></div>`:'<p class="note">Sem gastos no período.</p>'}</div>

// ---- leitura de arquivos de banco ----
function decodificarTexto(buf){ // bancos brasileiros às vezes mandam em Windows-1252
  try{return new TextDecoder("utf-8",{fatal:true}).decode(buf);}catch(e){return new TextDecoder("windows-1252").decode(buf);}
}
// (numBR agora é único e mora em 03-helpers.js; no OFX o ponto é sempre decimal)
function dataBR(t){t=String(t||"").trim();let m;
  if((m=t.match(/^(\d{4})-(\d{2})-(\d{2})/)))return m[1]+"-"+m[2]+"-"+m[3];
  if((m=t.match(/^(\d{2})\/(\d{2})\/(\d{4})/)))return m[3]+"-"+m[2]+"-"+m[1];
  if((m=t.match(/^(\d{2})\/(\d{2})\/(\d{2})$/)))return "20"+m[3]+"-"+m[2]+"-"+m[1];
  if((m=t.match(/^(\d{4})(\d{2})(\d{2})/)))return m[1]+"-"+m[2]+"-"+m[3];
  return null;}
function lerOFX(txt){
  const out=[];const blocos=txt.split(/<STMTTRN>/i).slice(1);
  const tag=(b,n)=>{const m=b.match(new RegExp("<"+n+">([^<\\r\\n]*)","i"));return m?m[1].trim():"";};
  blocos.forEach(b=>{const valor=numBR(tag(b,"TRNAMT"),true);const data=dataBR(tag(b,"DTPOSTED"));
    const desc=tag(b,"MEMO")||tag(b,"NAME")||"(sem descrição)";if(!data||!isFinite(valor))return;
    out.push({data,desc,valor,fitid:tag(b,"FITID")});});
  return{linhas:out,cartao:/<CCSTMTRS>/i.test(txt)};
}
function linhasCSV(txt){
  const ls=txt.replace(/^\uFEFF/,"").split(/\r?\n/).filter(l=>l.trim());if(!ls.length)return{cab:[],rows:[]};
  const sep=(ls[0].match(/;/g)||[]).length>(ls[0].match(/,/g)||[]).length?";":",";
  const parse=l=>{const o=[];let cur="",q=false;for(let i=0;i<l.length;i++){const ch=l[i];
    if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(ch===sep&&!q){o.push(cur);cur="";}else cur+=ch;}o.push(cur);return o.map(x=>x.trim());};
  const rows=ls.map(parse);return{cab:rows[0],rows:rows.slice(1)};
}
function lerCSV(txt){
  const{cab,rows}=linhasCSV(txt);if(!rows.length)return{linhas:[],cartao:false};
  const h=cab.map(normTxt);
  const achar=(rx,teste)=>{let i=h.findIndex(x=>rx.test(x));if(i<0&&teste)i=cab.findIndex((_,j)=>rows.slice(0,5).every(r=>teste(r[j])));return i;};
  const iData=achar(/^(data|date|dt)/,v=>!!dataBR(v));
  const iValor=achar(/^(valor|amount|vlr|quantia)/,v=>isFinite(numBR(v)));
  let iDesc=achar(/(descri|title|historico|estabelecimento|lancamento|detalhe|memo)/);
  if(iDesc<0)iDesc=cab.findIndex((_,j)=>j!==iData&&j!==iValor);
  if(iData<0||iValor<0)throw new Error("Não reconheci as colunas de data e valor deste CSV.");
  const linhas=rows.map(r=>({data:dataBR(r[iData]),desc:(r[iDesc]||"(sem descrição)").trim(),valor:numBR(r[iValor]),fitid:""})).filter(x=>x.data&&isFinite(x.valor));
  // fatura de cartão (formato "date,title,amount" de bancos digitais): compras vêm POSITIVAS
  const cartao=h.includes("title")||(linhas.length>0&&linhas.filter(x=>x.valor>0).length/linhas.length>0.7);
  return{linhas,cartao};
}
function hashTxt(t){let h=5381;for(const ch of String(t))h=((h*33)^ch.charCodeAt(0))>>>0;return h.toString(36);}

async function lerExtrato(inp){

      const base=[x.fitid||"",x.data,valor,x.desc].join("|"),oc=vistos[base]=(vistos[base]||0)+1;
      const id="ext_"+hashTxt(base+(oc>1?"#"+oc:""));

      const motivo=dup?"já importado":conta?"parece a conta \u201c"+conta+"\u201d":transf?"transferência/pagamento de fatura":!gasto?"recebimento (o salário já está na renda)":"";

// ---- lembretes de vencimento (.ics para Google Agenda / Calendário do iPhone) ----
function icsData(d){return d.replace(/-/g,"");}
function icsTexto(t){return String(t).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");}
function gerarICS(comValores){
  const hoje=hojeISO(),ultimo=meses()[meses().length-1],agora=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const linhas=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Minhas Financas//Lembretes//PT-BR","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Contas a pagar"];
  const contas=allContas().filter(n=>vencDe(n));
  contas.forEach(n=>{
    const dia=vencDe(n),ym=hoje.slice(0,7);
    const diaEm=y=>y+"-"+String(Math.min(dia,new Date(+y.slice(0,4),+y.slice(5),0).getDate())).padStart(2,"0");
    let ini=diaEm(ym);if(ini<hoje)ini=diaEm(ymAdd(ym,1));
    const fim=new Date(ini+"T00:00:00");fim.setDate(fim.getDate()+1);
    const p=parcelaInfo&&parcelaInfo(n,ym);
    const v=ultimo&&+ultimo.contas[n]?" — ~"+fmt(+ultimo.contas[n]):"";
    linhas.push("BEGIN:VEVENT","UID:conta-"+hashTxt(n)+"@minhas-financas","DTSTAMP:"+agora,
      "DTSTART;VALUE=DATE:"+icsData(ini),"DTEND;VALUE=DATE:"+icsData(isoData(fim)),
      "RRULE:FREQ=MONTHLY;"+(dia>28?"BYMONTHDAY="+Array.from({length:dia-27},(_,i)=>28+i).join(",")+";BYSETPOS=-1":"BYMONTHDAY="+dia)+(p&&p.fim&&!p.quitada?";UNTIL="+icsData(p.fim+"-28"):""),
      "SUMMARY:"+icsTexto("Pagar "+n+(comValores?v:"")),
      "DESCRIPTION:"+icsTexto("Vencimento todo dia "+dia+(dia>28?" (ou o último dia, nos meses mais curtos)":"")+(p&&!p.quitada&&!p.antes?" · parcela até "+lbl(p.fim):"")+". Marque como paga na aba Status do mês."),
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsTexto("Vence amanhã: "+n),"TRIGGER:-PT15H","END:VALARM","END:VEVENT");
  });
  linhas.push("END:VCALENDAR");
  return{texto:linhas.join("\r\n")+"\r\n",n:contas.length};
}
function baixarICS(){
  const comValores=!!(document.getElementById("icsValores")||{}).checked;
  const r=gerarICS(comValores);if(!r.n){alert("Nenhuma conta tem dia de vencimento. Defina na aba Editar dados (coluna \"Vence dia\").");return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([r.texto],{type:"text/calendar"}));a.download="lembretes-contas.ics";a.click();
}

// ============ FÉRIAS ============
// Modelo: state.ferias[] = {id,nome,inicio(ISO),diasGozo,venderDias,adiantar13,
//   override:{bruto,inss,irrf,abono,adto13,mesPagamento,salarioBase}, reservaPosFerias:{definida},
//   envelope:{teto,transferido,valorTransferido},
//   viagem:{destino,pessoas,planoAtivoId,planos:[{id,nome,pessoas,alimentacaoDiaPorPessoa,
//     trechos:[{id,modo:'carro'|'aviao'|'outro',...}],hospedagem:{diaria,noites,totalManual,parcelas},itens:[]}],gastos:[]}}
// Tudo com datas em "AAAA-MM-DD" (comparável como string, igual ao resto do app) e diasGozo
// genérico/editável — nenhum cálculo assume 30 dias fixos.
function feriasGet(id){return(state.ferias||[]).find(x=>x.id===id);}
function addDiasISO(iso,k){const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+k);return isoData(d);}
function ymOfIso(iso){return iso.slice(0,7);}
function fimFerias(f){return addDiasISO(f.inicio,Math.max(1,+f.diasGozo||1)-1);}
function mesesAfetadosFerias(f){
  if(!f.inicio)return[];
  const ymA=ymOfIso(f.inicio),ymB=ymOfIso(fimFerias(f));
  const out=[];let cur=ymA;
  while(true){out.push(cur);if(cur>=ymB||out.length>36)break;cur=ymAdd(cur,1);}
  return out;
}
function diasFeriasNoMes(f,ym){
  const diasNoMes=new Date(+ym.slice(0,4),+ym.slice(5),0).getDate();
  const iniMes=ym+"-01",fimMes=ym+"-"+String(diasNoMes).padStart(2,"0");
  const ini=f.inicio>iniMes?f.inicio:iniMes,fim=fimFerias(f)<fimMes?fimFerias(f):fimMes;
  if(ini>fim)return 0;
  return Math.round((new Date(fim+"T00:00:00")-new Date(ini+"T00:00:00"))/86400000)+1;
}
function brutoFerias(f){const ov=f.override||{};return ov.bruto!=null?+ov.bruto:(+state.folha.bruto||0);}
function calcFerias(f){
  const ov=f.override||{};
  const bd=brutoFerias(f)/30;
  const diasVendidos=clamp(+f.venderDias||0,0,10);
  const diasGozados=Math.max(0,+f.diasGozo||0);
  const baseFerias=r2(bd*diasGozados);
  const terco=r2(baseFerias/3);
  const brutoFeriasTot=r2(baseFerias+terco); // base de INSS/IRRF das férias, calculada separada do salário
  const abonoBase=r2(bd*diasVendidos);
  const abonoAuto=r2(abonoBase+abonoBase/3); // abono pecuniário + 1/3, isento de INSS/IRRF
  const abono=ov.abono!=null?+ov.abono:abonoAuto;
  const inssAuto=r2(calcINSS(brutoFeriasTot));
  const inss=ov.inss!=null?+ov.inss:inssAuto;
  const dep=+state.folha.dep||0;
  const baseIR=Math.max(brutoFeriasTot-inss-dep*(state.folhaCfg.depDed||0),0);
  const irrfAuto=r2(calcIRRF(baseIR,brutoFeriasTot));
  const irrf=ov.irrf!=null?+ov.irrf:irrfAuto;
  const adto13Auto=f.adiantar13?r2(brutoFerias(f)/2):0;
  const adto13=f.adiantar13?(ov.adto13!=null?+ov.adto13:adto13Auto):0;
  const liquidoFerias=r2(brutoFeriasTot-inss-irrf+abono);
  const totalReceberCalc=r2(liquidoFerias+adto13);
  const totalReceber=ov.reciboReal!=null?r2(+ov.reciboReal):totalReceberCalc; // "Já caiu?": valor real do recibo, quando confirmado
  const mesPagamentoAuto=f.inicio?ymOfIso(addDiasISO(f.inicio,-2)):mesAtualYm();
  const mesPagamento=ov.mesPagamento||mesPagamentoAuto;
  return{bd,diasVendidos,diasGozados,baseFerias,terco,brutoFeriasTot,abonoBase,abono,inss,irrf,baseIR,adto13,
    liquidoFerias,totalReceber,totalReceberCalc,reciboConfirmado:ov.reciboReal!=null,mesPagamento,
    autoAbono:ov.abono==null,autoInss:ov.inss==null,autoIrrf:ov.irrf==null,autoAdto13:ov.adto13==null,autoMesPg:!ov.mesPagamento,
    abonoAuto,inssAuto,irrfAuto,adto13Auto,mesPagamentoAuto};
}
// A folha paga com defasagem: o salário que cai no mês M é o trabalhado no mês M-defasagem
// (confirmado com holerite real — competência Setembro/26, pago 01/10/26 = defasagem de 1 mês).
// Por isso o "buraco" das férias não aparece no mês em que elas começam, e sim ~1 mês depois.
function defasagemFerias(f){return f.defasagemPagto!=null?+f.defasagemPagto:1;}
// Salário líquido de um mês SEM férias. Vem da Folha (mais confiável que o último mês lançado,
// que pode já ter sido reduzido ao aplicar as férias); override manual em f.override.salarioBase.
function salarioNormalFerias(f){
  const ov=f.override||{};
  if(ov.salarioBase!=null)return +ov.salarioBase;
  if(+state.folha.bruto>0)return r2(folhaCalc().liq);
  return mesesA().length?mesesA()[mesesA().length-1].salario:0;
}
// Saldo de salário de um mês civil que teve dias de férias, calculado como a folha faz:
// bruto/30 × dias trabalhados (mês comercial de 30 dias), INSS só do que falta para o teto
// (as férias daquele mês já consumiram parte dele), IRRF próprio (com o redutor da Lei 15.270),
// e os benefícios/descontos fixos da Folha (creche, VA, seguro, PGBL, outros) cheios.
function saldoSalarioFerias(f,civilRef){
  const F=state.folha,C=state.folhaCfg,c=calcFerias(f);
  const diasFer=diasFeriasNoMes(f,civilRef);
  const diasNoMesCivil=new Date(+civilRef.slice(0,4),+civilRef.slice(5),0).getDate();
  const diasTrab=diasFer>=diasNoMesCivil?0:Math.max(0,30-diasFer);
  const bruto=brutoFerias(f);
  const saldo=r2(bruto/30*diasTrab);
  const prop=c.diasGozados>0?diasFer/c.diasGozados:0;
  const feriasNoMes=r2(c.brutoFeriasTot*prop);   // parte das férias (+1/3) que pertence a esse mês
  const inssFeriasNoMes=r2(c.inss*prop);         // INSS dessa parte, já descontado no recibo de férias
  const inss=r2(Math.max(0,calcINSS(saldo+feriasNoMes)-inssFeriasNoMes));
  const pgbl=+F.pgbl||0,outros=(F.outros||[]).reduce((s,o)=>s+(+o.valor||0),0);
  const baseIR=Math.max(saldo-inss-pgbl-(+F.dep||0)*C.depDed,0);
  const irrf=r2(calcIRRF(baseIR,saldo));
  const creche=+F.creche||0,va=+F.va||0,seguro=+F.seguro||0;
  const liq=r2(saldo+creche-inss-irrf-va-seguro-pgbl-outros);
  return{diasFer,diasTrab,saldo,valorDia:r2(bruto/30),creche,inss,irrf,va,seguro,pgbl,outros,liq};
}
// ---- 13º salário (Lei 4.090/1962 e Lei 4.749/1965) ----
// 1ª parcela: até 30/11, 50% do bruto (avos), SEM desconto de INSS/IRRF.
// 2ª parcela: até 20/12, bruto integral (avos) − INSS − IRRF (tributação exclusiva, mesma tabela
// do salário mensal, calculada sobre o 13º integral) − a 1ª parcela já paga.
// "avos" é genérico/editável (12 = ano completo; menos se admitido/afastado durante o ano).
function calc13(f){
  const tz=f.treze||{};const ov=tz.override||{};
  const avos=clamp(tz.avos!=null?+tz.avos:12,0,12);
  const brutoTotal=r2(brutoFerias(f)*avos/12);
  const pct1=clamp(tz.pctParc1!=null?+tz.pctParc1:50,0,100);
  const parc1Auto=r2(brutoTotal*pct1/100);
  const adiantou=!!f.adiantar13;
  const parc1=adiantou?r2(calcFerias(f).adto13):(ov.parc1!=null?+ov.parc1:parc1Auto);
  const inssAuto=r2(calcINSS(brutoTotal));
  const inss=ov.inss!=null?+ov.inss:inssAuto;
  const dep=+state.folha.dep||0;
  const baseIR=Math.max(brutoTotal-inss-dep*(state.folhaCfg.depDed||0),0);
  const irrfAuto=r2(calcIRRF(baseIR));
  const irrf=ov.irrf!=null?+ov.irrf:irrfAuto;
  const parc2Calc=r2(brutoTotal-parc1-inss-irrf);
  const parc2=ov.parc2Real!=null?r2(+ov.parc2Real):parc2Calc; // "Já caiu?": valor real da 2ª parcela, quando confirmado
  const anoRef=f.inicio?+f.inicio.slice(0,4):+hojeISO().slice(0,4);
  const ymParc1=ov.ymParc1||(anoRef+"-11");
  const ymParc2=ov.ymParc2||(anoRef+"-12");
  return{adiantou,avos,brutoTotal,pct1,parc1,parc1Auto,parc2Calc,parc2Confirmada:ov.parc2Real!=null,inss,inssAuto,irrf,irrfAuto,baseIR,parc2,ymParc1,ymParc2,
    autoParc1:ov.parc1==null,autoInss:ov.inss==null,autoIrrf:ov.irrf==null,
    autoYmParc1:!ov.ymParc1,autoYmParc2:!ov.ymParc2,total:r2(parc1+parc2)};
}

// Linha do tempo: o mês em que as férias COMEÇAM + os 2 seguintes (abril → abr/mai/jun).
// Se o recibo de férias cair antes (férias começando dia 1º ou 2), esse mês entra também, antes.
// Cada mês: salário que cai nele (do mês civil anterior, por causa da defasagem — cheio se aquele
// mês não teve férias, saldo de salário se teve), + recibo de férias, + 13º, + extra livre.
function linhaDoTempoFerias(f){
  if(!f.inicio)return[];
  const c=calcFerias(f),c13=calc13(f),defas=defasagemFerias(f),salNormal=salarioNormalFerias(f);
  const extras=f.extrasLinhaTempo||{},ovLinha=f.overrideLinha||{};
  const ymIni=ymOfIso(f.inicio),ymUltFer=ymOfIso(fimFerias(f)),ymFim=[ymAdd(ymIni,2),ymAdd(ymUltFer,defas)].sort().pop();
  const rows=[];
  for(let ym=c.mesPagamento<ymIni?c.mesPagamento:ymIni;ym<=ymFim&&rows.length<6;ym=ymAdd(ym,1)){
    const civilRef=ymAdd(ym,-defas);
    const sal=diasFeriasNoMes(f,civilRef)>0?saldoSalarioFerias(f,civilRef):null;
    const salAuto=sal?sal.liq:salNormal;
    const salLiq=ovLinha[ym]!=null?+ovLinha[ym]:salAuto;
    const ex=extras[ym]||{nome:"",valor:0};
    const pagFerias=ym===c.mesPagamento?c.totalReceber:0;
    let treze13=0,nomeTreze="";
    if(ym===c13.ymParc1&&!c13.adiantou){treze13=c13.parc1;nomeTreze="1ª parcela";}
    else if(ym===c13.ymParc2){treze13=c13.parc2;nomeTreze="2ª parcela";}
    rows.push({ymPag:ym,civilRef,sal,salNormal,salAuto,salReduzido:salLiq,autoSal:ovLinha[ym]==null,
      buraco:r2(Math.max(0,salNormal-salLiq)),pagFerias,treze13,nomeTreze,
      extraNome:ex.nome||"",extraValor:+ex.valor||0,antes:ym<ymIni,

}
function setOverrideLinha(id,ym,v){const f=feriasGet(id);if(!f)return;if(!f.overrideLinha)f.overrideLinha={};if(v===null)delete f.overrideLinha[ym];else f.overrideLinha[ym]=+v;save();render();}
function mesesPagamentoFerias(f){return f.inicio?linhaDoTempoFerias(f).map(r=>r.ymPag):[];}
// ---- Reserva e envelope, do jeito que o usuário pensa ----
// O salário de cada mês paga as contas daquele mês. O recibo de férias fica separado: dele sai
// o que vai FALTAR nos meses seguintes (contas − salário reduzido); o resto é o envelope da viagem.
// Gasto previsto de cada mês: manual > contas já lançadas no mês > contas do mês das férias
// (referência: "o que deu em outubro") > média dos últimos 3 meses > 1 salário (sem histórico).
// Contas previstas. O mês das férias usa as próprias contas se já lançadas. Os meses seguintes
// seguem o método escolhido (f.metodoGasto): "ultimo" = contas do último mês lançado até o mês das
// férias; "media3" = média dos 3 últimos meses com contas até ali; "manual" = f.gastoManual.
// Valor digitado direto num mês (f.gastoLinha[ym]) sempre vence.
const METODOS_GASTO={ultimo:"Último mês",media3:"Média dos 3 últimos meses",manual:"Digitar um valor"};
function mesesComContasAte(ym){return meses().filter(x=>x.ym<=ym&&totalContas(x)>0);}
function gastoPorMetodo(f){
  const ymIni=f.inicio?ymOfIso(f.inicio):mesAtualYm(),mt=f.metodoGasto||"ultimo";
  if(mt==="manual")return{valor:+f.gastoManual||0,fonte:"valor digitado"};
  const ms=mesesComContasAte(ymIni);
  if(!ms.length)return{valor:salarioNormalFerias(f),fonte:"sem contas lançadas: 1 salário"};
  if(mt==="media3"){const u=ms.slice(-3);return{valor:r2(u.reduce((s,x)=>s+totalContas(x),0)/u.length),fonte:"média de "+u.map(x=>lbl(x.ym)).join(", ")};}
  const u=ms[ms.length-1];return{valor:r2(totalContas(u)),fonte:"contas de "+lbl(u.ym)};
}
function gastoPrevistoMes(f,ym){
  const ov=(f.gastoLinha||{})[ym];
  if(ov!=null)return{valor:+ov,fonte:"digitado neste mês"};

  if(ym<=ymIni){const m=meses().find(x=>x.ym===ym);if(m&&totalContas(m)>0)return{valor:r2(totalContas(m)),fonte:"contas de "+lbl(ym)};}
  return gastoPorMetodo(f);

// 13º fora da conta por padrão: a 1ª parcela cai no fim de novembro, depois das contas.
function caixaFerias(f){
  const rows=linhaDoTempoFerias(f);if(!rows.length)return{rows:[],recibo:0,faltaMesFerias:0,reservaAuto:0,usar13:false};
  const ymIni=ymOfIso(f.inicio),usar13=!!f.usar13Reserva;
  const cx=rows.map(r=>{const g=gastoPrevistoMes(f,r.ymPag);
    const entraSemFerias=r2(r.total-r.pagFerias-(usar13?0:r.treze13)); // salário + extra (+13º se marcado)
    return{...r,entraSemFerias,gasto:g.valor,fonteGasto:g.fonte,saldo:r2(entraSemFerias-g.valor),depois:r.ymPag>ymIni};});
  const recibo=r2(cx.reduce((s,r)=>s+r.pagFerias,0));
  // se o salário do mês das férias não cobrir as contas dele, essa diferença também sai do recibo
  const faltaMesFerias=r2(Math.max(0,-cx.filter(r=>!r.depois).reduce((s,r)=>s+r.saldo,0)));
  let acc=0,need=0;
  cx.filter(r=>r.depois).forEach(r=>{acc=r2(acc+r.saldo);r.acumulado=acc;need=Math.max(need,-acc);});
  return{rows:cx,recibo,faltaMesFerias,reservaAuto:r2(need),usar13};
}
function reservaSugeridaFerias(f){

}
function sobraMinFerias(f){return f.usarSobraMin?(+state.sobraAlvo||0):0;}
function envelopeSugeridoFerias(f){
  const cx=caixaFerias(f);

function idaViagem(f,p){p=p||planoAtivo(f);return(p&&p.ida)||f.inicio||"";}
function voltaViagem(f,p){p=p||planoAtivo(f);return(p&&p.volta)||(f.inicio?fimFerias(f):"");}
function diasViagem(f,p){const a=idaViagem(f,p),b=voltaViagem(f,p);if(!a||!b||b<a)return 0;return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000)+1;}

function envelopeGastoFerias(f){return r2(gastosDoPlano(f).reduce((s,g)=>s+(+g.valor||0),0));}

function diasRestantesViagem(f){

function custoTrecho(t){
  if(t.modo==="carro"){
    const kmTot=(+t.kmIda||0)*(t.idaEVolta?2:1);
    const comb=(+t.consumoKmL>0)?r2(kmTot/(+t.consumoKmL)*(+t.precoLitro||0)):0;
    return r2(comb+(+t.pedagioIda||0)+(t.idaEVolta?(+t.pedagioVolta||0):0)+(+t.estacionamento||0));
  }
  if(t.modo==="aviao")return r2((+t.qtdAdulto||0)*(+t.valorAdulto||0)+(+t.qtdCrianca||0)*(+t.valorCrianca||0)+(+t.bagagem||0)+(+t.taxaAssento||0)+(+t.transfer||0));

function alimentacaoDe(p){const a=p.alimentacao||{};const inc=(p.hospedagem&&p.hospedagem.inclui)||{};

// Ritmo do envelope dia a dia: gasto acumulado real × ritmo ideal (teto distribuído igual pelos dias).
// Gasto lançado antes do primeiro dia entra no 1º dia; dias futuros ficam sem valor real.
function ritmoEnvelope(f){
  const p=planoAtivo(f),ini=idaViagem(f),n=diasViagem(f);if(!p||!ini||!n)return null;
  const teto=envelopeTetoFerias(f),hoje=hojeISO(),g=gastosDoPlano(f);
  const dias=[],real=[],ideal=[];let acc=0;
  for(let i=0;i<n;i++){const d=addDiasISO(ini,i);dias.push(d);
    acc=r2(acc+g.filter(x=>(i===0?(x.data||"")<=d:(x.data||"")===d)).reduce((s,x)=>s+(+x.valor||0),0));
    real.push(d<=hoje?acc:null);ideal.push(r2(teto*(i+1)/n));}
  const posteriores=g.filter(x=>(x.data||"")>dias[n-1]).reduce((s,x)=>s+(+x.valor||0),0);
  if(posteriores&&hoje>dias[n-1])real[n-1]=r2(real[n-1]+posteriores);
  return{dias,real,ideal,teto};
}

// ---- Saldo de dias no período aquisitivo (CLT art. 134 e 143) ----
// Até 3 períodos; um com pelo menos 14 dias, os outros com pelo menos 5; venda de até 1/3 do direito.
function saldoAquisitivo(f){
  const grupo=(state.ferias||[]).filter(x=>(x.aquisitivo||"atual")===(f.aquisitivo||"atual"));
  const direito=+f.diasDireito||30;
  const gozados=grupo.reduce((s,x)=>s+(+x.diasGozo||0),0),vendidos=grupo.reduce((s,x)=>s+(+x.venderDias||0),0);
  const restam=direito-gozados-vendidos,av=[];
  if(grupo.length>3)av.push("A CLT permite dividir em no máximo 3 períodos — aqui há "+grupo.length+".");
  if(grupo.length&&Math.max(...grupo.map(x=>+x.diasGozo||0))<14)av.push("Um dos períodos precisa ter pelo menos 14 dias.");
  grupo.filter(x=>(+x.diasGozo||0)>0&&(+x.diasGozo||0)<5).forEach(x=>av.push('"'+esc(x.nome||"Férias")+'" tem '+x.diasGozo+" dias — o mínimo por período é 5."));
  if(vendidos>Math.floor(direito/3))av.push("Dá para vender no máximo "+Math.floor(direito/3)+" dias (1/3 do direito) — estão marcados "+vendidos+".");
  if(restam<0)av.push("Passou "+(-restam)+" dia(s) do direito de "+direito+".");
  return{grupo,direito,gozados,vendidos,restam,avisos:av};
}

// Datas digitadas: o navegador dispara "change" a cada dígito do ano (0002, 0020, 0202...).

// Aplica UMA linha da linha do tempo (índice 0,1,2) ao mês real correspondente:
// reduz o salário (se aquele mês civil de referência teve dias de férias) e/ou soma ao
// Extra (pagamento das férias, só na linha 0, + o extra manual da linha, ex.: 13º).
function aplicarLinhaFerias(id,i){
  const f=feriasGet(id);if(!f)return;
  const r=linhaDoTempoFerias(f)[i];if(!r)return;
  let m=state.meses.find(x=>x.ym===r.ymPag);
  if(!m){if(!confirm("O mês "+lbl(r.ymPag)+" ainda não existe. Criar agora (com as contas do último mês, marcadas como provisórias) e aplicar?"))return;
    m=criarMes(r.ymPag);}
  const reduz=r.buraco>0.005;
  const extraSoma=r2(r.pagFerias+r.treze13+r.extraValor);
  const partes=[];
  if(reduz)partes.push("Salário: "+fmt(m.salario)+" → "+fmt(r.salReduzido)+" (dias de férias no mês de "+lbl(r.civilRef)+")");
  const jaAplicado=+((f.aplicado||{})[r.ymPag]||0);
  const extraNovo=r2((+m.extra||0)-jaAplicado+extraSoma);
  if(extraSoma>0||jaAplicado)partes.push("Extra: "+fmt(m.extra||0)+" → "+fmt(extraNovo)+(jaAplicado?" (troca os "+fmt(jaAplicado)+" aplicados antes)":" (+"+fmt(extraSoma)+")"));
  if(!partes.length){alert("Nada a aplicar nesta linha.");return;}
  if(!confirm("Aplicar em "+lbl(r.ymPag)+"?\n\n"+partes.join("\n")))return;
  if(reduz){if(m._salarioPreFerias==null)m._salarioPreFerias=m.salario;m.salario=r.salReduzido;}
  if(extraSoma>0||jaAplicado){m.extra=extraNovo;if(!f.aplicado)f.aplicado={};f.aplicado[r.ymPag]=extraSoma;}
  if(i===0)f._aplicadoMes=r.ymPag;
  save();alert("Aplicado em "+lbl(r.ymPag)+".");render();
}
// desfaz o "aplicar": volta o salário original e tira do Extra o que esta(s) férias somaram
function restaurarSalarioPreFerias(ym){const m=state.meses.find(x=>x.ym===ym);if(!m)return;
  if(m._salarioPreFerias!=null){m.salario=m._salarioPreFerias;delete m._salarioPreFerias;}
  (state.ferias||[]).forEach(f=>{const v=+((f.aplicado||{})[ym]||0);if(v){m.extra=r2(Math.max(0,(+m.extra||0)-v));delete f.aplicado[ym];}});
  save();render();}
function criarMetaPosFerias(id){
  const f=feriasGet(id);if(!f)return;
  const alvo=reservaSugeridaFerias(f),c=calcFerias(f);
  if(!(alvo>0)){alert("A reserva sugerida está zerada — nada para guardar como meta.");return;}
  state.metasCurto.push({id:uid(),nome:"Reserva pós-férias — "+(f.nome||"Férias"),alvo:r2(alvo),prazo:c.mesPagamento,guardado:0});
  save();alert("Meta criada em Metas de curto prazo: "+fmt(alvo)+".");render();
}
function transferirEnvelope(id){
  const f=feriasGet(id);if(!f)return;
  const c=calcFerias(f);if(!meses().some(m=>m.ym===c.mesPagamento)){alert("O mês "+lbl(c.mesPagamento)+" ainda não existe em Editar dados. Crie-o primeiro.");return;}
  const teto=envelopeTetoFerias(f);
  if(!state.movs[c.mesPagamento])state.movs[c.mesPagamento]=[];
  state.movs[c.mesPagamento].push({id:uid(),nome:"Transferência p/ envelope de férias: "+(f.nome||"Férias"),valor:teto,tipo:"gasto",cat:"Outros",dia:new Date().getDate(),_ferias:f.id});
  if(!f.envelope)f.envelope={};f.envelope.transferido=true;f.envelope.valorTransferido=teto;
  save();alert("Transferido "+fmt(teto)+" para o envelope, lançado como gasto avulso em "+lbl(c.mesPagamento)+" (aba Gerenciar sobra). Os gastos da viagem daqui para baixo saem só do envelope.");render();
}
function desfazerTransferencia(id){
  const f=feriasGet(id);if(!f)return;
  if(!confirm("Desfazer a transferência para o envelope? Remove o lançamento do caixa."))return;
  Object.keys(state.movs).forEach(ym=>{(state.movs[ym]||[]).forEach(x=>{if(x._ferias===id)marcarApagado(x.id);});state.movs[ym]=(state.movs[ym]||[]).filter(x=>x._ferias!==id);});
  f.envelope.transferido=false;f.envelope.valorTransferido=0;save();render();
}
function agendarHospedagem(id,pid){
  const f=feriasGet(id);const p=f&&(f.viagem.planos||[]).find(x=>x.id===pid);if(!p)return;
  const n=Math.max(1,+p.hospedagem.parcelas||1);
  if(n<=1){alert("Defina mais de 1 parcela no campo 'Parcelas' da hospedagem para agendar na Agenda.");return;}
  const total=custoHospedagem(p.hospedagem,f,p),valorParc=r2(total/n);
  const c=calcFerias(f),inicio=ymAdd(c.mesPagamento,1);
  state.futuros.push({id:uid(),nome:"Hospedagem "+(p.destino||f.viagem.destino||f.nome||"férias"),valor:valorParc,tipo:"recorrente",inicio,fim:ymAdd(inicio,n-1)});
  save();alert(n+"x de "+fmt(valorParc)+" agendadas na Agenda, a partir de "+lbl(inicio)+".");render();
}

// ---- férias → cenário na Simulação ----
// Cada efeito vira um "reforço" (positivo) ou gasto (negativo) no mês certo, relativo ao mês-base
// da Simulação: recibo de férias, salário reduzido dos meses seguintes, 13º e o custo da viagem
// escolhida. Refazer substitui o cenário anterior das mesmas férias (não duplica).
function cenarioDasFerias(f){
  const S=state.simg,base=baseMesRef(),fora=[];const ex=[];
  const k=ym=>mesesEntre(base.ym,ym);
  const add=(nome,valor,ym)=>{if(!(Math.abs(valor)>0.005))return;const kk=k(ym);if(kk<1||kk>12){fora.push(nome+" ("+lbl(ym)+")");return;}ex.push({nome,valor:r2(valor),mesIni:kk,meses:1,fonte:"ferias"});};
  const c=calcFerias(f),c13=calc13(f);
  add("Recibo de férias",c.totalReceber,c.mesPagamento);
  linhaDoTempoFerias(f).forEach(r=>{if(r.buraco>0.005)add("Salário reduzido ("+lbl(r.civilRef)+")",-r.buraco,r.ymPag);});
  if(!c13.adiantou)add("13º — 1ª parcela",c13.parc1,c13.ymParc1);add("13º — 2ª parcela",c13.parc2,c13.ymParc2);
  const p=planoAtivo(f);if(p)add("Viagem: "+(p.nome||"viagem")+(p.destino?" ("+p.destino+")":""),-custoPlano(p,f),ymOfIso(idaViagem(f,p)||f.inicio));
  return{cenario:{nome:"Férias — "+(f.nome||"Férias")+" (automático)",itens:[],extras:ex,_ferias:f.id},fora,base:base.ym};
}
function criarCenarioFerias(id){
  const f=feriasGet(id);if(!f||!f.inicio){alert("Defina a data de início das férias primeiro.");return;}
  if(!meses().length){alert("Cadastre pelo menos um mês em Editar dados — a Simulação parte dele.");return;}
  const r=cenarioDasFerias(f);const S=state.simg;
  const i=S.cenarios.findIndex(x=>x._ferias===id);if(i>=0)S.cenarios[i]=r.cenario;else S.cenarios.push(r.cenario);
  save();go("sim");
  if(r.fora.length)alert("Ficaram de fora porque caem fora dos 12 meses a partir de "+lbl(r.base)+" (mês-base da Simulação): "+r.fora.join(", ")+".");
}

// ---- distância automática (OpenStreetMap: Nominatim + OSRM — gratuitos, sem chave) ----
// Só os nomes das duas cidades são enviados. Pedágio não tem serviço gratuito confiável: o link
// abre a rota no Google Maps, que mostra os pedágios.
async function geocodificar(q){
  const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q="+encodeURIComponent(q),{headers:{"Accept-Language":"pt-BR"}});
  const j=await r.json().catch(()=>[]);if(!r.ok||!j.length)throw new Error("Não achei “"+q+"” no mapa. Tente “Cidade, UF”.");
  return{lat:+j[0].lat,lon:+j[0].lon};}
async function rotaCarro(a,b){
  const r=await fetch("https://router.project-osrm.org/route/v1/driving/"+a.lon+","+a.lat+";"+b.lon+","+b.lat+"?overview=false");
  const j=await r.json().catch(()=>({}));if(!r.ok||j.code!=="Ok"||!j.routes||!j.routes.length)throw new Error("Não consegui calcular a rota.");
  return{km:j.routes[0].distance/1000,horas:j.routes[0].duration/3600};}
function setCasaCidade(v){state.casaCidade=(v||"").trim();save();render();}
async function calcularKm(id,pid,tid){
  const f=feriasGet(id),p=f&&(f.viagem.planos||[]).find(x=>x.id===pid),t=p&&(p.trechos||[]).find(x=>x.id===tid);if(!t)return;
  const de=(t.origem||state.casaCidade||"").trim(),para=(t.destinoTrecho||p.destino||"").trim();
  if(!de){alert("Preencha “Saindo de” (sua cidade) no topo da seção 5.");return;}
  if(!para){alert("Preencha o destino da viagem.");return;}
  try{t._calc="calculando…";render();
    const[a,b]=await Promise.all([geocodificar(de),geocodificar(para)]);const r=await rotaCarro(a,b);
    t.kmIda=Math.round(r.km);t.horasIda=r2(r.horas);t.kmAuto=de+" → "+para;delete t._calc;save();render();
  }catch(e){delete t._calc;render();alert(e.message+" (sem internet? dá para digitar o km à mão)");}
}
const linkRota=(de,para)=>"https://www.google.com/maps/dir/?api=1&travelmode=driving&origin="+encodeURIComponent(de)+"&destination="+encodeURIComponent(para);

// ---- "Já caiu?": cada dinheiro previsto das férias, no dia previsto, pergunta se caiu ----
// Datas: recibo ~2 dias antes do início; salário reduzido dia 1º do mês em que cai; 13º: 1ª até 30/11, 2ª até 20/12.
// "Sim" grava o valor real no campo que já existe (ou no "confirmado" do recibo/2ª parcela) e oferece as ações
// que já existem; "Ainda não" pergunta de novo amanhã; depois de 3 dias aparece "atrasado?". Para de perguntar após 30 dias.
function itensPrevistosFerias(f){
  if(!f.inicio)return[];
  const c=calcFerias(f),c13=calc13(f),rows=linhaDoTempoFerias(f),out=[];
  const idx=ym=>rows.findIndex(r=>r.ymPag===ym);
  out.push({key:"recibo",nome:"Recibo de férias",data:addDiasISO(f.inicio,-2),valor:c.totalReceberCalc,ym:c.mesPagamento,linha:idx(c.mesPagamento)});
  rows.forEach((r,i)=>{if(r.sal)out.push({key:"sal:"+r.ymPag,nome:"Salário de "+lbl(r.civilRef)+" (reduzido pelas férias)",data:r.ymPag+"-01",valor:r.salAuto,ym:r.ymPag,linha:i});});
  if(!c13.adiantou)out.push({key:"13a",nome:"13º — 1ª parcela",data:c13.ymParc1+"-30",valor:c13.parc1Auto,ym:c13.ymParc1,linha:idx(c13.ymParc1)});
  out.push({key:"13b",nome:"13º — 2ª parcela",data:c13.ymParc2+"-20",valor:c13.parc2Calc,ym:c13.ymParc2,linha:idx(c13.ymParc2)});
  return out;
}
function jaCaiuPendentes(f,hoje){
  hoje=hoje||hojeISO();const R=f.recebimentos||{};
  return itensPrevistosFerias(f).filter(it=>{const r=R[it.key]||{};
    if(r.status==="fechado")return false;
    if(r.status==="confirmado")return r.em===hoje; // fica mais o dia com os atalhos, depois some
    if(r.adiadoAte&&r.adiadoAte>hoje)return false;
    return it.data<=hoje&&hoje<=addDiasISO(it.data,30);});
}
function jaCaiuSim(fid,key){
  const f=feriasGet(fid);if(!f)return;const it=itensPrevistosFerias(f).find(x=>x.key===key);if(!it)return;
  const el=document.getElementById("jc_"+fid+"_"+key.replace(/\W/g,"_"));const v=el&&el.value!==""?numBR(el.value):it.valor;
  if(!(v>0)){alert("Digite quanto caiu.");return;}
  if(key==="recibo"){if(!f.override)f.override={};f.override.reciboReal=r2(v);}
  else if(key.startsWith("sal:")){if(!f.overrideLinha)f.overrideLinha={};f.overrideLinha[it.ym]=r2(v);}
  else if(key==="13a"){if(!f.treze)f.treze={};if(!f.treze.override)f.treze.override={};f.treze.override.parc1=r2(v);}
  else if(key==="13b"){if(!f.treze)f.treze={};if(!f.treze.override)f.treze.override={};f.treze.override.parc2Real=r2(v);}
  if(!f.recebimentos)f.recebimentos={};f.recebimentos[key]={status:"confirmado",valor:r2(v),em:hojeISO()};
  save();render();
}
function jaCaiuNao(fid,key){const f=feriasGet(fid);if(!f)return;if(!f.recebimentos)f.recebimentos={};
  const r=f.recebimentos[key]||{};f.recebimentos[key]={...r,status:"aguardando",adiadoAte:addDiasISO(hojeISO(),1)};save();render();}
function jaCaiuFechar(fid,key){const f=feriasGet(fid);if(!f||!f.recebimentos||!f.recebimentos[key])return;f.recebimentos[key].status="fechado";save();render();}
function blocoJaCaiu(f){
  const hoje=hojeISO(),pend=jaCaiuPendentes(f,hoje);if(!pend.length)return"";
  const br=d=>d.split("-").reverse().slice(0,2).join("/"),R=f.recebimentos||{};
  return `<div style="margin-top:8px;padding:8px 10px;border:1px dashed var(--teal);border-radius:10px">
    <b style="font-size:13px">💰 Já caiu?</b>
    ${pend.map(it=>{const r=R[it.key]||{},id="jc_"+f.id+"_"+it.key.replace(/\W/g,"_"),k=jsAttr(it.key);
      if(r.status==="confirmado"){
        const acoes=[];
        if(it.linha>=0)acoes.push(`<button class="btn" style="padding:3px 8px" onclick="aplicarLinhaFerias('${f.id}',${it.linha})">aplicar em ${lbl(it.ym)}</button>`);
        if(it.key==="recibo"&&!(f.envelope&&f.envelope.transferido))acoes.push(`<button class="btn" style="padding:3px 8px" onclick="transferirEnvelope('${f.id}')">separar o envelope do caixa</button>`);
        if(it.key==="recibo"&&reservaSugeridaFerias(f)>0&&!(state.metasCurto||[]).some(m=>(m.nome||"").startsWith("Reserva pós-férias")))acoes.push(`<button class="btn" style="padding:3px 8px" onclick="criarMetaPosFerias('${f.id}')">guardar a reserva como meta</button>`);
        return `<p class="note" style="margin-top:6px">✔ <b>${esc(it.nome)}</b> confirmado em ${br(r.em)}: ${fmt(r.valor)}</p>
          <div class="row" style="gap:6px">${acoes.join("")}<button class="btn" style="padding:3px 8px" onclick="jaCaiuFechar('${f.id}','${k}')">pronto</button></div>`;}
      const atrasado=hoje>addDiasISO(it.data,3);
      const quando=it.data===hoje?"Era para cair hoje":atrasado?`⚠ Atrasado? Era para cair em ${br(it.data)}`:`Era para cair em ${br(it.data)}`;
      return `<p class="note" style="margin-top:6px">${quando}: <b>${esc(it.nome)}</b> — previsto ${fmt(it.valor)}. Já caiu?</p>
        <div class="row" style="gap:6px"><label style="font-size:12px">Sim, caiu R$ <input id="${id}" type="text" inputmode="decimal" data-num step="0.01" value="${r2((+it.valor))}" style="width:110px"></label>
        <button class="btn primary" style="padding:3px 10px" onclick="jaCaiuSim('${f.id}','${k}')">Sim, caiu</button>
        <button class="btn" style="padding:3px 10px" onclick="jaCaiuNao('${f.id}','${k}')">Ainda não</button></div>`;}).join("")}
  </div>`;
}
// card só com o "Já caiu?" quando há pergunta pendente fora das datas das férias (ex.: salário reduzido, 13º)

function feriasDeHoje(hoje){

// gastos do dia a dia (lançados no mês, fora do envelope) com data dentro das férias
function gastosForaViagem(f){
  const ini=f.inicio,fim=fimFerias(f),out=[];
  Object.entries(state.movs||{}).forEach(([ym,arr])=>(arr||[]).forEach(x=>{
    if(x.tipo==="renda"||x._ferias)return; // recebimentos e a "transferência para o envelope" não contam
    const d=ym+"-"+String(+x.dia||1).padStart(2,"0");if(d>=ini&&d<=fim)out.push({...x,data:d});}));
  return out.sort((a,b)=>a.data.localeCompare(b.data));
}

  </div>`;

  return header+secPeriodo+secRecebo+secBuraco+secEnvelope+secPlanos+secGastos+secInteligencia;

function traduzErroFb(m){m=m||"";
  if(/EMAIL_EXISTS/.test(m))return"Esse e-mail já tem conta — use Entrar.";
  if(/EMAIL_NOT_FOUND|INVALID_PASSWORD|INVALID_LOGIN_CREDENTIALS/.test(m))return"E-mail ou senha incorretos.";
  if(/WEAK_PASSWORD/.test(m))return"A senha precisa ter pelo menos 6 caracteres.";
  if(/INVALID_EMAIL/.test(m))return"E-mail inválido.";
  if(/TOO_MANY_ATTEMPTS/.test(m))return"Muitas tentativas. Espere alguns minutos.";
  if(/TOKEN_EXPIRED|INVALID_REFRESH_TOKEN|USER_NOT_FOUND|USER_DISABLED/.test(m))return"Sessão expirada — entre de novo.";
  return"Erro do Firebase: "+(m||"sem resposta (sem internet?)");}
async function fbAuth(caminho,corpo){
  const r=await fetch("https://identitytoolkit.googleapis.com/v1/"+caminho+"?key="+FB.apiKey,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(corpo)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(traduzErroFb(j.error&&j.error.message));return j;}
async function fbToken(forcar){
  if(!sync.refreshToken)throw new Error("Não conectado.");
  if(!forcar&&sync.idToken&&Date.now()<sync.exp)return sync.idToken;
  const r=await fetch("https://securetoken.googleapis.com/v1/token?key="+FB.apiKey,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(sync.refreshToken)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(traduzErroFb(j.error&&j.error.message));
  sync.idToken=j.id_token;sync.refreshToken=j.refresh_token;sync.exp=Date.now()+((+j.expires_in||3600)-60)*1000;gravarSync();return sync.idToken;}
function tokenInfo(){try{const p=sync.idToken.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");return JSON.parse(decodeURIComponent(escape(atob(p))));}catch(e){return{};}}
const emailVerificado=()=>tokenInfo().email_verified===true;

  try{statusSync("sincronizando",criar?"criando conta…":"entrando…");
    const j=await fbAuth(criar?"accounts:signUp":"accounts:signInWithPassword",{email,password:senha,returnSecureToken:true});
    Object.assign(sync,{email:j.email,idToken:j.idToken,refreshToken:j.refreshToken,exp:Date.now()+((+j.expiresIn||3600)-60)*1000});gravarSync();
    if(criar)await fbAuth("accounts:sendOobCode",{requestType:"VERIFY_EMAIL",idToken:j.idToken});
    statusSync("","");render();if(syncAtivo())sincronizar();
  }catch(e){statusSync("erro",e.message);alert(e.message);}
}
